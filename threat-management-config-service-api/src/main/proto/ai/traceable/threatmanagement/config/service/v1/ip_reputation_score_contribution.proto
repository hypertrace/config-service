syntax = "proto3";

package ai.traceable.threatmanagement.config.service.v1;

import "ai/traceable/threatmanagement/config/service/v1/scope_config.proto";

option java_multiple_files = true;

message GetIpReputationThreatScoreConfigRequest {
  ScopeConfig scope = 1;
}

message GetIpReputationThreatScoreConfigResponse {
  IpReputationThreatScoreConfig ip_reputation_threat_score_config = 1;
  IpReputationThreatScoreConfig default_ip_reputation_threat_score_config = 2;
}

message UpdateIpReputationThreatScoreConfigRequest {
  IpReputationThreatScoreConfig ip_reputation_threat_score_config = 1;
}

message UpdateIpReputationThreatScoreConfigResponse {
  IpReputationThreatScoreConfig ip_reputation_threat_score_config = 1;
  IpReputationThreatScoreConfig default_ip_reputation_threat_score_config = 2;
}

message IpReputationThreatScoreConfig {
  int32 critical_ip_reputation_threat_score_increment = 1;
  int32 high_ip_reputation_threat_score_increment = 2;
  int32 medium_ip_reputation_threat_score_increment = 3;
  int32 low_ip_reputation_threat_score_increment = 4;
  ScopeConfig scope = 5;
}
