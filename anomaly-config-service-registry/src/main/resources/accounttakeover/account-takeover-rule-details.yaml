- ruleId: ato
  ruleName: Account Takeover
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_ACCOUNT_TAKEOVER
  severityLevel: ANOMALY_SEVERITY_LEVEL_HIGH
  eventDetails:
    description: "An Account Takeover (ATO) attack occurs when an attacker tries to gain unauthorized access to a user’s online account by exploiting weak authentication mechanisms or using stolen login credentials. The attacker attempts to bypass security measures like passwords or multi-factor authentication (MFA) in order to take control of the account."
    mitigation: |
      - Enable Multi-Factor Authentication (MFA): Adds an extra layer of security, requiring more than just a password.
      - Implement Strong Password Policies: Encourage or enforce the use of complex, unique passwords.
      - Monitor for Suspicious Activity: Track unusual login attempts and account changes.
      - Educate Users: Raise awareness of phishing risks and the importance of account security.
    impact:
      - The attacker may use the account to impersonate the user.
      - Businesses may suffer damage if customer accounts are compromised.
      - Sensitive personal or business data may be stolen or exposed.
      - Attackers could steal funds or make unauthorized purchases.
    References:
      - https://owasp.org/www-project-automated-threats-to-web-applications/assets/oats/EN/OAT-008_Credential_Stuffing
      - https://docs.rapid7.com/tcell/account-takeover/
  subRuleInfos:
    - ruleId: ato_credStuff
      ruleName: Credential Stuffing
      severityLevel: ANOMALY_SEVERITY_LEVEL_HIGH
      subRuleTypes: [ ANOMALY_SUB_RULE_TYPE_REGULAR ]
      eventLabels:
        CWE: 400
        OWASP_API_2023: API04
      eventDetails:
        description: |
          Credential stuffing is the automated injection of stolen username and password pairs into application entry points such as login endpoints, in order to fraudulently gain access to user accounts. Since many users tend to re-use the same password and username/email, when those credentials are exposed emanating from database breach or phishing attack their accounts can be compromised. Most applications have dedicated API’s for web, mobile, partner services etc which then have associated API tokens associated with each user and session. Credential stuffing is carried out using the login API’s and hence the defense layer also needs to be built via API Security.
        mitigation: |
          Typical approaches include implementing and enforcing strong password policies, using multi-factor authentication (MFA), single sign-on (SSO), using passwordless authentication etc.
        impact:
          - The attacker may use the account to impersonate the user.
          - Businesses may suffer damage if customer accounts are compromised.
          - Sensitive personal or business data may be stolen or exposed.
          - Attackers could steal funds or make unauthorized purchases.
        References:
          - https://owasp.org/www-project-automated-threats-to-web-applications/assets/oats/EN/OAT-008_Credential_Stuffing
          - https://docs.rapid7.com/tcell/account-takeover/