- ruleId: crs_931
  ruleName: Remote File Inclusion
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PATH_MANIPULATION
  eventDetails:
    description: |
      An anomaly characteristic of Remote File Inclusion(RFI) attack is detected.
      RFI attacks occur when the attacker is able to include files in the application. This is done by including a remote file using a URL or a remote file path using other protocols such as FTP, SSH, SMB, etc.
      This dynamic file inclusion allows the attacker to execute malicious code in the context of the web application.
    mitigation: |
      - Restrict the inclusion of user provided files, urls to the web application.
      - Maintain a list of accepted files that can be included in the web application. Use mappings to a file name rather than the actual file names in this scenario.
      - All application processes should be run with the minimal privileges required. Also, processes must shed privileges as soon as they no longer require them.
    impact: |
      Attackers could include arbitrary code, which could then be used to
        - execute malicious code on the web application.
        - read and modify files or sensitive information on the web server.
        - cause issues in the availability of the web server.
        - can facilitate the execution of other attacks such as cross site scripting, denial of service.
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
      - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
      - Common Weakness Enumeration (CWE) - CWE-98:Improper Control of Filename for Include/Require Statement in PHP Program ('PHP Remote File Inclusion') - https://cwe.mitre.org/data/definitions/98.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-193:PHP Remote File Inclusion - https://capec.mitre.org/data/definitions/193.html
      - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190
      - Web Application Security Consortium - WASC-5:Remote File Inclusion - http://projects.webappsec.org/w/page/13246955/Remote%20File%20Inclusion

- ruleId: crs_932
  ruleName: Remote Code Execution
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_KNOWN_VULNERABILITIES
  eventDetails:
    description: "An anomaly characteristic of Remote Code Execution (RCE) attack is detected. RCE attacks occur when an attacker can execute arbitrary commands or code on a remote server."
    mitigation: "To mitigate RCE attacks, validate and sanitize all user inputs. Avoid using user input in system commands where possible. Regularly update and patch your systems to fix known vulnerabilities."
    impact: "If not mitigated, RCE attacks can lead to full system compromise, allowing an attacker to perform any action they want on the server."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://owasp.org/www-project-api-security/2019/en/0xa8-injection.html
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
  subRuleInfos:
  - ruleId: crs_932170
    eventDetails:
      description: |
        An anomaly characteristic of Shell Shock RCE attack is detected.
        While defining an environment variable for a function definition, BASH would run commands following the function definition as BASH supports this functionality.
        This allowed the attackers to execute unexpected, dangerous commands directly on the operating system. This weakness can lead to a vulnerability in environments in which the attacker does not have direct access to the operating system, such as in web applications. Alternatively, if the weakness occurs in a privileged program, it could allow the attacker to specify commands that normally would not be accessible, or to call alternate commands with privileges that the attacker does not have. The problem is exacerbated if the compromised process does not follow the principle of least privilege, because the attacker-controlled commands may run with special system privileges that increases the amount of damage.
      mitigation: |
        - Update the current version of BASH running for the application.
        - Do not use user input before sanitization for environment variable definitions.
      impact: |
        Attackers could execute unauthorized commands, which could then be used to
        - fully compromise the host and the application.
        - read and modify files on OS for which the attacker does not have permissions to access directly.
        - compromise other parts of hosting infrastructure exploiting trust relationship.
        Since the targeted application is directly executing the commands instead of the attacker, any malicious activities may appear to come from the application or the application's owner.
      references: |
        - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
        - OWASP Top 10 - 2021 - A06:Vulnerable and Outdated Components - https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
        - OWASP Top 10 - 2017 - A09:Using Components with Known Vulnerabilities - https://owasp.org/www-project-top-ten/2017/A9_2017-Using_Components_with_Known_Vulnerabilities
        - Common Weakness Enumeration (CWE) - CWE-78:Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection') - https://cwe.mitre.org/data/definitions/78.html
        - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-248:Command Injection - https://capec.mitre.org/data/definitions/248.html
        - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
        - Web Application Security Consortium - WASC-31:OS Commanding - http://projects.webappsec.org/w/page/13246950/OS%20Commanding
  - ruleId: crs_932171
    eventDetails:
      description: |
        An anomaly characteristic of Shell Shock RCE attack is detected. While defining an environment variable for a function definition, BASH would run commands following the function definition as BASH supports this functionality.
        This allowed the attackers to execute unexpected, dangerous commands directly on the operating system. This weakness can lead to a vulnerability in environments in which the attacker does not have direct access to the operating system, such as in web applications. Alternatively, if the weakness occurs in a privileged program, it could allow the attacker to specify commands that normally would not be accessible, or to call alternate commands with privileges that the attacker does not have. The problem is exacerbated if the compromised process does not follow the principle of least privilege, because the attacker-controlled commands may run with special system privileges that increases the amount of damage.
