- ruleId: crs_930
  ruleName: Local File Inclusion
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PATH_MANIPULATION
  eventLabels:
    MITRE_TACTIC: TA0007
    MITRE_TECHNIQUE: T1083
  eventDetails:
    description: "A Local File Inclusion (LFI) attack occurs when an attacker manipulates a file path to include files from other parts of the server’s file system. The attacker typically exploits the application's failure to properly validate file paths, allowing them to access sensitive files or execute unintended files on the server."
    mitigation: "To mitigate LFI attacks, validate and sanitize all user inputs that are used in file paths. Avoid using user input to construct file paths where possible."
    impact: "If not mitigated, LFI attacks can lead to disclosure of sensitive information, such as source code or configuration files, which could compromise the security of your application."
    references: |
      - OWASP Top 10 - 2021 – A01:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
      - OWASP Top 10 - 2017 - A5:Broken Access Control - https://owasp.org/www-project-top-ten/2017/A5_2017-Broken_Access_Control
  subRuleInfos:
    - ruleId: crs_930100
      eventDetails:
        description: |
          A pattern indicative of Path Traversal attack is detected.
          Path Traversal attack are successful when the attacker is able to access files or directories which are stored outside the web root folder. This is done using the ../ sequences to navigate outside the current directory.
        mitigation: |
          - Use labels instead of file paths to refer to a file.
          - Do not trust user input. Sanitize these input to remove sequences such as ../
          - Avoid storing sensitive files inside the web root folder.
          - Apply access control policies to restrict the access of files to users.
        impact: |
          The attacker will be able to view sensitive information or files to does not have authorization for, which they could then use this sensitive information to carry out different other attacks.
        references: |
          - OWASP Top 10 - 2021 – A01:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
          - OWASP Top 10 - 2017 - A5:Broken Access Control - https://owasp.org/www-project-top-ten/2017/A5_2017-Broken_Access_Control
          - Common Weakness Enumeration (CWE) CWE-22:Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal') - https://cwe.mitre.org/data/definitions/22.html
          - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-126:Path Traversal - https://capec.mitre.org/data/definitions/126.html
          - MITRE Attack - T1083:File and Directory Discovery - https://attack.mitre.org/techniques/T1083/
          - Web Application Security Consortium - WASC-33:Path Traversal - http://projects.webappsec.org/w/page/13246952/Path%20Traversal

    - ruleId: crs_930120
      eventDetails:
        description: |
          A pattern indicative of OS File Access Attempt is detected. 
          This attack occurs when an attacker tries to access, read, or manipulate sensitive operating system files. These files include configuration files, password storage files, logs, or other critical system resources. Attackers exploit vulnerabilities like directory traversal, command injection, or insecure file uploads to access files outside intended directories or execute malicious actions.
        mitigation: |
          - Validate and sanitize all user inputs to ensure they conform to expected formats and are free of malicious payloads.
          - Normalize file paths to remove sequences like ../ and ensure access is restricted to authorized directories only.
          - Apply the principle of least privilege, ensuring that web server processes have minimal permissions.
          - Disable directory listings on web servers to prevent attackers from enumerating files.
          - Monitor file access through host-based intrusion detection systems or file integrity monitoring tools.
          - Implement robust error handling to avoid disclosing sensitive information about server file paths or structure.
        impact: |
          Unauthorized OS file access attempts can:
            - Expose sensitive configuration information, such as database credentials or encryption keys.
            - Provide attackers with reconnaissance data to exploit the system further.
            - Compromise the integrity and availability of the system by modifying or deleting critical files.
            - The attacker may gain unauthorized access to sensitive system files, leading to potential data breaches, privilege escalation, or system compromise. Successful exploitation could also facilitate further attacks, such as malware deployment or unauthorized system control.
        references: |
          - OWASP Path Traversal - https://owasp.org/www-community/attacks/Path_Traversal
          - Common Weakness Enumeration (CWE) CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal') - https://cwe.mitre.org/data/definitions/22.html
          - PortSwigger Web Security Academy - File Path Traversal - https://portswigger.net/web-security/file-path-traversal
          - MITRE ATT&CK - T1005: Data from Local System - https://attack.mitre.org/techniques/T1005/
          - MITRE ATT&CK - T1083: File and Directory Discovery - https://attack.mitre.org/techniques/T1083/
          - OWASP Top 10 - 2021 – A01:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
          - Web Application Security Consortium - WASC-33: Path Traversal - http://projects.webappsec.org/w/page/13246952/Path%20Traversal

    - ruleId: crs_930130
      eventDetails:
        description: |
          A pattern indicative of a restricted file access attempt is detected. This involves unauthorized attempts to access files that are explicitly restricted by the application, such as sensitive configuration files, user data, or restricted directories.
        mitigation: |
          - Implement strict access controls to restrict access to sensitive files.
          - Validate and sanitize all user inputs to prevent unauthorized directory or file access, such as path traversal attacks.
          - Configure the application and server to block access to restricted directories or files through proper directory indexing and server settings.
          - Monitor and log access attempts to restricted files and investigate any unauthorized or anomalous activity.
        impact: |
          Unauthorized access to restricted files can:
            - Expose sensitive application or user data, leading to breaches or compliance violations.
            - Allow attackers to modify or delete critical application files, impacting the application's integrity and availability.
            - Lead to further exploitation, including privilege escalation and lateral movement within the system.
        references: |
          - OWASP Top 10 - 2021 - A5: Security Misconfiguration - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
          - CWE-22: Path Traversal - https://cwe.mitre.org/data/definitions/22.html
          - CWE-552: Files or Directories Accessible to External Parties - https://cwe.mitre.org/data/definitions/552.html
          - MITRE ATT&CK - T1070: Indicator Removal on Host - https://attack.mitre.org/techniques/T1070/

    - ruleId: crs_9300010
      eventDetails:
        description: |
          Ruby on Rails versions <5.2.2.1, <5.1.6.2, <5.0.7.2, <4.2.11.1, and v3 are vulnerable to a File Content Disclosure vulnerability in Action View. 
          - CVE-2019-5418 occurs due to improper handling of Accept headers, which allows attackers to send specially crafted headers that can cause the contents of arbitrary files on the target system’s filesystem to be exposed.
          - This vulnerability allows attackers to read files from the filesystem, which could include sensitive data such as configuration files, user data, or internal logs.
          - The issue has been fixed in Rails versions 5.2.2.1, 5.1.6.2, 5.0.7.2, 4.2.11.1, and the latest versions of Rails 3.
          - The root cause is insufficient validation of HTTP headers, allowing the server to include files that should not be publicly accessible.
        mitigation: |
          - Upgrade to Rails versions 5.2.2.1, 5.1.6.2, 5.0.7.2, 4.2.11.1, or the latest Rails 3 to fix the vulnerability.
          - Sanitize and validate user inputs, particularly the Accept header, to prevent the inclusion of unauthorized files.
          - Restrict access to sensitive files and limit exposure to only necessary resources.
          - Monitor application logs for signs of exploit attempts or unusual file access patterns.
        impact: |
          - File Content Disclosure: Attackers can access the contents of arbitrary files on the server, potentially exposing sensitive data.
          - Data Exposure: Private or sensitive information such as configuration files or internal data can be leaked to unauthorized users.
          - System Compromise: Exploiting this vulnerability could provide attackers with valuable information for further attacks.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-5418
          - https://www.cve.org/CVERecord?id=CVE-2019-5418
    - ruleId: crs_9300150
      eventDetails:
        description: |
          Information Disclosure vulnerability in ownCloud Graph API (CVE-2023-49103) impacts ownCloud versions 0.2.x before 0.2.1 and 0.3.x before 0.3.1.
          - The issue arises from the use of a third-party GetPhpInfo.php library within the Graph API app.
          - When the phpinfo URL is accessed, it exposes sensitive configuration details of the PHP environment, including environment variables of the webserver.
          - In containerized deployments, this can leak sensitive data such as:
            - Admin passwords
            - Mail server credentials
            - License keys
          - Even non-containerized environments are at risk due to the potential exposure of other sensitive configuration details that could be exploited by attackers.
          - Disabling the Graph API app does not mitigate the risk, as the vulnerability is inherent in the use of the phpinfo page.
          - Docker containers prior to February 2023 are not vulnerable to credential disclosure.
        mitigation: |
          - Upgrade to ownCloud Graph API version 0.2.1 or 0.3.1 or later to resolve this issue.
          - Disable or remove the GetPhpInfo.php script to prevent exposure of sensitive information.
          - Ensure that sensitive data, such as passwords and credentials, are not stored in environment variables or accessible through phpinfo.
          - Audit your containers and systems to ensure environment variables are not leaking sensitive information.
          - Regularly scan for exposed phpinfo pages or similar vulnerabilities in your environment.
        impact: |
          - Information Disclosure: Sensitive configuration data, including passwords, mail server details, and license keys, could be exposed.
          - Privacy and Security Risks: This information can be used by attackers for further exploitation or unauthorized access to systems.
          - Credential Leakage: In containerized environments, environment variables may contain crucial data such as admin passwords, which could significantly impact security.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2023-49103
          - https://www.rapid7.com/blog/post/2023/12/01/etr-cve-2023-49103-critical-information-disclosure-in-owncloud-graph-api/
          - https://owncloud.com/news/immediate-action-required-critical-security-updates-for-owncloud/

    - ruleId: crs_930110
      eventDetails:
        description: |
          A pattern indicative of Path Traversal attack is detected.
          The attack is successful if the attacker is able to access files or directories which are stored outside the web root folder. This is done using the ../ sequences to navigate outside the current directory.
        mitigation: |
          - Use labels instead of file paths to refer to a file.
          - Do not trust user input. Sanitize these input to remove sequences such as ../.
          - Avoid storing sensitive files inside the web root folder.
          - Apply access control policies to restrict the access of files to users.
        impact: |
          The attacker will be able to view sensitive information or files to does not have authorization for, which they could then use this sensitive information to carry out different other attacks.
        references: |
          - OWASP Top 10 - 2021 – A01:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
          - OWASP Top 10 - 2017 - A5:Broken Access Control - https://owasp.org/www-project-top-ten/2017/A5_2017-Broken_Access_Control
          - Common Weakness Enumeration (CWE) CWE-22:Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal') - https://cwe.mitre.org/data/definitions/22.html
          - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-126:Path Traversal - https://capec.mitre.org/data/definitions/126.html
          - MITRE Attack - T1083:File and Directory Discovery - https://attack.mitre.org/techniques/T1083/
          - Web Application Security Consortium - WASC-33:Path Traversal - http://projects.webappsec.org/w/page/13246952/Path%20Traversal
    - ruleId: crs_9300120
      eventDetails:
        description: |
          A pattern indicative of OS File Access Attempt is detected. 
          This attack occurs when an attacker tries to access, read, or manipulate sensitive operating system files. These files include configuration files, password storage files, logs, or other critical system resources. Attackers exploit vulnerabilities like directory traversal, command injection, or insecure file uploads to access files outside intended directories or execute malicious actions.
        mitigation: |
          - Validate and sanitize all user inputs to ensure they conform to expected formats and are free of malicious payloads.
          - Normalize file paths to remove sequences like ../ and ensure access is restricted to authorized directories only.
          - Apply the principle of least privilege, ensuring that web server processes have minimal permissions.
          - Disable directory listings on web servers to prevent attackers from enumerating files.
          - Monitor file access through host-based intrusion detection systems or file integrity monitoring tools.
          - Implement robust error handling to avoid disclosing sensitive information about server file paths or structure.
        impact: |
          Unauthorized OS file access attempts can:
            - Expose sensitive configuration information, such as database credentials or encryption keys.
            - Provide attackers with reconnaissance data to exploit the system further.
            - Compromise the integrity and availability of the system by modifying or deleting critical files.
            - The attacker may gain unauthorized access to sensitive system files, leading to potential data breaches, privilege escalation, or system compromise. Successful exploitation could also facilitate further attacks, such as malware deployment or unauthorized system control.
        references: |
          - Common Weakness Enumeration (CWE) CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal') - https://cwe.mitre.org/data/definitions/22.html
          - PortSwigger Web Security Academy - File Path Traversal - https://portswigger.net/web-security/file-path-traversal
          - MITRE ATT&CK - T1005: Data from Local System - https://attack.mitre.org/techniques/T1005/
          - MITRE ATT&CK - T1083: File and Directory Discovery - https://attack.mitre.org/techniques/T1083/
          - OWASP Top 10 - 2021 – A01:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
          - Web Application Security Consortium - WASC-33: Path Traversal - http://projects.webappsec.org/w/page/13246952/Path%20Traversal


- ruleId: crs_931
  ruleName: Remote File Inclusion
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PATH_MANIPULATION
  eventDetails:
    description: |
      A Remote File Inclusion (RFI) attack happens when an attacker manipulates the application to include a file from a remote location. The attacker typically submits a URL or a file path (using protocols like FTP, SSH, or SMB) that points to a malicious file. Once included, the remote file is executed within the context of the application, allowing the attacker to run harmful code on the server.
    mitigation: |
      - Restrict the inclusion of user provided files, urls to the web application.
      - Maintain a list of accepted files that can be included in the web application. Use mappings to a file name rather than the actual file names in this scenario.
      - All application processes should be run with the minimal privileges required. Also, processes must shed privileges as soon as they no longer require them.
    impact: |
      Attackers could include arbitrary code, which could then be used to
        - execute malicious code on the web application.
        - read and modify files or sensitive information on the web server.
        - cause issues in the availability of the web server.
        - can facilitate the execution of other attacks such as cross site scripting, denial of service.
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
      - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
      - Common Weakness Enumeration (CWE) - CWE-98:Improper Control of Filename for Include/Require Statement in PHP Program ('PHP Remote File Inclusion') - https://cwe.mitre.org/data/definitions/98.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-193:PHP Remote File Inclusion - https://capec.mitre.org/data/definitions/193.html
      - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190
      - Web Application Security Consortium - WASC-5:Remote File Inclusion - http://projects.webappsec.org/w/page/13246955/Remote%20File%20Inclusion

  subRuleInfos:
    - ruleId: crs_9310100
      eventDetails:
        description: |
          A pattern indicative of a Remote File Inclusion (RFI) attack on the Parameter accepting URL using an Anomalous Domain is detected. This attack involves the use of an anomalous urls to include remote files in the application.  
        mitigation: |
          - Restrict the inclusion of user-provided files or URLs in the web application.
          - Implement strict input validation and allowlist only trusted URLs and IP addresses.
          - Ensure all application processes are executed with minimal privileges and drop unnecessary privileges promptly.
        impact: |
          Attackers could include arbitrary files using IP-based URLs, which may lead to:
            - Execution of malicious code within the web application.
            - Unauthorized access to sensitive server files or configurations.
            - Facilitation of other attacks, such as cross-site scripting (XSS) or denial of service (DoS).
        references: |
          - OWASP API Top 10 - 2019 - API8: Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - Common Weakness Enumeration (CWE) - CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program - https://cwe.mitre.org/data/definitions/98.html
          - MITRE ATT&CK - T1190: Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190
          - Web Application Security Consortium - WASC-5: Remote File Inclusion - http://projects.webappsec.org/w/page/13246955/Remote%20File%20Inclusion

    - ruleId: crs_931100
      eventDetails:
        description: |
          A pattern indicative of a Remote File Inclusion (RFI) attack is detected. This attack involves the use of a URL parameter containing an IP address to include remote files in the application.  
          Attackers may use IP-based URLs to bypass domain-based filtering and execute malicious code within the web application.
        mitigation: |
          - Restrict the inclusion of user-provided files or URLs in the web application.
          - Implement strict input validation and allowlist only trusted URLs and IP addresses.
          - Ensure all application processes are executed with minimal privileges and drop unnecessary privileges promptly.
        impact: |
          Attackers could include arbitrary files using IP-based URLs, which may lead to:
            - Execution of malicious code within the web application.
            - Unauthorized access to sensitive server files or configurations.
            - Facilitation of other attacks, such as cross-site scripting (XSS) or denial of service (DoS).
        references: |
          - OWASP API Top 10 - 2019 - API8: Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - Common Weakness Enumeration (CWE) - CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program - https://cwe.mitre.org/data/definitions/98.html
          - MITRE ATT&CK - T1190: Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190
          - Web Application Security Consortium - WASC-5: Remote File Inclusion - http://projects.webappsec.org/w/page/13246955/Remote%20File%20Inclusion

    - ruleId: crs_931110
      eventDetails:
        description: |
          A pattern indicative of a Remote File Inclusion (RFI) attack is detected. The attack involves the use of common parameters known to be vulnerable to RFI (e.g., `file`, `url`, or `path`) combined with a URL payload to include remote files in the application.
        mitigation: |
          - Restrict the inclusion of files based on user inputs and validate parameter values against an allowlist.
          - Avoid dynamically including files using user-supplied parameters unless absolutely necessary, and ensure proper sanitization.
          - Regularly audit and secure application parameters to identify and address potential RFI vulnerabilities.
        impact: |
          Attackers using RFI-vulnerable parameters can:
            - Execute arbitrary code or scripts within the application.
            - Gain unauthorized access to sensitive server files and configurations.
            - Use the application to launch further attacks, such as denial of service or XSS.
        references: |
          - OWASP Top 10 - 2021 - A3: Injection - https://owasp.org/Top10/A03_2021-Injection/
          - CAPEC-193: PHP Remote File Inclusion - https://capec.mitre.org/data/definitions/193.html
          - MITRE ATT&CK - T1190: Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190
          - WASC-5: Remote File Inclusion - http://projects.webappsec.org/w/page/13246955/Remote%20File%20Inclusion

    - ruleId: crs_931120
      eventDetails:
        description: |
          A pattern indicative of a Remote File Inclusion (RFI) attack is detected. This attack involves the use of a URL payload ending with a trailing question mark (`?`) to bypass input validation or obfuscate the payload.
        mitigation: |
          - Validate and sanitize all user inputs, disallowing obfuscated payloads such as URLs with trailing question marks.
          - Use static mappings to control file inclusion rather than dynamically evaluating user-supplied URLs.
          - Monitor logs for suspicious patterns, such as URLs with trailing question marks, and block such requests.
        impact: |
          Trailing question mark RFI payloads can:
            - Enable execution of malicious files or scripts.
            - Bypass security filters to gain unauthorized access to sensitive server data.
            - Lead to further exploitation, such as privilege escalation or data exfiltration.
        references: |
          - OWASP API Top 10 - 2019 - API8: Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - CWE-98: Improper Control of Filename for Include/Require Statement in PHP Program - https://cwe.mitre.org/data/definitions/98.html
          - CAPEC-193: PHP Remote File Inclusion - https://capec.mitre.org/data/definitions/193.html

- ruleId: crs_933
  ruleName: PHP Attacks
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_KNOWN_VULNERABILITIES
  eventLabels:
    MITRE_TACTIC: TA0002
    MITRE_TECHNIQUE: T1059.004
  eventDetails:
    description: "A PHP attack occurs when an attacker injects malicious code into an application, exploiting weaknesses in how PHP processes input, allowing the attacker to execute arbitrary commands on the server."
    mitigation: "To mitigate PHP injection attacks, ensure proper input validation and sanitization. Use prepared statements with parameterized queries for database interactions. Regularly update PHP and all related dependencies to the latest versions to patch known vulnerabilities. Use frameworks that provide built-in protection against injection attacks."
    impact: "PHP attacks can have severe consequences, including unauthorized access to sensitive data, complete server compromise, data corruption, or loss, and service disruption. Successful exploitation can lead to significant financial loss, reputational damage, and legal liabilities due to data breaches and non-compliance with data protection regulations."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - OWASP Top 10 - 2021 - A06:Vulnerable and Outdated Components - https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
      - OWASP Top 10 - 2017 - A09:Using Components with Known Vulnerabilities - https://owasp.org/www-project-top-ten/2017/A9_2017-Using_Components_with_Known_Vulnerabilities
      - Common Weakness Enumeration (CWE) - CWE-78:Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection') - https://cwe.mitre.org/data/definitions/78.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-248:Command Injection - https://capec.mitre.org/data/definitions/248.html
      - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
  subRuleInfos:
    - ruleId: crs_9330111
      eventDetails:
        description: |
          PHP CGI Argument Injection vulnerability (CVE-2024-4577) affects PHP versions 8.1.* before 8.1.29, 8.2.* before 8.2.20, 8.3.* before 8.3.8, specifically on Windows systems using PHP-CGI with Apache.
          - The vulnerability occurs when certain code pages are used in Windows systems, where Best-Fit behavior replaces characters in the command line passed to Win32 API functions.
          - When PHP is run using the CGI module, it may misinterpret these replaced characters as PHP options, allowing attackers to inject arbitrary PHP options.
          - This can lead to remote code execution (RCE), where an attacker could execute arbitrary PHP code, reveal the source code of PHP scripts, or manipulate server-side functions.
          - Exploiting this vulnerability requires an attacker to pass specially crafted arguments to PHP, potentially compromising the server.
        mitigation: |
          - Upgrade PHP to at least 8.1.29, 8.2.20, or 8.3.8 to resolve this vulnerability.
          - Disable PHP-CGI if not needed, and configure PHP to run using mod_php or FPM for improved security.
          - Ensure that code pages used by Windows systems are properly configured and do not rely on Best-Fit behavior for characters in command-line arguments.
          - Sanitize user input thoroughly to prevent unintended command injections or arguments being passed to the PHP binary.
          - Monitor logs for any attempts to exploit this vulnerability and take action if suspicious activity is detected.
        impact: |
          - Remote Code Execution (RCE): Attackers can execute arbitrary PHP code on the server.
          - Exposure of Source Code: If exploited, attackers may reveal the source code of PHP scripts running on the server.
          - Denial of Service (DoS): Potential for server misconfiguration or crashes if malicious arguments are injected into PHP’s command-line execution.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2024-4577
          - https://www.cve.org/CVERecord?id=CVE-2024-4577


- ruleId: crs_932
  ruleName: Remote Code Execution
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_KNOWN_VULNERABILITIES
  eventLabels:
    MITRE_TACTIC: TA0002
    MITRE_TECHNIQUE: T1059.004
  eventDetails:
