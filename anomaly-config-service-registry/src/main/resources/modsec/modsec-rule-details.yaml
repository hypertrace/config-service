        - Common Weakness Enumeration (CWE) CWE-153:Input Data Manipulation - https://capec.mitre.org/data/definitions/153.html
        - SANS TOP 25 - http://cwe.mitre.org/top25/
        - MITRE Attack - TA0007:Discovery - https://attack.mitre.org/tactics/TA0007/
        - CVE-2022-22965 - Spring4Shell - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2022-22965
        - Web Application Security Consortium - WASC-20:Improper Input Handling - http://projects.webappsec.org/w/page/13246933/Improper%20Input%20Handling
  - ruleId: crs_9440940
    eventDetails:
      description: |
        An anomaly characteristic of Apache Struts RCE attack is detected. The attack occurs if the attacker can manipulate file upload params to enable paths traversal.
        Under certain conditions, this manipulation can result in the upload of a malicious file, potentially enabling Remote Code Execution.
      mitigation: |
        Upgrade Apache Struts to:
        - Struts 2.5.x → 2.5.33 or higher
        - Struts 6.3.x → 6.3.0.2 or higher
