
- ruleId: crs_101
  ruleName: Server Side Request Forgery (SSRF) Signatures
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_SSRF
  eventLabels:
    MITRE_TACTIC: TA0006
    MITRE_TECHNIQUE: T1552.005
  eventDetails:
    description: |
      Server-Side Request Forgery (SSRF) occurs when attackers exploit improperly validated parameters that receive URLs, allowing them to inject malicious URLs pointing to internal services, protocols, ports, or other sensitive resources.
    mitigation: |
      Validate the input URL and prevent internal services from reaching internet applications:
      - Use regular expressions to validate possible URLs, avoiding unwanted domain names, ports, and protocols
      - Use a whitelist of allowed domains, protocols and ports
      - Prevent internal resources from reaching internet facing applications
      Traceable recommends to enable block mode for this rule.
    impact: |
      The impact of this attack depends on the affected systems - it can range from Sensitive Data Exposure, DOS, RCE, and more.
      - A vulnerable API importing remote code could be affected by RCE
      - A vulnerable API reading remote files might provide access internal sensitive APIs
      - A vulnerable API reading remote files can be used to request other protocols, like telnet or ftp
      - A vulnerable API reading remote files can sometimes be affected by RCE
      - A vulnerable API can sometimes be exploited to download big files and cause DOS
    references: |
      - Server Side Request Forgery: https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
      - OWASP Top 10 - 2021 - A10 2021-Server-Side Request Forgery - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
      - CWE - SANS - Server-Side Request Forgery (SSRF) - https://cwe.mitre.org/data/definitions/918.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - https://capec.mitre.org/data/definitions/664.html
      - MITRE Attack - T1190 Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
      - SSRF Bible Cheatsheet - https://cheatsheetseries.owasp.org/assets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet_SSRF_Bible.pdf
  subRuleInfos:
    - ruleId: crs_1010010
      eventDetails:
        description: |
          Apache HTTP Server is vulnerable to a Server-Side Request Forgery (SSRF) attack, identified as CVE-2021-40438. 
          - This vulnerability allows an attacker to craft a malicious HTTP request, which could trigger the server to make arbitrary requests to internal resources, potentially revealing sensitive information or leading to further attacks.
          - The issue arises when the server processes user-supplied URLs in certain configurations, such as with the `ProxyPass` or `Redirect` directives.
          - Exploiting this vulnerability may allow attackers to access internal services that are otherwise not exposed to the public, resulting in data leakage or network compromise.
          - The vulnerability is fixed in Apache HTTP Server 2.4.50, where improved input validation and restrictions on internal requests were implemented.
        mitigation: |
          - Upgrade to Apache HTTP Server version 2.4.50 or later, which addresses this vulnerability.
          - Review proxy configurations, ensuring that user-controlled inputs do not result in requests to internal resources.
          - Restrict access to internal services and implement proper network segmentation to limit potential damage from SSRF.
          - Monitor logs for any signs of exploitation and investigate unexpected internal network traffic.
        impact: |
          - Server-Side Request Forgery (SSRF): Attackers can make arbitrary requests to internal services, potentially compromising sensitive data or internal networks.
          - Data Exposure: Sensitive internal resources could be accessed or leaked through SSRF.
          - Network Compromise: The vulnerability could allow attackers to perform reconnaissance or launch further attacks on internal systems.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2021-40438
          - https://www.cve.org/CVERecord?id=CVE-2021-40438
          - https://httpd.apache.org/security/vulnerabilities_24.html
    - ruleId: crs_1010020
      eventDetails:
        description: |
          The /plugins/servlet/gadgets/makeRequest resource in Jira versions before 8.4.0 is vulnerable to a Server Side Request Forgery (SSRF) attack due to a logic bug in the JiraWhitelist class.
          - CVE-2019-8451 allows remote attackers to bypass restrictions and access internal network resources by crafting malicious requests that Jira will process on their behalf.
          - This vulnerability can be exploited because the `makeRequest` function does not properly validate URLs, allowing attackers to target internal services or sensitive information.
          - The flaw stems from the improper handling of URL-based requests, allowing attackers to access resources that should be otherwise restricted.
          - The issue was resolved in Jira version 8.4.0, which fixed the logic bug in the JiraWhitelist class, preventing unauthorized access to internal resources.
        mitigation: |
          - Upgrade to Jira version 8.4.0 or later, which resolves the SSRF vulnerability.
          - Restrict access to the /plugins/servlet/gadgets/makeRequest endpoint, ensuring that it is not accessible to untrusted users or external entities.
          - Validate and sanitize user input to ensure that URLs processed by the system do not point to internal resources.
          - Monitor logs for unusual activity related to SSRF attempts or unauthorized access to internal services.
        impact: |
          - Server-Side Request Forgery (SSRF): Attackers can make arbitrary requests to internal services, potentially gaining access to sensitive data or internal resources.
          - Data Exposure: Exploiting the SSRF vulnerability could lead to the exposure of sensitive internal resources or services.
          - Network Compromise: Attackers may use the vulnerability to perform reconnaissance on the internal network, enabling further attacks.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-8451
          - https://www.cve.org/CVERecord?id=CVE-2019-8451
          - https://jira.atlassian.com/browse/JRASERVER-72229
    - ruleId: crs_1010100
      eventDetails:
        description: |
          A pattern indicative of Server Side Request Forgery (SSRF) is detected.
          - SSRF occurs when an attacker is able to make arbitrary requests from the server-side application to internal resources, such as internal services or cloud provider metadata endpoints, through a vulnerable URL or API.
          - When SSRF targets cloud provider metadata endpoints (e.g., AWS, Azure, Google Cloud), it can allow attackers to gain access to sensitive metadata like instance credentials, internal service data, or configuration details.
          - These metadata endpoints are often not protected by firewalls or access control, making them a common target for exploitation.
          - Example: In AWS, accessing the metadata URL `http://169.254.169.254/latest/meta-data/` can reveal sensitive instance metadata, including security credentials, IAM roles, and other configuration details.
        mitigation: |
          - Restrict access to cloud provider metadata endpoints from untrusted sources by either blocking access to the metadata service or implementing strict whitelisting.
          - Use IAM roles with the least privilege principle to limit the permissions of cloud instances.
          - Perform input validation on URLs or API calls to prevent attackers from injecting malicious URLs that could be used for SSRF attacks.
          - Monitor and log requests made to internal services and metadata endpoints to detect and respond to suspicious activity.
          - Use network segmentation or Virtual Private Cloud (VPC) configurations to isolate metadata services from the public network and limit server-side access.
        impact: |
          - Information Disclosure: Accessing cloud metadata endpoints can leak sensitive information such as instance credentials, IAM roles, and configuration data.
          - Privilege Escalation: Attackers could obtain privileged credentials or access to cloud resources, leading to further exploitation.
          - Denial of Service: By abusing SSRF to flood internal services or metadata endpoints with excessive requests, attackers can cause resource exhaustion and service disruption.
          - Compromise of Cloud Infrastructure: Attackers may use stolen cloud credentials to escalate privileges, gain unauthorized access, or manipulate cloud environments.
        references: |
          - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
          - https://cwe.mitre.org/data/definitions/918.html
          - https://www.owasp.org/index.php/Server_Side_Request_Forgery
    - ruleId: crs_1010110
      eventDetails:
        description: |
          - A pattern indicative of Server Side Request Forgery (SSRF) using common collaborators is detected.
          - SSRF occurs when an attacker is able to make arbitrary requests from the server-side application to internal or external resources, exploiting vulnerabilities in the way user input is handled.
        mitigation: |
          - Restrict network access: Ensure that applications can only make requests to trusted and necessary destinations. Implement firewall rules or network segmentation to block access to internal services or cloud metadata endpoints.
          - Input validation and sanitization: Validate user input, especially URLs, to ensure that they cannot be used to redirect server-side requests to unauthorized collaborators. Reject requests with suspicious URL patterns or IP addresses.
          - Access control: Limit the privileges of the server or application executing the request, using the principle of least privilege to restrict access to sensitive services or collaborators.
          - Whitelisting: Use a whitelist approach to only allow requests to known, safe destinations. This can prevent the exploitation of SSRF attacks targeting arbitrary external services.
          - Monitor and log: Log all outbound requests and monitor for unusual patterns, especially requests to unexpected internal or external collaborators.
          - Response filtering: Filter and sanitize responses from external or internal collaborators to prevent the exposure of sensitive information.
        impact: |
          - Data Leakage: Attackers may access internal systems, cloud metadata, or services that could lead to unauthorized access to sensitive information.
          - Privilege Escalation: By gaining access to internal services or cloud metadata, attackers can escalate their privileges, compromising the system or gaining control over the infrastructure.
          - Denial of Service: Exploiting SSRF to make excessive requests to internal or external collaborators can lead to a denial-of-service (DoS) attack by exhausting resources or causing service outages.
          - Remote Code Execution: In some cases, SSRF can allow attackers to interact with vulnerable external services or internal systems, potentially leading to remote code execution or further compromise.
        references: |
          - https://cwe.mitre.org/data/definitions/918.html
          - https://www.owasp.org/index.php/Server_Side_Request_Forgery

- ruleId: crs_913
  ruleName: Scanner Detection
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_SCANNER_DETECTED
  eventLabels:
    MITRE_TACTIC: TA0043
    MITRE_TECHNIQUE: T1595.002
  eventDetails:
    description: "Scanners are commonly utilized by attackers to identify potential vulnerabilities within your application, allowing them to exploit weaknesses for malicious purposes."
    mitigation: |
      Monitor your application logs for scanning activity and investigate any suspicious behavior. Consider implementing rate limiting to reduce the effectiveness of scanners.
      Traceable recommends to enable block mode for this rule.
    impact: |
      If not mitigated, scanners can discover vulnerabilities in your application and provide attackers with information they can use to exploit these vulnerabilities.
      Traceable recommends to enable block mode for this rule.
    references: "For more information, refer to the OWASP Testing Guide: Testing for Vulnerability Scanners."
  subRuleInfos:
    - ruleId: crs_913100
      eventDetails:
        description: |
          A User-Agent associated with a known security scanner is detected. Security scanners are often used by attackers to identify vulnerabilities in your application by probing for weaknesses.
        mitigation: |
          Monitor your application logs for activity involving suspicious User-Agent strings and investigate any unusual behavior. Implement rate limiting and block or challenge requests from known malicious User-Agent patterns.  
          Traceable recommends enabling block mode for this rule.
        impact: |
          If not mitigated, scanners can identify vulnerabilities in your application, providing attackers with valuable information to exploit these weaknesses.
          Traceable recommends enabling block mode for this rule.
        references: |
          - https://owasp.org/www-community/Vulnerability_Scanning_Tools
          - https://owasp.org/www-project-web-security-testing-guide/
          - For more information, refer to the OWASP Testing Guide: Testing for Vulnerability Scanners.

    - ruleId: crs_913110
      eventDetails:
        description: |
          A request header associated with a known security scanner is detected. Security scanners often include unique headers or patterns that indicate probing for vulnerabilities in your application.
        mitigation: |
          Monitor your application logs for suspicious or unusual request headers and investigate any anomalous behavior. Consider implementing rate limiting and blocking requests containing known malicious or suspicious headers.  
          Traceable recommends enabling block mode for this rule.
        impact: |
          If not mitigated, scanners can identify vulnerabilities in your application, allowing attackers to gain valuable information for exploitation.
          Traceable recommends enabling block mode for this rule.
        references: |
          - https://owasp.org/www-community/Vulnerability_Scanning_Tools
          - https://owasp.org/www-project-web-security-testing-guide/
          - For more information, refer to the OWASP Testing Guide: Testing for Vulnerability Scanners.

    - ruleId: crs_913120
      eventDetails:
        description: |
          A request filename or argument associated with a known security scanner is detected. Attackers often use scanners to probe for specific files or arguments to identify vulnerabilities or sensitive information.
        mitigation: |
          Monitor your application logs for requests targeting suspicious filenames or arguments and investigate unusual activity. Implement input validation to block unexpected or malicious filenames and arguments.  
          Traceable recommends enabling block mode for this rule.
        impact: |
          If not mitigated, scanners can discover sensitive files or vulnerabilities in your application, increasing the risk of exploitation by attackers.
          Traceable recommends enabling block mode for this rule.
        references: |
          - https://owasp.org/www-community/Vulnerability_Scanning_Tools
          - https://owasp.org/www-project-web-security-testing-guide/
          - For more information, refer to the OWASP Testing Guide: Testing for Vulnerability Scanners.

- ruleId: crs_941
  ruleName: Cross Site Scripting (XSS)
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_XSS
  eventLabels:
    MITRE_TACTIC: TA0001
    MITRE_TECHNIQUE: T1189
  eventDetails:
    description: |
      Cross-Site Scripting (XSS) is the misuse of untrusted user input in web applications. Key aspects include:
      - Untrusted input from a web request is used to dynamically generate a web page without proper sanitization.
      - The victim’s browser executes the malicious script in the web server's domain, violating the same-origin policy.
      - Attackers may steal sensitive data, perform unauthorized actions, or trick victims with phishing attempts.
      - Scripts could exploit browser vulnerabilities, potentially compromising the victim’s device.
    mitigation: |
      Assume all input is malicious. Use an "accept known good" input validation strategy. Use a vetted library or framework that does not allow this weakness to occur or provides constructs that make this weakness easier to avoid. Use a whitelist of allowed characters that do not need to be encoded.
      To help mitigate XSS attacks against the user's session cookie, set the session cookie to be HttpOnly. This will prevent the cookie from being accessed by a client side script.
    impact: |
      Consequence of an XSS attack could be any of the following regardless of the type:
      - an annoyance to end user to complete account compromise.
      - can be exploited to manipulate or steal credentials/cookies or compromise confidential information.
      - forge requests from the victim's browser.
      - execute malicious code on the end user systems for a variety of nefarious purposes
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
      - OWASP Top 10 - 2017 - A7:Cross-Site Scripting (XSS) - https://owasp.org/www-project-top-ten/2017/A7_2017-Cross-Site_Scripting_(XSS).html
      - OWASP: Cross Site Scripting (XSS) - https://owasp.org/www-community/attacks/xss/
      - OWASP: XSS (Cross Site Scripting) Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting') - https://cwe.mitre.org/data/definitions/79.html
      - CAPEC-592: Stored Cross-Site Scripting - https://capec.mitre.org/data/definitions/592.html
  subRuleInfos:
    - ruleId: crs_9410170
      eventDetails:
        description: |
          A pattern indicative of Cross-Site Scripting (XSS) Attribute Injection attack is detected. Key aspects include:
          - Attempts to inject malicious attributes into HTML elements
          - Manipulation of existing attributes to execute JavaScript
          - Use of event handlers (like onclick, onmouseover) to trigger malicious code
          - Exploitation of browser rendering mechanisms to execute injected code
          - Bypassing traditional XSS filters through attribute manipulation
        mitigation: |
          Implement multiple layers of defense against attribute injection attacks:
          - Encode all dynamic attributes using context-aware encoding
          - Implement strict Content Security Policy (CSP) rules
          - Validate input against a whitelist of allowed attributes
          - Remove or encode special characters that could break out of attribute context
          - Use security-focused HTML sanitization libraries
          - Implement attribute name and value validation
        impact: |
          Successful attribute injection attacks can lead to:
          - Execution of arbitrary JavaScript in victim's browser
          - Theft of sensitive user data and session information
          - Manipulation of DOM elements to modify page content
          - Browser cookie theft and session hijacking
          - Click-jacking and user interface manipulation
        references: |
          - OWASP XSS Filter Evasion Cheat Sheet - https://owasp.org/www-community/xss-filter-evasion-cheatsheet
          - OWASP DOM Based XSS Prevention - https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html
          - CWE-83: Improper Neutralization of Script in Attributes - https://cwe.mitre.org/data/definitions/83.html
          - MITRE ATT&CK - T1059.007: Command and Scripting Interpreter: JavaScript - https://attack.mitre.org/techniques/T1059/007/
    - ruleId: crs_9410160
      eventDetails:
        description: |
          A pattern indicative of HTML Injection XSS attack is detected. Key aspects include:
          - Insertion of arbitrary HTML tags into the target application
          - Manipulation of DOM structure through injected HTML elements
          - Potential execution of embedded JavaScript through HTML elements
          - Bypass of XSS filters through HTML context manipulation
          - Use of malformed HTML to trigger browser parsing quirks
        mitigation: |
          Implement comprehensive HTML injection prevention measures:
          - Use HTML encoding for all dynamic content
          - Implement strict input validation and sanitization
          - Use content security policies (CSP) to restrict HTML sources
          - Apply HTML sanitization libraries to clean user input
          - Validate and sanitize HTML attributes and tag names
          - Implement proper output encoding based on the context
        impact: |
          HTML injection attacks can result in:
          - Modification of webpage structure and content
          - Execution of malicious JavaScript through HTML event handlers
          - Phishing attacks through injected forms or content
          - Data theft through malicious HTML elements
          - Client-side security control bypass
        references: |
          - CWE-80: Improper Neutralization of Script-Related HTML Tags - https://cwe.mitre.org/data/definitions/80.html
          - OWASP Testing Guide: Testing for HTML Injection - https://owasp.org/www-project-web-security-testing-guide/
          - MITRE ATT&CK - T1189: Drive-by Compromise - https://attack.mitre.org/techniques/T1189/
          - Web Application Security Consortium - HTML Injection - http://projects.webappsec.org/w/page/13246931/HTML%20Injection
          - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/03-Testing_for_HTML_Injection
    - ruleId: crs_941110
      eventDetails:
        description: |
          A pattern indicative of Script Tag XSS attack is detected. Key aspects include:
          - Direct injection of <script> tags into web applications
          - Attempts to execute JavaScript through various script tag attributes
          - Use of different encoding techniques to bypass filters
          - Exploitation of script tag parsing mechanisms
          - Implementation of alternative script loading methods
        mitigation: |
          Implement robust defense against script tag injection:
          - Remove or encode all <script> tags from user input
          - Implement strict Content Security Policy (CSP) rules
          - Use proper HTML encoding for dynamic content
          - Apply context-aware output encoding
          - Validate input against an allowlist of safe content
          - Implement proper sanitization of HTML content
        impact: |
          Script tag vector attacks can lead to:
          - Direct execution of malicious JavaScript code
          - Cross-site scripting attacks
          - Data theft and session hijacking
          - Browser exploitation
          - Client-side malware execution
        references: |
          - OWASP XSS Prevention - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
          - CWE-116: Improper Encoding or Escaping of Output - https://cwe.mitre.org/data/definitions/116.html
          - MITRE ATT&CK - T1059.007: JavaScript/JScript - https://attack.mitre.org/techniques/T1059/007/
    - ruleId: crs_941140
      eventDetails:
        description: |
          A pattern indicative of XSS Javascript URI Vector attack is detected. Key aspects include:
          - Use of javascript: protocol in URLs to execute code
          - Manipulation of href and src attributes to include JavaScript URIs
          - Encoding techniques to bypass URI filtering
          - Exploitation of browser URI handling mechanisms
          - Alternative JavaScript protocol variants
        mitigation: |
          Implement comprehensive protection against JavaScript URI attacks:
          - Strip or encode javascript: protocol handlers
          - Validate all URLs against an allowlist
          - Implement strict URI scheme filtering
          - Use Content Security Policy with proper URI restrictions
          - Sanitize all URL inputs and attributes
          - Implement proper URL encoding and validation
        impact: |
          JavaScript URI vector attacks can result in:
          - Execution of arbitrary JavaScript through URL handlers
          - Bypass of traditional XSS protections
          - Client-side code execution
          - Session hijacking and data theft
          - Browser security mechanism bypass
        references: |
          - OWASP URI-based XSS Prevention - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html#rule-7-prevent-uri-based-xss
          - CWE-79: Improper Neutralization of Input During Web Page Generation - https://cwe.mitre.org/data/definitions/79.html
          - MITRE ATT&CK - T1189: Drive-by Compromise - https://attack.mitre.org/techniques/T1189/
          - OWASP XSS Filter Evasion Cheat Sheet - https://owasp.org/www-community/xss-filter-evasion-cheatsheet

    - ruleId: crs_941230
      eventDetails:
        description: |
          A pattern indicative of Embed Tag XSS attack specific to Internet Explorer is detected. Key aspects include:
          - Exploitation of IE's handling of embed tags
          - Manipulation of embed tag attributes to execute code
          - Bypassing IE's XSS filters through embed tag vectors
          - Use of specially crafted embed parameters
          - Embedding of malicious content through flash or other plugins
        mitigation: |
          Implement specific protections against embed tag attacks:
          - Remove or sanitize all embed tags from user input
          - Implement strict Content Security Policy rules
          - Validate and sanitize embed tag attributes
          - Use proper HTML encoding for dynamic content
          - Apply specific IE security headers
          - Implement plugin content restrictions
        impact: |
          Embed tag XSS attacks can result in:
          - Execution of malicious code through embedded objects
          - Browser security bypass in IE-specific contexts
          - Plugin-based attacks and exploits
          - Data theft and session hijacking
          - Client-side security control bypass
        references: |
          - Microsoft Security Advisory: IE XSS Filter - https://docs.microsoft.com/en-us/security-updates/
          - OWASP XSS Filter Evasion - https://owasp.org/www-community/xss-filter-evasion-cheatsheet
          - CWE-80: Improper Neutralization of Script-Related HTML Tags - https://cwe.mitre.org/data/definitions/80.html
          - MITRE ATT&CK - T1189: Drive-by Compromise - https://attack.mitre.org/techniques/T1189/

    - ruleId: crs_941250
      eventDetails:
        description: |
          A pattern indicative of Meta http-equiv XSS attack targeting Internet Explorer is detected. Key aspects include:
          - Exploitation of meta tags with http-equiv attribute
          - Manipulation of content refresh and redirect mechanisms
          - Injection of JavaScript through meta tag content
          - Bypassing IE's XSS filters through meta tag vectors
          - Use of character encoding manipulation via meta tags
        mitigation: |
          Implement specific protections against meta http-equiv attacks:
          - Remove or strictly validate meta tags with http-equiv attributes
          - Implement proper Content Security Policy (CSP) headers
          - Validate and sanitize all meta tag content
          - Control character encoding declarations
          - Use HTTP headers instead of meta tags where possible
          - Implement strict validation of meta tag attributes
        impact: |
          Meta http-equiv attacks can result in:
          - Execution of malicious JavaScript through meta refresh
          - Content and encoding manipulation
          - Page redirect attacks
          - Browser security mechanism bypass
          - Cross-site scripting through meta tag injection
        references: |
          - CWE-95: Improper Neutralization of Directives in Dynamically Generated Content - https://cwe.mitre.org/data/definitions/95.html
          - MITRE ATT&CK - T1185: Browser Session Hijacking - https://attack.mitre.org/techniques/T1185/
          - Microsoft XSS Filter Documentation - https://docs.microsoft.com/en-us/previous-versions/windows/internet-explorer/ie-developer/

    - ruleId: crs_941260
      eventDetails:
        description: |
          A pattern indicative of Meta charset XSS attack targeting Internet Explorer is detected. Key aspects include:
          - Manipulation of character encoding through meta charset tags
          - Exploitation of character encoding mismatches
          - Bypassing XSS filters through encoding confusion
          - Use of rare or multiple character encodings
          - Injection of encoded malicious content
        mitigation: |
          Implement robust protection against meta charset attacks:
          - Set explicit character encoding through HTTP headers
          - Validate and restrict allowed character encodings
          - Remove or sanitize meta charset tags from user input
          - Implement consistent character encoding across application
          - Use Content Security Policy to control meta tag usage
          - Monitor for character encoding anomalies
        impact: |
          Meta charset attacks can lead to:
          - XSS filter bypass through encoding confusion
          - Content interpretation attacks
          - Character encoding-based XSS
          - Browser rendering engine exploitation
          - Security control bypass through encoding manipulation
        references: |
          - OWASP Encoded Injection - https://owasp.org/www-project-web-security-testing-guide/latest/6-Appendix/D-Encoded_Injection
          - CWE-116: Improper Encoding or Escaping of Output - https://cwe.mitre.org/data/definitions/116.html
          - MITRE ATT&CK - T1059.007: Command and Scripting Interpreter: JavaScript - https://attack.mitre.org/techniques/T1059/007/
          - Character Encoding Security - https://www.criticalstart.com/encoding-a-brief-history-and-its-role-in-cybersecurity/
          - IE Security Documentation - https://docs.microsoft.com/en-us/previous-versions/windows/internet-explorer/ie-developer/

    - ruleId: crs_941270
      eventDetails:
        description: |
          A pattern indicative of Link href XSS attack targeting Internet Explorer is detected. Key aspects include:
          - Exploitation of link tag href attributes
          - Injection of JavaScript through malformed URLs
          - Manipulation of stylesheet loading mechanisms
          - Bypassing IE XSS filters through link tag vectors
          - Use of data URIs in href attributes
        mitigation: |
          Implement comprehensive protection against link href attacks:
          - Validate all href attributes against allowlist
          - Implement strict Content Security Policy for stylesheets
          - Sanitize all URL inputs in href attributes
          - Restrict usage of javascript: and data: URIs
          - Validate stylesheet sources
          - Monitor for suspicious link tag patterns
        impact: |
          Link href attacks can result in:
          - Execution of malicious JavaScript through stylesheet loading
          - CSS-based attacks and information leakage
          - Resource loading attacks
          - Browser security mechanism bypass
          - Style-based DOM manipulation
        references: |
          - OWASP HREF XSS Prevention - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
          - CWE-83: Improper Neutralization of Script in Attributes - https://cwe.mitre.org/data/definitions/83.html
          - MITRE ATT&CK - T1189: Drive-by Compromise - https://attack.mitre.org/techniques/T1189/
          - CSS Security Best Practices - https://w3c.github.io/webappsec-csp/
          - Link Element Security - https://developer.mozilla.org/en-US/docs/Web/HTML/Element/link#Security

    - ruleId: crs_941280
      eventDetails:
        description: |
          A pattern indicative of Base href XSS attack targeting Internet Explorer is detected. Key aspects include:
          - Manipulation of base URL through base href attribute
          - Exploitation of relative URL resolution
          - Injection of malicious base URLs
          - Bypassing XSS filters through base tag manipulation
          - URL resolution attacks using base tag
        mitigation: |
          Implement specific protections against base href attacks:
          - Validate and sanitize base href attributes
          - Implement strict URL validation for base tags
          - Use Content Security Policy to restrict base tag usage
          - Remove or sanitize user-controlled base tags
          - Implement proper URL encoding and validation
          - Monitor for suspicious base tag modifications
        impact: |
          Base href attacks can lead to:
          - Manipulation of relative URL resolution
          - Path traversal attacks
          - Resource loading attacks
          - Cross-site scripting through URL manipulation
          - Browser security control bypass
