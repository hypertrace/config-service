- ruleId: crs_943
  ruleName: Session Fixation
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_SESSION_FIXATION
  eventLabels:
    MITRE_TACTIC: TA0009
    MITRE_TECHNIQUE: T1185
  eventDetails:
    description: |
      Session Fixation is an attack that permits an attacker to hijack a valid user session. The attack explores a limitation in the way the web application manages the session ID, more specifically the vulnerable web application. When authenticating a user, it doesn’t assign a new session ID, making it possible to use an existent session ID. The attack consists of obtaining a valid session ID (e.g. by connecting to the application), inducing a user to authenticate himself with that session ID, and then hijacking the user-validated session by the knowledge of the used session ID. The attacker has to provide a legitimate Web application session ID and try to make the victim’s browser use it.
      The session fixation attack is not a class of Session Hijacking, which steals the established session between the client and the Web Server after the user logs in. Instead, the Session Fixation attack fixes an established session on the victim’s browser, so the attack starts before the user logs in.
    mitigation: |
      - Generate a new session ID every time a user authenticates themself, even if a set session ID has been provided in the request.
      - Timeout user sessions after a short period of time with no activity. This will limit the amount of time the attacker is able to spend on the victim's session with the current session ID.
    impact: |
      A successful session fixation attack gives the attacker access to the victim's account. This could mean access to higher level privileges or the ability to look at sensitive data.
    references: |
      - https://owasp.org/www-community/attacks/Session_fixation
      - https://www.contrastsecurity.com/glossary/session-fixation-attack
      - http://en.wikipedia.org/wiki/Session_fixation
  subRuleInfos:
    - ruleId: crs_943100
      eventDetails:
        description: |
          - A pattern indicative of Session Fixation attacks through HTML cookie manipulation is detected.
          - Session Fixation is an attack that permits an attacker to hijack a valid user session. The attack explores a limitation in the way the web application manages the session ID, more specifically the vulnerable web application. When authenticating a user, it doesn’t assign a new session ID, making it possible to use an existent session ID. The attack consists of obtaining a valid session ID (e.g. by connecting to the application), inducing a user to authenticate himself with that session ID, and then hijacking the user-validated session by the knowledge of the used session ID. The attacker has to provide a legitimate Web application session ID and try to make the victim’s browser use it.
          - The session fixation attack is not a class of Session Hijacking, which steals the established session between the client and the Web Server after the user logs in. Instead, the Session Fixation attack fixes an established session on the victim’s browser, so the attack starts before the user logs in.
        mitigation: |
          Implement comprehensive protection against HTML-based cookie manipulation:
          - Regenerate session IDs after authentication
          - Use secure session management practices
          - Implement HTTP-only cookie flags
          - Validate and verify session creation sources
          - Monitor for suspicious cookie modifications
          - Block client-side session ID setting
        impact: |
          Session fixation through HTML cookie manipulation can lead to:
          - Session hijacking
          - Authentication bypass
          - Unauthorized session access
          - Identity spoofing
          - Session-based attacks
        references: |
          - OWASP Session Fixation - https://owasp.org/www-community/attacks/Session_fixation
          - CWE-384: Session Fixation - https://cwe.mitre.org/data/definitions/384.html
          - MITRE ATT&CK - T1212: Exploitation for Credential Access - https://attack.mitre.org/techniques/T1212/
          - Session Management Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
          - Cookie Security Best Practices - https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies
    - ruleId: crs_943110
      eventDetails:
        description: |
          - Session Fixation attacks involving SessionID parameters from external domains have been detected. 
          - Session IDs are manipulated from external sources, with attempts to fix the session across different domains.
          - Techniques like referrer manipulation and external domain session injection are used to exploit the vulnerability.
          - This issue allows for session parameter tampering from untrusted sources, leading to unauthorized session access.
        mitigation: |
          Implement robust protection against cross-domain session fixation:
          - Validate session origin and referrer headers
          - Implement strict session ID generation controls
          - Use secure session management
          - Apply proper cross-domain restrictions
          - Monitor for suspicious referrer patterns
          - Implement session token verification
        impact: |
          Cross-domain session fixation attacks can result in:
          - Cross-site session hijacking
          - Authentication state manipulation
          - Unauthorized session access
          - Cross-domain security bypass
          - Session integrity compromise
        references: |
          - OWASP Session Management - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/
          - CWE-384: Session Fixation - https://cwe.mitre.org/data/definitions/384.html
          - MITRE ATT&CK - T1557: Man-in-the-Middle - https://attack.mitre.org/techniques/T1557/
          - Session Security Guidelines - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
          - Cross-Domain Security - https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy
    - ruleId: crs_943120
      eventDetails:
        description: |
          - A pattern indicative of Session Fixation attacks with missing referrer information is detected.
          - Session Fixation attacks with missing referrer information occur when session manipulation attempts lack referrer headers.
          - The absence of origin validation allows session IDs to be injected without tracking the source of the session.
          - These attacks can involve anonymous session fixation, where referrer spoofing techniques bypass security controls.
        mitigation: |
          Implement specific protections against referrer-less session attacks:
          - Require and validate referrer headers for session operations
          - Implement strict session ID generation
          - Use secure session management practices
          - Apply proper origin validation
          - Monitor for missing referrer patterns
          - Implement additional authentication factors
        impact: |
          Session fixation attacks without referrer information can lead to:
          - Untraceable session manipulation
          - Authentication bypass attempts
          - Session tracking evasion
          - Anonymous attack execution
          - Session integrity violations
        references: |
          - OWASP Session Management Testing - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/06-Session_Management_Testing/
          - CWE-384: Session Fixation - https://cwe.mitre.org/data/definitions/384.html
          - MITRE ATT&CK - T1565: Data Manipulation - https://attack.mitre.org/techniques/T1565/
          - HTTP Referrer Security - https://developer.mozilla.org/en-US/docs/Web/Security/Referer_header:_privacy_and_security_concerns
          - Session Security Best Practices - https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html

- ruleId: crs_921
  ruleName: HTTP Protocol Attacks
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventLabels:
    MITRE_TACTIC: TA0011
    MITRE_TECHNIQUE: T1572
  eventDetails:
    description: "HTTP protocol attacks occur when vulnerabilities in the HTTP protocol are exploited, potentially indicating an attempt to compromise the security of the application."
    mitigation: |
      Ensure that your application correctly implements the HTTP protocol and handles any protocol-level errors.
      Consider using security middleware that can protect against protocol-level attacks.
    impact: "If not mitigated, this could lead to unauthorized access, data leakage, or denial of service."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://owasp.org/API-Security/editions/2019/en/0xa8-injection/
      - OWASP API Top 10 - 2023 - Security Misconfiguration - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
      - OWASP Top 10 - 2021 - A1:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
  subRuleInfos:
    - ruleId: crs_9210010
      eventDetails:
        description: |
          A pattern indicative of a Buffer Overflow attack in IIS 6.0 WebDAV module is detected.
          - This vulnerability, identified as CVE-2017-7269, occurs due to improper handling of specially crafted HTTP requests by the WebDAV extension in IIS 6.0.
          - An attacker can exploit this vulnerability by sending a malicious request, leading to a buffer overflow that may allow arbitrary code execution on the affected server.
          - Successful exploitation could enable an attacker to execute arbitrary code with the same privileges as the IIS process, potentially resulting in complete system compromise.
          - This issue is specific to IIS 6.0 and can be mitigated by upgrading to newer versions of IIS or by applying the security patches provided by Microsoft.
        mitigation: |
          - Upgrade to a more recent version of IIS, as IIS 6.0 has reached end-of-life and is no longer supported.
          - Apply the security patch released by Microsoft for IIS 6.0 if upgrading is not immediately feasible.
          - Disable WebDAV if it is not required for your environment, to mitigate the risk of exploitation.
          - Monitor server logs for suspicious activity indicative of exploit attempts and take immediate action if exploitation is detected.
        impact: |
          - Buffer Overflow: An attacker can exploit the vulnerability to execute arbitrary code on the affected server, potentially leading to a full system compromise.
          - Remote Code Execution (RCE): Successful exploitation could allow attackers to run arbitrary commands with the privileges of the IIS process.
          - Denial of Service (DoS): Exploitation could result in system instability or crashes, leading to service disruptions.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2017-7269
          - https://www.cve.org/CVERecord?id=CVE-2017-7269
    - ruleId: crs_9210115
      eventDetails:
        description: |
          A pattern indicative of HTTP Request Smuggling due to Content-Length/Transfer-Encoding Confusion is detected.
          - HTTP Request Smuggling occurs when an attacker exploits a discrepancy between how different systems (e.g., proxies, load balancers, web servers) interpret HTTP request headers, particularly the `Content-Length` and `Transfer-Encoding` headers.
          - This attack leads to the manipulation of request parsing, potentially allowing attackers to smuggle one or more HTTP requests through a vulnerable system.
          - Content-Length/Transfer-Encoding Confusion occurs when there is a conflict between the `Content-Length` and `Transfer-Encoding` headers in an HTTP request, where:
              - The `Content-Length` header specifies the length of the request body.
              - The `Transfer-Encoding` header (often set to `chunked`) indicates how the body is transferred.
          - If different systems interpret these headers differently, one system may process one request while another processes a different one, resulting in:
              - Request Smuggling: Attackers may send a crafted request that is interpreted differently by intermediaries (e.g., proxies, load balancers) and the final web server, smuggling a second request.
              - Bypassing Security Controls: Attackers may bypass security mechanisms, such as authentication or filtering systems, by smuggling malicious requests.
              - Hijacking Sessions: Attackers may smuggle a request that hijacks a session or exploits vulnerabilities on the server.
        mitigation: |
          - Correct Parsing of Headers: Ensure that HTTP servers, proxies, and load balancers correctly parse and enforce the rules for `Content-Length` and `Transfer-Encoding`. Servers should prioritize the `Transfer-Encoding` header and reject requests that contain both conflicting headers.
          - Strict Validation of HTTP Headers: Implement proper validation of all incoming HTTP requests to ensure no conflicting headers are allowed. Reject requests that contain both `Content-Length` and `Transfer-Encoding` headers.
          - Consistent Parsing: Ensure that all systems within the request path (e.g., proxies, firewalls, load balancers, and web servers) parse requests in the same way, minimizing the opportunity for discrepancies.
          - Security Configurations: Configure web servers and proxies to reject requests that contain both `Content-Length` and `Transfer-Encoding` headers. Certain web servers may provide options to enforce this behavior explicitly.
          - Implementing Web Application Firewalls (WAFs): Use WAFs to detect and block HTTP request smuggling attempts, which can look for signs of conflicting headers or other suspicious patterns.
          - Regular Security Patching: Keep web servers, proxies, and application security software updated to patch any known vulnerabilities that could be exploited by HTTP request smuggling.
        impact: |
          - Request Smuggling: Attackers may smuggle malicious requests that could bypass security systems, including authentication or filtering.
          - Session Hijacking: By smuggling a second request that affects user sessions, attackers may hijack users' sessions and access sensitive data.
          - Data Breaches: The attacker may exploit the vulnerability to access internal systems or leak sensitive information, bypassing access controls.
          - Denial of Service: In some cases, attackers may use HTTP request smuggling to overload the server or cause unintended behavior, leading to a denial-of-service condition.
          - Bypass of Security Mechanisms: Malicious payloads or requests may bypass firewalls, intrusion detection/prevention systems, or application security mechanisms, allowing attackers to gain unauthorized access.
        references: |
          - https://cwe.mitre.org/data/definitions/444.html
          - https://portswigger.net/research/http-request-smuggling
    - ruleId: crs_9210120
      eventDetails:
        description: |
          A pattern indicative of HTTP Request Smuggling due to Content-Length Confusion is detected.
          - HTTP Request Smuggling occurs when an attacker exploits discrepancies in how different systems (e.g., proxies, load balancers, web servers) interpret and handle HTTP request headers.
          - Content-Length Confusion is a specific form of HTTP request smuggling where the attacker manipulates the `Content-Length` header to cause confusion between systems parsing the request.
          - In this attack, the attacker crafts an HTTP request where the `Content-Length` header specifies a different body length than expected, leading to inconsistent handling of the request by different systems (e.g., the proxy or load balancer versus the web server). This could result in:
            - Request Smuggling: The attacker may inject malicious data that is misinterpreted by one system (e.g., the proxy), but correctly interpreted by another (e.g., the web server), allowing the attacker to smuggle a second HTTP request.
            - Bypassing Security Controls: The attack can bypass security filters, authentication mechanisms, and access controls.
            - Hijacking Sessions or Exploiting Vulnerabilities: The attacker could gain unauthorized access to sensitive data or execute arbitrary commands on the server.
        mitigation: |
          - Correct Parsing of Content-Length: Ensure that web servers, proxies, and load balancers correctly handle and validate the `Content-Length` header. Systems should reject requests where the `Content-Length` does not match the body size.
          - Reject Conflicting Headers: Reject requests that contain conflicting headers like `Content-Length` and `Transfer-Encoding`, which could cause confusion between systems.
          - Security Configurations: Configure web servers and proxies to properly prioritize headers and reject requests that can lead to smuggling. Ensure that parsing is consistent across all layers in the system.
          - Web Application Firewalls (WAFs): Use WAFs to detect suspicious patterns or inconsistencies in HTTP requests and block potential request smuggling attempts.
          - Regular Patching: Ensure that proxies, load balancers, and web servers are regularly updated to address known vulnerabilities and misconfigurations that could facilitate HTTP request smuggling.
        impact: |
          - Request Smuggling: Attackers may inject malicious requests, bypassing security mechanisms and potentially executing arbitrary code.
          - Session Hijacking: Attackers could hijack user sessions by injecting crafted requests that manipulate session data or authentication tokens.
          - Information Disclosure: Exploiting the vulnerability can lead to unauthorized access to sensitive data, potentially exposing private or confidential information.
          - Denial of Service: Attackers could also use this vulnerability to overload the system, causing a denial of service.
          - Bypass Security Filters: Malicious payloads may bypass firewalls, proxies, and intrusion detection systems, allowing attackers to execute unauthorized actions on the server.
        references: |
          - https://portswigger.net/research/http-request-smuggling
          - https://cwe.mitre.org/data/definitions/444.html
    - ruleId: crs_921200
      eventDetails:
        description: |
          A pattern indicative of LDAP Injection is detected.
          - LDAP Injection is a type of attack where an attacker manipulates an LDAP query to execute arbitrary commands or gain unauthorized access to resources in an LDAP-based authentication or directory service.
          - The attack typically occurs when user input is improperly sanitized and directly inserted into an LDAP query, allowing the attacker to alter the structure of the query.
          - In an LDAP Injection attack, the attacker provides specially crafted input that modifies the structure of an LDAP query. This can lead to:
            - Unauthorized Access: Attackers may bypass authentication mechanisms, gaining unauthorized access to sensitive data or resources.
            - Information Disclosure: Attackers can retrieve information about users, groups, or other sensitive data from the directory service.
            - Privilege Escalation: Attackers may manipulate queries to gain privileges higher than their assigned roles.
            - Denial of Service: Malformed queries could cause the LDAP server to crash or become unresponsive.

        mitigation: |
          - Input Validation and Sanitization: Validate and sanitize all user input before using it in an LDAP query. Use strict input validation techniques, ensuring that input conforms to expected formats (e.g., alphanumeric for usernames).
          - Parameterized Queries: Use parameterized or prepared queries to construct LDAP queries, ensuring that user input is not directly executed as part of the query.
          - Escaping Special Characters: Properly escape special characters like `*`, `(`, `)`, `&`, `|`, etc., that could be used in LDAP queries to manipulate their structure.
          - Access Control: Implement proper access control mechanisms, limiting what users can query or modify in the LDAP directory. Use the principle of least privilege.
          - Logging and Monitoring: Enable detailed logging of LDAP queries and monitor logs for suspicious activities that could indicate an LDAP Injection attack.
          - Input Length Limits: Limit the length of user input to prevent excessive query manipulation and reduce the risk of attack.
        impact: |
          - Unauthorized Access: Attackers may bypass authentication and access sensitive data, such as user credentials, private directories, or organizational data.
          - Privilege Escalation: By manipulating LDAP queries, attackers may escalate their privileges and gain administrative access to the system.
          - Information Disclosure: Attackers can retrieve confidential information about users, groups, or the network.
          - Denial of Service: Malformed or overly complex queries could crash the LDAP server or cause it to become unresponsive, leading to service disruption.
          - Reputation Damage: Successful LDAP Injection attacks can damage the trust of users and clients, especially if sensitive information is exposed or misused.
        references: |
          - https://owasp.org/www-project-top-ten/2017/A6_2017-Security_Misconfiguration
          - https://cwe.mitre.org/data/definitions/90.html
          - https://portswigger.net/kb/issues/00100500_ldap-injection

    - ruleId: crs_9210110
      eventDetails:
        description: |
          A pattern indicative of HTTP Request Smuggling is detected.
          - HTTP Request Smuggling occurs when an attacker exploits differences in how front-end and back-end servers interpret HTTP requests.
          - The attack involves sending multiple HTTP requests in a way that causes the front-end and back-end servers to process them differently.
          - Common techniques include:
            - CL.TE: Using both Content-Length and Transfer-Encoding headers
            - TE.CL: Manipulating Transfer-Encoding chunked format
            - TE.TE: Exploiting different Transfer-Encoding header interpretations
            - The attack can lead to cache poisoning, request queue poisoning, or bypassing security controls.

        mitigation: |
          - Consistent HTTP Parsing: Ensure consistent HTTP request parsing between all servers in the chain.
          - Strict Header Validation: Implement strict validation of Content-Length and Transfer-Encoding headers.
          - Disable Request Rewriting: Where possible, disable HTTP request rewriting capabilities.
          - Use HTTP/2: Consider upgrading to HTTP/2, which has a more robust request handling mechanism.
          - Regular Security Updates: Keep all web servers and proxy servers updated with the latest security patches.
          - Request Size Limits: Implement reasonable request size limits to prevent oversized smuggled requests.

        impact: |
          - Web Cache Poisoning: Attackers can poison web caches, serving malicious content to other users.
          - Request Queue Poisoning: Manipulation of request queues can lead to unauthorized access to other users' requests.
          - Security Bypass: Circumvention of security controls like web application firewalls.
          - Information Disclosure: Exposure of sensitive information through manipulated responses.
          - Session Hijacking: Potential theft of user sessions through queue manipulation.

        references: |
          - https://portswigger.net/web-security/request-smuggling
          - https://cwe.mitre.org/data/definitions/444.html

    - ruleId: crs_921120
      eventDetails:
        description: |
          A pattern indicative of HTTP Response Splitting is detected.
          - HTTP Response Splitting occurs when an attacker injects malicious data into HTTP response headers.
          - The attack exploits applications that include unvalidated user input in response headers.
          - Common injection points include:
            - Location headers in redirects
            - Set-Cookie headers
            - Custom response headers
          - Attackers can create two or more responses from a single request by injecting CR/LF sequences.

        mitigation: |
          - Input Validation: Implement strict input validation for all data used in HTTP headers.
          - Output Encoding: Properly encode all user-supplied data before including it in headers.
          - CR/LF Filtering: Remove or encode CR (\r) and LF (\n) characters from user input.
          - Header Sanitization: Implement proper sanitization of all header values.
          - Use Security Headers: Implement security headers like Content-Security-Policy.
          - Framework Updates: Use updated frameworks that automatically prevent response splitting.

        impact: |
          - Cross-Site Scripting (XSS): Ability to inject malicious scripts into cached pages.
          - Cache Poisoning: Contamination of web caches with malicious content.
          - Session Fixation: Potential to hijack user sessions through manipulated cookies.
          - Information Disclosure: Exposure of sensitive information through manipulated responses.
          - Web Application Defacement: Ability to modify how pages appear to other users.

        references: |
          - https://owasp.org/www-community/attacks/HTTP_Response_Splitting
          - https://cwe.mitre.org/data/definitions/113.html
          - https://capec.mitre.org/data/definitions/34.html


    - ruleId: crs_921130
      eventDetails:
        description: |
          A pattern indicative of HTTP Response Splitting is detected.
          - HTTP Response Splitting occurs when an attacker injects malicious data into HTTP response headers.
          - The attack exploits applications that include unvalidated user input in response headers.
          - Common injection points include:
            - Location headers in redirects
            - Set-Cookie headers
            - Custom response headers
          - Attackers can create two or more responses from a single request by injecting CR/LF sequences.
          
          mitigation: |
          - Input Validation: Implement strict input validation for all data used in HTTP headers.
          - Output Encoding: Properly encode all user-supplied data before including it in headers.
          - CR/LF Filtering: Remove or encode CR (\r) and LF (\n) characters from user input.
          - Header Sanitization: Implement proper sanitization of all header values.
          - Use Security Headers: Implement security headers like Content-Security-Policy.
          - Framework Updates: Use updated frameworks that automatically prevent response splitting.
          
          impact: |
          - Cross-Site Scripting (XSS): Ability to inject malicious scripts into cached pages.
          - Cache Poisoning: Contamination of web caches with malicious content.
          - Session Fixation: Potential to hijack user sessions through manipulated cookies.
          - Information Disclosure: Exposure of sensitive information through manipulated responses.
          - Web Application Defacement: Ability to modify how pages appear to other users.
          
          references: |
          - https://owasp.org/www-community/attacks/HTTP_Response_Splitting
          - https://cwe.mitre.org/data/definitions/113.html
          - https://capec.mitre.org/data/definitions/34.html

    - ruleId: crs_921140
      eventDetails:
        description: |
          A pattern indicative of HTTP Header Injection is detected.
          - HTTP Header Injection occurs when an attacker manages to insert newline characters into header values.
          - The attack allows for manipulation of HTTP headers and potentially splitting the response.
          - Common injection points include:
            - User-controlled input reflected in headers
            - Redirect locations
            - Cookie values
          - Successful attacks can lead to response manipulation, cache poisoning, and XSS.

        mitigation: |
          - Header Validation: Implement strict validation of all header values.
          - Character Filtering: Remove or encode special characters, especially CR and LF.
          - Safe Header Generation: Use secure methods for generating HTTP headers.
          - Framework Security: Use frameworks that automatically prevent header injection.
          - Input Length Limits: Implement reasonable limits on input lengths.
          - Security Headers: Implement security headers to minimize impact of successful attacks.

        impact: |
          - Response Manipulation: Ability to modify HTTP responses sent to users.
          - Cache Poisoning: Potential to poison web cache entries.
          - Cross-Site Scripting: Possibility of injecting malicious scripts.
          - Information Disclosure: Risk of exposing sensitive information.
          - Session Hijacking: Potential compromise of user sessions.

        references: |
          - https://cwe.mitre.org/data/definitions/113.html
          - https://www.acunetix.com/blog/web-security-zone/http-header-injection/

    - ruleId: crs_921160
      eventDetails:
        description: |
          A pattern indicative of HTTP Header Injection via specific payload patterns is detected.
          - This variant specifically targets header manipulation using CR/LF sequences and header-name injection.
          - The attack involves carefully crafted payloads that exploit header parsing vulnerabilities.
          - Techniques include:
            - Injection of CR/LF sequences to create new headers
            - Manipulation of header names to create unexpected headers
            - Exploitation of header parsing inconsistencies
            - Use of encoded characters to bypass filters

        mitigation: |
          - Header Parsing Validation: Implement strict header parsing rules.
          - CR/LF Filtering: Remove or encode all CR/LF sequences from input.
          - Header Name Validation: Validate all header names against a whitelist.
          - Encoding Controls: Implement proper handling of encoded characters.
          - Response Validation: Validate complete HTTP responses before sending.
          - Security Headers: Implement security headers to minimize impact.

        impact: |
          - Response Splitting: Creation of multiple responses from single request.
          - Header Injection: Injection of malicious headers.
          - Cache Poisoning: Contamination of web caches.
          - Cross-Site Scripting: Potential for XSS attacks via headers.
          - Information Disclosure: Exposure of sensitive information.

        references: |
          - https://owasp.org/www-community/attacks/HTTP_Response_Splitting
          - https://cwe.mitre.org/data/definitions/113.html
          - https://portswigger.net/web-security/request-smuggling

    - ruleId: crs_921190
      eventDetails:
        description: |
          A pattern indicative of HTTP Splitting via filename manipulation is detected.
          - This attack specifically targets file upload and download functionality.
          - Attackers inject CR/LF sequences into filenames to manipulate HTTP responses.
          - Common techniques include:
            - Malicious filename crafting
            - Path traversal combinations
            - Content-Disposition header manipulation
            - Multiple Content-Type declarations
          - The attack can lead to response splitting and content-type confusion.

        mitigation: |
          - Filename Sanitization: Implement strict filename validation and sanitization.
          - Content-Disposition Security: Properly secure Content-Disposition headers.
          - File Type Validation: Implement strong file type validation.
          - Path Validation: Apply strict path validation rules.
          - Character Filtering: Filter or encode special characters in filenames.
          - Upload Controls: Implement comprehensive upload security controls.
          - Response Headers: Set appropriate Content-Type and Content-Disposition headers.

        impact: |
          - Content-Type Confusion: Misinterpretation of file types.
          - Header Injection: Injection of malicious headers via filenames.
          - Path Traversal: Unauthorized file system access.
          - Response Manipulation: Manipulation of download responses.
          - XSS via Filename: Cross-site scripting through filename display.
          - Cache Poisoning: Poisoning of cached responses.

        references: |
          - https://owasp.org/www-community/vulnerabilities/Unrestricted_File_Upload
          - https://cwe.mitre.org/data/definitions/73.html
          - https://capec.mitre.org/data/definitions/111.html


    - ruleId: crs_9210150
      eventDetails:
        description: |
          A pattern indicative of HTTP Header Injection is detected.
          - This variant specifically focuses on CR/LF injection in specialized contexts.
          - The attack exploits header parsing vulnerabilities in specific server configurations.
          - Techniques include:
            - Specialized CR/LF encoding sequences
            - Protocol-level manipulation
            - Header boundary confusion
            - Multi-header injection chains
          - Attackers can create sophisticated header manipulation scenarios.

        mitigation: |
          - Specialized Parser Controls: Implement context-aware parser controls.
          - Protocol Validation: Validate HTTP protocol boundaries strictly.
          - Header Chain Validation: Implement header chain validation.
          - Encoding Validation: Apply strict encoding validation rules.
          - Response Verification: Verify complete response structure.
          - Security Headers: Implement comprehensive security headers.
          - Boundary Validation: Validate message boundaries properly.

        impact: |
          - Header Chain Manipulation: Complex header chain attacks.
          - Protocol Violations: Exploitation of protocol handling.
          - Response Corruption: Corruption of response structure.
          - Security Bypass: Bypass of security mechanisms.
          - Cache Inconsistency: Creation of cache inconsistencies.
          - Information Exposure: Enhanced information disclosure risks.

        references: |
          - https://owasp.org/www-project-web-security-testing-guide/latest/
          - https://cwe.mitre.org/data/definitions/113.html
          - https://portswigger.net/web-security/request-smuggling/finding


    - ruleId: crs_9210300
      eventDetails:
        description: |
          A pattern indicative of URL Encoding Abuse is detected.
          - URL Encoding Abuse occurs when attackers manipulate encoded characters to bypass security controls.
          - The attack exploits systems that perform URL decoding multiple times or inconsistently.
          - Common techniques include:
            - Double encoding (%252f instead of %2f)
            - Mixed encoding (combining different encoding schemes)
            - Unicode encoding abuse
            - Overlong UTF-8 sequences
          - Attackers may bypass input filters or access restricted resources.

        mitigation: |
          - Consistent Decoding: Implement a single, consistent URL decoding process.
          - Input Canonicalization: Normalize all input to a standard form before validation.
          - Strong Input Validation: Validate input after decoding, not before.
          - Path Normalization: Implement proper path normalization to prevent directory traversal.
          - Character Set Controls: Restrict allowed character sets and encoding schemes.
          - Security Headers: Use security headers to restrict content types and sources.

        impact: |
          - Security Bypass: Circumvention of security filters and controls.
          - Path Traversal: Unauthorized access to files and directories.
          - Information Disclosure: Exposure of sensitive information.
          - Application Logic Bypass: Manipulation of application logic through encoded values.
          - Injection Attacks: Facilitating other injection-based attacks.

        references: |
          - https://cwe.mitre.org/data/definitions/176.html
          - https://capec.mitre.org/data/definitions/71.html
          - https://www.cgisecurity.com/lib/URLEmbeddedAttacks.html

    - ruleId: crs_9210305
      eventDetails:
        description: |
          A pattern indicative of Null Byte Injection is detected.
          - Null Byte Injection involves inserting null characters (%00) into input strings.
          - The attack exploits differences in how different programming languages handle null characters.
          - Common targets include:
            - File operations
            - String handling functions
            - Path manipulation
          - Attackers can truncate strings to bypass security checks or access restricted files.

        mitigation: |
          - Null Character Filtering: Remove or reject null bytes from all input.
          - Strong Input Validation: Implement comprehensive input validation.
          - Safe API Usage: Use APIs that properly handle null bytes.
          - File Operation Security: Implement secure file handling practices.
          - Character Encoding Validation: Validate and normalize character encodings.
          - Updated Components: Use updated libraries that properly handle null bytes.

        impact: |
          - File System Access: Unauthorized access to files and directories.
          - Security Control Bypass: Circumvention of input validation.
          - Information Disclosure: Access to sensitive information.
          - Application Compromise: Potential for broader application compromise.
          - Data Corruption: Possible corruption of stored data.

        references: |
          - https://cwe.mitre.org/data/definitions/158.html
          - https://capec.mitre.org/data/definitions/52.html
          - https://owasp.org/www-community/attacks/Embedding_Null_Code


    - ruleId: crs_9210400
      eventDetails:
        description: |
          A pattern indicative of Mail Injection (Email Header Injection) is detected.
          - Mail Injection occurs when attackers insert additional email headers or content into mail functions.
          - The attack exploits applications that don't properly sanitize user input used in email operations.
          - Common injection points include:
            - Subject fields
            - From addresses
            - Reply-To headers
            - Message body content
          - Attackers can modify email content, headers, or send unauthorized emails through the system.

        mitigation: |
          - Header Validation: Implement strict validation of all email headers.
          - Input Sanitization: Properly sanitize all user input used in email operations.
          - Email Library Security: Use secure, updated email libraries and frameworks.
          - Rate Limiting: Implement rate limiting for email operations.
          - Access Controls: Restrict access to email functionality.
          - Logging and Monitoring: Monitor email operations for suspicious patterns.
          - Template Usage: Use pre-defined templates for email content.

        impact: |
          - Spam Distribution: System could be used to send spam emails.
          - Phishing Attacks: Facilitation of phishing attempts through legitimate mail servers.
          - Header Manipulation: Modification of email routing and delivery.
          - Information Disclosure: Exposure of internal email configurations.
          - Reputation Damage: Potential blacklisting of mail servers.
          - Resource Consumption: Excessive resource usage from mass mailings.

        references: |
          - https://www.invicti.com/learn/email-injection/
          - https://cwe.mitre.org/data/definitions/93.html
          - https://www.acunetix.com/blog/articles/email-header-injection/

- ruleId: crs_102
  ruleName: XML External Entity Injection (XXE)
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventLabels:
    MITRE_TACTIC: TA0005
    MITRE_TECHNIQUE: T1221
  eventDetails:
    description: "An XML External Entity Injection (XXE) attack occurs when an attacker exploits the way an application processes XML input that includes external references. The attacker manipulates the XML to include malicious entities that reference files or systems on the internal network. When the XML is parsed, these external entities are processed, potentially disclosing sensitive internal files, causing denial of service (such as a system crash), or even leading to remote code execution."
    mitigation: |
      To mitigate XXE attacks, disable the use of external entities in your XML parser. Also, validate and sanitize all XML input to your application.
      Traceable recommends to enable block mode for this rule.
    impact: "If not mitigated, XXE attacks can lead to disclosure of internal files, denial of service, or even remote code execution."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://owasp.org/API-Security/editions/2019/en/0xa8-injection/
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
  subRuleInfos:
    - ruleId: crs_1020100
      eventDetails:
        description: |
          A pattern indicative of XML External Entity Injection (XXE) is detected.
          - XXE is a security vulnerability that occurs when an XML parser processes XML input from an untrusted source and includes external entities in the document.
          - This can allow attackers to manipulate the XML parser to access sensitive files on the server or even execute arbitrary code.
          - Local Includes: Attackers may exploit XXE to read local files such as /etc/passwd or other sensitive files on the system, potentially leading to information disclosure or denial of service.
          - Remote Includes: If external entities are allowed, attackers may cause the XML parser to fetch remote resources, potentially resulting in remote code execution (RCE), data exfiltration, or denial of service.
          - Denial of Service (DoS):  XXE attacks can also lead to DoS by consuming excessive system resources (CPU, memory) through maliciously crafted XML payloads that exploit the parser’s recursive processing.
        mitigation: |
          - Disable external entity processing entirely when parsing XML documents, if possible.
          - Use safe libraries or parsers that are configured to prevent XXE attacks by default.
          - When external entities are required, ensure that only trusted and controlled entities are allowed, and perform proper input validation on incoming XML data.
          - Use output encoding to sanitize the data before including it in any external requests or system resources.
          - Enforce least privilege on the XML processor to limit the scope of potential damage.
          - Apply network-level filtering to block requests to external domains or IPs that could be used for remote entity inclusion.
        impact: |
          - Information Disclosure: Attackers can read sensitive files from the system, exposing internal data.
          - Remote Code Execution: If external entities are used, attackers can fetch arbitrary remote resources leading to RCE.
          - Denial of Service: Attackers can cause the parser to consume excessive resources, leading to system crashes or service unavailability.
          - Data Exfiltration: Attackers can exfiltrate sensitive data by forcing the server to make unauthorized external connections to remote servers.
        references: |
          - https://cwe.mitre.org/data/definitions/611.html
          - https://www.owasp.org/index.php/XML_External_Entity_(XXE)_Prevention_Cheat_Sheet
          - https://portswigger.net/web-security/xxe
          - https://owasp.org/www-community/vulnerabilities/XML_External_Entity_(XXE)_Processing

    - ruleId: crs_1020110
      eventDetails:
        description: |
          A pattern indicative of XML External Entity Injection (XXE) is detected, specifically targeting entity tags within XML documents.
          - XXE is a security vulnerability that occurs when an XML parser processes input from an untrusted source and includes external entities in the document.
          - Entity tags can be exploited by attackers to manipulate the XML parser, potentially leading to unauthorized file access, information disclosure, or even remote code execution.
          - Local Includes: Attackers may use entity tags to read sensitive local files such as /etc/passwd or other critical files on the system.
          - Remote Includes: Exploiting entity tags can cause the XML parser to fetch resources from remote locations, potentially resulting in data exfiltration, remote code execution (RCE), or denial of service (DoS).
          - Denial of Service (DoS): Maliciously crafted XML payloads exploiting entity tags can lead to excessive resource consumption (CPU, memory), causing application downtime.
        mitigation: |
          - Disable external entity processing entirely when parsing XML documents.
          - Use safe libraries or parsers configured to prevent XXE attacks by default.
          - Validate and sanitize all XML input to ensure it does not include untrusted or malicious entity tags.
          - Implement least privilege on the XML processor to limit potential damage caused by exploitation.
          - Apply network-level controls to block access to unauthorized external resources that could be exploited via entity tags.
          - Regularly audit and test XML processing components for vulnerabilities related to entity tags.
        impact: |
          - Information Disclosure: Attackers can use entity tags to access sensitive files, exposing critical data on the system.
          - Remote Code Execution: Malicious entity tags can fetch and execute remote code, compromising the server.
          - Denial of Service: Exploiting entity tags can result in excessive system resource consumption, leading to unavailability of services.
          - Data Exfiltration: Entity tags can be used to exfiltrate sensitive information to remote servers controlled by attackers.
        references: |
          - OWASP Top 10 - 2021 - A5: Security Misconfiguration - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
          - CWE-611: Improper Restriction of XML External Entity Reference - https://cwe.mitre.org/data/definitions/611.html
          - MITRE ATT&CK - T1190: Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/

- ruleId: crs_934
  ruleName: NodeJS Injection
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventLabels:
    MITRE_TACTIC: TA0002
    MITRE_TECHNIQUE: T1059.007
  eventDetails:
    description: "A Node.js injection attack occurs when an attacker controls the input data parsed by the Node.js engine, either on the server or client side. By manipulating this input, the attacker can execute arbitrary code, potentially compromising the application or system."
    mitigation: "To mitigate Node.js injection attacks, avoid using the eval() function. If it's absolutely necessary, ensure that the input data is properly sanitized and validated."
    impact: "If not mitigated, Node.js injection attacks can lead to arbitrary code execution, which could compromise the security of your application."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://owasp.org/API-Security/editions/2019/en/0xa8-injection/
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
  subRuleInfos:
    - ruleId: crs_934100
      eventDetails:
        description: |
          A pattern indicative of a Node.js injection attack is detected. These attacks occur when an attacker can control input data processed by the Node.js engine on the server or client, potentially leading to arbitrary code execution. Such vulnerabilities are often exploited through improper use of functions like `eval()`, dynamic code evaluation, or insecure template rendering.
        mitigation: |
          To mitigate Node.js injection attacks:
          - Avoid using the `eval()` function or other methods that execute dynamic code.
          - If dynamic code execution is necessary, rigorously sanitize and validate all user inputs.
          - Use secure template engines that automatically escape user-provided data.
          - Regularly update dependencies and libraries to address known vulnerabilities.
          - Implement runtime safeguards like Content Security Policies (CSPs) and secure HTTP headers.
        impact: |
          If not mitigated, Node.js injection attacks can lead to:
          - Arbitrary code execution, compromising the application and server.
          - Unauthorized access to sensitive data or system resources.
          - Persistent backdoors or privilege escalation, enabling further exploitation.
        references: |
          - OWASP API Top 10 - 2019 - API8: Injection: https://owasp.org/API-Security/editions/2019/en/0xa8-injection/
          - OWASP Top 10 - 2021 - A3: Injection: https://owasp.org/Top10/A03_2021-Injection/
          - OWASP Node.js Security Cheat Sheet: https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html
          - CWE-94: Improper Control of Generation of Code ('Code Injection'): https://cwe.mitre.org/data/definitions/94.html

- ruleId: crs_942
  ruleName: SQL Injection
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventLabels:
    MITRE_TACTIC: TA0001
    MITRE_TECHNIQUE: T1190
  eventDetails:
    description: |
      A pattern indicative of SQL injection attack is detected. SQL injection is a code injection technique that exploits a security vulnerability in an application's software.
      It occurs when data input by a user:
        - is NOT validated, filtered or sanitized by the application
        - is used to build Dynamic queries or non-parameterized calls without context-aware escaping
      This is an extremely common attack and its success can have critical implications.
    mitigation: |
      - The best way to protect your code against SQL injections is using parameterized queries (prepared statements). Almost all modern languages provide built-in libraries for this.
      - Wherever possible, do not create dynamic SQL queries or SQL queries with string concatenation. If not, sanitize the user input.
      - Using a database access layer (DAL)/ object relational mapping (ORM). Most of the ORM systems use only parameterized queries and this can solve the whole SQL injection problem centrally.
    impact: |
      Depending on the backend database, and the software stack, an attacker can execute one or more of the following type of attacks successfully:
      - Can read, update and delete arbitrary data/tables from the database.
      - Can read/write files into the underlying file system.
      - Can execute commands to the underlying operating system.
    references: |
      - SQL Injection: https://owasp.org/www-community/attacks/SQL_Injection
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
      - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
      - Common Weakness Enumeration (CWE) - CWE-89:SQL Injection - http://cwe.mitre.org/data/definitions/89.html
      - SANS TOP 25 - http://cwe.mitre.org/top25/
      - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-7:Blind SQL Injection - https://capec.mitre.org/data/definitions/7.html
      - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
      - Web Application Security Consortium - WASC-19:SQL Injection - http://projects.webappsec.org/w/page/13246963/SQL%20Injection
  subRuleInfos:
    - ruleId: crs_9420190
      eventDetails:
        description: |
          A pattern indicative of database code execution and information gathering via SQL injection is detected.
          - Attackers attempt to execute arbitrary code within the database context.
          - Common techniques include:
            - Executing built-in database functions
            - Accessing system tables and metadata
            - Using database-specific commands for information disclosure
            - Exploiting stored procedures with extended privileges
          - These attacks often focus on gathering schema information, user details, and system configuration.

        mitigation: |
          - Use Parameterized Queries: Implement prepared statements for all database operations.
          - Minimal Privileges: Apply principle of least privilege to database users.
          - Schema Hiding: Avoid exposing database schema information in errors.
          - Input Validation: Implement strict input validation for all database queries.
          - Stored Procedure Security: Carefully review and secure stored procedure permissions.
          - Error Handling: Implement generic error messages that don't reveal database details.
          - Monitoring: Enable comprehensive database activity monitoring.

        impact: |
          - Information Disclosure: Exposure of sensitive database schema and configuration.
          - Privilege Escalation: Potential execution of privileged database commands.
          - Data Theft: Unauthorized access to sensitive data.
          - System Compromise: Possible compromise of underlying system through database features.
          - Audit Bypass: Potential bypassing of database auditing mechanisms.

        references: |
          - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
          - https://cwe.mitre.org/data/definitions/89.html
          - https://portswigger.net/web-security/sql-injection

    - ruleId: crs_9420230
      eventDetails:
        description: |
          A pattern indicative of conditional SQL injection (Type 230) is detected.
          - Attackers use boolean conditions to extract information.
          - The attack involves:
            - Injection of TRUE/FALSE conditions
            - Time-based inference techniques
            - Systematic data extraction through binary search
            - Use of CASE statements for data extraction
          - This type of attack is often used when direct output is not visible.

        mitigation: |
          - Parameterized Queries: Use prepared statements exclusively.
          - Input Type Validation: Strictly validate input types and ranges.
          - Query Timeout: Implement query timeout mechanisms.
          - Response Monitoring: Monitor for patterns in response times.
          - Error Handling: Implement consistent error handling.
          - WAF Rules: Deploy specific WAF rules for conditional patterns.
          - Access Controls: Implement strict database access controls.

        impact: |
          - Data Extraction: Systematic extraction of database content.
          - Performance Impact: Server performance degradation from inference attacks.
          - Privacy Breach: Disclosure of sensitive information through inference.
          - Resource Consumption: High resource usage from repeated queries.
          - Service Disruption: Potential DoS from excessive conditional queries.

        references: |
          - https://owasp.org/www-community/attacks/Blind_SQL_Injection
          - https://cwe.mitre.org/data/definitions/89.html
          - https://capec.mitre.org/data/definitions/7.html


    - ruleId: crs_9420291
      eventDetails:
        # Basic MongoDB SQL Injection Attempts (Nested JSON)
        description: |
          A pattern indicative of MongoDB injection using nested JSON structures is detected.
          - Attacks exploit NoSQL injection vulnerabilities specific to MongoDB.
          - Common techniques include:
            - Manipulation of JSON query structures
            - Injection of nested operators ($where, $ne, $gt)
            - Array manipulation attacks
            - JavaScript code injection in queries
          - Attacks often bypass traditional SQL injection protections.

        mitigation: |
          - Input Sanitization: Sanitize all inputs used in MongoDB queries.
          - Query Structure Validation: Validate JSON structure before execution.
          - Disable JavaScript Execution: Disable server-side JavaScript execution.
          - Schema Validation: Implement strict schema validation.
          - Type Checking: Implement strict type checking for query parameters.
          - Security Middleware: Use security middleware for MongoDB operations.
          - Access Controls: Implement proper MongoDB access controls.

        impact: |
          - Data Manipulation: Unauthorized modification of MongoDB data.
          - Query Manipulation: Execution of unintended queries.
          - Information Disclosure: Exposure of sensitive data.
          - Authentication Bypass: Potential bypass of authentication mechanisms.
          - Service Disruption: Possible DoS through complex queries.

        references: |
          - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
          - https://brightsec.com/blog/sql-injection-in-mongodb-examples-and-prevention/
          - https://learn.snyk.io/lesson/nosql-injection-attack/

    - ruleId: crs_942240
      eventDetails:
        # MySQL Charset Switch and MSSQL DoS Attempts
        description: |
          A pattern indicative of MySQL charset manipulation and MSSQL DoS attempts is detected.
          - Attacks target specific database engine features:
            - MySQL charset switching for encoding bypass
            - MSSQL specific DoS vectors
            - Character encoding manipulation
            - Resource exhaustion techniques
          - These attacks often combine multiple techniques for maximum impact.

        mitigation: |
          - Character Set Configuration: Properly configure and lock character sets.
          - Resource Limits: Implement proper resource limiting.
          - Query Timeouts: Set appropriate query timeout values.
          - Connection Pooling: Implement proper connection pooling.
          - Monitor Resource Usage: Monitor for abnormal resource consumption.
          - Input Validation: Validate character encodings.
          - Security Patches: Keep database systems updated.

        impact: |
          - Service Disruption: Database service availability impact.
          - Resource Exhaustion: Server resource depletion.
          - Encoding Bypass: Bypass of security controls through encoding.
          - Performance Degradation: System performance impacts.
          - Data Corruption: Potential data corruption from charset issues.

        references: |
          - https://dev.mysql.com/doc/refman/8.0/en/charset-charsets.html
          - https://learn.microsoft.com/en-us/sql/relational-databases/security/sql-injection
          - https://owasp.org/www-community/attacks/SQL_Injection_Bypassing_WAF

    - ruleId: crs_942250
      eventDetails:
        # MATCH AGAINST, MERGE and EXECUTE IMMEDIATE Injections
        description: |
          A pattern indicative of specialized SQL command injection is detected.
          - Attacks exploit specific SQL commands and features:
            - MATCH AGAINST for full-text search manipulation
            - MERGE statement vulnerabilities
            - EXECUTE IMMEDIATE dynamic SQL execution
            - Combination of multiple SQL features
          - These attacks often target specific database features that are commonly overlooked.
          - Attackers exploit the dynamic nature of these commands to execute arbitrary SQL.
          - Often bypasses traditional input validation mechanisms.

        mitigation: |
          - Parameterized Queries: Use prepared statements for all dynamic SQL.
          - Feature Restriction: Limit access to powerful SQL features.
          - Input Validation: Implement strict validation for search terms.
          - Query Analysis: Implement query analysis and validation.
          - Access Controls: Restrict access to dynamic SQL execution.
          - Logging: Implement comprehensive logging of dynamic SQL operations.
          - Security Reviews: Regular review of dynamic SQL usage.

        impact: |
          - Code Execution: Unauthorized execution of SQL commands.
          - Data Manipulation: Unauthorized data modifications.
          - Information Disclosure: Exposure of sensitive data through search functions.
          - Performance Impact: Resource consumption from complex searches.
          - Security Bypass: Circumvention of security controls.

        references: |
          - https://dev.mysql.com/doc/refman/8.0/en/fulltext-search.html
          - https://owasp.org/www-project-code-review-guide/
          - https://cwe.mitre.org/data/definitions/89.html

    - ruleId: crs_942270
      eventDetails:
        description: |
          A pattern indicative of common SQL injection patterns is detected.
          - Attacks use widely-known SQL injection techniques:
            - Quote string termination attempts
            - Comment injection (-- , /* */)
            - UNION-based attacks
            - Boolean-based blind injection
            - Common database-specific syntax
          - These attacks represent the most frequently attempted SQL injections.
          - Often used as initial probing attempts.
          - May be automated through common attack tools.

        mitigation: |
          - Prepared Statements: Use parameterized queries exclusively.
          - Input Validation: Implement strict input validation.
          - Character Escaping: Proper escaping of special characters.
          - Query Parameters: Use query parameters instead of string concatenation.
          - WAF Rules: Implement specific WAF rules for common patterns.
          - Error Handling: Generic error messages only.
          - Regular Updates: Keep security patches up to date.

        impact: |
          - Authentication Bypass: Unauthorized access to accounts.
          - Data Theft: Extraction of sensitive information.
          - Data Manipulation: Unauthorized modifications to database.
          - System Access: Potential escalation to system access.
          - Audit Trail: Compromise of audit logging.

        references: |
          - https://owasp.org/www-community/attacks/SQL_Injection
          - https://portswigger.net/web-security/sql-injection/cheat-sheet
          - https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/SQL%20Injection

    - ruleId: crs_942280
      eventDetails:
        description: |
          A pattern indicative of Postgres-specific injection attack is detected.
          - Attacks target PostgreSQL-specific features:
            - pg_sleep() time-based injection
            - waitfor delay attacks
            - Database shutdown attempts
            - System table access
          - Often combines time-based and privilege escalation techniques.
          - May attempt to manipulate database configuration.
          - Can include attempts to access file system.

        mitigation: |
          - Time Limits: Implement query timeout limits.
          - Privilege Restriction: Restrict access to system functions.
          - Connection Pooling: Proper connection pool configuration.
          - Monitor Queries: Monitor for suspicious query patterns.
          - Access Controls: Implement strict role-based access control.
          - Error Handling: Implement proper error handling.
          - Security Updates: Regular security patches.

        impact: |
          - Service Disruption: Database service interruption.
          - Information Leakage: Exposure of system information.
          - Performance Impact: Server performance degradation.
          - Privilege Escalation: Unauthorized privilege elevation.
          - Data Access: Unauthorized data access.

        references: |
          - https://cwe.mitre.org/data/definitions/89.html
          - https://owasp.org/www-community/attacks/SQL_Injection_Bypassing_WAF


    - ruleId: crs_942290
      eventDetails:
        description: |
          A pattern indicative of basic MongoDB injection attack is detected.
          - Attacks target fundamental MongoDB query structures:
            - Simple query operator injection ($eq, $gt, $lt)
            - Basic authentication bypass attempts
            - Simple query structure manipulation
            - Array operator abuse ($in, $nin)
            - Basic logical operator injection ($or, $and)
          - These attacks represent common entry-level MongoDB injection attempts.
          - Often used as initial reconnaissance or automated scanning.
          - Typically targets common collection names and fields.
          - May attempt simple authentication bypasses.
          Key characteristics include:
            - Use of basic MongoDB operators
            - Simple query structure manipulation
            - Common field name targeting
            - Basic type manipulation attempts
            - Authentication bypass patterns

        mitigation: |
          - Input Validation:
            - Implement strict input validation for all query parameters
            - Validate data types before query execution
            - Check for MongoDB operator injection
            - Validate array inputs carefully

          - Query Security:
            - Use MongoDB's built-in query sanitization
            - Implement query whitelisting where possible
            - Avoid direct object references
            - Use proper data binding techniques

          - Authentication Security:
            - Implement proper session management
            - Use secure authentication mechanisms
            - Avoid storing sensitive data in easily guessable collections
            - Implement proper access controls

          - General Security:
            - Keep MongoDB updated to latest secure version
            - Implement proper error handling
            - Use security middleware for MongoDB operations
            - Regular security audits of database access patterns

        impact: |
          - Service Disruption: Database service interruption.
          - Information Leakage: Exposure of system information.
          - Performance Impact: Server performance degradation.
          - Privilege Escalation: Unauthorized privilege elevation.
          - Data Access: Unauthorized data access.

        references: |
          - MongoDB Security Documentation: https://docs.mongodb.com/manual/security/
          - OWASP NoSQL Injection: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
          - CWE-943: Improper Neutralization of Special Elements in Data Query Logic: https://cwe.mitre.org/data/definitions/943.html
          - Testing for NoSQL Injection: https://wiki.owasp.org/index.php/Testing_for_NoSQL_injection
          - MongoDB Security Best Practices: https://www.mongodb.com/security-best-practices


    - ruleId: crs_9420290
      eventDetails:
        description: |
          - A pattern indicative of potential MongoDB injection attempts is detected.
          - Attacks loosely target MongoDB query structures and may include:
            - Injection of basic query operators (e.g., $eq, $gt, $lt)
            - Attempts to bypass authentication with simple methods
            - Manipulation of query structures
            - Limited use of array operators (e.g., $in, $nin)
            - Basic injection using logical operators (e.g., $or, $and)
          - These attempts may represent exploratory or automated scanning activity targeting MongoDB.

        mitigation: |
          - Input Validation:
            - Implement strict input validation for all query parameters
            - Validate data types before query execution
            - Check for MongoDB operator injection
            - Validate array inputs carefully

          - Query Security:
            - Use MongoDB's built-in query sanitization
            - Implement query whitelisting where possible
            - Avoid direct object references
            - Use proper data binding techniques

          - Authentication Security:
            - Implement proper session management
            - Use secure authentication mechanisms
            - Avoid storing sensitive data in easily guessable collections
            - Implement proper access controls

          - General Security:
            - Keep MongoDB updated to latest secure version
            - Implement proper error handling
            - Use security middleware for MongoDB operations
            - Regular security audits of database access patterns

        impact: |
          - Service Disruption: Database service interruption.
          - Information Leakage: Exposure of system information.
          - Performance Impact: Server performance degradation.
          - Privilege Escalation: Unauthorized privilege elevation.
          - Data Access: Unauthorized data access.

        references: |
          - MongoDB Security Documentation: https://docs.mongodb.com/manual/security/
          - OWASP NoSQL Injection: https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/05.6-Testing_for_NoSQL_Injection
          - CWE-943: Improper Neutralization of Special Elements in Data Query Logic: https://cwe.mitre.org/data/definitions/943.html
          - Testing for NoSQL Injection: https://wiki.owasp.org/index.php/Testing_for_NoSQL_injection
          - MongoDB Security Best Practices: https://www.mongodb.com/security-best-practices

    - ruleId: crs_9420360
      eventDetails:
        description: |
          Detection of concatenated SQL injection and SQL Local File Inclusion (SQLLFI) attempts aimed at exploiting database vulnerabilities.
          - These attacks combine SQL injection with file inclusion techniques to access, manipulate, or exfiltrate sensitive data and files.
          - SQL injection patterns may include concatenated payloads targeting query manipulation, such as bypassing authentication, extracting data, or altering database schemas.
          - SQLLFI attempts use SQL functions or database features (e.g., `LOAD_FILE()`, `INTO OUTFILE`) to read or write files from the server.
          - These attempts are often used to obtain sensitive configuration files, credentials, or other critical server data.
        impact: |
          - Unauthorized access to sensitive files such as application configurations, database credentials, or system logs.
          - Potential database compromise through schema manipulation or data exfiltration.
          - Escalated access to the underlying server through file read/write operations.
          - Increased risk of persistent backdoors or further exploitation via file inclusion.
        mitigation: |
          - Enforce strict input validation and sanitization:
            - Use parameterized queries and prepared statements to prevent dynamic SQL injection.
            - Implement allowlists for acceptable input formats to block malicious payloads.
          - Restrict database user privileges:
            - Disable file-related database functions such as `LOAD_FILE()` and `INTO OUTFILE` if not required.
            - Use minimal privilege accounts for database connections.
          - Monitor for suspicious activity:
            - Detect unexpected use of file-related SQL functions or concatenated SQL payloads.
            - Log and analyze query patterns targeting file inclusion or schema manipulation.
          - Harden server configurations:
            - Restrict file read/write access for the database process.
            - Ensure sensitive files, such as configuration files, have strict access controls.
          - Regularly update and patch database systems and applications to address known vulnerabilities.
          - Conduct periodic vulnerability assessments and penetration testing.
          - Employ a Web Application Firewall (WAF) to block known SQL injection and SQLLFI patterns.
          references:

        references: |
          - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/
          - https://cwe.mitre.org/data/definitions/89.html
          - https://capec.mitre.org/data/definitions/76.html

    - ruleId: crs_942160
      eventDetails:
        description: |
          A pattern indicative of potential blind SQL injection (SQLi) tests is detected.
          - Attacks may involve time-based techniques to infer database behavior, including:
            - Use of the `SLEEP()` function to introduce delays
            - Use of the `BENCHMARK()` function to perform resource-intensive operations
            - Simple injection patterns testing for time-based responses
          - These attempts often involve:
            - Exploratory or automated probing to detect vulnerabilities
            - Minimal payload complexity targeting common SQL entry points
            - Variations in delay times or benchmark iterations to observe behavior changes
          This rule is relaxed, capturing broader and less explicit blind SQL injection patterns,
          often used in reconnaissance or early-stage testing.
        mitigation: |
          The best way to protect your code against SQL injections is using parameterized queries (prepared statements). Almost all modern languages provide built-in libraries for this.
          Wherever possible, do not create dynamic SQL queries or SQL queries with string concatenation. If not, sanitize the user input.
          Using a database access layer (DAL)/ object relational mapping (ORM). Most of the ORM systems use only parameterized queries and this can solve the whole SQL injection problem centrally.
        impact: |
          Depending on the backend database, and the software stack, an attacker can execute one or more of the following type of attacks successfully:
          - Can read, update and delete arbitrary data/tables from the database.
          - Can read/write files into the underlying file system.
          - Can execute commands to the underlying operating system.
        references: |
          - SQL Injection: https://owasp.org/www-community/attacks/SQL_Injection
          - Blind SQL Injection: https://owasp.org/www-community/attacks/Blind_SQL_Injection
          - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
          - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
          - Common Weakness Enumeration (CWE) - CWE-89:SQL Injection - http://cwe.mitre.org/data/definitions/89.html
          - SANS TOP 25 - http://cwe.mitre.org/top25/
          - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
          - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-7:Blind SQL Injection - https://capec.mitre.org/data/definitions/7.html
          - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
          - Web Application Security Consortium - WASC-19:SQL Injection - http://projects.webappsec.org/w/page/13246963/SQL%20Injection

    - ruleId: crs_942170
      eventDetails:
        description: |
          A pattern indicative of SQL Injection attempts using BENCHMARK() and SLEEP() functions, including conditional queries is detected. 
          - These attacks exploit time-based techniques to identify SQL injection vulnerabilities by observing query execution delays.
          - Common techniques include:
            - Using SLEEP() to introduce artificial delays in query execution.
            - Leveraging BENCHMARK() to perform repeated operations that consume resources.
            - Conditional queries (e.g., IF, CASE) to trigger time-based responses based on logical evaluations.
          - Often used for blind SQL injection reconnaissance or as part of automated scanning tools.
        mitigation: |
          - Validate and sanitize all user inputs to prevent SQL injection.
          - Use parameterized queries or prepared statements instead of dynamic SQL.
          - Wherever possible, do not create dynamic SQL queries or SQL queries with string concatenation. If not, sanitize the user input.
          - Implement strict input validation rules (e.g., allowlist acceptable input formats).
          - Regularly patch and update database systems and web application frameworks.
          - Monitor database logs for abnormal or time-intensive queries.
          - Conduct regular security testing and vulnerability assessments.
        impact: |
          - Successful exploitation of SQL injection vulnerabilities can lead to:
            - Unauthorized access to sensitive data.
            - Database schema disclosure.
            - Potential data manipulation or deletion.
            - Further compromise of the underlying system or application.
        references: |
          - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
          - CWE-89 Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') - https://cwe.mitre.org/data/definitions/89.html
          - SQL Injection Explanation on OWASP - https://owasp.org/www-community/attacks/SQL_Injection

    - ruleId: crs_942190
      eventDetails:
        description: |
          A pattern indicative SQL Injection attempts focusing on executing SQL code and gathering sensitive information is detected.
          - These attacks exploit SQL injection vulnerabilities to execute arbitrary SQL commands or retrieve database metadata.
          - Common techniques include:
            - Execution of database functions (e.g., `CURRENT_USER`, `VERSION()`, `DATABASE()`).
            - Extraction of table and column names using system tables (e.g., `INFORMATION_SCHEMA` or equivalent).
            - Use of UNION queries to merge unauthorized results with legitimate query outputs.
            - Execution of OS-level commands via database extensions where supported.
            - Dumping sensitive data such as credentials or PII.
          - Often employed during reconnaissance or as part of more complex exploitation chains.
        mitigation: |
          - Validate and sanitize all user inputs to prevent SQL injection.
          - Use parameterized queries or prepared statements instead of dynamic SQL.
          - Wherever possible, do not create dynamic SQL queries or SQL queries with string concatenation. If not, sanitize the user input.
          - Implement strict input validation rules (e.g., allowlist acceptable input formats).
          - Regularly patch and update database systems and web application frameworks.
          - Monitor database logs for abnormal or time-intensive queries.
          - Conduct regular security testing and vulnerability assessments.
        impact: |
          - Unauthorized database access and information disclosure:
             - Exposure of sensitive data, including user credentials, financial records, and PII.
             - Mapping of database structure, enabling subsequent targeted attacks.
           - Execution of unauthorized commands leading to potential data manipulation or deletion.
           - Risk of escalated access to the underlying operating system or application environment.
        references: |
          - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
          - CWE-89 Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') - https://cwe.mitre.org/data/definitions/89.html
          - SQL Injection Explanation on OWASP - https://owasp.org/www-community/attacks/SQL_Injection


    - ruleId: crs_942230
      eventDetails:
        description: |
          A pattern indicative of conditional SQL injection is detected.
          - Attackers use boolean conditions to extract information.
          - The attack involves:
            - Injection of TRUE/FALSE conditions
            - Time-based inference techniques
            - Systematic data extraction through binary search
            - Use of CASE statements for data extraction
          - This type of attack is often used when direct output is not visible.

        mitigation: |
          - Parameterized Queries: Use prepared statements exclusively.
          - Input Type Validation: Strictly validate input types and ranges.
          - Query Timeout: Implement query timeout mechanisms.
          - Response Monitoring: Monitor for patterns in response times.
          - Error Handling: Implement consistent error handling.
          - WAF Rules: Deploy specific WAF rules for conditional patterns.
          - Access Controls: Implement strict database access controls.

        impact: |
          - Data Extraction: Systematic extraction of database content.
          - Performance Impact: Server performance degradation from inference attacks.
          - Privacy Breach: Disclosure of sensitive information through inference.
          - Resource Consumption: High resource usage from repeated queries.
          - Service Disruption: Potential DoS from excessive conditional queries.

        references: |
          - https://owasp.org/www-community/attacks/Blind_SQL_Injection
          - https://cwe.mitre.org/data/definitions/89.html
          - https://capec.mitre.org/data/definitions/7.html

    - ruleId: crs_942320
      eventDetails:
        description: |
          A pattern indicative of stored procedure and function injection is detected.
          - Targets database procedural capabilities:
            - Stored procedure manipulation
            - Function parameter injection
            - Privilege escalation via procedures
            - Dynamic SQL in procedures
          - Attempts to exploit elevated procedure privileges.
          - May target system stored procedures.
          - Often combines multiple attack vectors.

        mitigation: |
          - Procedure Security: Implement secure stored procedure practices.
          - Parameter Validation: Validate all procedure parameters.
          - Privilege Management: Manage procedure privileges carefully.
          - Dynamic SQL Control: Avoid dynamic SQL in procedures.
          - Access Control: Implement proper access controls.
          - Monitoring: Monitor procedure execution.
          - Security Reviews: Regular security reviews of procedures.

        impact: |
          - Privilege Escalation: Elevation of database privileges.
          - Code Execution: Unauthorized code execution.
          - Data Access: Unauthorized data access.
          - System Manipulation: System-level changes.
          - Security Compromise: Bypass of security controls.

        references: |
          - https://www.postgresql.org/docs/current/plpgsql-statements.html
          - https://owasp.org/www-community/attacks/SQL_Injection
          - https://www.w3schools.com/sql/sql_stored_procedures.asp


    - ruleId: crs_942350
      eventDetails:
        description: |
          A pattern indicative of attempts to exploit MySQL User-Defined Functions (UDFs) and manipulate database data or structure is detected.
          - These attacks target the database to achieve unauthorized control or modify its structure and contents.
          - Techniques involve uploading malicious UDF libraries to the database server, creating or altering functions with injected UDFs, or manipulating schemas using commands like `ALTER`, `DROP`, or `CREATE`.
          - Attackers may leverage SQL features such as triggers or events to execute malicious actions or manipulate critical data within tables and columns.
          - Such attacks are typically used for privilege escalation, persistence, or further exploitation after an initial compromise.

        mitigation: |
          - Procedure Security: Implement secure stored procedure practices.
          - Parameter Validation: Validate all procedure parameters.
          - Privilege Management: Manage procedure privileges carefully.
          - Dynamic SQL Control: Avoid dynamic SQL in procedures.
          - Access Control: Implement proper access controls.
          - Monitoring: Monitor procedure execution.
          - Security Reviews: Regular security reviews of procedures.

        impact: |
          - Privilege Escalation: Elevation of database privileges.
          - Code Execution: Unauthorized code execution.
          - Data Access: Unauthorized data access.
          - System Manipulation: System-level changes.
          - Security Compromise: Bypass of security controls.

        references: |
          - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
          - MySQL Security Best Practices -  https://dev.mysql.com/doc/refman/8.0/en/security.html
          - CWE-89 - Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') - https://cwe.mitre.org/data/definitions/89.html

    - ruleId: crs_942360
      eventDetails:
        description: |
          A pattern indicative of concatenated SQL injection and SQL Local File Inclusion (SQLLFI) attempts aimed at exploiting database vulnerabilities is detected.          
          - These attacks combine SQL injection with file inclusion techniques to access, manipulate, or exfiltrate sensitive data and files.
          - SQL injection patterns may include concatenated payloads targeting query manipulation, such as bypassing authentication, extracting data, or altering database schemas.
          - SQLLFI attempts use SQL functions or database features (e.g., `LOAD_FILE()`, `INTO OUTFILE`) to read or write files from the server.
          - These attempts are often used to obtain sensitive configuration files, credentials, or other critical server data.

        mitigation: |
          - Procedure Security: Implement secure stored procedure practices.
          - Parameter Validation: Validate all procedure parameters.
          - Privilege Management: Manage procedure privileges carefully.
          - Dynamic SQL Control: Avoid dynamic SQL in procedures.
          - Access Control: Implement proper access controls.
          - Monitoring: Monitor procedure execution.
          - Security Reviews: Regular security reviews of procedures.
          - Restrict database user privileges:
            - Disable file-related database functions such as `LOAD_FILE()` and `INTO OUTFILE` if not required.
            - Use minimal privilege accounts for database connections.

        impact: |
          - Privilege Escalation: Elevation of database privileges.
          - Code Execution: Unauthorized code execution.
          - Data Access: Unauthorized data access.
          - System Manipulation: System-level changes.
          - Security Compromise: Bypass of security controls.

        references: |
          - OWASP SQL Injection Prevention Cheat Sheet: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
          - CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection'): https://cwe.mitre.org/data/definitions/89.html
          - CWE-98: Improper Control of Filename for Include/Require Statement in File Inclusion: https://cwe.mitre.org/data/definitions/98.html

    - ruleId: crs_942500
      eventDetails:
        description: |
          A pattern indicative of SQL injection attempts using MySQL in-line comments to manipulate queries or bypass input validation is detected.
          - Attackers use in-line comments (e.g., `--`, `#`) to terminate legitimate SQL syntax and introduce malicious payloads.
          - These attacks often aim to:
            - Bypass authentication or conditional checks in SQL queries.
            - Modify query logic by ignoring subsequent parts of the query.
            - Exploit application vulnerabilities to execute unauthorized SQL commands.
          - Typically seen in manual or automated SQL injection testing and exploitation.

        mitigation: |
          - Enforce strict input validation and sanitization:
            - Filter or escape special characters used in SQL comments (`--`, `#`).
            - Use parameterized queries and prepared statements to prevent injection.
          - Privilege Management: Manage procedure privileges carefully.
          - Dynamic SQL Control: Avoid dynamic SQL in procedures.
          - Access Control: Implement proper access controls.
          - Monitoring: Monitor procedure execution.
          - Security Reviews: Regular security reviews of procedures.
          - Regularly update and patch database systems and application frameworks to address known vulnerabilities.
          - Conduct periodic security audits, including penetration testing and code reviews, to identify injection vulnerabilities.

        impact: |
          - Privilege Escalation: Elevation of database privileges.
          - Code Execution: Unauthorized code execution.
          - Data Access: Unauthorized data access.
          - System Manipulation: System-level changes.
          - Security Compromise: Bypass of security controls.

        references: |
          - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
          - MySQL Security Best Practices -  https://dev.mysql.com/doc/refman/8.0/en/security.html
          - CWE-89 - Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection') - https://cwe.mitre.org/data/definitions/89.html

    - ruleId: crs_942100
      eventDetails:
        description: |
          A pattern indicative of SQL injection attack is detected. SQL injection is a code injection technique that exploits a security vulnerability in an application's software.
          It occurs when data input by a user:
            - is NOT validated, filtered or sanitized by the application
            - is used to build Dynamic queries or non-parameterized calls without context-aware escaping
          This is an extremely common attack and its success can have critical implications.

        mitigation: |
          - Procedure Security: Implement secure stored procedure practices.
          - Parameter Validation: Validate all procedure parameters.
          - Privilege Management: Manage procedure privileges carefully.
          - Dynamic SQL Control: Avoid dynamic SQL in procedures.
          - Access Control: Implement proper access controls.
          - Monitoring: Monitor procedure execution.
          - Security Reviews: Regular security reviews of procedures.

        impact: |
          - Privilege Escalation: Elevation of database privileges.
          - Code Execution: Unauthorized code execution.
          - Data Access: Unauthorized data access.
          - System Manipulation: System-level changes.
          - Security Compromise: Bypass of security controls.

        references: |
          - SQL Injection: https://owasp.org/www-community/attacks/SQL_Injection
          - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
          - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
          - Common Weakness Enumeration (CWE) - CWE-89:SQL Injection - http://cwe.mitre.org/data/definitions/89.html
          - SANS TOP 25 - http://cwe.mitre.org/top25/
          - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
          - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-7:Blind SQL Injection - https://capec.mitre.org/data/definitions/7.html
          - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
          - Web Application Security Consortium - WASC-19:SQL Injection - http://projects.webappsec.org/w/page/13246963/SQL%20Injection

    - ruleId: crs_942140
      eventDetails:
        description: |
          A pattern indicative of SQL injection attempts targeting common database names for enumeration or unauthorized access is detected.
          - This attack focuses on exploiting SQL injection vulnerabilities to identify or target standard database names, such as `mysql`, `information_schema`, `test`, or `performance_schema`.
          - Attackers may attempt to:
            - Use common database names in SQL queries to determine the existence of databases on the system.
            - Exploit injection points by checking for the presence of specific schemas or tables.
            - Execute queries that reveal information about the underlying database structure by targeting default or well-known database names.
          - These attacks are often part of a reconnaissance phase, helping attackers gather information for further exploitation.

        mitigation: |
          - Procedure Security: Implement secure stored procedure practices.
          - Parameter Validation: Validate all procedure parameters.
          - Privilege Management: Manage procedure privileges carefully.
          - Dynamic SQL Control: Avoid dynamic SQL in procedures.
          - Access Control: Implement proper access controls.
          - Monitoring: Monitor procedure execution.
          - Security Reviews: Regular security reviews of procedures.

        impact: |
          - Privilege Escalation: Elevation of database privileges.
          - Code Execution: Unauthorized code execution.
          - Data Access: Unauthorized data access.
          - System Manipulation: System-level changes.
          - Security Compromise: Bypass of security controls.

        references: |
          - SQL Injection: https://owasp.org/www-community/attacks/SQL_Injection
          - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
