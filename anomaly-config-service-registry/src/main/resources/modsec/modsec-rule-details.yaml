
- ruleId: crs_101
  ruleName: Server Side Request Forgery (SSRF) Signatures
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_SSRF
  eventDetails:
    description: |
      SSRF is a type of attack where an attacker exploits a non properly validated parameter that receives a URL. The attacker might inject a malicious URL pointing to internal services, including other protocols, ports and services.
    mitigation: |
      Validate the input URL and prevent internal services from reaching internet applications:
      - Use regular expressions to validate possible URLs, avoiding unwanted domain names, ports, and protocols
      - Use a whitelist of allowed domains, protocols and ports
      - Prevent internal resources from reaching internet facing applications
      Traceable recommends to enable block mode for this rule.
    impact: |
      The impact of this attack depends on the affected systems - it can range from Sensitive Data Exposure, DOS, RCE, and more.
      - A vulnerable API importing remote code could be affected by RCE
      - A vulnerable API reading remote files might provide access internal sensitive APIs
      - A vulnerable API reading remote files can be used to request other protocols, like telnet or ftp
      - A vulnerable API reading remote files can sometimes be affected by RCE
      - A vulnerable API can sometimes be exploited to download big files and cause DOS
    references: |
      - Server Side Request Forgery: https://owasp.org/www-community/attacks/Server_Side_Request_Forgery
      - OWASP Top 10 - 2021 - A10 2021-Server-Side Request Forgery - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
      - CWE - SANS - Server-Side Request Forgery (SSRF) - https://cwe.mitre.org/data/definitions/918.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - https://capec.mitre.org/data/definitions/664.html
      - MITRE Attack - T1190 Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
      - SSRF Bible Cheatsheet - https://cheatsheetseries.owasp.org/assets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet_SSRF_Bible.pdf

- ruleId: crs_913
  ruleName: Scanner Detection
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_SCANNER_DETECTED
  eventDetails:
    description: "Automated scanning activity is detected. Scanners are often used by attackers to discover vulnerabilities in your application."
    mitigation: |
      Monitor your application logs for scanning activity and investigate any suspicious behavior. Consider implementing rate limiting to reduce the effectiveness of scanners.
      Traceable recommends to enable block mode for this rule.
    impact: |
      If not mitigated, scanners can discover vulnerabilities in your application and provide attackers with information they can use to exploit these vulnerabilities.
      Traceable recommends to enable block mode for this rule.
    references: "For more information, refer to the OWASP Testing Guide: Testing for Vulnerability Scanners."

- ruleId: crs_941
  ruleName: Cross Site Scripting (XSS)
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_XSS
  eventDetails:
    description: |
      Cross-site scripting (XSS) attacks occur when untrusted user input is used by the application, usually from a web request and the web application dynamically generates a web page that contains this untrusted data. The victim visits the generated web page through a web browser where the malicious script is executed in the context of the web server's domain, effectively violating the web browser's same-origin policy. The attacker could transfer private information from the victim's browser or send malicious requests to a web site on behalf of the victim. Phishing attacks could be used to emulate trusted web sites and trick the victim into entering a password, allowing the attacker to compromise the victim's account on that web site. Finally, the script could exploit a vulnerability in the web browser itself possibly taking over the victim's machine, sometimes referred to as "drive-by hacking."
    mitigation: |
      Assume all input is malicious. Use an "accept known good" input validation strategy. Use a vetted library or framework that does not allow this weakness to occur or provides constructs that make this weakness easier to avoid. Use a whitelist of allowed characters that do not need to be encoded.
      To help mitigate XSS attacks against the user's session cookie, set the session cookie to be HttpOnly. This will prevent the cookie from being accessed by a client side script.
    impact: |
      Consequence of an XSS attack could be any of the following regardless of the type:
      - an annoyance to end user to complete account compromise.
      - can be exploited to manipulate or steal credentials/cookies or compromise confidential information.
      - forge requests from the victim's browser.
      - execute malicious code on the end user systems for a variety of nefarious purposes
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
      - OWASP Top 10 - 2017 - A7:Cross-Site Scripting (XSS) - https://owasp.org/www-project-top-ten/2017/A7_2017-Cross-Site_Scripting_(XSS).html
      - OWASP: Cross Site Scripting (XSS) - https://owasp.org/www-community/attacks/xss/
      - OWASP: XSS (Cross Site Scripting) Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
      - CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting') - https://cwe.mitre.org/data/definitions/79.html
      - CAPEC-592: Stored Cross-Site Scripting - https://capec.mitre.org/data/definitions/592.html

- ruleId: crs_943
  ruleName: Session Fixation
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_SESSION_FIXATION
  eventDetails:
    description: |
      Session Fixation is an attack that permits an attacker to hijack a valid user session. The attack explores a limitation in the way the web application manages the session ID, more specifically the vulnerable web application. When authenticating a user, it doesn’t assign a new session ID, making it possible to use an existent session ID. The attack consists of obtaining a valid session ID (e.g. by connecting to the application), inducing a user to authenticate himself with that session ID, and then hijacking the user-validated session by the knowledge of the used session ID. The attacker has to provide a legitimate Web application session ID and try to make the victim’s browser use it.
      The session fixation attack is not a class of Session Hijacking, which steals the established session between the client and the Web Server after the user logs in. Instead, the Session Fixation attack fixes an established session on the victim’s browser, so the attack starts before the user logs in.
    mitigation: |
      - Generate a new session ID every time a user authenticates themself, even if a set session ID has been provided in the request.
      - Timeout user sessions after a short period of time with no activity. This will limit the amount of time the attacker is able to spend on the victim's session with the current session ID.
    impact: |
      A successful session fixation attack gives the attacker access to the victim's account. This could mean access to higher level privileges or the ability to look at sensitive data.
    references: |
      - http://www.acros.si/papers/session_fixation.pdf
      - http://en.wikipedia.org/wiki/Session_fixation
      - http://www.derkeiler.com/pdf/Mailing-Lists/Securiteam/2002-12/0099.pdf

- ruleId: crs_921
  ruleName: HTTP Protocol Attacks
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventDetails:
    description: "Anomalies are detected in the HTTP protocol usage, which may indicate an attempt to exploit HTTP protocol vulnerabilities."
    mitigation: |
      Ensure that your application correctly implements the HTTP protocol and handles any protocol-level errors.
      Consider using security middleware that can protect against protocol-level attacks.
    impact: "If not mitigated, this could lead to unauthorized access, data leakage, or denial of service."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - http://owasp.org/www-project-api-security/2019/en/0xa8-injection.html
      - OWASP API Top 10 - 2023 - Security Misconfiguration - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/
      - OWASP Top 10 - 2021 - A4:Broken Access Control - https://owasp.org/Top10/A04_2021-Broken_Access_Control/


- ruleId: crs_102
  ruleName: XML External Entity Injection (XXE)
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventDetails:
    description: "XML External Entity Injection (XXE) attack signatures are detected. XXE attacks exploit the way an application processes XML input with external references, potentially leading to disclosure of internal files, denial of service, or remote code execution."
    mitigation: |
      To mitigate XXE attacks, disable the use of external entities in your XML parser. Also, validate and sanitize all XML input to your application.
      Traceable recommends to enable block mode for this rule.
    impact: "If not mitigated, XXE attacks can lead to disclosure of internal files, denial of service, or even remote code execution."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://owasp.org/www-project-api-security/2019/en/0xa8-injection.html
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/

- ruleId: crs_934
  ruleName: NodeJS Injection
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventDetails:
    description: "An anomaly characteristic of Node.js injection attack is detected. Node.js injection attacks occur when an attacker can control the input data that is parsed by the Node.js engine in server or client, potentially leading to arbitrary code execution."
    mitigation: "To mitigate Node.js injection attacks, avoid using the eval() function. If it's absolutely necessary, ensure that the input data is properly sanitized and validated."
    impact: "If not mitigated, Node.js injection attacks can lead to arbitrary code execution, which could compromise the security of your application."
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://owasp.org/www-project-api-security/2019/en/0xa8-injection.html
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/

- ruleId: crs_942
  ruleName: SQL Injection
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_INJECTIONS
  eventDetails:
    description: |
      An anomaly characteristic of SQL injection attack is detected. SQL injection is a code injection technique that exploits a security vulnerability in an application's software.
      It occurs when data input by a user:
        - is NOT validated, filtered or sanitized by the application
        - is used to build Dynamic queries or non-parameterized calls without context-aware escaping
      This is an extremely common attack and its success can have critical implications.
    mitigation: |
      - The best way to protect your code against SQL injections is using parameterized queries (prepared statements). Almost all modern languages provide built-in libraries for this.
      - Wherever possible, do not create dynamic SQL queries or SQL queries with string concatenation. If not, sanitize the user input.
      - Using a database access layer (DAL)/ object relational mapping (ORM). Most of the ORM systems use only parameterized queries and this can solve the whole SQL injection problem centrally.
    impact: |
      Depending on the backend database, and the software stack, an attacker can execute one or more of the following type of attacks successfully:
      - Can read, update and delete arbitrary data/tables from the database.
      - Can read/write files into the underlying file system.
      - Can execute commands to the underlying operating system.
    references: |
      - SQL Injection: https://owasp.org/www-community/attacks/SQL_Injection
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - OWASP Top 10 - 2021 - A3:Injection - https://owasp.org/Top10/A03_2021-Injection/
      - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
      - Common Weakness Enumeration (CWE) - CWE-89:SQL Injection - http://cwe.mitre.org/data/definitions/89.html
      - SANS TOP 25 - http://cwe.mitre.org/top25/
      - OWASP SQL Injection Prevention Cheat Sheet - https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-7:Blind SQL Injection - https://capec.mitre.org/data/definitions/7.html
      - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
      - Web Application Security Consortium - WASC-19:SQL Injection - http://projects.webappsec.org/w/page/13246963/SQL%20Injection

- ruleId: crs_930
  ruleName: Local File Inclusion
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PATH_MANIPULATION
  eventDetails:
    description: "An anomaly characteristic of Local File Inclusion (LFI) attack is detected. LFI attacks occur when an attacker can manipulate a file path to access files elsewhere in the server's file system."
    mitigation: "To mitigate LFI attacks, validate and sanitize all user inputs that are used in file paths. Avoid using user input to construct file paths where possible."
    impact: "If not mitigated, LFI attacks can lead to disclosure of sensitive information, such as source code or configuration files, which could compromise the security of your application."
    references: |
      - OWASP Top 10 - 2021 – A01:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
      - OWASP Top 10 - 2017 - A5:Broken Access Control - https://owasp.org/www-project-top-ten/2017/A5_2017-Broken_Access_Control
  subRuleInfos:
  - ruleId: crs_930100
    eventDetails:
      description: |
        An anomaly characteristic of Path Traversal attack is detected.
        Path Traversal attack are successful when the attacker is able to access files or directories which are stored outside the web root folder. This is done using the ../ sequences to navigate outside the current directory.
      mitigation: |
        - Use labels instead of file paths to refer to a file.
        - Do not trust user input. Sanitize these input to remove sequences such as ../
        - Avoid storing sensitive files inside the web root folder.
        - Apply access control policies to restrict the access of files to users.
      impact: |
        The attacker will be able to view sensitive information or files to does not have authorization for, which they could then use this sensitive information to carry out different other attacks.
      references: |
        - OWASP Top 10 - 2021 – A01:Broken Access Control - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
        - OWASP Top 10 - 2017 - A5:Broken Access Control - https://owasp.org/www-project-top-ten/2017/A5_2017-Broken_Access_Control
        - Common Weakness Enumeration (CWE) CWE-22:Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal') - https://cwe.mitre.org/data/definitions/22.html
        - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-126:Path Traversal - https://capec.mitre.org/data/definitions/126.html
        - MITRE Attack - T1083:File and Directory Discovery - https://attack.mitre.org/techniques/T1083/
        - Web Application Security Consortium - WASC-33:Path Traversal - http://projects.webappsec.org/w/page/13246952/Path%20Traversal
