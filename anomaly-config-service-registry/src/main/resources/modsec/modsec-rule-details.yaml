- ruleId: crs_944
  ruleName: Java Application Attacks
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_KNOWN_VULNERABILITIES
  subRuleInfos:
  - ruleId: crs_944120
    eventDetails:
      description: |
        Java Serialization seems to be in use. If not correctly validated, an attacker can send a specially crafted object. This can lead to a dangerous “Remote Code Execution”.
        A magic sequence identifying JSO can also be used by attackers (Base64: rO0AB, Raw: 0xac, 0xed, 0x00, 0x05).
      mitigation: |
        - Deserialization of untrusted data is inherently dangerous and should be avoided.
        - Auditing your system against such vulnerabilities is very difficult: you have to check every implementation of readObject, including those in third-party libraries and the runtime library.
      impact: |
        - By controlling the input to the deserialization process an attacker can trigger the invocation of any readObject deserialization-method.
        - It is theoretically possible for such a method to allow bytecode injection.
        - In practice it is certainly possible to easily exhaust memory or CPU resources this way, resulting in denial-of-service attacks.
      references: |
        - https://owasp.org/www-project-top-ten/2017/A8_2017-Insecure_Deserialization
        - https://owasp.org/Top10/A04_2021-Insecure_Design/
        - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
        - https://cwe.mitre.org/data/definitions/502.html
        - https://docs.oracle.com/javase/7/docs/platform/serialization/spec/input.html#2971
        - https://capec.mitre.org/data/definitions/586.html
  - ruleId: crs_9440210
    eventDetails:
      description: |
        Java Serialization seems to be in use. If not correctly validated, an attacker can send a specially crafted object. This can lead to a dangerous “Remote Code Execution”.
        A magic sequence identifying JSO can also be used by attackers (Base64: rO0AB, Raw: 0xac, 0xed, 0x00, 0x05).
      mitigation: |
        - Deserialization of untrusted data is inherently dangerous and should be avoided.
        - Auditing your system against such vulnerabilities is very difficult: you have to check every implementation of readObject, including those in third-party libraries and the runtime library.
      impact: |
        - By controlling the input to the deserialization process an attacker can trigger the invocation of any readObject deserialization-method.
        - It is theoretically possible for such a method to allow bytecode injection.
        - In practice it is certainly possible to easily exhaust memory or CPU resources this way, resulting in denial-of-service attacks.
      references: |
        - https://owasp.org/www-project-top-ten/2017/A8_2017-Insecure_Deserialization
        - https://owasp.org/Top10/A04_2021-Insecure_Design/
        - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
        - https://cwe.mitre.org/data/definitions/502.html
        - https://docs.oracle.com/javase/7/docs/platform/serialization/spec/input.html#2971
        - https://capec.mitre.org/data/definitions/586.html
  - ruleId: crs_9440900
    eventDetails:
      description: |
        An anomaly characteristic of Log4Shell attack is detected. Log4Shell attack ocuurs when the attacker is able to exploit a vulnerable endpoint by sending a malicious request with a malicious endpoint. The malicious payload is evaluated by the log4j, and the LDAP+JNDI payload is executed.
        Depending on the application permissions, the exploit might be able to execute arbitrary code outside the java virtual machine, and take control of the server.
      mitigation: |
        Upgrade log4j to version:
        - Java 6: 2.3.2 or higher
        - Java 7: 2.12.4 or higher
        - Java 8+: 2.17.1 or higher
      impact: |
        A successful exploitation of log4shell might lead to arbitrary code execution.
      references: |
        - Log4j vulnerability: https://www.ncsc.gov.uk/information/log4j-vulnerability-what-everyone-needs-to-know
        - OWASP API Top 10 - 2019 - A8 Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
        - CVE-2021-44228 - Log4j - https://cve.mitre.org/cgi-bin/cvename.cgi?name=cve-2021-44228
  - ruleId: crs_9440920
    eventDetails:
      description: |
        An anomaly characteristic of Spring4Shell attack is detected. This attack occurs if the attacker finds compatible “java gadgets” which contain characteristics that allows the attacker to evaluate code, write files, or more.
        This Spring4Shell attack relies on the form to model de-serialization feature that uses data binders to create spring models. Data binding allows the developers to dynamically bind the user input to the domain model of an application.
      mitigation: |
        Upgrade Spring to version:
        - Spring Framework 5.3.x → 5.3.18 or higher
        - Spring Framework 5.2.x → 5.2.20 or higher
        Upgrade Tomcat to version:
          - Apache Tomcat 10.0.x → 10.0.20 or higher
          - Apache Tomcat 9.0.x → 9.0.62 or higher
          - Apache Tomcat 8.5.x → 8.5.78 or higher
        Good practices in CI/CD could mitigate the risk of providing useful gadgets to an attacker, rendering this exploit less dangerous.
      impact: |
        A successful exploitation of spring4shell might lead to arbitrary code execution.
      references: |
        - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
        - OWASP Top 10 - 2021 – A03:Injection - https://owasp.org/Top10/A03_2021-Injection/
