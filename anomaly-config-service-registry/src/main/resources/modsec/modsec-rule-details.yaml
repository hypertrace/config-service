- ruleId: crs_944
  ruleName: Java Application Attacks
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_KNOWN_VULNERABILITIES
  eventLabels:
    MITRE_TACTIC: TA0005
    MITRE_TECHNIQUE: T1620
  eventDetails: 
    description: |
      Java application attacks target vulnerabilities in Java-based applications, frameworks, or runtime environments. These attacks often exploit insecure deserialization, improper input validation, or outdated dependencies.
    mitigation: | 
      - Implement secure coding practices, including input validation and output encoding.
      - Regularly update Java applications, libraries, and runtime environments to patch vulnerabilities.
      - Use security tools to detect and prevent vulnerabilities, such as static code analysis and runtime application self-protection (RASP).
      - Restrict deserialization to trusted data sources and validate deserialized objects.
      - Apply the principle of least privilege (PoLP) for file, network, and database access.
    impact: |
      Successful Java application attacks can lead to data breaches, unauthorized access, service disruptions, or complete system compromise, depending on the severity of the exploited vulnerability.
    references: |
      - https://cheatsheetseries.owasp.org/cheatsheets/Java_Security_Cheat_Sheet.html
      - https://dzone.com/refcardz/java-application-vulnerabilities
      - https://www.guardrails.io/blog/java-top-10-security-vulnerabilities/
  subRuleInfos:
    - ruleId: crs_9440210
      eventDetails:
        description: |
          Java Serialization seems to be in use. If not correctly validated, an attacker can send a specially crafted object. This can lead to a dangerous “Remote Code Execution”.
          A magic sequence identifying JSO can also be used by attackers (Base64: rO0AB, Raw: 0xac, 0xed, 0x00, 0x05).
        mitigation: |
          - Deserialization of untrusted data is inherently dangerous and should be avoided.
          - Auditing your system against such vulnerabilities is very difficult: you have to check every implementation of readObject, including those in third-party libraries and the runtime library.
        impact: |
          - By controlling the input to the deserialization process an attacker can trigger the invocation of any readObject deserialization-method.
          - It is theoretically possible for such a method to allow bytecode injection.
          - In practice it is certainly possible to easily exhaust memory or CPU resources this way, resulting in denial-of-service attacks.
        references: |
          - https://owasp.org/www-project-top-ten/2017/A8_2017-Insecure_Deserialization
          - https://owasp.org/Top10/A04_2021-Insecure_Design/
          - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - https://cwe.mitre.org/data/definitions/502.html
          - https://docs.oracle.com/javase/7/docs/platform/serialization/spec/input.html#2971
          - https://capec.mitre.org/data/definitions/586.html
    - ruleId: crs_9440900
      eventDetails:
        description: |
          A pattern indicative of Log4Shell attack is detected. Log4Shell attack ocuurs when the attacker is able to exploit a vulnerable endpoint by sending a malicious request with a malicious endpoint. The malicious payload is evaluated by the log4j, and the LDAP+JNDI payload is executed.
          Depending on the application permissions, the exploit might be able to execute arbitrary code outside the java virtual machine, and take control of the server.
        mitigation: |
          Upgrade log4j to version:
          - Java 6: 2.3.2 or higher
          - Java 7: 2.12.4 or higher
          - Java 8+: 2.17.1 or higher
        impact: |
          A successful exploitation of log4shell might lead to arbitrary code execution.
        references: |
          - Log4j vulnerability: https://www.ncsc.gov.uk/information/log4j-vulnerability-what-everyone-needs-to-know
          - OWASP API Top 10 - 2019 - A8 Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - CVE-2021-44228 - Log4j - https://cve.mitre.org/cgi-bin/cvename.cgi?name=cve-2021-44228
    - ruleId: crs_9440920
      eventDetails:
        description: |
          A pattern indicative of Spring4Shell attack is detected. This attack occurs if the attacker finds compatible “java gadgets” which contain characteristics that allows the attacker to evaluate code, write files, or more.
          This Spring4Shell attack relies on the form to model de-serialization feature that uses data binders to create spring models. Data binding allows the developers to dynamically bind the user input to the domain model of an application.
        mitigation: |
          Upgrade Spring to version:
          - Spring Framework 5.3.x → 5.3.18 or higher
          - Spring Framework 5.2.x → 5.2.20 or higher
          Upgrade Tomcat to version:
            - Apache Tomcat 10.0.x → 10.0.20 or higher
            - Apache Tomcat 9.0.x → 9.0.62 or higher
            - Apache Tomcat 8.5.x → 8.5.78 or higher
          Good practices in CI/CD could mitigate the risk of providing useful gadgets to an attacker, rendering this exploit less dangerous.
        impact: |
          A successful exploitation of spring4shell might lead to arbitrary code execution.
        references: |
          - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - OWASP Top 10 - 2021 – A03:Injection - https://owasp.org/Top10/A03_2021-Injection/
          - OWASP Top 10 - 2021 – A06:Vulnerable and Outdated Components - https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
          - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
          - OWASP Top 10 - 2017 - A9:Using Components with Known Vulnerabilities - https://owasp.org/www-project-top-ten/2017/A9_2017-Using_Components_with_Known_Vulnerabilities
          - Common Weakness Enumeration (CWE) CWE-153:Input Data Manipulation - https://capec.mitre.org/data/definitions/153.html
          - SANS TOP 25 - http://cwe.mitre.org/top25/
          - MITRE Attack - TA0007:Discovery - https://attack.mitre.org/tactics/TA0007/
          - CVE-2022-22965 - Spring4Shell - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2022-22965
          - Web Application Security Consortium - WASC-20:Improper Input Handling - http://projects.webappsec.org/w/page/13246933/Improper%20Input%20Handling
    - ruleId: crs_9440940
      eventDetails:
        description: |
          A pattern indicative of Apache Struts RCE attack is detected. The attack occurs if the attacker can manipulate file upload params to enable paths traversal.
          Under certain conditions, this manipulation can result in the upload of a malicious file, potentially enabling Remote Code Execution.
        mitigation: |
          Upgrade Apache Struts to:
          - Struts 2.5.x → 2.5.33 or higher
          - Struts 6.3.x → 6.3.0.2 or higher
        impact: |
          A successful exploitation of Apache Struts RCE might lead to Remote Code Execution
        references: |
          - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - OWASP Top 10 - 2021 – A03:Injection - https://owasp.org/Top10/A03_2021-Injection/
          - OWASP Top 10 - 2021 – A06:Vulnerable and Outdated Components - https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/
          - OWASP Top 10 - 2017 - A1:Injection - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
          - OWASP Top 10 - 2017 - A9:Using Components with Known Vulnerabilities - https://owasp.org/www-project-top-ten/2017/A9_2017-Using_Components_with_Known_Vulnerabilities
          - CWE-552: Files or Directories Accessible to External Parties: https://cwe.mitre.org/data/definitions/552.html
          - SANS TOP 25 - http://cwe.mitre.org/top25/
          - CAPEC-150: Collect Data from Common Resource Locations: https://capec.mitre.org/data/definitions/150.html
          - CAPEC-639: Probe System Files: https://capec.mitre.org/data/definitions/639.html
          - [ANN] Apache Struts 6.3.0.2 & 2.5.33: https://lists.apache.org/thread/yh09b3fkf6vz5d6jdgrlvmg60lfwtqhj

    - ruleId: crs_9440960
      eventDetails:
        description: |
          Apache Struts is vulnerable to a path traversal vulnerability that can lead to Remote Code Execution (RCE). 
          - CVE-2024-53677 occurs when untrusted user input is used in file system operations, allowing attackers to craft malicious file paths.
          - This vulnerability enables attackers to bypass security restrictions and access files outside of the intended directory, potentially leading to arbitrary code execution on the affected server.
          - Attackers can exploit this flaw to access sensitive files or inject malicious code, which can compromise the system.
          - The issue is fixed in the latest Apache Struts release, where input validation and path sanitization have been improved to prevent path traversal.
        mitigation: |
          - Upgrade to the latest version of Apache Struts, where this vulnerability has been patched.
          - Validate and sanitize user inputs to ensure file paths are properly restricted to safe locations.
          - Restrict file system access to only necessary directories and resources.
          - Monitor for suspicious activity and potential exploitation attempts.
        impact: |
          - Remote Code Execution (RCE): Attackers can execute arbitrary code on the server, potentially compromising the entire system.
          - Data Exposure: Sensitive files can be accessed or exfiltrated by attackers.
          - System Compromise: The vulnerability can lead to full control over the server, allowing attackers to perform further malicious actions.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2024-53677
          - https://www.cve.org/CVERecord?id=CVE-2024-53677

    - ruleId: crs_94400910
      eventDetails:
        description: |
          - Apache Commons Text versions 1.5 to 1.9 have unsafe default interpolators ("script", "dns", "url") that can lead to Remote Code Execution (RCE) or unintentional remote connections when processing untrusted input.
        mitigation: |
          - Upgrade to Apache Commons Text version 1.10.0 or later, which addresses this vulnerability.
          - Avoid passing untrusted input into the string interpolation functions of the library.
          - Use safe libraries or frameworks that sanitize input to prevent injection attacks.
        impact: |
          - Exploiting this vulnerability allows attackers to execute arbitrary commands on the server.
          - Successful exploitation could compromise system integrity, confidentiality, and availability.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2022-42889
          - https://www.cve.org/CVERecord?id=CVE-2022-42889
          - https://commons.apache.org/proper/commons-text/
          - https://github.com/apache/commons-text

    - ruleId: crs_9440921
      eventDetails:
        description: |
          - A potential Spring Core Remote Code Execution (CVE-2022-22965) vulnerability has been detected.
          - A Spring MVC or Spring WebFlux application running on JDK 9+ may be vulnerable to remote code execution (RCE) via data binding. 
          - The vulnerability specifically targets applications running on Tomcat as a WAR deployment. Although Spring Boot executable jar deployments are not vulnerable to the primary exploit path, the underlying vulnerability may have other exploitation vectors.
        mitigation: |
          - For Spring Framework 5.3.x: Upgrade to version 5.3.18 or higher
          - For Spring Framework 5.2.x: Upgrade to version 5.2.20 or higher
          - Consider deploying as Spring Boot executable jar instead of WAR
          - If immediate upgrade is not possible, follow Spring's security advisory for temporary workarounds
          - Review and validate all data binding configurations
        impact: |
          - Remote Code Execution on vulnerable systems
          - Complete compromise of affected applications and their underlying systems
          - Ability to execute arbitrary code with application server privileges
          - Potential unauthorized access to sensitive data
          - Risk of lateral movement within internal networks if successfully exploited
        references: |
          - https://tanzu.vmware.com/security/cve-2022-22965
          - https://spring.io/blog/2022/03/31/spring-framework-rce-early-announcement
          - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2022-22965
          - https://www.rapid7.com/blog/post/2022/03/30/spring4shell-zero-day-vulnerability-in-spring-framework/
          - https://nvd.nist.gov/vuln/detail/CVE-2022-22965

    - ruleId: crs_944100
      eventDetails:
        description: |
          A potentially malicious Java class execution has been detected. This could indicate an attempt to execute arbitrary commands on the system through Java class manipulation or injection. Such attacks often leverage vulnerabilities in Java deserialization, class loading mechanisms, or unsafe reflection to execute unauthorized code.
        mitigation: |
          - Implement strict class loading policies and whitelist allowed classes
          - Validate and sanitize all user inputs that could affect class loading or execution
          - Use SecurityManager to restrict permissions and class access
          - Implement proper input validation and encoding
          - Keep Java runtime and all dependencies up to date
          - Consider using automated code scanning tools to detect potential RCE vulnerabilities
          - Implement proper logging and monitoring for suspicious class loading activities
        impact: |
          - Unauthorized remote code execution on the target system
          - Potential complete system compromise
          - Access to sensitive data and system resources
          - Ability to execute arbitrary commands with application privileges
          - Possible lateral movement within the network
          - Risk of data theft or system manipulation
        references: |
          - https://owasp.org/www-project-top-ten/2017/A1_2017-Injection
          - https://docs.oracle.com/javase/tutorial/essential/environment/security.html
          - https://cwe.mitre.org/data/definitions/94.html
          - https://cheatsheetseries.owasp.org/cheatsheets/Java_Security_Cheat_Sheet.html
          - https://portswigger.net/web-security/deserialization

    - ruleId: crs_944120
      eventDetails:
        description: |
          A potential Java deserialization vulnerability (CVE-2015-4852) has been detected. This vulnerability affects WebLogic Server and allows remote attackers to execute arbitrary commands via crafted serialized Java objects. The attack exploits unsafe deserialization of T3 protocol messages, which can lead to remote code execution through maliciously constructed serialized objects.
          A magic sequence identifying JSO can also be used by attackers (Base64: rO0AB, Raw: 0xac, 0xed, 0x00, 0x05).
        mitigation: |
          - Deserialization of untrusted data is inherently dangerous and should be avoided.
          - Auditing your system against such vulnerabilities is very difficult: you have to check every implementation of readObject, including those in third-party libraries and the runtime library.
          - Implement input validation for all serialized data
          - Consider using alternatives to Java serialization such as JSON or Protocol Buffers
          - Enable server-side validation and whitelisting of serialized classes
          - Implement network segmentation to restrict T3 protocol access
          - Use SerialKiller or other similar tools to validate serialized objects
          - Consider implementing NIST's guidance for securing Java deserialization
        impact: |
          - By controlling the input to the deserialization process an attacker can trigger the invocation of any readObject deserialization-method.
          - It is theoretically possible for such a method to allow bytecode injection.
          - In practice it is certainly possible to easily exhaust memory or CPU resources this way, resulting in denial-of-service attacks.
        references: |
          - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2015-4852
          - https://www.oracle.com/security-alerts/cpujan2016.html
          - https://owasp.org/www-community/vulnerabilities/Deserialization_of_untrusted_data
          - https://foxglovesecurity.com/2015/11/06/what-do-weblogic-websphere-jboss-jenkins-opennms-and-your-application-have-in-common-this-vulnerability/
          - https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html

    - ruleId: crs_944130
      eventDetails:
        description: |
          A suspicious Java class execution attempt has been detected in the system. This could indicate potential malicious activity where an attacker is trying to load and execute unauthorized Java classes. Such behavior may be associated with attempts to exploit class loading mechanisms, reflection abuse, or dynamic code execution vulnerabilities to run malicious code within the Java Virtual Machine.
        mitigation: |
          - Implement strict class loading policies that only allow known and trusted classes
          - Enable SecurityManager with appropriate permissions
          - Implement comprehensive logging of class loading activities
          - Use allowlist-based class loading restrictions
          - Monitor and audit dynamic class loading operations
          - Review and restrict reflection usage in the application
          - Implement runtime application self-protection (RASP) solutions
          - Keep all Java components and dependencies up to date
        impact: |
          - Potential execution of malicious code within the JVM
          - Possible system compromise through unauthorized class execution
          - Risk of data theft or manipulation
          - Potential privilege escalation
          - Service disruption or system instability
          - Possible use as a stepping stone for further attacks
        references: |
          - https://docs.oracle.com/javase/tutorial/essential/environment/security.html
          - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
          - https://cwe.mitre.org/data/definitions/94.html
          - https://cheatsheetseries.owasp.org/cheatsheets/Java_Security_Cheat_Sheet.html
          - https://www.oracle.com/java/technologies/javase/seccodeguide.html

    - ruleId: crs_944110
      eventDetails:
        description: |
          A potential exploitation attempt of CVE-2017-9805 (Apache Struts REST plugin vulnerability) has been detected. This vulnerability affects Apache Struts REST Plugin versions 2.1.1 through 2.3.x (before 2.3.34) and 2.5.x (before 2.5.13). The vulnerability stems from the REST Plugin's XStreamHandler using an XStream instance for XML deserialization without proper type filtering. When processing malicious XML payloads, this can lead to unsafe deserialization and subsequent remote code execution through process spawning.
        mitigation: |
          - Upgrade Apache Struts to the following patched versions:
            - Version 2.3.34 or higher (for 2.3.x users)
            - Version 2.5.13 or higher (for 2.5.x users)
          - Implement strict XML payload validation and filtering
          - Configure XStream security settings to restrict allowed types
          - Deploy Web Application Firewall (WAF) rules to detect and block malicious XML payloads
          - Monitor and restrict process creation capabilities
          - Implement application whitelisting for process execution
          - Consider disabling XML deserialization if not strictly required
        impact: |
          - Remote code execution through process spawning
          - Complete system compromise through malicious XML payload processing
          - Unauthorized access to system resources and sensitive data
          - Ability to execute arbitrary system commands
          - Potential for lateral movement within the network
          - Service disruption and system instability
          - Data theft or manipulation risks
        references: |
          - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-9805
          - https://struts.apache.org/docs/s2-052.html
          - https://owasp.org/www-project-top-ten/2017/A8_2017-Insecure_Deserialization
          - https://nvd.nist.gov/vuln/detail/CVE-2017-9805
          - https://cheatsheetseries.owasp.org/cheatsheets/XML_Security_Cheat_Sheet.html
          - https://cwiki.apache.org/confluence/display/WW/S2-052

    - ruleId: crs_9440930
      eventDetails:
        description: |
          Confluence Server is vulnerable to OGNL (Object-Graph Navigation Language) injection, which allows attackers to execute arbitrary code on the server by injecting malicious input into the Webwork framework. 
          - This vulnerability affects versions before 6.13.23, from 6.14.0, before 7.4.11, from 7.5.0, before 7.11.6, and from 7.12.0 before 7.12.5.
          - Attackers can exploit this vulnerability by providing untrusted data, which is then processed by the OGNL expression evaluator, leading to Remote Code Execution (RCE).
          - Successful exploitation can allow attackers to take full control of the server, read or modify sensitive data, and cause system disruption.
        mitigation: |
          - Upgrade to Confluence Server version 7.4.13 or later, which addresses this vulnerability.
          - Validate and sanitize inputs to prevent the injection of untrusted data into OGNL expressions.
          - Review use of OGNL in your application, ensuring sensitive operations are not exposed to user input.
          - Restrict access to Confluence’s administrative endpoints and secure any other vulnerable areas of the system.
        impact: |
          - Remote Code Execution (RCE): Attackers can execute arbitrary commands on the server, potentially compromising the entire system.
          - Data Exposure: Sensitive information can be accessed or modified by attackers.
          - Denial of Service (DoS): Malicious code execution could lead to service disruption or resource exhaustion.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2021-26084
          - https://www.cve.org/CVERecord?id=CVE-2021-26084
          - https://jira.atlassian.com/browse/CONFSERVER-67940
          - https://blog.qualys.com/qualys-insights/2022/06/29/atlassian-confluence-ognl-injection-remote-code-execution-rce-vulnerability-cve-2022-26134

    - ruleId: crs_9440910
      eventDetails:
        description: |
          Apache Log4j2 versions 2.0-alpha1 through 2.16.0 (excluding 2.12.3 and 2.3.1) are vulnerable to an Uncontrolled Recursion Denial of Service (DoS) vulnerability (CVE-2021-45105).
          - This vulnerability occurs due to uncontrolled recursion in Log4j2 when handling self-referential lookups.
          - An attacker with control over Thread Context Map (TCM) data can craft a malicious string that causes a recursive lookup, leading to denial of service (DoS).
          - The vulnerability is caused by the failure to properly protect against recursion in self-referential log messages, potentially causing the application or server to hang or crash due to infinite recursion.
          - Affected versions include 2.0-alpha1 through 2.16.0, with the exception of 2.12.3 and 2.3.1, which are not impacted.
        mitigation: |
          - Upgrade to Log4j 2.17.0 or later to fix the vulnerability.
          - If upgrading is not immediately feasible, use Log4j 2.12.3 or 2.3.1, which are not affected by this issue.
          - Review and sanitize Thread Context Map data to ensure no attacker-controlled input can trigger recursive behavior.
          - Monitor system logs for unusual behavior or signs of attempts to exploit this vulnerability.
        impact: |
          - Denial of Service (DoS): Attackers can cause infinite recursion, leading to application crashes or unresponsiveness.
          - Service Disruption: Exploiting this vulnerability could result in significant downtime or degraded service performance.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2021-45105
          - https://www.cve.org/CVERecord?id=CVE-2021-45105
          - https://logging.apache.org/log4j/2.x/security.html

    - ruleId: crs_9440950
      eventDetails:
        description: |
          PAN-OS GlobalProtect Portal is vulnerable to Remote Code Execution (RCE) due to improper input validation. 
            - The vulnerability affects the following versions:
              - Affected from 10.2.0 before 10.2.9-h1
              - Unaffected from 10.2.9-h1
              - Affected from 11.0.0 before 11.0.4-h1
              - Unaffected from 11.0.4-h1
              - Affected from 11.1.0 before 11.1.2-h3
              - Unaffected from 11.1.2-h3
              - Unaffected at 9.0.0, 9.1.0, 10.0.0, and 10.1.0
          - Exploitation of this vulnerability can allow attackers to execute arbitrary code, leading to full device compromise, data exfiltration, and potential network attacks.
          - The issue is fixed in versions starting from 10.2.9-h1, 11.0.4-h1, and 11.1.2-h3, which provide better input validation to prevent RCE.
        mitigation: |
          - Upgrade to PAN-OS versions 10.2.9-h1, 11.0.4-h1, or 11.1.2-h3 or later to resolve the issue.
          - Implement tighter access control and authentication mechanisms for GlobalProtect.
          - Monitor logs for abnormal activity and potential exploitation attempts.
        impact: |
          - Remote Code Execution (RCE): Attackers can execute arbitrary code, leading to full control over the affected system.
          - Data Exposure: Sensitive data can be accessed or exfiltrated by attackers.
          - Network Compromise: A successful attack could allow lateral movement within the network and further exploitation.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2024-3400
          - https://www.cve.org/CVERecord?id=CVE-2024-3400

- ruleId: crs_103
  ruleName: Basic Authentication Violation
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_AUTHENTICATION_AND_TOKEN_VIOLATIONS
  eventLabels:
    MITRE_TACTIC: TA0005
    MITRE_TECHNIQUE: T1556
  eventDetails: 
    description: |
        Basic authentication violations occur when attackers exploit weaknesses in the implementation of HTTP Basic Authentication, often through insecure transmission of credentials, weak passwords, or lack of encryption.
    mitigation: | 
      - Use HTTPS to encrypt communication and prevent credential interception.
      - Enforce strong password policies, including complexity and expiration.
      - Implement multi-factor authentication (MFA) to enhance security.
      - Monitor and log authentication attempts to detect and respond to suspicious activity.
      - Limit the number of failed login attempts to protect against brute-force attacks.
    impact: |
      Violations of basic authentication can result in unauthorized access to sensitive resources, data breaches, credential theft, and potential exploitation of other systems using compromised credentials.
    references: |
      - https://cheatsheetseries.owasp.org/cheatsheets/Web_Service_Security_Cheat_Sheet.html
      - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
  
  subRuleInfos:
    - ruleId: crs_1030100
      eventDetails:
        description: |
          HTTP basic authentication is simple, sending a username and password with each request. However, if appropriate security protocols such as TLS session encryption are not used for all communication, the username and password information can be sent in the clear, making it easy for attackers to steal the credentials.
        mitigation: |
          Make sure that HTTP authentication is transmitted over HTTPS.
        impact: |
          - An attacker eavesdropping the traffic might obtain logins and passwords of valid users.
          - It may be vulnerable to account brute-forcing or may encourage Man-in-The-Middle (MiTM) attacks.
          - Because the included credentials contain so little context, they can easily be misused in attacks such as cross-site request forgeries (CSRF)
        references: |
          - https://owasp.org/www-project-top-ten/2017/A3_2017-Sensitive_Data_Exposure.html
          - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
          - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/dist/owasp-api-security-top-10.pdf
          - https://capec.mitre.org/data/definitions/102.html
          - https://cwe.mitre.org/data/definitions/522.html
          - https://www.first.org/cvss/calculator/3.0#CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:N
          - http://projects.webappsec.org/Insufficient%20Transport%20Layer%20Protection
          - https://attack.mitre.org/techniques/T1190/

- ruleId: crs_104
  ruleName: GraphQL Attacks
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_GRAPHQL_ATTACKS
  eventDetails: 
    description: |
      GraphQL attacks exploit vulnerabilities in GraphQL APIs, such as excessive data exposure, improper authorization, or query batching abuse, to access sensitive data or disrupt services.
    mitigation: | 
      - Implement strict access control and authentication mechanisms for GraphQL APIs.
      - Use query depth and complexity limits to prevent resource exhaustion attacks.
      - Perform input validation and sanitization to avoid injection vulnerabilities.
      - Disable introspection in production environments to minimize information disclosure.
      - Regularly monitor and log API queries to detect and respond to abnormal patterns.
    impact: |
      Successful GraphQL attacks can lead to unauthorized access to sensitive data, service disruptions, or exploitation of backend systems, potentially resulting in data breaches and financial losses.
    references: |
      - https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html
      - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/12-API_Testing/01-Testing_GraphQL
      - https://portswigger.net/web-security/graphql
      - https://www.imperva.com/blog/graphql-vulnerabilities-common-attacks/

  subRuleInfos:
    - ruleId: crs_1040100
      eventDetails:
        description: |
          GraphQL introspection allows to query all information related to the supported schema and queries on a GraphQL server instance. By leveraging this misconfiguration, an attacker could retrieve sensitive information or conduct further attacks on the discovered endpoints
        mitigation: |
          Restrict GraphQL introspection feature to authorized users only, or disable it.
        impact: |
          - Attackers could view sensitive information about the service and the infrastructure on which the service is being run on, using which malicious actors can target the system with different attacks.
        references: |
          - OWASP API Top 10 - 2019 - API7:Security Misconfiguration - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa7-security-misconfiguration.md
          - OWASP Top 10 - 2021 – A05:Security Misconfiguration - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
          - OWASP Top 10 - 2017 - A6:Security Misconfiguration - https://owasp.org/www-project-top-ten/2017/A6_2017-Security_Misconfiguration
          - Common Weakness Enumeration (CWE) CWE-16: Configuration : https://cwe.mitre.org/data/definitions/16
          - SANS TOP 25 - http://cwe.mitre.org/top25/
          - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-116:Excavation - https://capec.mitre.org/data/definitions/116.html
          - MITRE Attack - T1213:Data from Information Repositories - https://attack.mitre.org/techniques/T1213/
          - Web Application Security Consortium - WASC-15:Application Misconfiguration - http://projects.webappsec.org/w/page/13246914/Application%20Misconfiguration