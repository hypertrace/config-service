    mitigation: "To mitigate RCE attacks, validate and sanitize all user inputs. Avoid using user input in system commands where possible. Regularly update and patch your systems to fix known vulnerabilities."
    impact: "If not mitigated, RCE attacks can lead to full system compromise, allowing an attacker to perform any action they want on the server."
