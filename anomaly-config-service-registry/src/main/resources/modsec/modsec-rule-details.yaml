    - ruleId: crs_9320310
      eventDetails:
        description: |
          A pattern indicative of Server Side Template Injection (SSTI) is detected.
          - SSTI occurs when user-controlled input is embedded into a server-side template, allowing attackers to inject malicious code that is executed on the server.
          - This vulnerability arises from improper sanitization of user input, enabling attackers to inject template syntax and execute arbitrary code or access sensitive data.
          - Exploiting SSTI can lead to remote code execution, data leakage, or server compromise, as the attacker can manipulate the template engine to perform unintended actions.
          - Mitigating SSTI involves properly validating and sanitizing all user inputs before passing them into templates, ensuring that malicious code cannot be executed.
        mitigation: |
          To mitigate SSTI attacks, ensure that all user inputs are strictly validated and sanitized before being processed by the server-side template engine. 
          - Avoid passing untrusted data directly into templates, and use safe methods for data binding.
          - Consider using template engines that provide secure ways to handle user input, such as escaping special characters, and restrict the usage of dangerous template features.
          - Implement proper access controls and only allow trusted templates to be executed.
          - Keep your server-side template engine and all related components up to date with the latest security patches.
        impact: |
          Successful exploitation of an SSTI vulnerability can allow an attacker to execute arbitrary code on the server, potentially gaining full control of the system. 
          - This can lead to data leakage, unauthorized access to sensitive information, and further exploitation of the system for privilege escalation or lateral movement within the network.
          - In critical systems, SSTI can result in complete server compromise and service disruption.
        references: |
          - OWASP Server-Side Template Injection Testing Guide - https://owasp.org/www-project-web-security-testing-guide/v41/4-Web_Application_Security_Testing/07-Input_Validation_Testing/18-Testing_for_Server_Side_Template_Injection
          - OWASP Top 10 - 2021 - A03:Injection - https://owasp.org/Top10/A03_2021-Injection/
          - Common Weakness Enumeration (CWE) CWE-20: Improper Input Validation - https://cwe.mitre.org/data/definitions/20.html
          - MITRE ATT&CK - T1071: Application Layer Protocol - https://attack.mitre.org/techniques/T1071/
          - PortSwigger Web Security Academy - Server Side Template Injection - https://portswigger.net/web-security/server-side-template-injection


    - ruleId: crs_9320010
      eventDetails:
        description: |
          Spring Cloud Function versions 3.1.6, 3.2.2, and older unsupported versions are vulnerable to Remote Code Execution (RCE) due to improper handling of Spring Expression Language (SpEL) expressions in the routing functionality, identified as CVE-2022-22963.
          - The vulnerability occurs when an attacker can provide a specially crafted SpEL expression as a routing-expression, which is then evaluated by Spring Cloud Function.
          - This allows attackers to inject arbitrary code, resulting in the execution of malicious code and potentially gaining access to local resources or executing arbitrary actions on the system.
          - The issue is triggered through the use of SpEL in routing decisions, where unsafe evaluation of user-controlled input can lead to remote code execution.
          - The vulnerability has been fixed in Spring Cloud Function versions 3.1.7 and later, where safer handling and validation of SpEL expressions were implemented to mitigate the risk.
        mitigation: |
          - Upgrade to Spring Cloud Function version 3.1.7 or later to resolve the vulnerability.
          - Sanitize and validate user inputs, particularly those controlling routing expressions, to prevent injection of malicious SpEL.
          - Limit or disable the use of Spring Expression Language (SpEL) in routing functionality if it is not necessary for the application.
          - Review and secure code paths that evaluate routing expressions to ensure they cannot execute arbitrary code.
        impact: |
          - Remote Code Execution (RCE): Attackers can inject malicious SpEL expressions, leading to arbitrary code execution on the target system.
          - Unauthorized Access: Exploiting this vulnerability can give attackers access to sensitive resources and data on the system.
          - Complete System Compromise: Successful exploitation may allow attackers to fully control the affected system.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2022-22963
          - https://www.cve.org/CVERecord?id=CVE-2022-22963
          - https://github.com/spring-cloud/spring-cloud-function/releases/tag/v3.1.7


    - ruleId: crs_9320020
      eventDetails:
        description: |
          The Jakarta Multipart parser in Apache Struts 2 versions 2.3.x before 2.3.32 and 2.5.x before 2.5.10.1 is vulnerable to Remote Code Execution (RCE) due to incorrect exception handling and error-message generation during file-upload attempts, identified as CVE-2017-5638.
          - The vulnerability is triggered when an attacker sends a crafted HTTP request with malicious Content-Type, Content-Disposition, or Content-Length headers, particularly a Content-Type header containing a `#cmd=` string.
          - This improper handling allows attackers to inject arbitrary commands into the request, leading to remote code execution on the affected system.
          - The issue was exploited in the wild in March 2017, where attackers used specially crafted requests to execute arbitrary commands on vulnerable systems.
          - The vulnerability was fixed by improving exception handling and error message generation, ensuring malicious headers cannot trigger arbitrary command execution.
        mitigation: |
          - Upgrade to Apache Struts version 2.3.32 or 2.5.10.1 or later to resolve the vulnerability.
          - Sanitize and validate Content-Type, Content-Disposition, and Content-Length headers in file-upload requests to prevent injection of malicious data.
          - Implement input validation for all user-controlled HTTP headers, especially in multipart form submissions.
          - Monitor application logs for unusual patterns or exploitation attempts involving file uploads or malformed headers.
        impact: |
          - Remote Code Execution (RCE): Attackers can exploit the vulnerability to execute arbitrary commands on the affected system by injecting malicious headers.
          - System Compromise: Exploiting this vulnerability could lead to a complete system compromise, allowing attackers to run arbitrary code with the same privileges as the web server.
          - Data Exposure: Attackers could potentially leak sensitive data or disrupt services through code execution.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2017-5638
          - https://www.cve.org/CVERecord?id=CVE-2017-5638

    - ruleId: crs_9320021
      eventDetails:
        description: |
          Apache Struts versions 2.3 to 2.3.34 and 2.5 to 2.5.16 are vulnerable to Remote Code Execution (RCE) due to improper handling of OGNL (Object-Graph Navigation Language) expressions in URLs, identified as CVE-2018-11776.
          - The vulnerability occurs when the alwaysSelectFullNamespace configuration is set to true, either by the user or by plugins such as the Convention Plugin. This misconfiguration allows for unsafe URL resolution.
          - When results are used with no namespace and the upper package has either no namespace or a wildcard namespace, OGNL expressions can be injected into the URL, leading to code execution.
          - A similar issue occurs with the url tag when no value or action is set, and the upper package has either no namespace or a wildcard, allowing an attacker to inject malicious OGNL expressions.
          - The vulnerability arises because Struts fails to properly filter and validate these parameters before evaluating them as OGNL expressions.
          - The issue has been fixed by improving the validation of namespaces and input parameters, preventing malicious OGNL expressions from being executed in the context of URL resolution.
        mitigation: |
          - Upgrade to Apache Struts version 2.3.35 or 2.5.17 or later to resolve the vulnerability.
          - Ensure proper namespace configuration by setting specific namespaces rather than using wildcard namespaces or leaving them undefined.
          - Disable unsafe plugins like the Convention Plugin or configure them to use secure settings.
          - Sanitize and validate all user inputs, especially URL parameters and dynamic results, to prevent the injection of malicious OGNL expressions.
          - Review and harden the Struts configuration, ensuring that all actions and results are properly namespaced and that dynamic content is handled securely.
        impact: |
          - Remote Code Execution (RCE): Attackers can inject malicious OGNL expressions into URL parameters, leading to arbitrary code execution on the server.
          - System Compromise: Exploiting this vulnerability can provide attackers with full control over the system, allowing them to execute arbitrary commands and escalate privileges.
          - Data Exposure: If exploited, attackers could access sensitive data, modify configurations, or disrupt services.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2018-11776
          - https://www.cve.org/CVERecord?id=CVE-2018-11776

    - ruleId: crs_9320030
      eventDetails:
        description: |
          Apache Solr versions 5.0.0 to 5.5.5 and 6.0.0 to 6.6.5 are vulnerable to Remote Code Execution (RCE) due to unsafe deserialization in the Config API.
          - The vulnerability arises because the Config API allows configuring the JMX server via an HTTP POST request.
          - By pointing the JMX server configuration to a malicious RMI server, an attacker could exploit Solr's unsafe deserialization process to execute arbitrary code on the Solr server.
          - This issue occurs because Solr fails to properly validate and sanitize the RMI server configurations before deserializing them, allowing an attacker to inject malicious payloads and trigger remote code execution.
          - The vulnerability was fixed by implementing proper validation and sanitization of the JMX server configurations to ensure they do not point to malicious RMI servers.
        mitigation: |
          - Upgrade to Apache Solr version 5.5.6 or later (for Solr 5.x) and 6.6.6 or later (for Solr 6.x) to mitigate the vulnerability.
          - Configure the JMX server only to point to trusted, secure RMI servers and avoid allowing user-controlled configurations for this setting.
          - Sanitize inputs for all HTTP POST requests to the Config API to prevent malicious input from being processed.
          - Implement network segregation to limit access to Solr's JMX server configuration, reducing the attack surface.
        impact: |
          - Remote Code Execution (RCE): Attackers can exploit this vulnerability by pointing the JMX configuration to a malicious RMI server, triggering unsafe deserialization and executing arbitrary code on the Solr server.
          - System Compromise: Exploiting this vulnerability allows attackers to gain complete control over the Solr instance and potentially escalate privileges on the underlying system.
          - Data Loss or Integrity Issues: Attackers could manipulate or leak sensitive data stored on the Solr server.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-0192
          - https://www.cve.org/CVERecord?id=CVE-2019-0192
          - https://lucene.apache.org/solr/6_6_6/changes/Changes.html#solr-6.6.6

    - ruleId: crs_9320031
      eventDetails:
        description: |
          Apache Solr versions 5.0.0 to 8.4.0 are vulnerable to Remote Code Execution (RCE) through the DataImportHandler (DIH) component. The issue arises from the use of the "dataConfig" parameter in requests, which is used to load DIH configurations.
          - The DataImportHandler allows for pulling data from external sources and can include scripts in its configuration. This configuration can be supplied dynamically via the "dataConfig" parameter in a request.
          - In debug mode, this functionality is used for convenience during development, but it allows attackers to inject malicious scripts or code into the DIH configuration if proper input sanitization is not in place.
          - Starting with Solr 8.2.0, the use of this parameter requires setting the Java System property "enable.dih.dataConfigParam" to true for it to be active, reducing the risk of exploitation in later versions.
          - The vulnerability is triggered when the "dataConfig" parameter is used without proper validation or when an attacker can manipulate the request to inject malicious code into the DIH configuration.
        mitigation: |
          - Upgrade to Apache Solr version 8.2.0 or later to mitigate the vulnerability.
          - Disable the use of the "dataConfig" parameter when possible, or configure it to accept only trusted sources.
          - In versions 8.2.0 and later, ensure the Java System property "enable.dih.dataConfigParam" is explicitly set to true only when required.
          - Sanitize and validate all inputs, especially the "dataConfig" parameter and its contents, to prevent injection of unauthorized or malicious scripts.
          - Restrict access to the DIH admin interface to trusted users and limit exposure to the debug mode feature.
        impact: |
          - Remote Code Execution (RCE): Attackers can exploit this vulnerability by injecting malicious scripts into the DIH configuration via the "dataConfig" parameter, allowing for arbitrary code execution on the Solr server.
          - System Compromise: Exploiting this vulnerability could allow attackers to gain full control over the Solr server and execute arbitrary commands.
          - Data Integrity or Exposure: Attackers could manipulate or access sensitive data stored within Solr, potentially compromising confidentiality or availability.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-0193
          - https://www.cve.org/CVERecord?id=CVE-2019-0193
          - https://lucene.apache.org/solr/8_2_0/changes/Changes.html#solr-8.2.0

    - ruleId: crs_9320040
      eventDetails:
        description: |
          Atlassian Confluence versions before 6.6.12, 6.7.0 to 6.12.3, 6.13.0 to 6.13.3, and 6.14.0 to 6.14.2 are vulnerable to Server-Side Template Injection (SSTI) leading to Remote Code Execution (RCE) in the Widget Connector macro.
          - The vulnerability exists due to improper sanitization of user input in the Widget Connector macro feature, which allows attackers to inject server-side template expressions.
          - The attack can be triggered by exploiting the macro to craft malicious input that is evaluated by the Velocity Template Engine (VTE). This leads to arbitrary code execution on the server.
          - The issue was particularly dangerous because the Widget Connector macro allows users to embed external resources (like videos) that could be manipulated to execute arbitrary commands on the Confluence server.
          - The vulnerability was fixed by improving input validation and ensuring that user input in the Widget Connector macro is properly sanitized to prevent template injection.
        mitigation: |
          - Upgrade to Confluence version 6.6.12, 6.12.3, 6.13.3, or 6.14.2 or later to resolve the vulnerability.
          - Sanitize and validate user inputs in the Widget Connector macro to prevent template injection and other forms of malicious input.
          - Limit the use of external macros or embed functionality and ensure that only trusted users can add content to Confluence pages.
          - Monitor user activity and configure access controls to restrict potentially dangerous functionality, especially in public or untrusted environments.
        impact: |
          - Remote Code Execution (RCE): An attacker could exploit the vulnerability to inject arbitrary code, leading to full control over the Confluence server or Data Center instance.
          - System Compromise: Successful exploitation gives attackers the ability to execute commands, escalate privileges, and potentially access or modify sensitive data stored within Confluence.
          - Data Breach: By exploiting the vulnerability, attackers may gain unauthorized access to Confluence data, potentially leading to data leaks or manipulation.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-3396
          - https://www.cve.org/CVERecord?id=CVE-2019-3396
    - ruleId: crs_9320041
      eventDetails:
        description: |
          Atlassian Confluence versions before 6.6.12, 6.7.0 to 6.12.3, 6.13.0 to 6.13.3, and 6.14.0 to 6.14.2 are vulnerable to Path Traversal and Remote Code Execution (RCE) via Server-Side Template Injection (SSTI) in the Widget Connector macro.
          - The vulnerability occurs due to improper sanitization of user input in the Widget Connector macro, which allows attackers to inject server-side template code, leading to path traversal and remote code execution.
          - This issue is triggered when the Widget Connector macro handles malicious input containing crafted file paths and template expressions, which may allow attackers to traverse directories and execute arbitrary code on the Confluence server.
          - The attack is possible due to the lack of sufficient input validation and the ability of the macro to process user-supplied content without proper sandboxing or restrictions.
          - The vulnerability was fixed by enhancing input validation in the Widget Connector macro and addressing the server-side template injection risk.
        mitigation: |
          - Upgrade to Confluence version 6.6.12, 6.12.3, 6.13.3, or 6.14.2 or later to fix the vulnerability.
          - Sanitize and validate user input in the Widget Connector macro to prevent both path traversal and template injection attacks.
          - Implement proper security controls to prevent untrusted users from submitting potentially dangerous content to Confluence.
          - Restrict the ability to use external macros or embedding functionality to trusted users only.
        impact: |
          - Remote Code Execution (RCE): An attacker can exploit this vulnerability to execute arbitrary code on the Confluence server or Data Center instance.
          - System Compromise: Successful exploitation allows attackers to gain full control over the server, potentially executing commands and accessing sensitive data.
          - Data Exposure: Exploiting the vulnerability may enable attackers to access sensitive files or manipulate data within Confluence.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-3396
          - https://www.cve.org/CVERecord?id=CVE-2019-3396

    - ruleId: crs_9320050
      eventDetails:
        description: |
          vBulletin versions 5.0.0 to 5.5.4 are vulnerable to Remote Code Execution (RCE) via the widgetConfig[code] parameter in an ajax/render/widget_php route string request.
          - The vulnerability occurs when the widgetConfig[code] parameter is not properly sanitized, allowing attackers to inject malicious PHP code into the request.
          - This leads to remote code execution on the server, as the widgetConfig[code] parameter is evaluated and executed by the application.
          - Attackers can exploit this vulnerability by sending specially crafted requests, allowing them to execute arbitrary commands and gain control over the vBulletin instance.
          - The flaw is in the handling of the widgetConfig[code] parameter in the ajax/render/widget_php endpoint, which was exploited in the wild for RCE.
          - The vulnerability was fixed by improving input validation and ensuring that the widgetConfig[code] parameter cannot execute arbitrary code.
        mitigation: |
          - Upgrade to vBulletin version 5.5.5 or later to fix the vulnerability.
          - Sanitize and validate all user inputs, especially those in widgetConfig and similar parameters, to prevent code injection.
          - Restrict access to sensitive AJAX endpoints like ajax/render/widget_php to trusted users only.
          - Monitor for suspicious activities like unexpected commands or unauthorized access attempts targeting the vulnerable endpoint.
        impact: |
          - Remote Code Execution (RCE): Attackers can inject malicious PHP code, leading to the execution of arbitrary commands on the vBulletin server.
          - System Compromise: Successful exploitation provides attackers with full control over the server, including the ability to upload files, execute commands, and manipulate data.
          - Data Breach: Attackers may gain unauthorized access to sensitive data stored in vBulletin or use the vulnerability to escalate further attacks.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-16759
          - https://www.cve.org/CVERecord?id=CVE-2019-16759

    - ruleId: crs_9320060
      eventDetails:
        description: |
          Adobe ColdFusion versions 2018.0.0.310739 (July 12 release), Update 6, and Update 14 and earlier are vulnerable to an Unrestricted File Upload vulnerability.
          - The vulnerability occurs due to improper validation of uploaded files, allowing attackers to upload arbitrary files to the server.
          - Successful exploitation could allow attackers to upload malicious files, such as PHP or JSP scripts, which can then be executed remotely, leading to Remote Code Execution (RCE).
          - The vulnerability is triggered by an improperly secured file upload mechanism, where attackers can bypass file type checks and upload files that can be executed by the server.
          - If successfully exploited, the attacker can execute arbitrary code on the server, potentially gaining full control over the system.
          - This flaw was fixed by improving file upload validation and restricting the types of files that can be uploaded.
        mitigation: |
          - Upgrade to the latest Adobe ColdFusion version that has patched this vulnerability.
          - Sanitize and validate all file uploads to ensure only trusted file types are accepted.
          - Configure proper file upload restrictions, ensuring that only specific file types are allowed.
          - Ensure that file upload directories are not executable and are appropriately secured to prevent code execution.
          - Monitor file uploads for suspicious activity and anomalous file types.
        impact: |
          - Remote Code Execution (RCE): Attackers can upload arbitrary files and execute arbitrary code on the server.
          - System Compromise: Successful exploitation allows attackers to gain full control over the ColdFusion server, run commands, and potentially escalate privileges.
          - Data Breach: Attackers may gain access to confidential data stored within ColdFusion or use the server for further attacks.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2018-15961
          - https://www.cve.org/CVERecord?id=CVE-2018-15961

    - ruleId: crs_93200070
      eventDetails:
        description: |
          Blueimp jQuery-File-Upload versions 9.22.0 and earlier are vulnerable to an Unauthenticated Arbitrary File Upload vulnerability.
          - The vulnerability occurs due to insufficient access control on the file upload endpoint, which allows unauthenticated users to upload arbitrary files to the server.
          - Attackers can exploit this vulnerability to upload malicious files, such as PHP scripts or web shells, which can then be executed remotely, leading to Remote Code Execution (RCE).
          - This issue arises because the jQuery-File-Upload library does not enforce proper authentication or authorization to restrict access to the file upload functionality, making it possible for unauthenticated users to upload files.
          - Successful exploitation allows attackers to upload files to the server and execute arbitrary code, potentially compromising the system.
          - The vulnerability was fixed by adding proper access controls to the file upload functionality and ensuring that only authenticated users can upload files.
        mitigation: |
          - Upgrade to the latest version of Blueimp jQuery-File-Upload that has patched this vulnerability.
          - Implement authentication and authorization checks to ensure that only authorized users can upload files.
          - Sanitize and validate all uploaded files to ensure that only trusted file types are accepted, and that uploaded files do not contain executable code.
          - Restrict file upload locations by ensuring that uploaded files are stored in directories that are not publicly accessible or executable.
          - Monitor file uploads for suspicious activity, including attempts to upload unauthorized or dangerous file types.
        impact: |
          - Remote Code Execution (RCE): Attackers can exploit the arbitrary file upload vulnerability to upload and execute malicious files on the server.
          - System Compromise: Successful exploitation gives attackers full control over the server, enabling them to run arbitrary commands, execute malware, or escalate privileges.
          - Data Breach: Attackers may gain unauthorized access to sensitive data or use the server as a launchpoint for further attacks.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2018-9206
          - https://www.cve.org/CVERecord?id=CVE-2018-9206

    - ruleId: crs_93200080
      eventDetails:
        description: |
          Oracle WebLogic Server versions 10.3.6.0.0 and 12.1.3.0.0 are vulnerable to an easily exploitable flaw in the Web Services component.
          - The vulnerability allows unauthenticated attackers with network access via HTTP to compromise Oracle WebLogic Server.
          - Exploitation of this vulnerability can result in Remote Code Execution (RCE), granting attackers full control over the server.
          - Attackers do not need authentication to exploit this vulnerability, making it a high-risk security issue.
        mitigation: |
          - Upgrade to the latest supported version of Oracle WebLogic Server.
          - Apply the Oracle security patch provided for CVE-2019-2725 to fix the flaw.
          - Restrict network access to Oracle WebLogic Server services, ensuring that only trusted users and networks can access the HTTP endpoints.
          - Enable authentication and access control for Web Services to prevent unauthenticated access to sensitive components.
          - Monitor for signs of exploitation or unusual traffic to WebLogic HTTP services.
        impact: |
          - Remote Code Execution (RCE): Attackers can take full control of the server, executing arbitrary commands or code.
          - System Compromise: Exploiting this vulnerability can lead to a complete takeover of the Oracle WebLogic Server.
          - Data Breach: Attackers can access and compromise sensitive data, or use the server for additional attacks.
          - The vulnerability impacts Confidentiality, Integrity, and Availability, as an attacker can perform arbitrary operations on the system and potentially cause system-wide compromise.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-2725
          - https://www.cve.org/CVERecord?id=CVE-2019-2725
          - https://www.oracle.com/security-alerts/cpujul2019.html

    - ruleId: crs_93200090
      eventDetails:
        description: |
          Zoho ManageEngine ServiceDesk Plus (SDP) versions before 10.0 build 10012 are vulnerable to an Arbitrary File Upload vulnerability.
          - The vulnerability exists in the login page customization feature, where an attacker can upload arbitrary files via the page customization functionality.
          - Attackers can exploit this flaw to upload malicious files (e.g., web shells or scripts) to the server, which may then be executed remotely.
          - Insufficient input validation and lack of restrictions on file uploads allows attackers to upload any file type, potentially leading to Remote Code Execution (RCE).
          - This flaw was identified as a critical security issue, as it allows unauthenticated attackers to gain control over the application server.
        mitigation: |
          - Upgrade to Zoho ManageEngine ServiceDesk Plus version 10.0 build 10012 or later, which fixes this vulnerability.
          - Restrict file uploads to only allow safe file types (such as images and documents) and deny executable file types.
          - Implement proper input validation for any uploaded files, ensuring that file names and contents are thoroughly checked.
          - Monitor file uploads and related logs for any suspicious activity related to malicious files.
          - Limit access to sensitive customization features to authenticated and authorized users only.
        impact: |
          - Remote Code Execution (RCE): Successful exploitation allows attackers to upload and execute arbitrary code on the server.
          - System Compromise: Full access to the affected server can be achieved, allowing attackers to execute arbitrary commands or access sensitive data.
          - Data Breach: Attackers may gain unauthorized access to and exfiltrate confidential information stored on the system.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-8394
          - https://www.cve.org/CVERecord?id=CVE-2019-8394

    - ruleId: crs_93200100
      eventDetails:
        description: |
          Atlassian Crowd and Crowd Data Center versions 2.1.0 through 3.4.3 are vulnerable to a Remote Code Execution (RCE) vulnerability due to the pdkinstall development plugin being incorrectly enabled in release builds.
          - The vulnerability allows attackers, who can send unauthenticated or authenticated requests to a Crowd instance, to exploit the incorrectly enabled plugin to install arbitrary plugins on the server.
          - Once an attacker installs a malicious plugin, they can execute arbitrary code on the target system, leading to a complete system compromise.
          - This flaw affects a wide range of Crowd and Crowd Data Center versions before the following fixed versions:
            - 3.0.5 for 3.0.x
            - 3.1.6 for 3.1.x
            - 3.2.8 for 3.2.x
            - 3.3.5 for 3.3.x
            - 3.4.4 for 3.4.x
        mitigation: |
          - Upgrade to the fixed versions of Crowd:
            - 3.0.5 or later for 3.0.x
            - 3.1.6 or later for 3.1.x
            - 3.2.8 or later for 3.2.x
            - 3.3.5 or later for 3.3.x
            - 3.4.4 or later for 3.4.x
          - Disable the pdkinstall development plugin in all environments where it is not required.
          - Restrict access to the Crowd instance by ensuring only authorized users can interact with sensitive features, especially those related to plugin management.
          - Monitor logs for any suspicious installation activity or unauthorized plugin installations.
          - Review existing plugins and ensure that only trusted plugins are installed and active in the Crowd environment.
        impact: |
          - Remote Code Execution (RCE): Attackers can install and execute arbitrary code by exploiting the vulnerability.
          - System Compromise: Successful exploitation allows attackers to gain full control over the affected Crowd or Crowd Data Center instance.
          - Data Breach: Attackers may gain unauthorized access to sensitive configurations or data managed by Crowd.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-11580
          - https://www.cve.org/CVERecord?id=CVE-2019-11580

    - ruleId: crs_93200110
      eventDetails:
        description: |
          Microsoft Exchange Server versions 2013, 2016, and 2019 are vulnerable to a Remote Code Execution (RCE) vulnerability (CVE-2021-26855), which allows unauthenticated attackers to send specially crafted requests to the server.
          - This vulnerability is part of the ProxyLogon exploit chain, which enables attackers to gain unauthorized access to Exchange Servers.
          - The flaw exists within the Autodiscover feature of Exchange, which processes web requests that can be manipulated by attackers to execute arbitrary code on the server.
          - Successful exploitation of this vulnerability could allow attackers to fully compromise the target Exchange Server, potentially leading to further data breaches and system takeover.
        mitigation: |
          - Apply the latest security updates provided by Microsoft to mitigate the vulnerability:
              - Exchange Server 2013: Apply CU23 or later.
              - Exchange Server 2016: Apply CU19 or later.
              - Exchange Server 2019: Apply CU9 or later.
          - Enable Multi-Factor Authentication (MFA) for privileged and admin accounts to reduce the risk of account compromise.
          - Disable or restrict public access to the Autodiscover feature if not necessary for your environment.
          - Monitor Exchange server logs for any suspicious activity, especially around HTTP requests and authentication attempts.
          - Restrict Exchange services to internal networks or trusted users where possible.
        impact: |
          - Remote Code Execution: An attacker can execute arbitrary code on an Exchange server, leading to system compromise.
          - Confidentiality Breach: Attackers may access sensitive information, including emails and configurations.
          - Integrity and Availability Impact: Attackers could modify or delete critical data, disrupt services, and potentially install persistent backdoors.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2021-26855
          - https://www.cve.org/CVERecord?id=CVE-2021-26855
          - https://us-cert.cisa.gov/ncas/alerts/aa21-062a
          - https://www.upguard.com/blog/cve-2021-26855

    - ruleId: crs_93200120
      eventDetails:
        description: |
          Drupal Core versions 8.5.x before 8.5.11 and 8.6.x before 8.6.10 are vulnerable to a Remote Code Execution (RCE) vulnerability (CVE-2019-6340).
          - Some field types in Drupal do not properly sanitize data from non-form sources, such as RESTful Web Services (REST), POST, or PATCH requests.
          - If a site has the RESTful Web Services (rest) module enabled and allows PATCH or POST requests, or if another web services module (like JSON:API or Services) is enabled, this vulnerability may be exploited.
          - Attackers can send specially crafted requests to the server, leading to the execution of arbitrary PHP code.
          - Successful exploitation could allow attackers to execute arbitrary code, potentially compromising the entire server.
          - The vulnerability is actively exploitable in some configurations.
        mitigation: |
          - Upgrade to the latest versions of Drupal Core:
              - Drupal 8.5.x: Update to 8.5.11 or later.
              - Drupal 8.6.x: Update to 8.6.10 or later.
          - Review and disable unnecessary web services modules, such as RESTful Web Services, JSON:API, or Services, if not needed.
          - Limit the types of requests (e.g., PATCH, POST) allowed from untrusted sources or external clients.
          - Sanitize all incoming data, especially when accepting non-form data or user input.
          - Monitor logs for any suspicious or unauthorized attempts to exploit this vulnerability.
        impact: |
          - Remote Code Execution (RCE): Attackers could execute arbitrary PHP code, leading to a full server compromise.
          - Data Breach: Sensitive site data may be exposed or stolen by attackers.
          - Service Disruption: Attackers could impact site availability or integrity.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2019-6340
          - https://www.cve.org/CVERecord?id=CVE-2019-6340
          - https://www.drupal.org/sa-core-2019-003
          - https://www.drupal.org/project/drupal/releases/8.5.11

    - ruleId: crs_9320070
      eventDetails:
        description: |
          ServiceNow is affected by two Remote Code Execution (RCE) vulnerabilities, CVE-2024-4879 and CVE-2024-5217, that allow attackers to execute arbitrary code on the affected systems. 
          - CVE-2024-4879: This vulnerability allows attackers to inject malicious scripts through unauthenticated endpoints, leading to remote code execution on the server.
          - CVE-2024-5217: This vulnerability allows attackers to exploit improper input validation in ServiceNow's processing of user input, potentially leading to RCE.
          - Exploiting these vulnerabilities allows attackers to gain control over the affected instance, read sensitive data, and execute arbitrary commands.
          - The issues are fixed in the latest security updates from ServiceNow, which address input validation and endpoint security.
        mitigation: |
          - Apply the latest security patches from ServiceNow to fix CVE-2024-4879 and CVE-2024-5217.
          - Sanitize and validate all user inputs to prevent malicious scripts and code execution.
          - Restrict access to sensitive endpoints and monitor for unusual activity.
          - Review and audit configurations to ensure minimal exposure to untrusted input.
        impact: |
          - Remote Code Execution (RCE): Attackers can execute arbitrary code, potentially compromising the system.
          - Data Exposure: Sensitive data may be accessed or exfiltrated.
          - System Compromise: Exploitation can lead to full control of the affected instance, including further attacks on the internal network.
        references: |
          - https://nvd.nist.gov/vuln/detail/CVE-2024-4879
          - https://nvd.nist.gov/vuln/detail/CVE-2024-5217
          - https://www.cve.org/CVERecord?id=CVE-2024-4879
          - https://www.cve.org/CVERecord?id=CVE-2024-5217

    - ruleId: crs_932170
      eventDetails:
        description: |
          A pattern indicative of Shell Shock RCE attack is detected.
          While defining an environment variable for a function definition, BASH would run commands following the function definition as BASH supports this functionality.
          This allowed the attackers to execute unexpected, dangerous commands directly on the operating system. This weakness can lead to a vulnerability in environments in which the attacker does not have direct access to the operating system, such as in web applications. Alternatively, if the weakness occurs in a privileged program, it could allow the attacker to specify commands that normally would not be accessible, or to call alternate commands with privileges that the attacker does not have. The problem is exacerbated if the compromised process does not follow the principle of least privilege, because the attacker-controlled commands may run with special system privileges that increases the amount of damage.
        mitigation: |
          - Update the current version of BASH running for the application.
          - Do not use user input before sanitization for environment variable definitions.
        impact: |
          Attackers could execute unauthorized commands, which could then be used to
          - fully compromise the host and the application.
          - read and modify files on OS for which the attacker does not have permissions to access directly.
          - compromise other parts of hosting infrastructure exploiting trust relationship.
          Since the targeted application is directly executing the commands instead of the attacker, any malicious activities may appear to come from the application or the application's owner.
        references: |
          - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
          - Common Weakness Enumeration (CWE) - CWE-78:Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection') - https://cwe.mitre.org/data/definitions/78.html
          - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-248:Command Injection - https://capec.mitre.org/data/definitions/248.html
          - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190/
          - Web Application Security Consortium - WASC-31:OS Commanding - http://projects.webappsec.org/w/page/13246950/OS%20Commanding
