- ruleId: crs_103
  ruleName: Basic Authentication Violation
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_AUTHENTICATION_AND_TOKEN_VIOLATIONS
  subRuleInfos:
  - ruleId: crs_1030100
    eventDetails:
      description: |
        HTTP basic authentication is simple, sending a username and password with each request. However, if appropriate security protocols such as TLS session encryption are not used for all communication, the username and password information can be sent in the clear, making it easy for attackers to steal the credentials.
      mitigation: |
        Make sure that HTTP authentication is transmitted over HTTPS.
      impact: |
        - An attacker eavesdropping the traffic might obtain logins and passwords of valid users.
        - It may be vulnerable to account brute-forcing or may encourage Man-in-The-Middle (MiTM) attacks.
        - Because the included credentials contain so little context, they can easily be misused in attacks such as cross-site request forgeries (CSRF)
      references: |
        - https://owasp.org/www-project-top-ten/2017/A3_2017-Sensitive_Data_Exposure.html
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
        - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/dist/owasp-api-security-top-10.pdf
        - https://capec.mitre.org/data/definitions/102.html
        - https://cwe.mitre.org/data/definitions/522.html
        - https://www.first.org/cvss/calculator/3.0#CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:L/I:N/A:N
        - http://projects.webappsec.org/Insufficient%20Transport%20Layer%20Protection
        - https://attack.mitre.org/techniques/T1190/

- ruleId: crs_104
  ruleName: GraphQL Attacks
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_GRAPHQL_ATTACKS
  subRuleInfos:
  - ruleId: crs_1040100
    eventDetails:
      description: |
        GraphQL introspection allows to query all information related to the supported schema and queries on a GraphQL server instance. By leveraging this misconfiguration, an attacker could retrieve sensitive information or conduct further attacks on the discovered endpoints
      mitigation: |
        Restrict GraphQL introspection feature to authorized users only, or disable it.
      impact: |
        - Attackers could view sensitive information about the service and the infrastructure on which the service is being run on, using which malicious actors can target the system with different attacks.
      references: |
        - OWASP API Top 10 - 2019 - API7:Security Misconfiguration - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa7-security-misconfiguration.md
        - OWASP Top 10 - 2021 – A05:Security Misconfiguration - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
        - OWASP Top 10 - 2017 - A6:Security Misconfiguration - https://owasp.org/www-project-top-ten/2017/A6_2017-Security_Misconfiguration
        - Common Weakness Enumeration (CWE) CWE-16: Configuration : https://cwe.mitre.org/data/definitions/16
        - SANS TOP 25 - http://cwe.mitre.org/top25/
        - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-116:Excavation - https://capec.mitre.org/data/definitions/116.html
        - MITRE Attack - T1213:Data from Information Repositories - https://attack.mitre.org/techniques/T1213/
        - Web Application Security Consortium - WASC-15:Application Misconfiguration - http://projects.webappsec.org/w/page/13246914/Application%20Misconfiguration