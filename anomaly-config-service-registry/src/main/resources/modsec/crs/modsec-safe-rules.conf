# TRACEABLE-REQUEST-921-PROTOCOL-ATTACK.conf

SecRule ARGS_NAMES|ARGS|REQUEST_BODY|XML:/* "@rx (?:get|post|head|options|connect|put|delete|trace|track|patch|propfind|propatch|mkcol|copy|move|lock|unlock)\s+(?:/|\w)[^\s]*(?:\s+http/\d|[\r\n])" \
    "id:9210110,\
    phase:2,\
    block,\
    capture,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    msg:'HTTP Request Smuggling Attack (Request Splitting)',\
    logdata:'Matched Data: %{TX.0} found within %{MATCHED_VARS_NAMES}: %{MATCHED_VARS}',\
    tag:'attack-protocol',\
    severity:'CRITICAL',\
    setvar:'tx.http_violation_score=+%{tx.critical_anomaly_score}',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_HEADERS_NAMES|REQUEST_HEADERS "@rx (content-length|transfer-encoding)" \
    "id:9210114,\
    phase:2,\
    pass,\
    nolog,\
    t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,\
    tag:'attack-protocol',\
    severity:'CRITICAL',\
    setvar:'TX.clte=%{TX.clte} %{MATCHED_VAR}',\
    setvar:'TX.clte_count=+1'"

SecRule TX:/clte_count/ "@gt 1" \
    "id:9210115,\
    phase:2,\
    block,\
    msg:'HTTP Request Smuggling Attack (Content-Length/Transfer-Encoding Confusion)',\
    logdata:'Matched Data:Content-Length/Transfer-Encoding Confusion:%{TX.clte}',\
    tag:'attack-protocol',\
    severity:'CRITICAL',\
    chain"
    SecRule MATCHED_VARS_NAMES "@rx TX:clte_count" \
        "block,\
        setvar:'tx.http_violation_score=+%{tx.critical_anomaly_score}',\
        setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_HEADERS:Content-Length "@rx ," \
    "id:9210120,\
    phase:2,\
    block,\
    msg:'HTTP Request Smuggling Attack (Content-Length Confusion)',\
    logdata:'Matched Data:Multiple Content-Length values found',\
    tag:'attack-protocol',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecRule REQUEST_FILENAME "@rx \x25" \
    "id:9210300,\
    phase:2,\
    block,\
    t:none,\
    msg:'URL Encoding Abuse Attack Attempt',\
    logdata:'%{MATCHED_VAR}',\
    tag:'attack-protocol',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_URI "@validateUrlEncoding" \
        "setvar:'tx.anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

SecRule REQUEST_FILENAME "@validateByteRange 1-255" \
    "id:9210305,\
    phase:2,\
    block,\
    t:none,t:urlDecodeUni,\
    multimatch,\
    msg:'Null Byte Injection',\
    logdata:'%{MATCHED_VAR}',\
    tag:'attack-protocol',\
    severity:'CRITICAL',\
    setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

SecMarker "TRACEABLE-END-REQUEST-921-PROTOCOL-ATTACK"

