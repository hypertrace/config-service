    references: |
      - CWE-405: Asymmetric Resource Consumption (Resource Exhaustion) - https://cwe.mitre.org/data/definitions/405.html
      - OWASP Top 10 2021: A3 - Injection - https://owasp.org/Top10/A03_2021-Injection/

