- ruleId: integer
  ruleName: Value Out of Range
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PARAMETER_ANOMALIES
  eventLabels: 
    CWE: 190
    OWASP_API: API8
  eventDetails:
    description: |
      Traceable identified a Value Out of range attack, where the application tries to assign an integer value outside than range which the memory assigned to the variable can hold.
    mitigation: |
      Enforce range limits for custom user inputs of a request. Use scanners regularly to look for such attack vulnerabilities.
    impact: |
      Writing outside the ranges can corrupt data, crash the program, or cause the execution of malicious code.
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - Common Weakness Enumeration (CWE) - CWE-190:Integer Overflow or Wraparound - https://cwe.mitre.org/data/definitions/190.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-92:Forced Integer Overflow - https://capec.mitre.org/data/definitions/92.html
      - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190
      - Web Application Security Consortium - WASC-03:Integer Overflows - http://projects.webappsec.org/w/page/13246946/Integer%20Overflows
    
