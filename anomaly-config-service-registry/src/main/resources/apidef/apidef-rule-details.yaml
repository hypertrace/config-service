- ruleId: unknownParam
  ruleName: Mass Assignment
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PARAMETER_ANOMALIES
  eventLabels:
    CWE: 472
    OWASP_API: API6
    MITRE_TACTIC: TA0040
    MITRE_TECHNIQUE: T1565.001
  eventDetails:
    description: |
      A Mass Assignment attack is flagged when parameters that are not meant to be supported are deployed.
      Some examples are:
      - An application uses ORM to create a user object, the ORM framework will accept all database fields, even sensitive fields like role.
      - Read-only fields are not filtered out when creating an "article" object.
      - A user can disable MFA skipping security controls by setting the "skipMfa" field to true.
    mitigation: |
      The best way to protect your code against Mass Assignment is to make the API schemas and deployed apps consistent. The application should only accept parameters declared in the API schema.
      While using ORM frameworks, always use lists of permitted parameters. Don't accepting raw inputs.
    impact: |
      It depends on the exposed parameters.
      - A parameter like role might have a critical impact in your application by allowing privilege escalation.
      - A parameter like skipMfa might have a high impact in your application by allowing MFA bypass.
      - A parameter like country_code might have a medium impact in your application by allowing country-block bypass.
    references: |
      - OWASP API Top 10 - 2019 - A6 Mass Assignment - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa6-mass-assignment.md
      - CWE - SANS - TOP 25 - http://cwe.mitre.org/top25/
      - Common Weakness Enumeration - Improperly Controlled Modification of Dynamically-Determined Object Attributes - https://cwe.mitre.org/data/definitions/915.html

- ruleId: enum
  ruleName: Invalid Enumerations
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PARAMETER_ANOMALIES
  eventLabels:
    CWE: 183
    OWASP_API_2023: API8
    OWASP_API: API7
    MITRE_TACTIC: TA0043
    MITRE_TECHNIQUE: T1595.002
  eventDetails:
    description: "The value of an enumeration in the request does not match the expected values. This could indicate a malformed request or an attempt to exploit a type-related vulnerability."
    mitigation: "Implement input validation in your API to ensure all enumeration values are within the expected range. Consider using a schema validation library to automate this process."
    impact: "If not mitigated, this could lead to unexpected behavior or errors in your application, and potentially security vulnerabilities."
    references: |
      - CWE-183: Permissive List of Allowed Inputs - https://cwe.mitre.org/data/definitions/183.html
      - OWASP API Security Top 10 - 2023 - API8:2023 - Security Misconfiguration - https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/

- ruleId: integer
  ruleName: Value Out of Range
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PARAMETER_ANOMALIES
  eventLabels:
    CWE: 190
    OWASP_API: API8
  eventDetails:
    description: |
      A Value Out of Range attack is flagged when the attacker tries to assign an integer value outside than range which the memory assigned to the variable can hold.
    mitigation: |
      Enforce range limits for custom user inputs of a request. Use scanners regularly to look for such attack vulnerabilities.
    impact: |
      Writing outside the ranges can corrupt data, crash the program, or cause the execution of malicious code.
    references: |
      - OWASP API Top 10 - 2019 - API8:Injection - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa8-injection.md
      - Common Weakness Enumeration (CWE) - CWE-190:Integer Overflow or Wraparound - https://cwe.mitre.org/data/definitions/190.html
      - Common Attack Pattern Enumerations and Classifications (CAPEC) - CAPEC-92:Forced Integer Overflow - https://capec.mitre.org/data/definitions/92.html
      - MITRE Attack - T1190:Exploit Public-Facing Application - https://attack.mitre.org/techniques/T1190
      - Web Application Security Consortium - WASC-03:Integer Overflows - http://projects.webappsec.org/w/page/13246946/Integer%20Overflows

