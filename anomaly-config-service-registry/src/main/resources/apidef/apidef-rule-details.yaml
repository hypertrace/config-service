- ruleId: unknownParam
  ruleName: Mass Assignment
  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PARAMETER_ANOMALIES
  eventLabels: 
    CWE: 472
    OWASP_API: API6
  eventDetails:
    description: |
      Traceable identified a Mass Assignment attack.
      It occur when parameters that are not meant to be supported are deployed. Some examples are:
      - An application uses ORM to create a user object, the ORM framework will accept all database fields, even sensitive fields like role.
      - Read-only fields are not filtered out when creating an "article" object.
      - A user can disable MFA skipping security controls by setting the "skipMfa" field to true.
    mitigation: |
      The best way to protect your code against Mass Assignment is to make the API schemas and deployed apps consistent. The application should only accept parameters declared in the API schema.
      While using ORM frameworks, always use lists of permitted parameters. Don't accepting raw inputs.
    impact: |
      It depends on the exposed parameters.
      - A parameter like role might have a critical impact in your application by allowing privilege escalation.
      - A parameter like skipMfa might have a high impact in your application by allowing MFA bypass.
      - A parameter like country_code might have a medium impact in your application by allowing country-block bypass.
    references: |
      - OWASP API Top 10 - 2019 - A6 Mass Assignment - https://github.com/OWASP/API-Security/blob/master/editions/2019/en/0xa6-mass-assignment.md
      - CWE - SANS - TOP 25 - http://cwe.mitre.org/top25/
      - Common Weakness Enumeration - Improperly Controlled Modification of Dynamically-Determined Object Attributes - https://cwe.mitre.org/data/definitions/915.html
    
