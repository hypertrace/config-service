  anomalyRuleCategory: ANOMALY_RULE_CATEGORY_PARAMETER_ANOMALIES
  eventLabels:
    CWE: 405
    OWASP_2021: A3
  eventDetails:
    description: "The size of the content in a request or response significantly increases due to nested references, which may indicate an attempt to overload the system (a type of Denial of Service attack)."
    mitigation: "Implement rate limiting and data size checks in your API. Disable reference expansion by default and limit depth of request structures being processed. Monitor the size of requests and responses and set reasonable limits."
