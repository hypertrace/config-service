syntax = "proto3";

// buf:lint:ignore PACKAGE_VERSION_SUFFIX
package ai.traceable.anomaly.config.service.v1.trainer;
import "ai/traceable/anomaly/config/service/v1/anomaly_config.proto";

option java_multiple_files = true;

enum TrainingConfigType {
  TRAINING_CONFIG_TYPE_UNSPECIFIED = 0;
  TRAINING_CONFIG_TYPE_METADATA = 1;
  TRAINING_CONFIG_TYPE_VULNERABILITY = 2;
  TRAINING_CONFIG_TYPE_SESSION = 3;
  TRAINING_CONFIG_TYPE_API_NAMING = 4;
  TRAINING_CONFIG_TYPE_SENSITIVE_DATA = 5;
  TRAINING_CONFIG_TYPE_LOCAL_TRAINING = 6;
  TRAINING_CONFIG_TYPE_VOLUMETRIC_TRAINING = 7;
  TRAINING_CONFIG_TYPE_DEMO_APPLICATION_CONFIG = 8;
}

message GetTrainingConfigsFilter {
  repeated TrainingConfigType training_config_types = 1;
}

enum DeleteAnomalyConfigOption {
  DELETE_ANOMALY_CONFIG_OPTION_UNSPECIFIED = 0;
  DELETE_ANOMALY_CONFIG_OPTION_WHOLE_TRAINING_CONFIG = 1;
}

message GetScopedTrainingConfigRequest {
  AnomalyConfigScope config_scope = 1;
  GetTrainingConfigsFilter filter = 2;
}

message GetScopedTrainingConfigResponse {
  ScopedTrainingConfig scoped_training_config = 1;
}

message GetAllScopedTrainingConfigsRequest {
  GetTrainingConfigsFilter filter = 1;
}

message GetAllScopedTrainingConfigsResponse {
  repeated ScopedTrainingConfig scoped_training_configs = 1;
}

message GetUnresolvedScopedTrainingConfigRequest {
  AnomalyConfigScope config_scope = 1;
  GetTrainingConfigsFilter filter = 2;
}

message GetUnresolvedScopedTrainingConfigResponse {
  ScopedTrainingConfig scoped_training_config = 1;
}

message GetAllUnresolvedScopedTrainingConfigRequest {
  GetTrainingConfigsFilter filter = 1;
}

message GetAllUnresolvedScopedTrainingConfigResponse {
  repeated ScopedTrainingConfig scoped_training_configs = 1;
}

message ScopedTrainingConfig {
  AnomalyConfigScope config_scope = 1;
  repeated TrainingConfig training_configs = 2;
}

message UpdateScopedTrainingConfigRequest {
  ScopedTrainingConfig scoped_training_config = 1;
}

message UpdateScopedTrainingConfigResponse {
  ScopedTrainingConfig scoped_training_config = 1;
}

message DeleteScopedTrainingConfigRequest {
  DeleteAnomalyConfigOption delete_anomaly_config_option = 1;
  ScopedTrainingConfig scoped_training_config = 2;
}

message DeleteScopedTrainingConfigResponse {
  ScopedTrainingConfig deleted_scoped_training_config = 1;
}

message TrainingConfig {
  optional bool disabled = 1;
  oneof training_config {
    MetadataTrainingConfig metadata_training_config = 2;
    VulnerabilityTrainingConfig vulnerability_training_config = 3;
    SessionTrainingConfig session_training_config = 4;
    ApiNamingTrainingConfig api_naming_training_config = 5;
    SensitiveDataTrainingConfig sensitive_data_training_config = 6;
    LocalTrainingConfig local_training_config = 7;
    VolumetricTrainingConfig volumetric_training_config = 8;
    DemoApplicationConfig demo_application_config = 9;
    DomainDiscoveryConfig domain_discovery_config = 10;
  }
}

message DomainDiscoveryConfig {
  oneof config {
    DomainFilterConfig domain_filter_config = 1;
  }
}

message DemoApplicationConfig {
  oneof config {
    DemoApplicationDefinition demo_application_definition = 1;
    DemoApplicationAutomaticDetectionConfig demo_application_automatic_detection_config = 2;
  }
}

message DemoApplicationAutomaticDetectionConfig {
  bool automatic_detection_disabled = 1 [deprecated = true];
  AutomaticDetectionStatus automatic_detection_status = 2;
}

enum AutomaticDetectionStatus {
  AUTOMATIC_DETECTION_STATUS_UNSPECIFIED = 0;
  AUTOMATIC_DETECTION_STATUS_ENABLED = 1;
  AUTOMATIC_DETECTION_STATUS_DISABLED = 2;
}

message DemoApplicationDefinition {
  repeated DemoApplicationType demo_application_types = 1;
}

message VolumetricTrainingConfig {
  oneof config {
    ApiCallSpikeTrainingConfig api_call_spike_config = 1;
  }
}

message ApiCallSpikeTrainingConfig {
  ApiCallSpikeTuningConfigList api_call_spike_tuning_config_list = 1;
}

message ApiCallSpikeTuningConfigList {
  repeated ApiCallSpikeTuningConfig api_call_spike_tuning_configs = 1;
}

message ApiCallSpikeTuningConfig {
  // the below training config would be applied on the endpoints identified by this config
  TrainingScopeConfig training_scope_config = 1;
  // training specific threshold; it specifies that we should have seen this
  // atleast 'x' spans for the endpoint within the training window atleast once
  int64 endpoint_span_count_threshold = 2;
  // training specific threshold (between 0-1); it specifies that the PX
  // value (percentile value like P95) for the span count within the training
  // data samples should be greater than 0. For example, if the value = 0.25,
  // that means the P25(training data samples) > 0 or we should have atleast
  // 75% legitimate training data points.
  float endpoint_span_count_percentile_threshold = 3;
  // training specific threshold (between 0-1); it specifies what the
  // maximum permissible time duration between the first and last time sorted
  // data points should be as a fraction of the training data window. If the
  // duration between first and last seen data points > time_fraction_training_window_threshold * training window,
  // then only we consider the API data for training. For example, if the
  // value = 0.5 and the training duration is 14 days. 0.5 * 14 = 7 days should
  // be the minimum duration between first and last seen data points for the API
  // to be considered for training.
  float time_fraction_training_window_threshold = 4;
}

message TrainingScopeConfig {
  // there is an implicit OR between the below fields
  // the priority(in case of conflicting scopes) is: endpoint_ids > url_regexes > endpoint_labels
  StringList endpoint_ids = 1;
  StringList url_regexes = 2;
  StringList endpoint_labels = 3;
}

message LocalTrainingConfig {
  oneof config {
    ApiNamingConfig api_naming_config = 1;
  }
}

message ApiNamingConfig {}

message ApiNamingTrainingConfig {
  oneof config {
    UrlFilterConfig url_filter_config = 1 [deprecated = true];
    TrieModelTrainingConfig trie_model_training_config = 2;
    CustomRulesListConfig custom_rules_list_config = 3 [deprecated = true];
    RejectFilterConfig reject_filter_config = 4;
  }
}

message MetadataTrainingConfig {
  oneof config {
    TypeTrainingConfig type = 1;
    PiiTrainingConfig pii = 2;
    EnumerationsTrainingConfig enum = 3;
    DigitLengthTrainingConfig digit_length = 4;
    SpecialCharactersTrainingConfig special_chars = 5;
    HttpStatusCodeTrainingConfig http_status = 6;
    DeviceTrainingConfig device = 7;
    ContentSizeTrainingConfig content_size = 8;
    AccessorsTrainingConfig accessors = 9;
    SsrfTrainingConfig ssrf = 10;
    ThresholdsFamilyTrainingConfig thresholds_family = 11;
    DataClassificationTrainingConfig data_classification = 12;
    ContentTypeTrainingConfig content_type = 13;
    CountTrainingConfig count = 14;
    IsExternalApiTrainingConfig is_external_api = 15;
    MessagePartStatsTrainingConfig message_part_stats = 16;
    NoSqlTrainingConfig no_sql = 17;
    RailsOpenTrainingConfig rails_open = 18;
    StartTimeTrainingConfig start_time = 19;
    UserAgentTrainingConfig user_agent = 20;
    UserRoleTrainingConfig user_role = 21;
    UserScopeTrainingConfig user_scope = 30;
    HtmlTagsTrainingConfig html_tags = 22;
    HtmlTagAttributesTrainingConfig html_tag_attributes = 23;
    JwtParamsTrainingConfig jwt_params = 24;
    ParamExclusionsConfig param_exclusions = 25;
    NumericSignTrainingConfig numeric_sign = 26;
    StructuredContentDepthTrainingConfig structured_content_depth = 27;
    IsEncryptedApiTrainingConfig is_encrypted_api = 28;
    CorrelationAttributeTrainingConfig correlation_attribute = 29;
    NonAsciiUnicodeCharactersTrainingConfig non_ascii_unicode_characters = 31;
  }
}

message VulnerabilityTrainingConfig {
  AutoResolutionConfig auto_resolution_config = 12;

  oneof config {
    ParamContainsSensitiveDataTrainingConfig param_contains_sensitive_data = 1;
    LackOfEncryptionTrainingConfig lack_of_encryption = 3;
    ApiParamContainsUrlTrainingConfig api_param_contains_url = 4;
    ContentTypeOptionsSecurityHeaderTrainingConfig content_type_options_security_header = 5;
    HstsSecurityHeaderTrainingConfig hsts_security_header = 6;
    JavaSerializedObjectTrainingConfig java_serialized_object = 7;
    ServiceUsesBasicAuthTrainingConfig service_uses_basic_auth = 8;
    CspSecurityHeaderTrainingConfig csp_security_header = 9;
    DirectoryListingTrainingConfig directory_listing = 10;
    EnumerableParamTrainingConfig enumerable_param = 11;
    DeprecatedApiRouteTrainingConfig deprecated_api_route = 13;
    MultipleApiVersionsTrainingConfig multiple_api_versions = 14;
    ExcessDataExposureTrainingConfig excess_data_exposure = 15;
    OpenRedirectTrainingConfig open_redirect = 16;
    MassParameterAssignmentConfig mass_parameter_assignment = 17;
    SqlInjectionErrorBasedTrainingConfig sql_injection_error_based = 18;
    JwtExpiryIssueAtTrainingConfig jwt_expiry_and_issue_at_not_set = 20;
    JwtAlgoWeaknessTrainingConfig jwt_algo_weakness = 19;
    MissingGatewayPoliciesTrainingConfig missing_gateway_policies = 21;
    SensitiveDataInErrorMessageTrainingConfig sensitive_data_in_error_message = 22;
    LackOfEncryptionExternalApiTrainingConfig lack_of_encryption_external_api = 23;
  }
}

message SessionTrainingConfig {
  oneof config {
    ObjectBolaTrainingConfig object_bola = 1;
    UserIdBolaTrainingConfig user_id_bola = 2;
  }
}

message SensitiveDataTrainingConfig {
  oneof config {
    PiiSensitiveDataTrainingConfig pii_sensitive_data = 1;
  }
}

message TypeTrainingConfig {
  optional int32 max_allowed_child_params = 1;
}

message PiiTrainingConfig {
  optional int32 dlp_api_request_batch_size = 1;
  optional int32 max_dlp_api_requests_per_sec = 2;
  optional string param_age_threshold_duration = 3;
  optional string low_age_frequency_duration = 4;
  optional string high_age_frequency_duration = 5;
}

message DataClassificationTrainingConfig {}

message SensitiveDataInErrorMessageTrainingConfig {}

message LackOfEncryptionExternalApiTrainingConfig {}

message EnumerationsTrainingConfig {
  optional int32 max_enumerations = 1;
  optional int32 enum_value_max_length = 2;
  optional int32 min_occurrence_count = 3;
  // Takes value between 0-100
  optional double min_enum_occurrence_percent = 4;
}

message ThresholdsFamilyTrainingConfig {
  optional int64 learning_time_millis = 1;
  optional int32 required_ips_for_diverse_set = 2;
  optional int32 required_user_ids_for_diverse_set = 3;
  IntList bad_status_ips = 4;
  IntList bad_status_user_ids = 5;
  optional int32 required_percent_for_authenticated = 6;
  optional int32 thresholds_family_relearn_version = 7;
}

message DigitLengthTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message NumericSignTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message StructuredContentDepthTrainingConfig {
}

message SpecialCharactersTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message HttpStatusCodeTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message DeviceTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message ContentSizeTrainingConfig {
  optional int32 request_range_size = 1;
  optional int32 response_range_size = 2;
}

message AccessorsTrainingConfig {
  ThresholdFamilyConfig api_threshold_family_config = 1;
  ThresholdFamilyConfig query_param_threshold_family_config = 2;
  ThresholdFamilyConfig request_body_param_threshold_family_config = 3;
  ThresholdFamilyConfig param_type_threshold_family_config = 4;
  ThresholdFamilyConfig request_header_threshold_family_config = 5;
  ThresholdFamilyConfig request_cookie_threshold_family_config = 6;
  ApiAccessorOverrideConfig api_accessor_override_config = 7;
}

message SsrfTrainingConfig {
  ThresholdFamilyConfig protocol_threshold_family_config = 1;
  optional int32 max_allowed_hosts = 2;
}

message HtmlTagsTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message HtmlTagAttributesTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message ContentTypeTrainingConfig {}

message CountTrainingConfig {}

message IsExternalApiTrainingConfig {}

message IsEncryptedApiTrainingConfig {}

message CorrelationAttributeTrainingConfig {}

message MessagePartStatsTrainingConfig {}

message NoSqlTrainingConfig {}

message RailsOpenTrainingConfig {}

message StartTimeTrainingConfig {}

message UserAgentTrainingConfig {}

message NonAsciiUnicodeCharactersTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
}

message UserRoleTrainingConfig {
  MinOccurrenceConfig min_occurrence_config = 1;
}

message UserScopeTrainingConfig {
  MinOccurrenceConfig min_occurrence_config = 2;
}

message JwtExpiryIssueAtTrainingConfig {};

message JwtAlgoWeaknessTrainingConfig {};

message MassParameterAssignmentConfig {
  MinOccurrenceConfig threshold_parameter_config = 1;
}

message JwtParamsTrainingConfig {
  ThresholdFamilyConfig threshold_family_config = 1;
  StringList include_param_regexes = 2;
}

message MissingGatewayPoliciesTrainingConfig {
  repeated GatewayPolicies recommended_policies = 1;
}

message GatewayPolicies {
  GatewayType gateway_type = 1;
  repeated GatewayPolicy policies = 2;
}

message GatewayPolicy {
  string type = 1;
}

enum GatewayType {
  GATEWAY_TYPE_UNSPECIFIED = 0;
  GATEWAY_TYPE_MULESOFT = 1;
  GATEWAY_TYPE_APIGEE = 2;
}

message ParamExclusionsConfig {
  repeated ParamKeyExclusionConfig param_key_exclusion_configs = 1;
  repeated ParamLevelExclusionConfig param_level_exclusion_configs = 2;
}

message ParamKeyExclusionConfig {
  oneof config {
    ParamKeyConfig query_param_key_config = 1;
    ParamKeyConfig http_request_header_key_config = 2;
    ParamKeyConfig http_response_header_key_config = 3;
    ParamKeyConfig http_request_body_key_config = 4;
    ParamKeyConfig http_response_body_key_config = 5;
    ParamKeyConfig http_request_cookie_key_config = 6;
    ParamKeyConfig http_response_cookie_key_config = 7;
  }
}

message ParamLevelExclusionConfig {
  oneof config {
    ParamLevelConfig http_request_body_level_config = 1;
    ParamLevelConfig http_response_body_level_config = 2;
    ParamLevelConfig rpc_request_body_level_config = 3;
    ParamLevelConfig rpc_response_body_level_config = 4;
  }
}

message ParamKeyConfig {
  oneof config {
    LengthConfig length_config = 1;
    FilterConfig filter_config = 2;
    GibberishConfig gibberish_config = 3;
    FilterConfig exception_config = 4;
  }
  ParamKeyAction action = 5;
}

message LengthConfig {
  bool disabled = 1;
  int32 max_length = 2;
}

message FilterConfig {
  bool disabled = 1;
  Operator operator = 2;
  repeated string values = 3;
}

enum Operator {
  OPERATOR_UNSPECIFIED = 0;
  OPERATOR_CONTAINS = 1;
  OPERATOR_MATCHES_REGEX = 2;
}

enum ParamKeyAction {
  PARAM_KEY_ACTION_UNSPECIFIED = 0;
  PARAM_KEY_ACTION_WILDCARD = 1;
  PARAM_KEY_ACTION_REMOVE = 2;
}

message ParamLevelConfig {
  bool disabled = 1;
  int32 max_level = 2;
}

message ParamContainsSensitiveDataTrainingConfig {
  MinOccurrenceConfig query_param_pii_type_config = 1;
  MinOccurrenceConfig persistent_cookie_pii_type_config = 2;
}

message LackOfEncryptionTrainingConfig {
  MinOccurrenceConfig https_calls_config = 1;
}

message ExcessDataExposureTrainingConfig {
  MinDataTypeOccurrenceConfig data_occurrence_config = 1;
}

message ApiEncryptionTrainingConfig {
  MinOccurrenceConfig https_calls_config = 1;
}

message ApiParamContainsUrlTrainingConfig {}

message ContentTypeOptionsSecurityHeaderTrainingConfig {}

message HstsSecurityHeaderTrainingConfig {}

message CspSecurityHeaderTrainingConfig {}

message DirectoryListingTrainingConfig {}

message JavaSerializedObjectTrainingConfig {}

message MultipleApiVersionsTrainingConfig {
  optional int64 max_allowed_api_versions_count = 1;
}

message ServiceUsesBasicAuthTrainingConfig {}

message DeprecatedApiRouteTrainingConfig {}

message OpenRedirectTrainingConfig {}

message SqlInjectionErrorBasedTrainingConfig {}

message EnumerableParamTrainingConfig {
  optional string include_param_regex = 1;
  optional int32 max_allowed_bucket_occurrence_percent = 2;
  optional int64 min_required_total_occurrence_count = 3;
}

message ObjectBolaTrainingConfig {
  ParamSusceptibilityConfig param_susceptibility_config = 1;
  ThresholdCountConfig required_count_config = 2;
  StringList prefixes_not_allowed_in_response_param_key = 3;
  StringList suffixes_not_allowed_in_response_param_key = 4;
  optional bool enabled_on_same_api = 5;
  MultiValuedStringParamRulesList multi_valued_string_param_rules = 6;
}

message UserIdBolaTrainingConfig {
  UserIdSource user_id_source = 1 [deprecated = true];
  ThresholdCountConfig required_count_config = 2;
  UserIdDataList user_id_data_list = 3;
}

message PiiSensitiveDataTrainingConfig {}

message ThresholdCountConfig {
  optional int32 required_calls_count = 1;
  optional int32 required_unique_user_ids_count = 2;
  optional int32 required_unique_ips_count = 3;
}

message ApiAccessorOverrideConfig {
  oneof config {
    int32 required_calls_count = 1;
  }
}

message ThresholdFamilyConfig {
  ThresholdCountConfig diverse_ip_diverse_user_family_config = 1;
  ThresholdCountConfig diverse_ip_limited_user_family_config = 2;
  ThresholdCountConfig limited_ip_family_config = 3;
  ThresholdCountConfig limited_ip_diverse_user_family_config = 4;
}

message MinOccurrenceConfig {
  optional int32 min_total_occurrences = 1;
  optional int32 min_percent = 2;
}

message MinDataTypeOccurrenceConfig {
  optional int32 min_total_occurrences = 1;
  optional int32 min_percent = 2 [deprecated = true];
  optional int32 min_data_type_occurrences = 3;
}

message AutoResolutionConfig {
  bool disabled = 1;
}

enum UserIdSource {
  USER_ID_SOURCE_UNSPECIFIED = 0;
  USER_ID_SOURCE_ANY = 1;
  USER_ID_SOURCE_JWT = 2;
}

message ParamSusceptibilityConfig {
  StringList prefixes_not_allowed_in_request_param_key = 1;
  StringList suffixes_not_allowed_in_request_param_key = 2;
  optional string request_param_value_regex = 3;
  StringList susceptible_request_param_keys = 4;
  StringList request_param_values_not_allowed = 5;
  StringList regexes_not_allowed_in_request_param_key = 6;
}

message RejectFilterConfig {
  UrlPathFilterConfig url_path_filter_config = 1;
  SegmentFilterConfig segment_filter_config = 2;
  UserAgentFilterConfig user_agent_filter_config = 3;
  StatusCodeFilterConfig status_code_filter_config = 4;
  SpanAttributeFilterConfig span_attribute_filter_config = 5 [deprecated = true];
  SpanAttributeFilterConfigList span_attribute_filter_config_list = 6;
  ModsecFilterConfig modsec_filter_config = 7;
}

message DomainFilterConfig {
  IntRangeFilterConfig allowed_domain_length_range = 1;
  RegexFilterConfigList regex_rejection_config_list = 2;
  IpAddressFilterConfigList ip_address_rejection_config_list = 3;
  SpanAttributeFilterConfigList span_attribute_rejection_config_list = 4;
}

message RegexFilterConfigList {
  repeated RegexFilterConfig regex_filter_configs = 1;
}

message RegexFilterConfig {
  RegexOperator operator = 1;
  string regex = 2;
}

message IpAddressFilterConfigList {
  repeated IpAddressFilterConfig ip_address_filter_configs = 1;
}

message IpAddressFilterConfig {
  IpAddressOperator operator = 1;
  string ip_lower_bound_inclusive = 2;
  string ip_upper_bound_inclusive = 3;
}

enum RegexOperator {
  REGEX_OPERATOR_UNSPECIFIED = 0;
  REGEX_OPERATOR_MATCHES = 1;
  REGEX_OPERATOR_NOT_MATCHES = 2;
}

enum IpAddressOperator {
  IP_ADDRESS_OPERATOR_UNSPECIFIED = 0;
  IP_ADDRESS_OPERATOR_IN = 1;
  IP_ADDRESS_OPERATOR_NOT_IN = 2;
}

message StatusCodeFilterConfig {
  repeated IntRangeFilterConfig range_filter_configs = 1;
}

message IntRangeFilterConfig {
  optional int32 low = 1;
  optional int32 high = 2;
  IntList exclusions = 3;
}

message SegmentFilterConfig {
  optional int32 url_parts_threshold = 1;
  optional int32 segment_length_threshold = 2;
}

message UrlPathFilterConfig  {
  StringList url_path_regex_patterns = 1;
}

message UrlFilterConfig {
  StringList url_reject_regex_patterns = 1;
}

message ModsecFilterConfig {
  repeated ModsecStrategy modsec_strategies = 1;
}

enum ModsecStrategy {
  MODSEC_STRATEGY_UNSPECIFIED = 0;
  MODSEC_STRATEGY_REGULAR_CRS = 1;
  MODSEC_STRATEGY_SAFE_CRS = 2;
}

message TrieModelTrainingConfig {
  StringList allow_regex_list = 1;
  ThresholdRegexConfig ids = 2;
  ThresholdRegexConfig low_cardinality = 3;
  ThresholdRegexConfig medium_cardinality = 4;
  ThresholdRegexConfig high_cardinality = 5;
  StringList extensions = 6;
  optional int32 embryonic_threshold = 7;
  optional int32 max_number_of_trie_paths = 8;
  optional int32 non_mergeable_depth = 9;
  GibberishConfig gibberish_config = 10;
  repeated SegmentMergeConfig segment_merge_config = 11;
  StringList id_enums = 12;
}

message GibberishConfig {
  optional int32 threshold = 1;
  bool disabled = 2;
}

message SegmentMergeConfig {
  bool disabled = 1;
  optional string segment_depth = 2;
  repeated LevelThresholdConfig level_threshold_config = 3;
  optional int32 non_mergeable_depth = 4;
}

message LevelThresholdConfig {
  int32 level = 1;
  optional int32 ids_threshold = 2;
  optional int32 low_cardinality_threshold = 3;
  optional int32 high_cardinality_threshold = 4;
  optional int32 medium_cardinality_threshold = 5;
  optional int32 gibberish_threshold = 6;
}

message UserAgentFilterConfig {
  StringList bot_agent_list = 2;
}

message SpanAttributeFilterConfigList {
  repeated SpanAttributeFilterConfig span_attribute_filter_configs = 1;
}

message SpanAttributeFilterConfig {
  Filter filter = 1;
}

message Filter {
  oneof filter {
    RelationalFilter relational_filter = 1;
    LogicalFilter logical_filter = 2;
  }
}

message LogicalFilter {
  LogicalOperator operator = 1;
  repeated Filter filters = 2;
}

message RelationalFilter {
  KeyFilter key_filter = 1;
  ValueFilter value_filter = 2;
}

message KeyFilter {
  KeyLocation location = 1;
  RelationalOperator operator = 2;
  Value value = 3;
}

message ValueFilter {
  RelationalOperator operator = 1;
  Value value = 2;
}

message Value {
  oneof value {
    string string_value = 1;
    StringList string_values = 2;
  }
}

enum KeyLocation {
  KEY_LOCATION_UNSPECIFIED = 0;
  KEY_LOCATION_REQUEST_HEADER = 1;
  KEY_LOCATION_RESPONSE_HEADER = 2;
  KEY_LOCATION_REQUEST_BODY = 3;
  KEY_LOCATION_RESPONSE_BODY = 4;
  KEY_LOCATION_ATTRIBUTES = 5;
  KEY_LOCATION_STATUS_CODE = 6;
  KEY_LOCATION_URL_PATH = 7;
  KEY_LOCATION_FULL_URL_PATH = 8;
}

enum LogicalOperator {
  LOGICAL_OPERATOR_UNSPECIFIED = 0;
  LOGICAL_OPERATOR_AND = 1;
  LOGICAL_OPERATOR_OR = 2;
  LOGICAL_OPERATOR_NOT = 3;
}

enum RelationalOperator {
  RELATIONAL_OPERATOR_UNSPECIFIED = 0;
  RELATIONAL_OPERATOR_EQUALS = 1;
  RELATIONAL_OPERATOR_NOT_EQUALS = 2;
  RELATIONAL_OPERATOR_CONTAINS = 3;
  RELATIONAL_OPERATOR_STARTS_WITH = 4;
  RELATIONAL_OPERATOR_ENDS_WITH = 5;
  RELATIONAL_OPERATOR_REGEX_MATCH = 6;
  RELATIONAL_OPERATOR_IN = 7;
  RELATIONAL_OPERATOR_EXISTS = 8;
  RELATIONAL_OPERATOR_NOT_IN = 9;
  RELATIONAL_OPERATOR_NOT_CONTAINS = 10;
}

message ThresholdRegexConfig {
  optional int32 threshold = 1;
  StringList regex_list = 2;
}

message CustomRulesListConfig {
  repeated CustomRuleConfig custom_rules_config = 1;
}

message CustomRuleConfig {
  string regex = 1;
  string url_pattern = 2;
}

message MultiValuedStringParamRulesList {
  repeated MultiValuedStringParamRule rules = 1;
}

message MultiValuedStringParamRule {
  string key_regex = 1;
  string value_delimiter = 2;
  optional string value_regex = 3;
}

message UserIdDataList {
  repeated UserIdData user_id_data = 1;
}

message UserIdData {
  oneof user_id_source {
    bool user_attribution_extracted_id = 1;
    bool user_attribution_extracted_id_from_jwt = 2;
    string user_id_custom_attribute = 3;
  }
}
