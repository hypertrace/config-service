syntax = "proto3";

// buf:lint:ignore PACKAGE_VERSION_SUFFIX
package ai.traceable.anomaly.config.service.v1.override;

import "ai/traceable/anomaly/config/service/v1/anomaly_config.proto";
import "ai/traceable/anomaly/config/service/v1/override/common_detection_override_configs.proto";
import "ai/traceable/anomaly/config/service/v1/override/detection_override_actor_config.proto";
import "ai/traceable/anomaly/config/service/v1/override/detection_override_event_config.proto";

option java_multiple_files = true;


message DetectionExceptionRule {
  string id = 1;
  string description = 2;
  DetectionExceptionRuleConfig config = 3;
}

message DetectionExceptionRuleConfig {
  DetectionExceptionConfigCriteria criteria = 1;
  DetectionOverrideRuleStatus rule_status = 2;
  DetectionExceptionEventAction event_action = 3;
}

message DetectionExceptionConfigCriteria {
  DetectionOverrideAssetConfig target_asset_config = 1;
  DetectionOverrideTargetEventsConfig target_events_config = 2;
  DetectionOverrideActorsConfig actors_config = 3;
}

message DetectionExceptionEventAction {
  optional AnomalyThreatCategory threat_category = 1;
  optional AnomalySeverityLevel severity_level = 2;
  optional bool internal = 3;
}

message GetAllDetectionExceptionRulesRequest {
}

message GetAllDetectionExceptionRulesResponse {
  repeated DetectionExceptionRule rules = 1;
}

message CreateDetectionExceptionRuleConfigRequest {
  string description = 1;
  DetectionExceptionRuleConfig config = 2;
}

message CreateDetectionExceptionRuleConfigResponse {
  DetectionExceptionRule rule = 1;
}

message UpdateDetectionExceptionRuleRequest {
  DetectionExceptionRule rule = 1;
}

message UpdateDetectionExceptionRuleResponse {
  DetectionExceptionRule rule = 1;
}

message DeleteDetectionExceptionRuleRequest {
  string rule_id = 1;
}

message DeleteDetectionExceptionRuleResponse {
}
