syntax = "proto3";

package ai.traceable.anomaly.config.service.v1;

import "ai/traceable/anomaly/config/service/v1/enum_extension.proto";

option java_multiple_files = true;

message AnomalyConfigStatusChange {
  optional bool disabled = 1;
  optional bool internal = 2;
}

message AnomalyConfigStatus {
  bool disabled = 1;
  bool internal = 2; // used only when disabled = true
}

message AnomalyConfigScope {
  AnomalyConfigScopeType scope_type = 1 [deprecated = true];
  oneof scope {
    AnomalyServiceScope service_scope = 2;
    AnomalyApiScope api_scope = 3;
    AnomalyParamScope param_scope = 4 [deprecated = true];
    AnomalyCustomerScope customer_scope = 5;
    AnomalyEnvironmentScope environment_scope = 6;
  }
}

message AnomalyCustomerScope {
}

message AnomalyEnvironmentScope {
  string environment_id = 1;
}

// deprecated
message AnomalyParamScope {
  option deprecated = true;
  string param_name = 1 [deprecated = true];
  AnomalyApiScope api_scope = 2 [deprecated = true];
  AnomalyParamInfoScope scope = 3;
  AnomalyParamInfo param_info = 4;
}

// deprecated
message AnomalyParamInfoScope {
  option deprecated = true;
  oneof scope {
    AnomalyApiScope api_scope = 1;
    AnomalyServiceScope service_scope = 2;
    AnomalyCustomerScope customer_scope = 3;
  }
}

// deprecated
message AnomalyParamInfo {
  option deprecated = true;
  oneof param_details {
    string param_name = 1;
    string param_regex = 2;
  }
}

message AnomalyApiScope {
  string id = 1;
  AnomalyServiceScope service_scope = 2;
}

message AnomalyServiceScope {
  string id = 1;
  AnomalyEnvironmentScope environment_scope = 2; //optional
}

enum AnomalyConfigScopeType {
  ANOMALY_CONFIG_SCOPE_TYPE_UNSPECIFIED = 0;
  ANOMALY_CONFIG_SCOPE_TYPE_CUSTOMER = 1;
  ANOMALY_CONFIG_SCOPE_TYPE_SERVICE = 2;
  ANOMALY_CONFIG_SCOPE_TYPE_API = 3;
}

enum AnomalyEventFamily {
  ANOMALY_EVENT_FAMILY_UNSPECIFIED = 0;
  ANOMALY_EVENT_FAMILY_API_DEF = 1;
  ANOMALY_EVENT_FAMILY_MODSEC = 2;
  ANOMALY_EVENT_FAMILY_SESSION = 3;
  ANOMALY_EVENT_FAMILY_RATE_LIMIT = 4;
  ANOMALY_EVENT_FAMILY_CUSTOM_SIGNATURE = 5;
}

message AnomalyRuleInfo {
  string rule_id = 1;
  string rule_name = 2;
  string rule_category = 3 [deprecated = true];
  AnomalyEventFamily event_family = 4;
  repeated AnomalySubRuleInfo sub_rule_infos = 5;
  AnomalyRuleCategory anomaly_rule_category = 6;
}

message AnomalySubRuleInfo {
  string rule_id = 1;
  string rule_name = 2;
  repeated AnomalySubRuleType sub_rule_types = 3;
  map<string, string> event_labels = 4;
}

enum AnomalySubRuleType {
  ANOMALY_SUB_RULE_TYPE_UNSPECIFIED = 0;
  ANOMALY_SUB_RULE_TYPE_REGULAR = 1;
  ANOMALY_SUB_RULE_TYPE_SAFE = 2;
  ANOMALY_SUB_RULE_TYPE_BLOCK = 3;
  ANOMALY_SUB_RULE_TYPE_UNSAFE = 4 [deprecated = true];
}

enum AnomalyRuleCategory {
  ANOMALY_RULE_CATEGORY_UNSPECIFIED = 0 [(string_value) = "Unspecified"];
  ANOMALY_RULE_CATEGORY_PARAMETER_ANOMALIES = 1 [(string_value) = "Parameter Anomalies"];
  ANOMALY_RULE_CATEGORY_REQUEST_RESPONSE_METADATA_ANOMALIES = 2 [(string_value) = "Request and Response Metadata Anomalies"];
  ANOMALY_RULE_CATEGORY_INJECTIONS = 3 [(string_value) = "Injections"];
  ANOMALY_RULE_CATEGORY_SSRF = 4 [(string_value) = "Server-Side Request Forgery (SSRF)"];
  ANOMALY_RULE_CATEGORY_DOS = 5 [(string_value) = "Denial of Service (DOS) attack"];
  ANOMALY_RULE_CATEGORY_SCANNER_DETECTED = 6 [(string_value) = "Scanner Detection"];
  ANOMALY_RULE_CATEGORY_XSS = 7 [(string_value) = "Cross Site Scripting (XSS)"];
  ANOMALY_RULE_CATEGORY_SESSION_FIXATION = 8 [(string_value) = "Session Fixation"];
  ANOMALY_RULE_CATEGORY_PATH_MANIPULATION = 9 [(string_value) = "Path Manipulation"];
  ANOMALY_RULE_CATEGORY_KNOWN_VULNERABILITIES = 10 [(string_value) = "Known Vulnerabilities"];
  ANOMALY_RULE_CATEGORY_AUTHORIZATION_VIOLATIONS = 11 [(string_value) = "Session Authorization Anomalies"];
  ANOMALY_RULE_CATEGORY_CUSTOM_RULES = 12 [(string_value) = "Custom Rules"];
  ANOMALY_RULE_CATEGORY_RATE_LIMIT = 13 [(string_value) = "Rate Limit"];
  ANOMALY_RULE_CATEGORY_ATTACKER = 14 [(string_value) = "Attacker"];
}

enum AnomalyConfidenceLevel {
  ANOMALY_CONFIDENCE_LEVEL_UNSPECIFIED = 0;
  ANOMALY_CONFIDENCE_LEVEL_LOW = 1;
  ANOMALY_CONFIDENCE_LEVEL_MEDIUM = 2;
  ANOMALY_CONFIDENCE_LEVEL_HIGH = 3;
}

enum AnomalySeverityLevel {
  ANOMALY_SEVERITY_LEVEL_UNSPECIFIED = 0;
  ANOMALY_SEVERITY_LEVEL_LOW = 1;
  ANOMALY_SEVERITY_LEVEL_MEDIUM = 2;
  ANOMALY_SEVERITY_LEVEL_HIGH = 3;
}

enum AnomalyThreatCategory {
  ANOMALY_THREAT_CATEGORY_UNSPECIFIED = 0;
  ANOMALY_THREAT_CATEGORY_MALICIOUS_ACTIVITIES = 1;
  ANOMALY_THREAT_CATEGORY_ANOMALIES = 2;
  ANOMALY_THREAT_CATEGORY_TESTS = 3;
}

message StringList {
  repeated string values = 1;
}

message IntList {
  repeated int32 values = 1;
}
