# Default values for the helm chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#
# Note about Namespace
# --------------------
# It is deliberately left out here and using the helm -n or --namespace flag you can deploy your resources to the same
# namespace as the release. If you leave it out, your resources will be deployed to the default namespace.
# Also, note that the namespace you are deploying to should already exist otherwise the helm command will fail.
# You can always specify a different namespace for a resource by setting it directly in it's yaml file or
# making it configurable by defining it in this file.

###########
# Deployment and Service
###########
replicaCount: 1
maxUnavailable: 0

chartType: application

image:
  registry: us-docker.pkg.dev/traceable-actions-386017/docker
  repository: traceable/traceable-config-service
  pullPolicy: IfNotPresent
  tagOverride: ""

imagePullSecrets:
  - name: gcp-artifact-registry-dev

internalContainerPort: 50101
externalContainerPort: 50102
containerAdminPort: 50103
internalGlobalServiceContainerPort: 50104
internalContainerPortName: grpc-int-port
externalContainerPortName: grpc-ext-port
internalGlobalServiceContainerPortName: int-global-port
restContainerPort: 50105
restContainerPortName: rest-port

service:
  name: traceable-config-service
  type: ClusterIP
  internalPort: 50101
  externalPort: 50102
  internalGlobalPort: 50104
  rest:
    port: 50105
    maxHeaderSize: 32KiB

# coraza-waf-service container
corazaWafService:
  name: coraza-waf-service
  image:
    tag: 0.3.12 # also sync traceable-corazaWafService in libs.versions.toml
    repository: traceable/coraza-waf-service
    pullPolicy: IfNotPresent
    tagOverride: ""
  resources:
    limits:
      # tune cpu to higher limits for lower grpc latency overhead, refer runbook & dashboard
      cpu: 1.0
      memory: 256Mi
    requests:
      cpu: 0.5
      memory: 256Mi

nodeLabels: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

hostNetwork: false

podSecurityContext: {}

containerSecurityContext: {}

initContainers: []

extraVolumes: []

extraVolumeMounts: []

extraEnvs: []

commonPodLabels: {}

commonPodAnnotations: {}

javaOpts: "-XX:InitialRAMPercentage=50.0 -XX:MaxRAMPercentage=60.0 -XX:MaxDirectMemorySize=128M -XX:+ExitOnOutOfMemoryError"

livenessProbe:
  periodSeconds: 5
  failureThreshold: 3
  timeoutSeconds: 3
startupProbe:
  periodSeconds: 5
  failureThreshold: 24
  timeoutSeconds: 3

resources:
  requests:
    cpu: 0.1
    memory: 1.25Gi
  limits:
    cpu: 0.5
    memory: 1.25Gi

deploymentLabels:
  app: traceable-config-service

podLabels:
  app: traceable-config-service

podAnnotations: {}

# The Deployment Selector match labels are different from the pod labels. Note that they should be a subset of the pod
# labels. You append new labels to them but cannot remove labels. If you remove or modify the labels you will need to
# delete the existing deployment bearing the same name and then redeploy. This is the reason why they are separated from
# the pod labels. You can add and remove pod labels without having an effect on the deployment.
# Also, please use "apiVersion: apps/v1" instead of the deprecated "apiVersion: extensions/v1beta1" for the deployment
# apiVersion in the yaml file.
deploymentSelectorMatchLabels:
  app: traceable-config-service

serviceSelectorLabels:
  app: traceable-config-service

serviceAccount:
  create: false
  name: traceable-config-service
  annotations: {}

modelStoreNFSMountPath: "/var/data/models"
modelStoreNFSClaimName: "traceable-nfs-model-store"
deepStoreFilePath: "/var/data/customers/"
deepStoreFsScheme: "gs"
deepStoreMountPath: "/var/data"
deepStoreClaimName: "traceable-nfs-deep-store"
s3BucketName: ""
bucketPrefix: traceable-saas
s3.config:
  - fs.s3a.endpoint: "s3-us-west-2.amazonaws.com"

iamServiceAccountSecret: gcs-iam-secret

trieModels:
  modelStores:
    - deepStoreScheme: "file"
      readEnabled: true
      readPriority: 1
      writeDisabled: false
  cache:
    refreshAfterWriteDuration: 30m
    expireAfterWriteDuration: 60m
    maximumSize: 100
    threadPoolSize: 2

trieDiffLog:
  modelStore:
    deepStoreScheme: "file"
  trieDiffLogsRetentionPeriod: 1h
  cache:
    refreshAfterWriteDuration: 30m
    expireAfterWriteDuration: 60m
    maximumSize: 100
    threadPoolSize: 2

entityFetcher:
  cache:
    refreshAfterWriteDuration: 12h
    expireAfterWriteDuration: 24h
    maximumSize: 1000
    delegate:
      refreshAfterWriteDuration: 600s
      expireAfterWriteDuration: 1200s
      maximumSize: 1000

apiNamingCustomRules:
  cache:
    refreshAfterWriteDuration: 150s
    expireAfterWriteDuration: 300s
    maximumSize: 1000

apiNamingConfigs:
  cache:
    refreshAfterWriteDuration: 12h
    expireAfterWriteDuration: 24h
    maximumSize: 100

###########
# Config Maps
###########
traceableConfigServiceConfig:
  name: traceable-config-service-config
  publishChangeEvents: false

  attributeServiceConfig:
    host: attribute-service
    port: 9012
    request:
      timeout: "10 s"

  partitionerServiceConfig:
    defaultProfiles:
        - name: "spans"
          partitionKey: "customer_id"
  insightsServiceConfig:
    host: insights-service
    port: 50098
    request:
      timeout: 10s
  entityServiceConfig:
    host: entity-service
    port: 50061
    timeout: 10s
    cache:
      maxCacheSize: 10000
      refreshAfterWriteDuration: 10m
      expireAfterWriteDuration: 12h
  entityFetcherCache:
    serviceMappingCache:
      maxSize: 1000
      refreshAfterWriteDuration: 6h
      expireAfterWriteDuration: 24h
  regexPatternCacheSize: 10000
  licenseMeteringServiceConfig:
    host: license-metering-service
    port: 51018
    cacheExpiryDuration: 5m
    cacheMaxSize: 5000
  iamV2ServiceConfig:
    host: iam-v2
    grpcPort: 51100
  regionConfigService:
    neustar:
      mode: VERSIONS_DIR
      resourceFile: neustar/countries.csv
      versions: |-
        versions.dir = /var/data/models/neustar/country_csv
        versions.file.name = countries.csv
        versions.refresh.duration = 24h
    ipqs:
      mode: VERSIONS_DIR
      resourceFile: ipqs/countries.csv
      resolveNeustar: true
      versions: |-
        versions.dir = /var/data/models/ipqs/country_csv
        versions.file.name = countries.csv
        versions.refresh.duration = 24h
  customSignatureConfigService:
    modsecurity:
      ruleVersion: MODSEC_RULE_VERSION_V3
#    defaultCustomSignatureRules: |-
#    [
#     {
#        id = "ruleId"
#        name = "ruleName"
#        definition = {}
#      }
#    ]
  blockingConfigService:
    enableNewModsecCrsBlockingFlow: false
    agentPollingFrequency: 30s
    iptype:
      mode: VERSIONS_DIR
      resourceFile: iptype/empty_highrisk.csv
      versions: |-
        versions.dir = /var/data/models/ipqs/highrisk_csv
        versions.file.name = highrisk.csv
        versions.refresh.duration = 24h
    actorFetcherConfig:
      host: actor-service
      port: 50888
      request:
        timeout: 10s
      cache:
        maxCacheSize: 10000
        expireAfterWriteDuration: 10m
        refreshAfterWriteDuration: 30s
      maxNumberOfActors: 10000
  featureFlagServiceConfig:
    host: feature-flag-service
    port: 51001
    request:
      timeout: 10s
    cache:
      refresh:
        duration: 5m
      expiration:
        duration: 15m
      thread:
        pool:
          size: 2
  labelApplicationRuleConfigServiceConfig:
    maxDynamicLabelApplicationRulesPerTenant: 100
  notificationChannelConfigServiceConfig:
    webhookExclusionDomains: ["localhost", "127.0.0.1", "169.254.169.254", "metadata.google.internal"]
    webhookHttpSupportEnabled: false
  splunkIntegrationConfigServiceConfig:
    splunkHttpSupportEnabled: false
  detectionExclusionConfigService:
    migrationDisabled: false
    changeLog2:
      migrationDisabled: true
    changeLog3:
      migrationDisabled: true
    changeLog4:
      migrationDisabled: true
  astConfigService:
    defaultPurgeDuration: 30d
    defaultAstFeatureConfig:
      astEnabled: true
      astReplayConfig:
        enabled: false
        apiInactivityDuration: 30d
        maxApiLimit: 10000
        skipNonLearntApis: true
        skipUnderDiscoveryApis: true
  actorService:
    host: actor-service
    port: 50888
    request:
      timeout: 1m
