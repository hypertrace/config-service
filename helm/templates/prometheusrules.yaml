{{- if .Values.prometheusRule.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: traceable-config-service-prometheus-rule
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    monitoring: shared
    app: {{ .Values.service.name }}
spec:
  groups:
    - name: traceable-config-service
      rules:
        - alert: ThreatAutoBlockingConfigurationChange
          annotations:
            summary: 'Threat Auto Blocking Configuration Change'
            message: 'Threat Auto Blocking Configuration changed to {{`{{ $labels.operation}}`}} for customer:{{`{{ $labels.tenantId }}`}}'
          expr: sum(config_threat_autoblocking_action_timer_seconds_max) by (tenantId, operation) > 0
          for: 0m
          labels:
            severity: SEV2
            repository: config-service
            team: common
            {{- with .Values.prometheusrule.additionalRuleLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - alert: ApiNamingRulesLimitExceeded
          annotations:
            summary: 'The total number of API Naming Rules created is too high.'
            message: 'The number of API Naming Rules created for tenant {{`{{$labels.tenantId}}`}} exceeded the limit (10,000). Current value: {{`{{ $value }}`}} rules."'
          expr: sum by (tenantId) (max by (tenantId, disabled) (spec_based_api_naming_rules_count)) > 10000
          for: 0m
          labels:
            severity: warning
            repository: config-service
            team: catalog
            { { - with .Values.prometheusrule.additionalRuleLabels } }
            { { - toYaml . | nindent 12 } }
            { { - end } }
  {{- end }}

{{- end }}