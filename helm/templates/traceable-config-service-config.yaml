apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.traceableConfigServiceConfig.name }}
  labels:
    release: {{ .Release.Name }}
data:
  application.conf: |-
    service.port.internal = {{ .Values.internalContainerPort }}
    service.port.external = {{ .Values.externalContainerPort }}
    service.global.port.internal = {{ .Values.internalGlobalServiceContainerPort }}
    service.admin.port = {{ .Values.containerAdminPort }}
    service.rest.port = {{ .Values.restContainerPort }}
    traceable.url = {{ .Values.global.appEndpoint | quote }}
    service.rest.maxHeaderSize = {{ .Values.service.rest.maxHeaderSize }}
    generic.config.service {
      document.store {
        {{- if .Values.database }}
        {{- $dst := .Values.database.type }}
        dataStoreType = {{ $dst }}
        appName = {{ .Values.service.name }}

        {{- range $key, $value := (index .Values "database") }}
        {{- if ne $key $dst }}
        {{ $key }} = {{- toJson $value }}
        {{- end }}
        {{- end }}
    
        {{ $dst }} {
          {{- range $key, $value := (index .Values "database" (printf "%s" $dst)) }}
          {{- if $value }}
            {{- if hasPrefix "${?" (printf "%s" $value) }}
          {{ $key }} = {{ $value }}
            {{- else }}
          {{ $key }} = {{- toJson $value }}
            {{- end }}
          {{- end }}
          {{- end }}
        }
        {{- end }}
      }
      publish.change.events = {{ .Values.traceableConfigServiceConfig.publishChangeEvents }}
    }
    hypertrace.config.service.timeout = {{ .Values.hypertraceConfigServiceTimeout }}
    partitioner.config.service {
      default.profiles = [
      {{- range $k,$v := $.Values.traceableConfigServiceConfig.partitionerServiceConfig.defaultProfiles }}
        {
          name = {{ $v.name }}
          partition.key = {{ $v.partitionKey }}
        }
      {{- end }}
      ]
    }
    event.store {
      type = kafka
      bootstrap.servers = "bootstrap:9092"
      config.change.events.producer {
        bootstrap.servers = "bootstrap:9092"
        schema.registry.url = "http://schema-registry-service:8081"
      }
     email.notification.producer {
        topic.name = "notification-events"
        bootstrap.servers = "bootstrap:9092"
        key.serializer = org.apache.kafka.common.serialization.StringSerializer
        value.serializer = io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
        schema.registry.url = "http://schema-registry-service:8081"
      }
    }
    {{- if hasKey .Values.traceableConfigServiceConfig "defaultPiiFilterConfig" }}
    sensitive.data.config.service {
      default.pii.filter.config {
        {{- .Values.traceableConfigServiceConfig.defaultPiiFilterConfig | nindent 8 }}
      }
    }
    {{- end }}
    insights.service.config = {
      host = {{ .Values.traceableConfigServiceConfig.insightsServiceConfig.host }}
      port = {{ .Values.traceableConfigServiceConfig.insightsServiceConfig.port }}
      request.timeout = {{ .Values.traceableConfigServiceConfig.insightsServiceConfig.request.timeout }}
    }
    entity.service.config = {
      host = {{ .Values.traceableConfigServiceConfig.entityServiceConfig.host }}
      port = {{ .Values.traceableConfigServiceConfig.entityServiceConfig.port }}
      cache = {
        maxCacheSize = {{ .Values.traceableConfigServiceConfig.entityServiceConfig.cache.maxCacheSize }}
        refreshAfterWriteDuration = {{ .Values.traceableConfigServiceConfig.entityServiceConfig.cache.refreshAfterWriteDuration }}
        expireAfterWriteDuration = {{ .Values.traceableConfigServiceConfig.entityServiceConfig.cache.expireAfterWriteDuration }}
      }
    }
    entity.fetcher.cache = {
      service.mapping.cache = {
        maxSize = {{ .Values.traceableConfigServiceConfig.entityFetcherCache.serviceMappingCache.maxSize }}
        refreshAfterWriteDuration = {{ .Values.traceableConfigServiceConfig.entityFetcherCache.serviceMappingCache.refreshAfterWriteDuration }}
        expireAfterWriteDuration = {{ .Values.traceableConfigServiceConfig.entityFetcherCache.serviceMappingCache.expireAfterWriteDuration }}
      }
    }
    regex.pattern.cache.size = {{ .Values.traceableConfigServiceConfig.regexPatternCacheSize }}
    license.metering.service = {
      host = {{ .Values.traceableConfigServiceConfig.licenseMeteringServiceConfig.host }}
      port = {{ .Values.traceableConfigServiceConfig.licenseMeteringServiceConfig.port }}
      cache.expiration.duration = {{ .Values.traceableConfigServiceConfig.licenseMeteringServiceConfig.cacheExpiryDuration }}
      cache.max.size = {{ int .Values.traceableConfigServiceConfig.licenseMeteringServiceConfig.cacheMaxSize }}
    }
    iam.v2.service = {
      host = {{ .Values.traceableConfigServiceConfig.iamV2ServiceConfig.host }}
      grpc.port = {{ .Values.traceableConfigServiceConfig.iamV2ServiceConfig.grpcPort }}
    }
    region.config.service {
      changeLog1.migrationDisabled = {{ .Values.traceableConfigServiceConfig.regionConfigService.changeLog1.migrationDisabled }}
      neustar.countries.data {
        mode = {{ .Values.traceableConfigServiceConfig.regionConfigService.neustar.mode }}
        {{- if .Values.traceableConfigServiceConfig.regionConfigService.neustar.resourceFile }}
        resource.file = {{ .Values.traceableConfigServiceConfig.regionConfigService.neustar.resourceFile }}
        {{- end }}
        {{- if .Values.traceableConfigServiceConfig.regionConfigService.neustar.versions }}
        {{- .Values.traceableConfigServiceConfig.regionConfigService.neustar.versions | nindent 8 }}
        {{- end }}
      }
      ipqs.countries.data {
        mode = {{ .Values.traceableConfigServiceConfig.regionConfigService.ipqs.mode }}
        {{- if .Values.traceableConfigServiceConfig.regionConfigService.ipqs.resourceFile }}
        resource.file = {{ .Values.traceableConfigServiceConfig.regionConfigService.ipqs.resourceFile }}
        {{- end }}
        {{- if .Values.traceableConfigServiceConfig.regionConfigService.ipqs.versions }}
        {{- .Values.traceableConfigServiceConfig.regionConfigService.ipqs.versions | nindent 8 }}
        {{- end }}
        {{- if .Values.traceableConfigServiceConfig.regionConfigService.ipqs.resolveNeustar }}
        resolve.neustar = {{ .Values.traceableConfigServiceConfig.regionConfigService.ipqs.resolveNeustar }}
        {{- end }}
      }
    }
    custom.signature.config.service {
      modsecurity {
        directives.data.path = modsecurity.conf
        rule.version = {{ .Values.traceableConfigServiceConfig.customSignatureConfigService.modsecurity.ruleVersion }}
      }
      {{- if .Values.traceableConfigServiceConfig.customSignatureConfigService.defaultCustomSignatureRules }}
      defaultCustomSignatureRules =
        {{- .Values.traceableConfigServiceConfig.customSignatureConfigService.defaultCustomSignatureRules | nindent 8 }}
      {{- end }}
      edsConversionEnabled = {{ .Values.traceableConfigServiceConfig.customSignatureConfigService.edsConversionEnabled }}
      ruleEvaluationPoints.migrationDisabled = {{ .Values.traceableConfigServiceConfig.customSignatureConfigService.ruleEvaluationPoints.migrationDisabled }}
      ruleCategory.migrationDisabled = {{ .Values.traceableConfigServiceConfig.customSignatureConfigService.ruleCategory.migrationDisabled }}
      allowRulesPlatformExclusion.migrationDisabled = {{ .Values.traceableConfigServiceConfig.customSignatureConfigService.allowRulesPlatformExclusion.migrationDisabled }}
    }
    bot.config.service {
        default.policies = {{ toJson .Values.traceableConfigServiceConfig.botConfigService.defaultPolicies }}
    }
    actor.service.config {
      host = {{ .Values.traceableConfigServiceConfig.actorService.host }}
      port = {{ .Values.traceableConfigServiceConfig.actorService.port }}
      request.timeout = {{ .Values.traceableConfigServiceConfig.actorService.request.timeout }}
    }
    blocking.config.service {
      enableNewModsecCrsBlockingFlow = {{ .Values.traceableConfigServiceConfig.blockingConfigService.enableNewModsecCrsBlockingFlow }}
      agent.polling.frequency = {{ .Values.traceableConfigServiceConfig.blockingConfigService.agentPollingFrequency }}
      actor.fetcher.config = {
        host = {{ .Values.traceableConfigServiceConfig.blockingConfigService.actorFetcherConfig.host }}
        port = {{ .Values.traceableConfigServiceConfig.blockingConfigService.actorFetcherConfig.port }}
        request.timeout = {{ .Values.traceableConfigServiceConfig.blockingConfigService.actorFetcherConfig.request.timeout }}
        cache = {
          maxCacheSize = {{ .Values.traceableConfigServiceConfig.blockingConfigService.actorFetcherConfig.cache.maxCacheSize }}
          refreshAfterWriteDuration = {{ .Values.traceableConfigServiceConfig.blockingConfigService.actorFetcherConfig.cache.refreshAfterWriteDuration }}
          expireAfterWriteDuration = {{ .Values.traceableConfigServiceConfig.blockingConfigService.actorFetcherConfig.cache.expireAfterWriteDuration }}
        }
        maxNumberOfActors = {{ .Values.traceableConfigServiceConfig.blockingConfigService.actorFetcherConfig.maxNumberOfActors }}
      }
      iptype {
        mode = {{ .Values.traceableConfigServiceConfig.blockingConfigService.iptype.mode }}
        {{- if .Values.traceableConfigServiceConfig.blockingConfigService.iptype.resourceFile }}
        resource.file = {{ .Values.traceableConfigServiceConfig.blockingConfigService.iptype.resourceFile }}
        {{- end }}
        {{- if .Values.traceableConfigServiceConfig.blockingConfigService.iptype.versions }}
        {{- .Values.traceableConfigServiceConfig.blockingConfigService.iptype.versions | nindent 6 }}
        {{- end }}
      }
    }
    api.naming.config {
      trieModels = {
        {{- if $.Values.trieModels.modelStores }}
        model.stores = [
          {{- range $sk,$sv := $.Values.trieModels.modelStores }}
          {
            deep.store.fs.scheme = {{ $sv.deepStoreScheme }}
            read.enabled = {{ $sv.readEnabled }}
            read.priority = {{ $sv.readPriority }}
            write.disabled = {{ $sv.writeDisabled }}
            {{- if and (ne $sv.deepStoreScheme "gs") (ne $sv.deepStoreScheme "s3") }}
            directory = {{ printf "%s/%s/customers" $.Values.modelStoreNFSMountPath $.Values.global.env | quote }}
            {{- end }}
            {{- if eq $sv.deepStoreScheme "gs" }}
            gcs.bucket.name = {{ printf "%s-%s" $.Values.bucketPrefix $.Values.global.env | quote }}
            gcs.key.file = "/accounts/key.json"
            directory = {{ $.Values.deepStoreFilePath | quote }}
            {{- end }}
            {{- if eq $sv.deepStoreScheme "s3" }}
            directory = {{ $.Values.deepStoreFilePath | quote }}
            s3.bucket.name = {{ $.Values.s3BucketName | quote }}
            s3.config = {
              {{- range $k, $v := $.Values.s3Config }}
              {{ $k }} = {{ $v | quote }}
              {{- end }}
            }
            {{- end }}
          },
          {{- end}}
        ]
        {{- end}}
        cache = {
          refreshAfterWriteDuration = {{ .Values.trieModels.cache.refreshAfterWriteDuration }}
          expireAfterWriteDuration = {{ .Values.trieModels.cache.expireAfterWriteDuration }}
          maximumSize = {{ .Values.trieModels.cache.maximumSize }}
          threadPoolSize = {{ .Values.trieModels.cache.threadPoolSize }}
        }
      }
      trieDiffLog = {
        model.store = {
          deep.store.fs.schema = {{ .Values.trieDiffLog.modelStore.deepStoreScheme }}
          {{- if eq $.Values.trieDiffLog.modelStore.deepStoreScheme "file" }}
          directory = {{ printf "%s/%s/customers" $.Values.modelStoreNFSMountPath $.Values.global.env | quote }}
          {{- end }}
          {{- if eq $.Values.trieDiffLog.modelStore.deepStoreScheme "gs" }}
          gcs.bucket.name = {{ printf "%s-%s" $.Values.bucketPrefix $.Values.global.env | quote }}
          gcs.key.file = "/accounts/key.json"
          directory = {{ $.Values.deepStoreFilePath | quote }}
          {{- end }}
          {{- if eq $.Values.trieDiffLog.modelStore.deepStoreScheme "s3" }}
          directory = {{ $.Values.deepStoreFilePath | quote }}
          s3.bucket.name = {{ $.Values.s3BucketName | quote }}
          s3.config = {
            {{- range $k, $v := $.Values.s3Config }}
            {{ $k }} = {{ $v | quote }}
            {{- end }}
          }
          {{- end }}
        }
        diff.logs.retention.period = {{ .Values.trieDiffLog.trieDiffLogsRetentionPeriod }}
        cache = {
          refreshAfterWriteDuration = {{ .Values.trieDiffLog.cache.refreshAfterWriteDuration }}
          expireAfterWriteDuration = {{ .Values.trieDiffLog.cache.expireAfterWriteDuration }}
          maximumSize = {{ .Values.trieDiffLog.cache.maximumSize }}
          threadPoolSize = {{ .Values.trieDiffLog.cache.threadPoolSize }}
        }
      }
      entity.fetcher = {
        cache = {
          refreshAfterWriteDuration = {{ .Values.entityFetcher.cache.refreshAfterWriteDuration }}
          expireAfterWriteDuration = {{ .Values.entityFetcher.cache.expireAfterWriteDuration }}
          maximumSize = {{ .Values.entityFetcher.cache.maximumSize }}
          delegate = {
            refreshAfterWriteDuration = {{ .Values.entityFetcher.cache.delegate.refreshAfterWriteDuration }}
            expireAfterWriteDuration = {{ .Values.entityFetcher.cache.delegate.expireAfterWriteDuration }}
            maximumSize = {{ .Values.entityFetcher.cache.delegate.maximumSize }}
          }
        }
      }
      customRules = {
        cache = {
          refreshAfterWriteDuration = {{ .Values.apiNamingCustomRules.cache.refreshAfterWriteDuration }}
          expireAfterWriteDuration = {{ .Values.apiNamingCustomRules.cache.expireAfterWriteDuration }}
          maximumSize = {{ .Values.apiNamingCustomRules.cache.maximumSize }}
        }
      }
      configs = {
        cache = {
          refreshAfterWriteDuration = {{ .Values.apiNamingConfigs.cache.refreshAfterWriteDuration }}
          expireAfterWriteDuration = {{ .Values.apiNamingConfigs.cache.expireAfterWriteDuration }}
          maximumSize = {{ .Values.apiNamingConfigs.cache.maximumSize }}
        }
      }
    }
    feature.flag.service.config = {
      host = {{ .Values.traceableConfigServiceConfig.featureFlagServiceConfig.host }}
      port = {{ .Values.traceableConfigServiceConfig.featureFlagServiceConfig.port }}
      request.timeout = {{ .Values.traceableConfigServiceConfig.featureFlagServiceConfig.request.timeout }}
      cache {
        refresh.duration = {{ .Values.traceableConfigServiceConfig.featureFlagServiceConfig.cache.refresh.duration }}
        expiration.duration = {{ .Values.traceableConfigServiceConfig.featureFlagServiceConfig.cache.expiration.duration }}
        thread.pool.size = {{ .Values.traceableConfigServiceConfig.featureFlagServiceConfig.cache.thread.pool.size }}
      }
    }
    anomaly.config.service = {
      include "anomaly.conf"
    }
    risk.config.service = {
      include "risk.conf"
    }
    label.application.rule.config.service {
      include "label-application-rule.conf"
    }
    notification.channel.config.service {
      webhook.exclusion.domains = {{ .Values.traceableConfigServiceConfig.notificationChannelConfigServiceConfig.webhookExclusionDomains | toJson }}
      webhook.http.support.enabled = {{ .Values.traceableConfigServiceConfig.notificationChannelConfigServiceConfig.webhookHttpSupportEnabled }}
    }
    splunk.integration.config.service {
      splunk.http.support.enabled = {{ .Values.traceableConfigServiceConfig.splunkIntegrationConfigServiceConfig.splunkHttpSupportEnabled }}
    }
    traceable.edge.config.service = {
      include "traceable-edge.conf"
    }
    detection.exclusion.config.service = {
      migrationDisabled = {{ .Values.traceableConfigServiceConfig.detectionExclusionConfigService.migrationDisabled }}
      changeLog2.migrationDisabled = {{ .Values.traceableConfigServiceConfig.detectionExclusionConfigService.changeLog2.migrationDisabled }}
      changeLog3.migrationDisabled = {{ .Values.traceableConfigServiceConfig.detectionExclusionConfigService.changeLog3.migrationDisabled }}
      ruleEvaluationPoints.migrationDisabled = {{ .Values.traceableConfigServiceConfig.detectionExclusionConfigService.ruleEvaluationPoints.migrationDisabled }}
      {{- if .Values.traceableConfigServiceConfig.detectionExclusionConfigService.defaultDetectionExclusionRules }}
      defaultDetectionExclusionRules =
        {{- .Values.traceableConfigServiceConfig.detectionExclusionConfigService.defaultDetectionExclusionRules | nindent 8 }}
      {{- end }}
    }
    rate.limiting.config.service {
      changeLog1.migrationDisabled = {{ .Values.traceableConfigServiceConfig.rateLimitingConfigService.changeLog1.migrationDisabled }}
      ruleEvaluationPoints.migrationDisabled = {{ .Values.traceableConfigServiceConfig.rateLimitingConfigService.ruleEvaluationPoints.migrationDisabled }}
    }
    iprange.config.service {
      changeLog1.migrationDisabled = {{ .Values.traceableConfigServiceConfig.iprangeConfigService.changeLog1.migrationDisabled }}
    }
    malicious.sources.config.service {
      changeLog1.migrationDisabled = {{ .Values.traceableConfigServiceConfig.maliciousSourcesConfigService.changeLog1.migrationDisabled }}
    }
    ast.config.service = {
      defaultPurgeDuration = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultPurgeDuration }}
      defaultScanRetentionLimitPerSuite = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultScanRetentionLimitPerSuite }}
      defaultAstFeatureConfig = {
        astEnabled = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultAstFeatureConfig.astEnabled }}
        astReplayConfig = {
          enabled = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultAstFeatureConfig.astReplayConfig.enabled }}
          apiInactivityDuration = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultAstFeatureConfig.astReplayConfig.apiInactivityDuration }}
          maxApiLimit = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultAstFeatureConfig.astReplayConfig.maxApiLimit }}
          skipNonLearntApis = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultAstFeatureConfig.astReplayConfig.skipNonLearntApis }}
          skipUnderDiscoveryApis = {{ .Values.traceableConfigServiceConfig.astConfigService.defaultAstFeatureConfig.astReplayConfig.skipUnderDiscoveryApis }}
        }
      }
    }
    {{- if hasKey $.Values.traceableConfigServiceConfig "spanProcessingConfig" }}
    span.processing.config.service = {
      {{- if hasKey .Values.traceableConfigServiceConfig.spanProcessingConfig "defaultRequestHeaderRetentionRules" }}
      default.request.header.retention.rules = {{- .Values.traceableConfigServiceConfig.spanProcessingConfig.defaultRequestHeaderRetentionRules | indent 6 }}
      {{- end }}
      {{- if hasKey .Values.traceableConfigServiceConfig.spanProcessingConfig "defaultResponseHeaderRetentionRules" }}
      default.response.header.retention.rules = {{- .Values.traceableConfigServiceConfig.spanProcessingConfig.defaultResponseHeaderRetentionRules | indent 6 }}
      {{- end }}
      {{- if hasKey .Values.traceableConfigServiceConfig.spanProcessingConfig "defaultAttributeRetentionRules" }}
      default.attribute.retention.rules = {{- .Values.traceableConfigServiceConfig.spanProcessingConfig.defaultAttributeRetentionRules | indent 6 }}
      {{- end }}
      {{- if hasKey .Values.traceableConfigServiceConfig.spanProcessingConfig "systemExcludeSpanRules" }}
      system.exclude.span.rules = {{- .Values.traceableConfigServiceConfig.spanProcessingConfig.systemExcludeSpanRules | indent 6 }}
      {{- end }}
      {{- if hasKey .Values.traceableConfigServiceConfig.spanProcessingConfig "apiSpecConfigServiceTimeout" }}
      api.spec.config.service.timeout = {{ .Values.traceableConfigServiceConfig.spanProcessingConfig.apiSpecConfigServiceTimeout }}
      {{- end }}
    }
    {{- end }}
    span.exclusion.rules = {
      agent.unsupported.rule.ids = {{ .Values.traceableConfigServiceConfig.spanExclusionRules.agentUnsupportedRuleIds | toJson }}
    }
    
    api.spec.config = {
      max.allowed.specs.per.tenant = {{ .Values.traceableConfigServiceConfig.apiSpecConfig.maxAllowedSpecsPerTenant }}
    }
    
    local.api.naming.config = {
      agent.polling.frequency = {{ .Values.localApiNamingConfig.agentPollingFrequency }}
      {{- if hasKey $.Values.localApiNamingConfig "fullTrieReloadConfig" }}
      full.trie.reload.config = {
        {{- range $k,$v := $.Values.localApiNamingConfig.fullTrieReloadConfig }}
          {{- if eq $k "default" }}
          default = {
            disabled = {{ $.Values.localApiNamingConfig.fullTrieReloadConfig.default.disabled }}
            version = {{ $.Values.localApiNamingConfig.fullTrieReloadConfig.default.version | quote }}
          }
          {{- else }}
          {{ $k }} = {
            {{- range $sk,$sv := $v }}
              {{ $sk }} = {
                disabled = {{ $sv.disabled }}
                version = {{ $sv.version | quote}}
              }
            {{- end }}
          }
          {{- end }}
        {{- end }}
      }
      {{- end }}
    }
    external.data.classification.config.service = {
      {{- if .Values.traceableConfigServiceConfig.externalDataClassificationServiceConfig.defaultExternalDataTypes }}
      default.external.data.types = [
        {{- .Values.traceableConfigServiceConfig.externalDataClassificationServiceConfig.defaultExternalDataTypes | nindent 8 }}
      ]
      {{- end }}
      cache {
        refresh = {{ .Values.traceableConfigServiceConfig.externalDataClassificationServiceConfig.cache.refresh }}
        maxSize = {{ int .Values.traceableConfigServiceConfig.externalDataClassificationServiceConfig.cache.maxSize }}
      }
    }
    saved.query.config.service = {
      userDataMigrationFlag = {{ .Values.savedQueriesConfig.userDataMigrationFlag }}
    }
    jwt.extraction.config.service = {
      {{- if .Values.defaultJwtExtractionConfigRules }}
      default.jwt.extraction.rules = {{- .Values.defaultJwtExtractionConfigRules | indent 6 }}
      {{- end }}
    }
    attribute.service.config = {
      host = {{ .Values.traceableConfigServiceConfig.attributeServiceConfig.host }}
      port = {{ .Values.traceableConfigServiceConfig.attributeServiceConfig.port }}
      request.timeout = {{ .Values.traceableConfigServiceConfig.attributeServiceConfig.request.timeout }}
    }
    
    threat.management.config.service {
      decay {
        percentage.value = {{ .Values.threatManagementConfig.decay.percentageValue | default 14 }}
        after.duration = {{ .Values.threatManagementConfig.decay.afterDuration | default "1d" }}
      }
    }
    
    fraud.datamodel.derivation.config.service = {
      default.derivation.configs = {{- .Values.fraudDataModelDerivationConfigService.defaultFraudDataModelDerivations | indent 6 }}
    }

  anomaly.conf: |-
    modsecRuleVersion = {{ .Values.anomalyConfigServiceConfig.modsecRuleVersion }}
    global {
      disabled = {{ .Values.anomalyConfigServiceConfig.global.disabled }}
      internal = {{ .Values.anomalyConfigServiceConfig.global.internal }}
      licenseTiers = {{- .Values.anomalyConfigServiceConfig.global.licenseTiers | indent 6 }}
      modsecGlobalConfig {
        defaultConfigsType = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.defaultConfigsType }}
        exitSpansEvalEnabled = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.exitSpansEvalEnabled }}
        ruleVersion {
          newWebAppStableVersion = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.newWebAppStableVersion }}
          newWebAppStableVersionPublishedDate = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.newWebAppStableVersionPublishedDate | quote }}
          oldWebAppStableVersion = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.oldWebAppStableVersion }}
          oldWebAppStableVersionPublishedDate = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.oldWebAppStableVersionPublishedDate | quote }}
          webAppRuleTestingModeRetentionDays = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.webAppRuleTestingModeRetentionDays }}
        }
        environmentDefaultConfigType = {{ .Values.anomalyConfigServiceConfig.global.modsecGlobalConfig.environmentDefaultConfigType }}
      }
      apiGlobalConfig {
        defaultConfigsType = {{ .Values.anomalyConfigServiceConfig.global.apiGlobalConfig.defaultConfigsType }}
        exitSpansEvalEnabled = {{ .Values.anomalyConfigServiceConfig.global.apiGlobalConfig.exitSpansEvalEnabled }}
         ruleVersion {
            newApiProtectionStableVersion = {{ .Values.anomalyConfigServiceConfig.global.apiGlobalConfig.newApiProtectionStableVersion }}
            newApiProtectionStableVersionPublishedDate = {{ .Values.anomalyConfigServiceConfig.global.apiGlobalConfig.newApiProtectionStableVersionPublishedDate | quote }}
            oldApiProtectionStableVersion = {{ .Values.anomalyConfigServiceConfig.global.apiGlobalConfig.oldApiProtectionStableVersion }}
            oldApiProtectionStableVersionPublishedDate = {{ .Values.anomalyConfigServiceConfig.global.apiGlobalConfig.oldApiProtectionStableVersionPublishedDate | quote }}
        }
      }
    }
    modsec.config.service = {
      webAppConfigContextCache {
        maxSize = {{ .Values.anomalyConfigServiceConfig.modsecConfigService.webAppConfigContextCache.maxSize }}
        refreshAfterWriteDuration = {{ .Values.anomalyConfigServiceConfig.modsecConfigService.webAppConfigContextCache.refreshAfterWriteDuration }}
        threadPoolSize = {{ .Values.anomalyConfigServiceConfig.modsecConfigService.webAppConfigContextCache.threadPoolSize }}
      }
    }
    trainer.config.service = {
      {{- if .Values.defaultApiNamingTrainerConfigs }}
      apiNamingTrainingConfigs = {{- .Values.defaultApiNamingTrainerConfigs | indent 6 }}
      {{- end }}
      {{- if .Values.defaultVulnerabilityTrainingConfigs }}
      vulnerabilityTrainingConfigs = {{- .Values.defaultVulnerabilityTrainingConfigs | indent 6 }}
      {{- end }}
    }
    detector.config.service = {
      {{- if .Values.defaultModsecDetectionConfigs }}
      modsecDetectionConfigs = {{- .Values.defaultModsecDetectionConfigs | indent 6 }}
      {{- end }}
    }

  risk.conf: |-
    {{- if hasKey .Values "riskConfigServiceConfig" }}
      {{- if hasKey .Values.riskConfigServiceConfig "riskLevelConfigValues" }}
        riskLevelConfigValues = {{- .Values.riskConfigServiceConfig.riskLevelConfigValues | indent 2 }}
      {{- end }}
      {{- if hasKey .Values.riskConfigServiceConfig "riskFactorGridConfigValues" }}
        riskFactorGridConfigValues = {{- .Values.riskConfigServiceConfig.riskFactorGridConfigValues | indent 2 }}
      {{- end }}
    {{- end }}

  label-application-rule.conf: |-
    {{- if hasKey .Values "labelApplicationRuleConfigServiceConfig" }}
      {{- if hasKey .Values.labelApplicationRuleConfigServiceConfig "maxDynamicLabelApplicationRulesPerTenant" }}
        max.dynamic.label.application.rules.per.tenant = {{- .Values.labelApplicationRuleConfigServiceConfig.maxDynamicLabelApplicationRulesPerTenant | indent 2 }}
      {{- end }}
    {{- end }}

  traceable-edge.conf: |-
    {{- if .Values.defaultTraceableEdgeUserAttributionVariables }}
    default.variables.user-attribution = {{- .Values.defaultTraceableEdgeUserAttributionVariables | indent 4 }}
    {{- end }}
    get.configs.thread.pool.size = {{ .Values.traceableEdgeConfigService.getConfigsThreadPoolSize }}