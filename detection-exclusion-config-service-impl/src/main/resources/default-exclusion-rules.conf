  {
    // DO NOT CHANGE RULE ID
    id = "traceable-ootb-gh-webhook"
    ruleInfo = {
      name = "Default: Github Webhook Endpoints Exclusion Rule"
      description = "Excluding SQL, XSS & RCE detection on pull-request and commit-message payloads in github webhook endpoints"
      ruleStatus = {
        ruleCreationSource = RULE_SOURCE_DEFAULT
        disabled = false
        hidden = true
      }
      exclusionTargets = [EXCLUSION_TARGET_ALERT]
      conditions = [
        {
          attributeMatchCondition = {
            keyMatchCondition = {
              metadata = KEY_METADATA_URL
            }
            valueMatchCondition = {
              operator = MATCH_OPERATOR_MATCHES_REGEX
              value = "github"
            }
          }
        },
        {
          attributeMatchCondition = {
            keyMatchCondition = {
              metadata = KEY_METADATA_URL
            }
            valueMatchCondition = {
              operator = MATCH_OPERATOR_MATCHES_REGEX
              value = "webhook"
            }
          }
        },
        {
          anomalousAttributeCondition = {
            keyMatchCondition = {
              operator = MATCH_OPERATOR_MATCHES_REGEX
              value = "^http\\.request\\.body\\.(?:pull_request\\.body|.*commit.*message)$"
            }
          }
        },
        {
          eventCondition = {
            systemDefinedEvents = [
              {
                eventFamily = SYSTEM_DEFINED_EVENT_FAMILY_MODSEC
                eventTypeId = "crs_941"
              },
              {
                eventFamily = SYSTEM_DEFINED_EVENT_FAMILY_MODSEC
                eventTypeId = "crs_942"
              },
              {
                eventFamily = SYSTEM_DEFINED_EVENT_FAMILY_MODSEC
                eventTypeId = "crs_932"
              }
            ]
          }
        }
      ]
    }
