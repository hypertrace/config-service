syntax = "proto3";

package ai.traceable.detection.exclusion.config.service.v1;

option java_multiple_files = true;


message EntityScope {
  EntityType entity_type = 1;
  repeated string entity_ids = 2;
}

message LabelScope {
  LabelType label_type = 1;
  repeated string label_ids = 2;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_SERVICE = 1;
  ENTITY_TYPE_API = 2;
}

enum LabelType {
  LABEL_TYPE_UNSPECIFIED = 0;
  LABEL_TYPE_SERVICE = 1;
  LABEL_TYPE_API = 2;
}
