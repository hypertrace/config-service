syntax = "proto3";

package ai.traceable.detection.exclusion.config.service.v1;

option java_multiple_files = true;

import "ai/traceable/detection/exclusion/config/service/v1/detection_exclusion_conditions.proto";


message DetectionExclusionRule {
  string id = 1;
  DetectionExclusionRuleScope rule_scope = 2;
  DetectionExclusionRuleInfo rule_info = 3;
}

message DetectionExclusionRuleScope {
  oneof scope { // if no option selected, default is customer scope (all environments)
    EnvironmentScope environment_scope = 1;
  }
}

message EnvironmentScope {
  repeated string environment_ids = 1;
}

message DetectionExclusionRuleInfo {
  string name = 1;
  string description = 2;
  repeated DetectionExclusionCondition conditions = 3;
  DetectionExclusionRuleStatus rule_status = 4;
  repeated ExclusionTarget exclusion_targets = 5;
}


message DetectionExclusionCondition {
  oneof condition {
    ScopeCondition scope_condition = 1;
    SpanAttributeMatchCondition attribute_match_condition = 2;
    IpLocationTypeCondition ip_location_type_condition = 3;
    IpReputationCondition ip_reputation_condition = 4;
    UserIdCondition user_id_condition = 5;
    EventCondition event_condition = 6;
    AnomalousAttributeCondition anomalous_attribute_condition = 7;
    ScopeCondition source_scope_condition = 8;
    AnomalousAttributeCondition source_anomalous_attribute_match_condition = 9;
    IpAddressCondition ip_address_condition = 10;
    IpConnectionTypeCondition ip_connection_type_condition = 11;
    IpOrganisationCondition ip_organisation_condition = 12;
    IpAsnCondition ip_asn_condition = 13;
    IpAbuseVelocityCondition ip_abuse_velocity_condition = 14;
    RegionCondition region_condition = 15;
    EmailDomainCondition email_domain_condition = 16;
    UserAgentCondition user_agent_condition = 17;
  }
}

message DetectionExclusionRuleStatus {
  bool disabled = 1;
  optional bool hidden = 2;
  optional bool generate_internal_events = 3;
  RuleChangeSource change_source = 4 [deprecated = true];
  RuleSource rule_creation_source = 5;
  RuleIntent rule_intent = 6;
  ExpirationDetails expiration_details = 7;
}

message ExpirationDetails {
  // Expiration duration represented in ISO 8601 duration format.
  // If expiration_duration is not set and expiration_timestamp_millis is set, the value gets derived from the expiration_timestamp_millis field
  optional string expiration_duration = 1;
  // Timestamp at which the blocking expires.
  // If expiration_timestamp_millis is not set and expiration_duration is set, the value gets derived from the expiration_duration field
  optional int64 expiration_timestamp_millis = 2;
}

enum ExclusionTarget {
  EXCLUSION_TARGET_UNSPECIFIED = 0;
  EXCLUSION_TARGET_BLOCK = 1;
  EXCLUSION_TARGET_ALLOW = 2;
  EXCLUSION_TARGET_ALERT = 3;
}

enum RuleSource{
  RULE_SOURCE_UNSPECIFIED = 0;
  RULE_SOURCE_DEFAULT = 1;
  RULE_SOURCE_CUSTOMER = 2;
  RULE_SOURCE_TRACEABLE = 3;
  RULE_SOURCE_OLD_API = 4;
  RULE_SOURCE_SYSTEM = 5;
}

enum RuleChangeSource {
  option deprecated = true;
  RULE_CHANGE_SOURCE_UNSPECIFIED = 0;
  RULE_CHANGE_SOURCE_DEFAULT = 1;
  RULE_CHANGE_SOURCE_CUSTOMER = 2;
  RULE_CHANGE_SOURCE_TRACEABLE = 3;
  RULE_CHANGE_SOURCE_SYSTEM = 4;
}

enum RuleIntent {
  RULE_INTENT_UNSPECIFIED = 0;
  RULE_INTENT_FALSE_POSITIVE = 1;
  RULE_INTENT_INTERNAL_TO_EXTERNAL = 2;
}
