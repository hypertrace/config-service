syntax = "proto3";

package ai.traceable.fraud.policy.config.service.v1;

import "ai/traceable/fraud/policy/config/service/v1/time_object.proto";
import "ai/traceable/fraud/query/model/v1/fraud_data_query.proto";
import "google/protobuf/struct.proto";

option java_multiple_files = true;

// Terminology:
// - Policy - encapsulates the policy definition.
// - Policy Evaluation - represents an instance of a policy's evaluation at a point in time over a given time window.
// - Eval Window - a time window over which a policy is evaluated
// - Anomaly Event (Tuple = [policy,env,target,target_type,primary_entity])
//    - represents a single anomaly event generated by a policy evaluation at a point in time over a given time window.
//    - Identified by [policy,env,target,target_type,primary_entity]
// - Anomaly Series (Tuple = [policy,env,target,target_type,primary_entity])
//    - represents a collection of anomaly events that share the same [policy,env,target,target_type,primary_entity] tuple
//    - An anomaly series is a collection of anomaly events that share the same [policy,env,target,target_type,primary_entity] tuple
// - Trigger (Tuple = [policy,env,target,target_type,primary_entity])
//    - Always Evaluated per Anomaly Series
//    - Trigger is met when the threshold is met for a given [policy,env,target,target_type,primary_entity] tuple
// - Incident (Tuple = [policy,env,target,target_type])
//    - Consists of one or more anomaly series.
//    - Grouping Modes - see comment below
// Example:
// configuration:
// policy:
//   - name = "fraud-policy-1", envs = ["prod", "dev"], targets = ["login", "payment"], target_types = ["api", "api"], primary_entities = ["user1", "user2"]
//   - threshold: > 5 in 10min
// triggers:
//   - create_trigger: anom_count = 2 out of 3 evaluations
//   - close_trigger: normal_count = 2 out of 3 evaluations
// Series:
// - series1 = [policy = "fraud-policy-1", env = "prod", target = "login", target_type = "api", primary_entity = "user1"]
// - series2 = [policy = "fraud-policy-1", env = "prod", target = "login", target_type = "api", primary_entity = "user2"]
// - series3 = [policy = "fraud-policy-1", env = "dev", target = "login", target_type = "api", primary_entity = "user1"]
// - series4 = [policy = "fraud-policy-1", env = "dev", target = "login", target_type = "api", primary_entity = "user2"]
// - series5 = [policy = "fraud-policy-1", env = "prod", target = "payment", target_type = "api", primary_entity = "user1"]
// - series6 = [policy = "fraud-policy-1", env = "prod", target = "payment", target_type = "api", primary_entity = "user2"]
// - series7 = [policy = "fraud-policy-1", env = "dev", target = "payment", target_type = "api", primary_entity = "user1"]
// - series8 = [policy = "fraud-policy-1", env = "dev", target = "payment", target_type = "api", primary_entity = "user2"]
// Evaluations:
// t0:
//   - series1: anom=true
//   - series2: anom=true
//   - series3: anom=true
//   - series4: anom=true
//   - series5: anom=false
//   - series6: anom=false
//   - series7: anom=false
//   - series8: anom=false
// - TriggerProcessor
//   - series1: create_trigger=false, close_trigger=false
//   - series2: create_trigger=false, close_trigger=false
//   - series3: create_trigger=false, close_trigger=false
//   - series4: create_trigger=false, close_trigger=false
//   - series5: create_trigger=false, close_trigger=false
//   - series6: create_trigger=false, close_trigger=false
//   - series7: create_trigger=false, close_trigger=false
//   - series8: create_trigger=false, close_trigger=false
// - IncidentConsumer (Describe different grouping modes)
//   - Nothing to do.
// t1:
//   - series1: anom=true
//   - series2: anom=true
//   - series3: anom=true
//   - series4: anom=true
//   - series5: anom=false
//   - series6: anom=false
//   - series7: anom=false
//   - series8: anom=false
// - TriggerProcessor
//   - series1: create_trigger=true, close_trigger=false. incident_event_type = STARTED
//   - series2: create_trigger=true, close_trigger=false. incident_event_type = STARTED
//   - series3: create_trigger=true, close_trigger=false. incident_event_type = STARTED
//   - series4: create_trigger=true, close_trigger=false. incident_event_type = STARTED
//   - series5: create_trigger=false, close_trigger=false
//   - series6: create_trigger=false, close_trigger=false
//   - series7: create_trigger=false, close_trigger=false
//   - series8: create_trigger=false, close_trigger=false
// - IncidentConsumer
//   - GROUPING_MODE_DEFAULT
//     - incident1: series1, series2. status = ACTIVE
//     - incident2: series3, series4. status = ACTIVE
//   - GROUPING_MODE_ANOMALY_SERIES
//     - incident1: series1. status = ACTIVE
//     - incident2: series2. status = ACTIVE
//     - incident3: series3. status = ACTIVE
//     - incident4: series4. status = ACTIVE
//   - GROUPING_MODE_EVAL_WINDOW
//     - incident1: series1, series2. status = CLOSED
//     - incident2: series3, series4. status = CLOSED
//   - GROUPING_MODE_EVAL_WINDOW_AND_ANOMALY_SERIES
//     - incident1: series1. status = CLOSED
//     - incident2: series2. status = CLOSED
//     - incident3: series3. status = CLOSED
//     - incident4: series4. status = CLOSED
// t2:
//   - series1: anom=false
//   - series2: anom=false
//   - series3: anom=false
//   - series4: anom=false
//   - series5: anom=false
//   - series6: anom=false
//   - series7: anom=false
//   - series8: anom=false
// - TriggerProcessor
//   - series1: create_trigger=false, close_trigger=false. incident_event_type = CONTINUING
//   - series2: create_trigger=true, close_trigger=false. incident_event_type = CONTINUING / STARTED (depending on grouping mode)
//   - series3: create_trigger=false, close_trigger=false. incident_event_type = CONTINUING
//   - series4: create_trigger=true, close_trigger=false. incident_event_type = CONTINUING / STARTED (depending on grouping mode)
//   - series5: create_trigger=false, close_trigger=false
//   - series6: create_trigger=false, close_trigger=false
//   - series7: create_trigger=false, close_trigger=false
//   - series8: create_trigger=false, close_trigger=false
// - IncidentConsumer
//   - GROUPING_MODE_DEFAULT
//     - incident1: series1, series2. status = ACTIVE
//     - incident2: series3, series4. status = ACTIVE
//   - GROUPING_MODE_ANOMALY_SERIES
//     - incident1: series1. status = ACTIVE
//     - incident2: series2. status = ACTIVE
//     - incident3: series3. status = ACTIVE
//     - incident4: series4. status = ACTIVE
//   - GROUPING_MODE_EVAL_WINDOW
//     - incident1: series1, series2. status = CLOSED
//     - incident2: series3, series4. status = CLOSED
//   - GROUPING_MODE_EVAL_WINDOW_AND_ANOMALY_SERIES
//     - incident1: series1. status = CLOSED
//     - incident2: series2. status = CLOSED
//     - incident3: series3. status = CLOSED
//     - incident4: series4. status = CLOSED
// t3:
//   - series1: anom=false
//   - series2: anom=false
//   - series3: anom=false
//   - series4: anom=false
//   - series5: anom=false
//   - series6: anom=false
//   - series7: anom=false
//   - series8: anom=false
// - TriggerProcessor
//   - series1: create_trigger=false, close_trigger=true. incident_event_type = STOPPED
//   - series2: create_trigger=false, close_trigger=false. incident_event_type = CONTINUING / CREATE (depending on grouping mode)
//   - series3: create_trigger=false, close_trigger=true. incident_event_type = STOPPED
//   - series4: create_trigger=false, close_trigger=false. incident_event_type = CONTINUING / CREATE (depending on grouping mode)
//   - series5: create_trigger=false, close_trigger=false
//   - series6: create_trigger=false, close_trigger=false
//   - series7: create_trigger=false, close_trigger=false
//   - series8: create_trigger=false, close_trigger=false
// - IncidentConsumer
//   - GROUPING_MODE_DEFAULT
//     - incident1: series1, series2. status = ACTIVE
//     - incident2: series3, series4. status = ACTIVE
//   - GROUPING_MODE_ANOMALY_SERIES
//     - incident1: series1. status = CLOSED
//     - incident2: series2. status = ACTIVE
//     - incident3: series3. status = CLOSED
//     - incident4: series4. status = ACTIVE
//   - GROUPING_MODE_EVAL_WINDOW
//     - incident1: series1, series2. status = CLOSED
//     - incident2: series3, series4. status = CLOSED
//   - GROUPING_MODE_EVAL_WINDOW_AND_ANOMALY_SERIES
//     - incident1: series1. status = CLOSED
//     - incident2: series2. status = CLOSED
//     - incident3: series3. status = CLOSED
//     - incident4: series4. status = CLOSED
// t4:
//   - series1: anom=false
//   - series2: anom=false
//   - series3: anom=false
//   - series4: anom=false
//   - series5: anom=false
//   - series6: anom=false
//   - series7: anom=false
//   - series8: anom=false
// - TriggerProcessor
//   - series1: create_trigger=false, close_trigger=false
//   - series2: create_trigger=false, close_trigger=true. incident_event_type = STOPPED
//   - series3: create_trigger=false, close_trigger=false
//   - series4: create_trigger=false, close_trigger=true. incident_event_type = STOPPED
//   - series5: create_trigger=false, close_trigger=false
//   - series6: create_trigger=false, close_trigger=false
//   - series7: create_trigger=false, close_trigger=false
//   - series8: create_trigger=false, close_trigger=false
// - IncidentConsumer
//   - GROUPING_MODE_DEFAULT
//     - incident1: series1, series2. status = CLOSED
//     - incident2: series3, series4. status = CLOSED
//   - GROUPING_MODE_ANOMALY_SERIES
//     - incident2: series2. status = CLOSED
//     - incident4: series4. status = CLOSED
//   - GROUPING_MODE_EVAL_WINDOW
//     - Nothing to do. Only STARTED events will be considered
//   - GROUPING_MODE_EVAL_WINDOW_AND_ANOMALY_SERIES
//     - Nothing to do. Only STARTED events will be considered
// Runtime:
// each policy evaluation produces one or more anomaly events (series - because the same tuple can have multiple events over time)
// each anomaly event/series corresponds to [policy,env,target,target_type,primary_entity] tuple
// each anomaly series has a corresponding trigger processor, that has a TriggerListener
// output of trigger processor is given to IncidentConsumer which is responsible for lifecycle of incidents
// Depending on the grouping mode, variety of IncidentConsumers can be used
enum IncidentGroupingMode {
  INCIDENT_GROUPING_MODE_UNSPECIFIED = 0;

  // By default, we will group all anomaly series and all windows in an incident.
  // An incident is OPENED when a series matches the trigger condition.
  // It continues to be OPEN as long as there is at least one series that's matching the trigger condition.
  // An incident is CLOSED only when all series return to NORMAL.
  // This generates less incidents.
  // For ex: if there are 2 anomaly series, then 1 incident will be generated for all 2 anomaly series.
  // Even if one of them returns to NORMAL
  // Max active incidents = 1 per [policy,env,target,target_type]
  INCIDENT_GROUPING_MODE_DEFAULT = 1;

  // An incident is OPENED when a series matches the trigger condition. It continues to be OPEN as long as the
  // same series matches the trigger condition. The incident is CLOSED when the series returns to NORMAL.
  // so, grouping is at a SERIES level, for any evaluation window.
  // This generates one incident per Anomaly series
  // For ex: if there are 2 anomaly series, then 2 incidents will be generated. One for each anomaly series
  // Max active incidents = number of anomaly series
  INCIDENT_GROUPING_MODE_SERIES = 2;

  // An incident is OPENED for all series for a single evaluation window. It is CLOSED at the end of the window.
  // so, grouping is at a WINDOW level, for any series that's matches the trigger condition in that window.
  // This generates one incident per evaluation window.
  // Maximum number of incidents that can be generated is (number of evaluation windows)
  // Max active incidents = number of evaluation windows
  // Should be used ONLY if eval window is large and eval frequency is low
  INCIDENT_GROUPING_MODE_EVAL_WINDOW = 3;

  // An incident is OPENED for each series for each evaluation window. It is CLOSED at the end of the window.
  // so, there is no grouping done at the series level OR window level.
  // This generates one incident per evaluation window per series
  // Maximum number of incidents that can be generated is (number of evaluation windows) * (number of anomaly series)
  // Max active incidents = number of evaluation windows * number of anomaly series
  // Should be used ONLY if eval window is large and eval frequency is low
  // no grouping is done, each anomaly event is treated as a separate incident
  INCIDENT_GROUPING_MODE_NONE = 4;
}

message IncidentConfig {
  IncidentGroupingMode grouping_mode = 1;
  ai.traceable.fraud.policy.config.service.v1.TimeObj max_incident_duration = 2;
  CreateTriggers create_triggers = 3;
  CloseTriggers close_triggers = 4;
  oneof tags_source {
    // project specific tags - usually from the anomaly events
    ai.traceable.fraud.query.model.v1.EntityGraphDataQuery entity_graph_data_query = 5;
  }
  bool disabled = 6;
  google.protobuf.Value custom_fields = 100;
}

message CreateTriggers {
  repeated CreateTrigger and = 1;
  repeated CreateTrigger or = 2;
}

message CloseTriggers {
  repeated CloseTrigger or = 1;
  repeated CloseTrigger and = 2;
}

// these are incident triggers. for create and close
// PIVOT: per anomaly group (usually policy_id, environment, target, target_type, (optional) primary_tags)
// all the following statements are applicable per anomaly group identified by the Pivot.
// a window is a set of anomaly events. The window is open until the trigger is met or enough evaluations are done to close the window
// each evaluation results in:
// - one or more anomaly events
// - each evaluation emits one or more anomaly events that are added to a window.
// - if the window "triggers", then look for an existing incident and update it. Or create a new one.
enum CreateTriggerType {
  CREATE_TRIGGER_TYPE_UNSPECIFIED = 0;
  // trigger based on count of anomalies in a window
  // for ex: window = 5 evaluations, trigger if 3 or more anomalies
  CREATE_TRIGGER_TYPE_COUNT = 1;
}

enum CloseTriggerType {
  CLOSE_TRIGGER_TYPE_UNSPECIFIED = 0;
  // trigger based on count of anomalies in a window
  // for ex: window = 5 evaluations, trigger if 3 or more normal (non-anomalous) points
  CLOSE_TRIGGER_TYPE_COUNT = 1;
  // trigger based on time
  CLOSE_TRIGGER_TYPE_TIME = 2;
}

message TriggerWindow {
  // definition of a window: either time-based or count based
  oneof in {
    ai.traceable.fraud.policy.config.service.v1.TimeObj total_time = 1;
    int32 total_evaluations = 2;
  }
}

message CreateTrigger {
  oneof type {
    CountTrigger count_trigger = 1;
  }
}

message CloseTrigger {
  oneof type {
    CloseCountTrigger close_count_trigger = 1;
    CloseTimeTrigger close_time_trigger = 2;
  }
}

message CountTrigger {
  CreateTriggerType type = 1;
  // window to consider: time-based or count-based
  TriggerWindow window = 2;
  // threshold of anomCount=count(anomalous points) in a window
  int32 anom_count = 3;
  double min_anom_score = 5;
}

message CloseCountTrigger {
  CloseTriggerType type = 1;
  // window to consider: usually count-based
  TriggerWindow window = 2;
  // threshold of count. how many normal points in a window
  int32 normal_count = 3;
}

message CloseTimeTrigger {
  CloseTriggerType type = 1;
  ai.traceable.fraud.policy.config.service.v1.TimeObj close_time = 2;
}
