syntax = "proto3";

package ai.traceable.fraud.policy.config.service.v1;

import "ai/traceable/edge/decision/config/service/v1/edge_decision_rule.proto";
import "ai/traceable/graphql/autogen/schema/annotations/field/v1/graphql_field_options.proto";
import "google/protobuf/duration.proto";

option java_multiple_files = true;

message AbusePredefinedBrowserBypassPolicy {
  // target api specific configuration for client type config generation
  BrowserBypassTrainingConfig training_config = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Target-API settings for generating client-type bypass configs (filters, window, thresholds, etc)"];
  // configurations for generating fraud policies based on the outcome of training
  BrowserBypassPolicyGenerationConfig policy_generation_config = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Target-API settings for generating client-type bypass configs (filters, window, thresholds, etc)"];
  // target api specific triage configuration
  BrowserBypassTriageConfig triage_config = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Providing actionability to prevent/monitor attacks subsequently"];
}

message BrowserBypassTrainingConfig {
  // correlation key used to attribute user for a session/flow
  repeated string correlation_key = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "List of correlation keys used to attribute traffic to a user or session for browser bypass detection"];
  // During config generation exclude spans with certain status code using regex
  string exclude_status_code_regex = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Regex matching HTTP status codes to exclude spans during config generation"];
  // time window pre and post the target api to consider a legitimate call pre pre -> target -> post api
  google.protobuf.Duration window_size = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Lookback/lookahead duration around the target API to treat calls as a legitimate pre-target-post flow"];
}

message BrowserBypassPolicyGenerationConfig {
  // exact strings for client types to exclude
  repeated string excluded_client_types = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Client type strings to exclude from training"];
  // threshold in percent (0-1) to filter correlated apis
  double min_occurrence_rate_for_correlated_apis = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Minimum occurrence rate between 0 and 1 to retain correlated APIs"];
  // time window for target API to call an attack
  google.protobuf.Duration min_spans_to_call_attack_window = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Observation window for target API when calling an attack"];
  // min spans to be seen for target API to call an attack
  int32 min_spans_to_call_attack_count = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Minimum spans to be seen for the target API within window to call an attack"];
}

message BrowserBypassTriageConfig {
  // eds action to enforce/generate post policy hit
  ai.traceable.edge.decision.config.service.v1.EdgeDecisionType action = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Edge decision action to be enforced post policy hit"];
}
