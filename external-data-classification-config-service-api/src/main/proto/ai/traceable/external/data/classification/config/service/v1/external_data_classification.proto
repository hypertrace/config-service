syntax = "proto3";

package ai.traceable.external.data.classification.config.service.v1;

option go_package = "github.com/Traceableai/config-service/gen/go/ai/traceable/external/data/classification/config/service/v1";
option java_multiple_files = true;

message DataParsingRule {
  SpanFilter span_filter = 1;
  AttributeFilter attribute_filter = 2;
  DataParsingMode mode = 3;
  oneof failure_strategy {
    DropOnFailure drop_on_failure = 10;
  }

  enum DataParsingMode {
    DATA_PARSING_MODE_UNSPECIFIED = 0;
    DATA_PARSING_MODE_JSON = 1;
    DATA_PARSING_MODE_COOKIE_STRING = 2;
    DATA_PARSING_MODE_SQL = 3;
    DATA_PARSING_MODE_URL_ENCODED = 4;
    DATA_PARSING_MODE_XML = 5;
    DATA_PARSING_MODE_MULTIPART = 6;
  }

  message DropOnFailure {
  }
}

message DataType {
  string data_type_id = 1;
  repeated DataTypeMatchRule match_rules = 2;
  optional DataTransformation transformation = 3;
  bool session_identifier = 4;
  // Regex pattern used to identify capture groups to suppress (obfuscate or redact)
  // e.g. (.*)@(?:.*) to suppress an email address but not the domain. person@host.com -> ***@host.com
  // If omitted, suppress full value
  optional string suppression_pattern = 5;

  enum DataTransformation {
    DATA_TRANSFORMATION_UNSPECIFIED = 0;
    DATA_TRANSFORMATION_REDACT = 1;
    DATA_TRANSFORMATION_OBFUSCATE = 2;
  }

  message DataTypeMatchRule {
    SpanFilter span_filter = 1;
    AttributeFilter attribute_filter = 2;
    Result result = 3;
    oneof predicate {
      PathPredicate path_predicate = 5;
      PathValuePredicate path_value_predicate = 6;
    }
  }

  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_MATCH = 1;
    RESULT_IGNORE = 2;
  }
}

message SpanFilter {
  // TODO - this could include things like API scoping in the future
  // This supports things like matching a url before checking for a particular param name
  repeated AttributePredicate required_matching_attributes = 1;
}

message AttributeFilter {
  // This is used to, for example, restrict matches to only headers
  repeated string prefixes = 1;
}

message StringPredicate {
  Operator operator = 1;
  string value = 2;
}

message PathPredicate {
  oneof path {
    string json_path = 1;
    StringPredicate path_segment_predicate = 2;
    StringPredicate leaf_path_segment_predicate = 3;
  }
}

message AttributePredicate {
  StringPredicate name_predicate = 1;
  StringPredicate value_predicate = 2;
}

message PathValuePredicate {
  PathPredicate path_predicate = 1;
  StringPredicate value_predicate = 2;
}

enum Operator {
  OPERATOR_UNSPECIFIED = 0;
  OPERATOR_EQUALS = 1;
  OPERATOR_MATCHES_REGEX = 2;
}

message ObfuscationStrategy {
  HashFunction hash_function = 1;
  string salt = 2;

  enum HashFunction {
    HASH_FUNCTION_UNSPECIFIED = 0;
    HASH_FUNCTION_SHA256 = 1;
  }
}
