syntax = "proto3";

package ai.traceable.region.config.service.v1;

option java_multiple_files = true;

message GetRegionsRequest {
  RegionsFilter filter = 1;
}

message RegionsFilter {
  repeated string id = 1;
}

message GetRegionsResponse {
  repeated Region region = 1;
}

message GetRegionRequest {
  string id = 1;
}

message GetRegionResponse {
  Region region = 1;
}

message GetDetailedRegionsRequest {
  RegionsFilter filter = 1;
}

message GetDetailedRegionsResponse {
  repeated DetailedRegion region = 1;
}

message Region {
  string id = 1;
  string name = 2;
}

message DetailedRegion {
  string id = 1;
  string name = 2;
  repeated IpRange ip_range = 3;
}

message IpRange {
  oneof range {
    IpV4Range ipv4_range = 1;
  }
}

message IpV4Range {
  int64 start_ip = 1;
  int64 end_ip = 2;
}

message GetRegionRulesFilter {
  RuleScope rule_scope = 1;
  repeated RegionRuleActionType rule_action_types = 2;
  optional bool disabled = 8;
  optional bool internal = 9;
}

message GetAllRegionRulesRequest {
  GetRegionRulesFilter filter = 1;
}

message GetAllRegionRulesResponse {
  repeated RegionRule rule = 1;
}

message CreateRegionRuleRequest {
  repeated string region_id = 1;
  string name = 2;
  RegionRuleActionType action_type = 3;
  ExpirationDetails expiration_details = 4;
  RuleScope rule_scope = 5;
  EventSeverity event_severity = 6;
  RegionRuleConditions conditions = 7;
  string description = 8;
}

message CreateRegionRuleResponse {
  RegionRule rule = 1;
}

message UpdateRegionRuleRequest {
  string id = 1;
  repeated string region_id = 2;
  string name = 3;
  RegionRuleActionType action_type = 4;
  ExpirationDetails expiration_details = 5;
  RuleScope rule_scope = 6;
  EventSeverity event_severity = 7;
  RegionRuleConditions conditions = 8;
  bool disabled = 9;
  bool internal = 10;
  string description = 11;
}

message UpdateRegionRuleResponse {
  RegionRule rule = 1;
}

message DeleteRegionRuleRequest {
  string id = 1;
}

message DeleteRegionRuleResponse {
}

message ExpirationDetails {
  oneof expiration {
    // Duration represented in ISO 8601 duration format.
    string duration = 1;
  }
}

message RegionRule {
  string id = 1;
  repeated string region_id = 2;
  string name = 3;
  RegionRuleActionType action_type = 4;
  ExpirationDetails expiration_details = 5;
  RuleScope rule_scope = 6;
  EventSeverity event_severity = 7;
  RegionRuleConditions conditions = 8;
  bool disabled = 9;
  bool internal = 10;
  string description = 11;
  map<string, string> region_id_to_name_map = 12;

  message ExpirationDetails {
    // Duration represented in ISO 8601 duration format.
    string duration = 1;
    int64 timestamp_millis = 2;
  }
}

message RegionRuleConditions {
  CustomRegionScopeCondition scope = 1;
  IpReputationCondition ip_reputation = 2;
  StatusCodeMatchCondition status_code_match_condition = 3;
}

message RuleScope {
  oneof scope { // if no option selected, default is customer scope (all environments)
    EnvironmentScope environment_scope = 1;
  }
}

message EnvironmentScope {
  repeated string environment_ids = 1;
}

enum RegionRuleActionType {
  REGION_RULE_ACTION_TYPE_UNSPECIFIED = 0;
  REGION_RULE_ACTION_TYPE_BLOCK = 1;
  REGION_RULE_ACTION_TYPE_ALLOW = 2;
  REGION_RULE_ACTION_TYPE_BLOCK_ALL_EXCEPT = 3;
  REGION_RULE_ACTION_TYPE_ALERT = 4;
}

enum EventSeverity {
  EVENT_SEVERITY_UNSPECIFIED = 0;
  EVENT_SEVERITY_LOW = 1;
  EVENT_SEVERITY_MEDIUM = 2;
  EVENT_SEVERITY_HIGH = 3;
  EVENT_SEVERITY_CRITICAL = 4;
}

message CustomRegionScopeCondition {
  repeated CustomRegionScope scopes = 1;
}

message CustomRegionScope {
  oneof scope {
    CustomRegionEntityScope api_scope = 1;
    CustomRegionEntityScope service_scope = 2;
  }
}

message CustomRegionEntityScope {
  oneof ids {
    StringList entity_ids = 1;
    StringList label_ids = 2;
  }
}

message StringList {
  repeated string values = 1;
}

message IpReputationCondition {
  IpReputationSeverity min_ip_reputation_severity = 1;
}

enum IpReputationSeverity {
  IP_REPUTATION_SEVERITY_UNSPECIFIED = 0;
  IP_REPUTATION_SEVERITY_LOW = 1;
  IP_REPUTATION_SEVERITY_MEDIUM = 2;
  IP_REPUTATION_SEVERITY_HIGH = 3;
  IP_REPUTATION_SEVERITY_CRITICAL = 4;
}

message StatusCodeMatchCondition {
  StatusCodeMatchType match_type = 1;
  string match_value = 2;
}

enum StatusCodeMatchType {
  STATUS_CODE_MATCH_TYPE_UNSPECIFIED = 0;
  STATUS_CODE_MATCH_TYPE_EQUALS = 1;
  STATUS_CODE_MATCH_TYPE_NOT_EQUAL = 2;
  STATUS_CODE_MATCH_TYPE_MATCHES_REGEX = 3;
  STATUS_CODE_MATCH_TYPE_NOT_MATCH_REGEX = 4;
}
