syntax = "proto3";

package ai.traceable.alerting.config.service.v2;

option java_multiple_files = true;

message ExcludeSpanRuleConfigChangeCondition {
  repeated ExcludeSpanRuleConfigChangeType change_types = 1;
}

enum ExcludeSpanRuleConfigChangeType {
  EXCLUDE_SPAN_RULE_CONFIG_CHANGE_TYPE_UNSPECIFIED = 0;
  EXCLUDE_SPAN_RULE_CONFIG_CHANGE_TYPE_CREATE = 1;
  EXCLUDE_SPAN_RULE_CONFIG_CHANGE_TYPE_UPDATE = 2;
  EXCLUDE_SPAN_RULE_CONFIG_CHANGE_TYPE_DELETE = 3;
}
