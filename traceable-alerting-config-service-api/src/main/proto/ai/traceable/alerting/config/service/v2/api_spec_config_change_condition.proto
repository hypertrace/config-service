syntax = "proto3";

package ai.traceable.alerting.config.service.v2;

option java_multiple_files = true;

message ApiSpecConfigChangeCondition {
  repeated ApiSpecConfigChangeType change_types = 1;
}

enum ApiSpecConfigChangeType {
  API_SPEC_CONFIG_CHANGE_TYPE_UNSPECIFIED = 0;
  API_SPEC_CONFIG_CHANGE_TYPE_CREATE = 1;
  API_SPEC_CONFIG_CHANGE_TYPE_UPDATE = 2;
  API_SPEC_CONFIG_CHANGE_TYPE_DELETE = 3;
}
