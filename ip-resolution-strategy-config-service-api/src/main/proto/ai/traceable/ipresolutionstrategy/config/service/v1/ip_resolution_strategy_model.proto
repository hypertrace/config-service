syntax = "proto3";

package ai.traceable.ipresolutionstrategy.config.service.v1;

import "ai/traceable/graphql/autogen/schema/annotations/field/v1/graphql_field_options.proto";

option java_multiple_files = true;

// Producer-owned IP resolution strategy model (separate from blocking-config API)
message IpResolutionStrategy {
  // If true, all extracted IPs (from all sources) will be evaluated for blocking decisions (block if any match).
  // If false, only the first extracted IP (based on source precedence) will be evaluated for blocking.
  // Note: For detection only the first extracted IP is used, regardless of this flag.
  bool evaluate_all_ips_for_blocking = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Whether all extracted IPs should be checked for blocking decisions; for detection, only the first IP is always used"];

  // Ordered list of sources to check for client IP, in precedence order (first match wins).
  repeated IpSource sources = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Ordered list of IP sources to evaluate when resolving the client IP"];
}

message IpSource {
  string source_attribute_name = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Tracing attribute name (e.g. http.request.header.x-forwarded-for) used to extract IP candidates"];
  ParsingStrategy parsing_strategy = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Parsing rules to convert the attribute value into IP candidates"];
}

// Defines how to extract an IP address from a given attribute
message ParsingStrategy {
  string split_delimiter = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Delimiter used to split the attribute value into tokens"];
  bool remove_internal_ips = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Whether to drop internal or private IPs from the token list"];
  int32 preferred_index = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Index of the token to select after filtering (0-based)"];
  // Strategy to extract IP from each token
  oneof extraction_rule {
    KeywordBasedExtraction keyword_based = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Extract IPs using prefix/suffix keywords within each token"];
    RawIpExtraction raw_ip = 5 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Treat each token as a raw IP address"];
    RegexBasedExtraction regex_based = 6 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Extract IPs using a regular expression applied to each token"];
  }
}

// For keyword-based IP extraction like "for=1.2.3.4"
message KeywordBasedExtraction {
  string prefix = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Keyword prefix that appears before the IP within the token"];
  string suffix = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Keyword suffix that appears after the IP within the token"];
}

// For regex-based extraction where a pattern extracts the IP from each token
message RegexBasedExtraction {
  string pattern = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Regular expression applied to each token to capture the IP"];
  uint32 capture_group = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Capture group to use from the regex match (0 selects the full match)"];
  bool case_insensitive = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Whether the regular expression should be evaluated case-insensitively"];
}

message RawIpExtraction {}
