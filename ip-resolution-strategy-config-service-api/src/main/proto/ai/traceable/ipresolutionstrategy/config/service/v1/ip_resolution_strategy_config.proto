syntax = "proto3";

package ai.traceable.ipresolutionstrategy.config.service.v1;

import "ai/traceable/ipresolutionstrategy/config/service/v1/ip_resolution_strategy_model.proto";

option java_multiple_files = true;

// A single stored configuration object for IP resolution strategy
message IpResolutionStrategyConfig {
  string id = 1;
  IpResolutionStrategyConfigData data = 2;
}

message IpResolutionStrategyConfigData {
  // The actual strategy to be used by agents
  ai.traceable.ipresolutionstrategy.config.service.v1.IpResolutionStrategy strategy = 1;
  // Scope at which the strategy applies
  Scope scope = 2;
  // Optionally disable this config without deleting it
  bool disabled = 3;
}

// Scope definition (environment and service)
message Scope {
  EnvironmentScope environment_scope = 1;
  ServiceScope service_scope = 2;
}

message EnvironmentScope {
  // If empty, applies to all environments
  repeated string environment_names = 1;
}

message ServiceScope {
  // If empty, applies to all services
  repeated string service_names = 1;
}

// Request filter to fetch configs
message IpResolutionStrategyFilter {
  // Optional: filter by disabled flag
  optional bool disabled = 1;
  // Optional: restrict by environment names
  repeated string environment_names = 2;
  // Optional: restrict by service names
  repeated string service_names = 3;
  // Optional: limit to specific ids
  repeated string ids = 4;
}
