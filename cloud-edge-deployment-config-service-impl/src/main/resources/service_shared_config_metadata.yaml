- configKey: "maxPendingHttpRequest"
  description: "Max Pending Http Requests for a service"
  displayName: "Max Pending Http Requests"
  constraint:
    intRange:
      min: 0
      max: 100
  configPermission:
    read: CONFIG_ACCESS_TYPE_GLOBAL
    write: CONFIG_ACCESS_TYPE_GLOBAL
  identifiers:
    - chartName: ""
      chartPath: ""

