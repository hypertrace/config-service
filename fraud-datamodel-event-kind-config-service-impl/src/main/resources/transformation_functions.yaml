# Transformation Functions Registry
# Defines available transformation functions and their type compatibility

functions:
  # Generic functions - work on all types
  - id: "system_defined_function_to_string"
    display_name: "toString"
    description: "Converts any value to its string representation"
    input_kinds:
      - kind_id: "system_event_kind_value"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "traceable:toStr(${input})"

  # String functions
  - id: "system_defined_function_split"
    display_name: "split"
    description: "Splits a string by a delimiter and returns an array"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      array_of:
        kind_id: "system_event_kind_string"
    jexl_template: "${input}.split('${delimiter}')"
    parameters:
      - name: "delimiter"
        description: "Delimiter to split by (e.g., ':', ',', ' ')"
        type: PARAMETER_TYPE_STRING
        required: false
        default_value: ","
        allowed_values:
          - value: ","
            display_name: "Comma (,)"
          - value: ":"
            display_name: "Colon (:)"
          - value: " "
            display_name: "Space ( )"
          - value: "\\."
            display_name: "Dot (.)"
          - value: "\\|"
            display_name: "Pipe (|)"
          - value: "/"
            display_name: "Slash (/)"
          - value: "\\$"
            display_name: "Dollar ($)"

  # Array functions - use type_parameter_ref for compile-time type safety
  - id: "system_defined_function_get"
    display_name: "get"
    description: "Gets an element at a specific index from an array"
    # Input: ARRAY<T>
    input_kinds:
      - array_of:
          type_parameter_ref: "T"
    # Output: T (same as element type - compile-time type preservation!)
    output_kind:
      type_parameter_ref: "T"
    jexl_template: "${input}[${index}]"
    parameters:
      - name: "index"
        description: "Index to extract (0-based)"
        type: PARAMETER_TYPE_NUMBER
        required: true

  - id: "system_defined_function_last"
    display_name: "lastElement"
    description: "Gets the last element from an array"
    # Input: ARRAY<T>
    input_kinds:
      - array_of:
          type_parameter_ref: "T"
    # Output: T (same as element type - compile-time type preservation!)
    output_kind:
      type_parameter_ref: "T"
    jexl_template: "${input}[${input}.size() - 1]"

  - id: "system_defined_function_join"
    display_name: "join"
    description: "Joins array elements into a single string with a delimiter"
    input_kinds:
      - array_of:
          kind_id: "system_event_kind_value"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "string:join(${input}, '${delimiter}')"
    parameters:
      - name: "delimiter"
        description: "Delimiter to join with (e.g., ':', ',', ' ')"
        type: PARAMETER_TYPE_STRING
        required: false
        default_value: ""

  - id: "system_defined_function_array_size"
    display_name: "arraySize"
    description: "Returns the number of elements in an array"
    input_kinds:
      - array_of:
          kind_id: "system_event_kind_value"
    output_kind:
      kind_id: "system_event_kind_integer"
    jexl_template: "${input}.size()"

  - id: "system_defined_function_substring"
    display_name: "substring"
    description: "Extracts a portion of the string"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "${input}.substring(${start}, ${end})"
    parameters:
      - name: "start"
        description: "Start index (0-based)"
        type: PARAMETER_TYPE_NUMBER
        required: true
      - name: "end"
        description: "End index (exclusive)"
        type: PARAMETER_TYPE_NUMBER
        required: false

  - id: "system_defined_function_to_lower_case"
    display_name: "toLowerCase"
    description: "Converts string to lowercase"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "${input}.toLowerCase()"

  - id: "system_defined_function_to_upper_case"
    display_name: "toUpperCase"
    description: "Converts string to uppercase"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "${input}.toUpperCase()"

  - id: "system_defined_function_trim"
    display_name: "trim"
    description: "Removes leading and trailing whitespace"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "${input}.trim()"

  - id: "system_defined_function_replace"
    display_name: "replace"
    description: "Replaces occurrences of a pattern"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "${input}.replace('${pattern}', '${replacement}')"
    parameters:
      - name: "pattern"
        description: "Pattern to find"
        type: PARAMETER_TYPE_STRING
        required: true
      - name: "replacement"
        description: "Replacement string"
        type: PARAMETER_TYPE_STRING
        required: true

