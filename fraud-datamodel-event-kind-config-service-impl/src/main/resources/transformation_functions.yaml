  # Email functions
  - id: "system_defined_function_get_email_domain"
    display_name: "getEmailDomain"
    description: "Extracts the domain from an email address"
    input_kinds:
      - kind_id: "system_event_kind_email"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "${input}.split('@')[1]"

  - id: "system_defined_function_to_detumbled_email"
    display_name: "toDetumbledEmail"
    description: "Removes tumbling from an email address by stripping +, -, . suffixes and trailing digits from the handle"
    input_kinds:
      - kind_id: "system_event_kind_email"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "email:toDetumbledEmail(${input})"

  - id: "system_defined_function_to_email_handle_pattern"
    display_name: "toEmailHandlePattern"
    description: "Converts an email handle into a 10-digit structural pattern encoding the lengths of alternating alpha and non-alpha groups"
    input_kinds:
      - kind_id: "system_event_kind_email"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "email:toEmailHandlePattern(${input})"

  - id: "system_defined_function_is_abnormal_email_handle"
    display_name: "isAbnormalEmailHandle"
    description: "Checks if an email handle has abnormal character distribution based on consonant/vowel ratios"
    input_kinds:
      - kind_id: "system_event_kind_email"
    output_kind:
      kind_id: "system_event_kind_boolean"
    jexl_template: "email:isAbnormalEmailHandle(${input})"

  - id: "system_defined_function_entropy"
    display_name: "entropy"
    description: "Calculates the Shannon metric entropy of an email handle to detect randomly generated addresses"
    input_kinds:
      - kind_id: "system_event_kind_email"
    output_kind:
      kind_id: "system_event_kind_numeric"
    jexl_template: "email:entropy(${input}, ${lengthThreshold})"
    parameters:
      - name: "lengthThreshold"
        description: "Minimum handle length to compute entropy (handles shorter than this return NaN)"
        type: PARAMETER_TYPE_NUMBER
        required: false
        default_value: "10"

  # JSON functions
  - id: "system_defined_function_parse_json"
    display_name: "parseJson"
    description: "Parses a JSON string into a map object for field extraction"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      string_map_of:
        kind_id: "system_event_kind_value"
    jexl_template: "traceable:parseJson(${input})"

  - id: "system_defined_function_get_entry"
    display_name: "getEntry"
    description: "Gets a value from a map by key name"
    # Input: MAP<string, T>
    input_kinds:
      - string_map_of:
          type_parameter_ref: "T"
    # Output: T (preserves value type)
    output_kind:
      type_parameter_ref: "T"
    jexl_template: "${input}['${key}']"
    parameters:
      - name: "key"
        description: "Key name to extract from the map"
        type: PARAMETER_TYPE_STRING
        required: true

  - id: "system_defined_function_json_path"
    display_name: "getJsonPath"
    description: "Extracts a value from a JSON string using a JSON path expression (e.g., $.transaction.details.accountId)"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "traceable:getJsonPathValue(${input}, '${path}')"
    parameters:
      - name: "path"
        description: "JSON path expression (e.g., $.transaction.[].details.accountId)"
        type: PARAMETER_TYPE_STRING
        required: true

  # Encoding functions
  - id: "system_defined_function_base64_encode"
    display_name: "base64Encode"
    description: "Encodes the value in Base64"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "traceableTransformUtils:base64Encode(${input})"

  - id: "system_defined_function_base64_decode"
    display_name: "base64Decode"
    description: "Decodes a Base64 encoded value"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "traceableTransformUtils:base64Decode(${input})"

  - id: "system_defined_function_url_encode"
    display_name: "urlEncode"
    description: "URL encodes the value"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "traceableTransformUtils:urlEncode(${input})"

  - id: "system_defined_function_url_decode"
    display_name: "urlDecode"
    description: "URL decodes the value"
    input_kinds:
      - kind_id: "system_event_kind_string"
    output_kind:
      kind_id: "system_event_kind_string"
    jexl_template: "traceableTransformUtils:urlDecode(${input})"
