default.variables.user-attribution =
[
  {
    name = "userId1"
    rules = [
      {
        transformationConfig = {
          jexlExpression = {
            jexlExpression = "$s.getHeaders().get('authorization')"
          }
        }
      }
    ]
  }
]

userid.blocking.configs =
[
  {
    tenantId = "tenantId"
    variables.user-attribution = ["userId1"]
  }
]