syntax = "proto3";

package ai.traceable.fraud.datamodel.entity.derivation.config.service.v1;

import "ai/traceable/fraud/datamodel/entity/derivation/config/service/v1/entity_derivation_config.proto";
import "ai/traceable/fraud/datamodel/event/kind/v1/complex_data_model_event_kind.proto";
import "ai/traceable/graphql/autogen/schema/annotations/field/v1/graphql_field_options.proto";

option java_multiple_files = true;

service EntityDerivationConfigService {
  rpc CreateEntityDerivationConfig(CreateEntityDerivationConfigRequest) returns (CreateEntityDerivationConfigResponse) {}
  rpc UpdateEntityDerivationConfig(UpdateEntityDerivationConfigRequest) returns (UpdateEntityDerivationConfigResponse) {}
  rpc GetEntityDerivationConfigSummaries(GetEntityDerivationConfigSummariesRequest) returns (GetEntityDerivationConfigSummariesResponse) {}
  rpc GetEntityDerivationConfigs(GetEntityDerivationConfigsRequest) returns (GetEntityDerivationConfigsResponse) {}
  rpc DeleteEntityDerivationConfig(DeleteEntityDerivationConfigRequest) returns (DeleteEntityDerivationConfigResponse) {}
}

message CreateEntityDerivationConfigRequest {
  EntityDerivationConfigData data = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Entity derivation configuration data (Required)"];
  // Optional: if provided, use this ID instead of generating one. Intended for internal callers that need a deterministic/fixed ID.
  string id = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_skip) = true];
}

message CreateEntityDerivationConfigResponse {
  EntityDerivationConfig entity_derivation_config = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Created entity derivation configuration"];
}

message UpdateEntityDerivationConfigRequest {
  string id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Entity derivation config ID to update (Required)"];
  EntityDerivationConfigData data = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Updated entity derivation configuration data (Required)"];
}

message UpdateEntityDerivationConfigResponse {
  EntityDerivationConfig entity_derivation_config = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Updated entity derivation configuration"];
}

message GetEntityDerivationConfigSummariesRequest {
  EntityDerivationConfigFilter filter = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Filter criteria for entity derivation configs"];
}

message GetEntityDerivationConfigSummariesResponse {
  repeated EntityDerivationConfigSummary summaries = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "List of entity derivation config summaries"];
}

message EntityDerivationConfigSummary {
  string id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Entity derivation config ID"];
  string display_name = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Display name"];
  ai.traceable.fraud.datamodel.event.kind.v1.ComplexDataModelEventKind event_kind = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Data type of the derived value"];
  string description = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Description"];
  bool filter_only = 5 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "If set to true, entity can only be used in filters, not as aggregation/group-by fields"];
}

message EntityDerivationConfigFilter {
  optional bool include_disabled = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Include disabled entities"];
  optional bool include_internal = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Include internal entities"];
  EntityDerivationScopeFilter scope_filter = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Filter entities by scope overlap (environment and API IDs)"];
  optional bool include_filter_only = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Include filter-only entities (entities that can only be used in filters, not as aggregation/group-by fields)"];
  optional bool exclude_monitor_only = 5 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Exclude monitor-only entities (entities that require async enrichment and cannot be used in blocking policies)"];
}

message EntityDerivationScopeFilter {
  repeated string environment_ids = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Environment IDs to filter by - entities with overlapping environment scope will be included"];
  repeated string api_ids = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "API IDs to filter by - entities with overlapping API scope will be included"];
}

message GetEntityDerivationConfigsRequest {
  EntityDerivationConfigFilter filter = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Filter criteria for entity derivation configs"];
  repeated string ids = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Filter by specific entity IDs (empty = all)"];
}

message GetEntityDerivationConfigsResponse {
  repeated EntityDerivationConfig entity_derivation_configs = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "List of entity derivation configurations"];
}

message DeleteEntityDerivationConfigRequest {
  string entity_derivation_config_id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Entity derivation config ID to delete (Required)"];
}

message DeleteEntityDerivationConfigResponse {}
