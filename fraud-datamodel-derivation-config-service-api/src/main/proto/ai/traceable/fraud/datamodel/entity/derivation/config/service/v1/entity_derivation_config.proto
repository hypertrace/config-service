syntax = "proto3";

package ai.traceable.fraud.datamodel.entity.derivation.config.service.v1;

import "ai/traceable/fraud/datamodel/entity/derivation/config/service/v1/event_derivation_config_details.proto";
import "ai/traceable/fraud/datamodel/event/kind/v1/data_model_event_kind.proto";
import "ai/traceable/fraud/datamodel/event/kind/v1/transformation_pipeline.proto";
import "ai/traceable/graphql/autogen/schema/annotations/field/v1/graphql_field_options.proto";

option java_multiple_files = true;

// EntityDerivationConfig with ID and configuration data
message EntityDerivationConfig {
  string id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Unique identifier"];
  EntityDerivationConfigData data = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Entity derivation configuration data"];
}

// EntityDerivationConfigData contains all configuration fields for entity derivation.
// SpanProjection embeds EventDerivationConfigDetails directly. ParentDerivation derives from a parent entity.
message EntityDerivationConfigData {
  string name = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Machine-readable name of the entity"];
  string display_name = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Display name shown in UI"];
  string description = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Description"];
  bool disabled = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Whether this entity is disabled"];
  bool internal = 5 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Whether this entity is internal and hidden from UI"];
  EntityCategory category = 6 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Category of this entity"];
  // Strong type of the entity
  ai.traceable.fraud.datamodel.event.kind.v1.DataModelEventKind event_kind = 7 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Data type of the derived value (e.g., string, integer, IP address)"];

  // How the raw value is extracted — either from spans or from a parent entity
  oneof value_source {
    SpanProjection span_projection = 8 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Extract value directly from API request/response data"];
    ParentDerivation parent_derivation = 9 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Derive value from a parent entity"];
  }
}

// SpanProjection extracts values directly from span data (request/response)
message SpanProjection {
  repeated EventDerivationConfigDetails event_derivation_configs = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Extraction rules for deriving values from request/response data"];
}

// ParentDerivation derives a value by referencing a parent entity
message ParentDerivation {
  string parent_entity_derivation_id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Parent entity derivation config ID"];
  // Transformation applied on the extracted value from parent
  ai.traceable.fraud.datamodel.event.kind.v1.TransformationPipeline pipeline = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Transformation applied on the extracted value from parent"];
}

enum EntityCategory {
  ENTITY_CATEGORY_UNSPECIFIED = 0;
  ENTITY_CATEGORY_SYSTEM = 1;
  ENTITY_CATEGORY_MANDATORY = 2;
  ENTITY_CATEGORY_RECOMMENDED = 3;
  ENTITY_CATEGORY_CUSTOM = 4;
}
