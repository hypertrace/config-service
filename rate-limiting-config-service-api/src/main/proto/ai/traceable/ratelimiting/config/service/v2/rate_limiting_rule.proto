syntax = "proto3";

package ai.traceable.ratelimiting.config.service.v2;

option java_multiple_files = true;

import "google/protobuf/duration.proto";

message RateLimitingRule {
  string id = 1;
  RateLimitingRuleData data = 2;
}

message RateLimitingModsecRule {
  string id = 1;
  RateLimitingRuleData data = 2;
  // Implicit AND within the list
  repeated ModsecRuleIdInfo associated_modsec_rule_ids = 3;
}

message ModsecRuleIdInfo {
  // Implicit OR within the list
  repeated MatchCondition match_conditions = 1;
  IdType type = 2;

  enum IdType {
    ID_TYPE_DATA_TYPE_UNSPECIFIED = 0;
    ID_TYPE_DATA_TYPE_CUSTOM_LOCATION = 1;
    ID_TYPE_KEY_VALUE_CONDITION_URL_REGEXES = 2;
  }

  message MatchCondition{
    repeated string ignore_ids = 1;
    string match_id = 2;
  }
}

message RateLimitingRuleData {
  Category category = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  Condition condition = 5;
  repeated ThresholdActionConfig threshold_action_configs = 6;
  TransactionActionConfig transaction_action_config = 9;
  RuleConfigScope rule_config_scope = 7;
  RuleStatus rule_status = 8;
}

message RuleStatus {
  optional bool hidden = 1;
  optional bool generate_internal_events = 2;
  RuleSource rule_creation_source = 3;

  enum RuleSource {
    RULE_SOURCE_UNSPECIFIED = 0;
    RULE_SOURCE_DEFAULT = 1;
    RULE_SOURCE_CUSTOMER = 2;
    RULE_SOURCE_TRACEABLE = 3;
  }
}

message RuleConfigScope {
  oneof scope { // if no option selected, default is customer scope (all environments)
    EnvironmentScope environment_scope = 1;
  }
}

message EnvironmentScope {
  repeated string environment_ids = 1;
}

message Condition {
  oneof condition {
    CompositeCondition composite_condition = 1;
    LeafCondition leaf_condition = 2;
  }
}

message CompositeCondition {
  LogicalOperator operator = 1;
  repeated Condition children = 2;

  enum LogicalOperator {
    LOGICAL_OPERATOR_UNSPECIFIED = 0;
    LOGICAL_OPERATOR_AND = 1;
    LOGICAL_OPERATOR_OR = 2;
  }
}

message LeafCondition {
  oneof condition {
    ScopeCondition scope_condition = 1;
    KeyValueCondition key_value_condition = 2;
    DatatypeCondition datatype_condition = 3;
    RegionCondition region_condition = 4;
    IpAddressCondition ip_address_condition = 5;
    IpLocationTypeCondition ip_location_type_condition = 6;
    IpReputationCondition ip_reputation_condition = 7;
    UserIdCondition user_id_condition = 8;
    EmailDomainCondition email_domain_condition = 9;
    UserAgentCondition user_agent_condition = 10;
    IpConnectionTypeCondition ip_connection_type_condition = 11;
    IpOrganisationCondition ip_organisation_condition = 12;
    IpAsnCondition ip_asn_condition = 13;
    IpAbuseVelocityCondition ip_abuse_velocity_condition = 14;
  }
}

message ScopeCondition {
  oneof scope {
    EntityScope entity_scope = 1;
    LabelScope label_scope = 2;
    UrlScope url_scope = 3;
  }

  message UrlScope{
    repeated string url_regexes = 1;
  }

  message EntityScope {
    EntityType entity_type = 1;
    repeated string entity_ids = 2;
  }

  message LabelScope {
    LabelType label_type = 1;
    repeated string label_ids = 2;
  }

  enum EntityType {
    ENTITY_TYPE_UNSPECIFIED = 0;
    ENTITY_TYPE_API = 1;
    ENTITY_TYPE_SERVICE = 2;
  }

  enum LabelType {
    LABEL_TYPE_UNSPECIFIED = 0;
    LABEL_TYPE_SERVICE = 1;
    LABEL_TYPE_API = 2;
  }
}

message KeyValueCondition {
  Type type = 1;
  StringCondition key_condition = 2;
  StringCondition value_condition = 3;

  message StringCondition {
    MatchOperator operator = 1;
    string value = 2;
  }

  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_URL = 1;
    TYPE_HOST = 2;
    TYPE_HTTP_METHOD = 3;
    TYPE_USER_AGENT = 4;
    TYPE_STATUS_CODE = 5;
    TYPE_REQUEST_BODY = 6;
    TYPE_RESPONSE_BODY = 7;
    TYPE_REQUEST_HEADER = 8;
    TYPE_RESPONSE_HEADER = 9;
    TYPE_REQUEST_COOKIE = 10;
    TYPE_RESPONSE_COOKIE = 11;
    TYPE_QUERY_PARAMETER = 12;
    TYPE_REQUEST_BODY_PARAMETER = 13;
    TYPE_RESPONSE_BODY_PARAMETER = 14;
    TYPE_TAG = 15;
  }

  enum MatchOperator {
    MATCH_OPERATOR_UNSPECIFIED = 0;
    MATCH_OPERATOR_EQUALS = 1;
    MATCH_OPERATOR_NOT_EQUAL = 2;
    MATCH_OPERATOR_MATCHES_REGEX = 3;
    MATCH_OPERATOR_NOT_MATCH_REGEX = 4;
    MATCH_OPERATOR_CONTAINS = 5;
    MATCH_OPERATOR_NOT_CONTAIN = 6;
  }
}

enum DataSensitivityLevel{
  DATA_SENSITIVITY_LEVEL_UNSPECIFIED = 0;
  DATA_SENSITIVITY_LEVEL_LOW = 1;
  DATA_SENSITIVITY_LEVEL_MEDIUM = 2;
  DATA_SENSITIVITY_LEVEL_HIGH = 3;
  DATA_SENSITIVITY_LEVEL_CRITICAL = 4;
}
enum DataLocation{
  DATA_LOCATION_UNSPECIFIED = 0;
  DATA_LOCATION_REQUEST = 1;
  DATA_LOCATION_RESPONSE = 2;
}
message DatatypeCondition {
  repeated string dataset_ids = 1;
  repeated string datatype_ids = 2;
  repeated DataSensitivityLevel data_sensitivity_levels = 3;
  DataLocation data_location = 4;
  DatatypeMatching datatype_matching = 5;

  message DatatypeMatching {
    oneof matching {
      LearnedTypesMatching learned_types_matching = 1;
      RegexBasedMatching regex_based_matching = 2;
    }
  }

  message LearnedTypesMatching{}

  message RegexBasedMatching{
    KeyValueCondition custom_matching_location = 6;
  }
}

message RegionCondition {
  repeated string regions = 1 [deprecated = true];
  repeated Region region_identifiers = 2;
  bool exclude = 3;

  message Region {
    oneof region {
      string country_iso_code = 1;
    }
  }
}

message IpAddressCondition {
  repeated string cidr_ip_ranges = 1;
  repeated string ip_addresses = 2;
  repeated string raw_input_ip_data = 3;
  bool exclude = 4;
  IpAddressConditionType ip_address_condition_type = 5;
}

message IpLocationTypeCondition {
  repeated IpLocationType ip_location_types = 1;
  bool exclude = 2;
}

message UserIdCondition {
  repeated string user_id_regexes = 1;
  repeated string actor_entity_ids = 2; // not supported currently
  repeated string user_ids = 3;
  bool exclude = 4;
}

message IpReputationCondition {
  IpReputationSeverity min_ip_reputation_severity = 1;
}

message IpConnectionTypeCondition {
  repeated IpConnectionType ip_connection_types = 1;
  bool exclude = 2;
}

message EmailDomainCondition {
  repeated string email_domains = 1;
  repeated string email_regexes = 2;
  bool exclude = 3;
}

message UserAgentCondition {
  repeated string user_agents = 1;
  repeated string user_agent_regexes = 2;
  bool exclude = 3;
}

message IpOrganisationCondition {
  repeated string ip_organisation_regexes = 1;
  bool exclude = 2;
}

message IpAsnCondition {
  repeated string ip_asn_regexes = 1;
  bool exclude = 2;
}

message IpAbuseVelocityCondition {
  IpAbuseVelocity min_ip_abuse_velocity = 1;
}

message ThresholdActionConfig {
  repeated ResourceAccessThresholdConfig resource_access_threshold_configs = 1;
  repeated Action actions = 2;
}

message ResourceAccessThresholdConfig {
  UserAggregateType user_aggregate_type = 1;
  ApiAggregateType api_aggregate_type = 2;
  oneof threshold_config {
    RollingWindowThresholdConfig rolling_window_threshold_config = 3; // static
    ValueBasedThresholdConfig value_based_threshold_config = 4;
    DynamicThresholdConfig dynamic_threshold_config = 5;
  }

  message RollingWindowThresholdConfig {
    int64 count_allowed = 1;
    string duration_iso = 2;
  }

  message ValueBasedThresholdConfig {
    int64 unique_values_allowed = 1;
    string duration_iso = 2;
    ValueType value_type = 3;
  }

  enum ValueType {
    VALUE_TYPE_UNSPECIFIED = 0;
    VALUE_TYPE_REQUEST_BODY = 1;
    VALUE_TYPE_SENSITIVE_PARAMS = 2;
    VALUE_TYPE_PATH_PARAMS = 3;
  }

  message DynamicThresholdConfig {
    int32 percent_exceeding_mean_allowed = 1;
    google.protobuf.Duration duration = 2;
    google.protobuf.Duration mean_calculation_duration = 3;
  }
}

message Action {
  oneof action {
    Block block = 1;
    Alert alert = 2;
    Allow allow = 3;
  }

  message Block {
    EventSeverity event_severity = 1;
    optional string duration_iso = 2;
  }

  message Alert {
    EventSeverity event_severity = 1;
  }

  message Allow {
    optional string duration_iso = 1;
  }

  enum EventSeverity {
    EVENT_SEVERITY_UNSPECIFIED = 0;
    EVENT_SEVERITY_LOW = 1;
    EVENT_SEVERITY_MEDIUM = 2;
    EVENT_SEVERITY_HIGH = 3;
    EVENT_SEVERITY_CRITICAL = 4;
  }
}

message TransactionActionConfig {
  Action action = 1;
  optional int64 expiration_timestamp_millis = 2;
}

enum IpLocationType {
  IP_LOCATION_TYPE_UNSPECIFIED = 0;
  IP_LOCATION_TYPE_RESIDENTIAL = 1 [deprecated = true];
  IP_LOCATION_TYPE_ANONYMOUS = 2 [deprecated = true];
  IP_LOCATION_TYPE_ANONYMOUS_VPN = 3;
  IP_LOCATION_TYPE_HOSTING_PROVIDER = 4;
  IP_LOCATION_TYPE_PUBLIC_PROXY = 5;
  IP_LOCATION_TYPE_TOR_EXIT_NODE = 6;
  IP_LOCATION_TYPE_BOT = 7;
}

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_RATE_LIMITING = 1;
  CATEGORY_DATA_EXFILTRATION = 2;
  CATEGORY_ENUMERATION = 3;
}

enum UserAggregateType {
  USER_AGGREGATE_TYPE_UNSPECIFIED = 0;
  USER_AGGREGATE_TYPE_PER_USER = 1;
  USER_AGGREGATE_TYPE_ACROSS_USERS = 2;
}

enum ApiAggregateType {
  API_AGGREGATE_TYPE_UNSPECIFIED = 0;
  API_AGGREGATE_TYPE_PER_ENDPOINT = 1;
  API_AGGREGATE_TYPE_ACROSS_ENDPOINTS = 2;
}

enum IpReputationSeverity {
  IP_REPUTATION_SEVERITY_UNSPECIFIED = 0;
  IP_REPUTATION_SEVERITY_LOW = 1;
  IP_REPUTATION_SEVERITY_MEDIUM = 2;
  IP_REPUTATION_SEVERITY_HIGH = 3;
  IP_REPUTATION_SEVERITY_CRITICAL = 4;
}

enum IpConnectionType {
  IP_CONNECTION_TYPE_UNSPECIFIED = 0;
  IP_CONNECTION_TYPE_RESIDENTIAL = 1;
  IP_CONNECTION_TYPE_MOBILE = 2;
  IP_CONNECTION_TYPE_CORPORATE= 3;
  IP_CONNECTION_TYPE_DATA_CENTER = 4;
  IP_CONNECTION_TYPE_EDUCATION = 5;
}

enum IpAddressConditionType {
  IP_ADDRESS_CONDITION_TYPE_UNSPECIFIED = 0;
  IP_ADDRESS_CONDITION_TYPE_ALL_INTERNAL = 2;
  IP_ADDRESS_CONDITION_TYPE_ALL_EXTERNAL = 3;
}

enum IpAbuseVelocity {
  IP_ABUSE_VELOCITY_UNSPECIFIED = 0;
  IP_ABUSE_VELOCITY_LOW = 1;
  IP_ABUSE_VELOCITY_MEDIUM = 2;
  IP_ABUSE_VELOCITY_HIGH = 3;
}
