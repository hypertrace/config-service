syntax = "proto3";

package ai.traceable.external.wasm.config.service.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/Traceableai/config-service/gen/go/ai/traceable/external/wasm/config/service/v1";
option java_multiple_files = true;

service ExternalWasmConfigService {
  rpc GetWasmModules(GetWasmModulesRequest) returns (GetWasmModulesResponse) {}
}

message GetWasmModulesRequest {
  Filter filter = 1;
  AgentCapabilities agent_capabilities = 2;
  WasmModuleRequest agent_attributes_wasm_module_request = 3;

  message WasmModuleRequest {
    string wasm_module_hash = 1;
    string wasm_module_config_hash = 2;
  }

  message Filter {
    Scope scope = 1;
  }

  message Scope {
    oneof scope {
      string environment_name = 1;
    }
  }

  message AgentCapabilities {
    string traceable_platform_agent_version = 1;
  }
}

message GetWasmModulesResponse {
  ResponseMetadata response_metadata = 1;
  WasmModuleResponse agent_attributes_wasm_module = 2;

  message ResponseMetadata {
    google.protobuf.Duration refresh_after_duration = 1;
  }

  message WasmModuleResponse {
    WasmModuleResponseMetadata wasm_module_response_metadata = 1;
    // The binary for wasm module
    bytes wasm_module_bytes = 2;
    // The config to be given to wasm module
    bytes wasm_module_config_bytes = 3;

    message WasmModuleResponseMetadata {
      bool enabled = 1;
      string wasm_module_hash = 2;
      string wasm_module_config_hash = 3;
    }
  }
}
