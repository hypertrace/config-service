syntax = "proto3";

package ai.traceable.data.handling.config.service.v1;

option java_multiple_files = true;

message DataHandlingRule {
  string id = 1;
  int32 rank = 2; // Rules with the lowest rank value have the highest precedence
  DataHandlingRuleData data = 10;
}

message DataHandlingRuleData {
  string name = 1;
  repeated DataHandlingRuleCondition conditions = 2;
  repeated DataHandlingRuleAction actions = 3;
}

message DataHandlingRuleCondition {}

message DataHandlingRuleAction {}
