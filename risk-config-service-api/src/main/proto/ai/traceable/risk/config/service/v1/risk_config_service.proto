syntax = "proto3";

package ai.traceable.risk.config.service.v1;

import "ai/traceable/risk/config/service/v1/risk_config_request_response.proto";

option java_multiple_files = true;

service RiskConfigService {
  rpc GetRiskScoringConfigs(GetRiskScoringConfigsRequest) returns (GetRiskScoringConfigsResponse) {}

  rpc GetRiskLikelihoodConfigs(GetRiskLikelihoodConfigsRequest) returns (GetRiskLikelihoodConfigsResponse) {}

  rpc GetRiskImpactConfigs(GetRiskImpactConfigsRequest) returns (GetRiskImpactConfigsResponse) {}

  rpc UpdateRiskLevelConfig(UpdateRiskLevelConfigRequest) returns (UpdateRiskLevelConfigResponse) {}

  rpc UpdateRiskFactorGridConfig(UpdateRiskFactorGridConfigRequest) returns (UpdateRiskFactorGridConfigResponse) {}

  rpc UpdateRiskLikelihoodConfigs(UpdateRiskLikelihoodConfigsRequest) returns (UpdateRiskLikelihoodConfigsResponse) {}

  rpc UpdateRiskImpactConfigs(UpdateRiskImpactConfigsRequest) returns (UpdateRiskImpactConfigsResponse) {}

  rpc ResetRiskLevelConfig(ResetRiskLevelConfigRequest) returns (ResetRiskLevelConfigResponse) {}

  rpc ResetRiskFactorGridConfig(ResetRiskFactorGridConfigRequest) returns (ResetRiskFactorGridConfigResponse) {}

  rpc ResetRiskLikelihoodConfigs(ResetRiskLikelihoodConfigsRequest) returns (ResetRiskLikelihoodConfigsResponse) {}

  rpc ResetRiskImpactConfigs(ResetRiskImpactConfigsRequest) returns (ResetRiskImpactConfigsResponse) {}
}
