syntax = "proto3";

package ai.traceable.policy.config.service.v1;

import "ai/traceable/policy/config/service/v1/traceable_policy.proto";
import "google/protobuf/field_mask.proto";

option java_multiple_files = true;
option java_package = "ai.traceable.policy.config.service.v1";

service TraceablePolicyConfigService {
  rpc Upsert(UpsertRequest) returns (UpsertResponse) {}
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc GetAll(GetAllRequest) returns (GetAllResponse) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  rpc Update(UpdateRequest) returns (UpdateResponse) {}
}

message UpsertRequest {
  TraceablePolicy policy = 1;
}

message UpsertResponse {
  TraceablePolicy policy = 1;
}

message GetRequest {
  string policy_kind = 1;
  string id = 2;
}

message GetResponse {
  TraceablePolicy policy = 1;
}

message GetAllRequest {
  optional string policy_kind = 1;
}

message GetAllResponse {
  repeated TraceablePolicy policies = 1;
}

message UpdateRequest {
  TraceablePolicy policy = 1;
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateResponse {
  TraceablePolicy updated_policy = 1;
}

message DeleteRequest {
  string policy_kind = 1;
  string id = 2;
}

message DeleteResponse {
  TraceablePolicy deleted_policy = 1;
}
