syntax = "proto3";

package ai.traceable.api.attribute.override.service.v1;

option java_multiple_files = true;

message GetAllApiAttributeOverridesRequest {
  Filter filter = 1;
}

message Filter {
  repeated string api_ids = 1;
}

message GetAllApiAttributeOverridesResponse {
  map<string, ApiAttributeOverrides> api_attribute_overrides = 1;
}

message UpsertApiAttributeOverridesRequest {
  string api_id = 1;
  repeated AttributeOverride attribute_overrides = 2;
}

message UpsertApiAttributeOverridesResponse {
  ApiAttributeOverrides api_attribute_overrides = 1;
}

message DeleteApiAttributeOverridesRequest {
  string api_id = 1;
  repeated AttributeOverrideIdentifier attribute_override_identifiers = 2;
}

message DeleteApiAttributeOverridesResponse {
  ApiAttributeOverrides api_attribute_overrides = 1;
}

message ApiAttributeOverrides {
  string api_id = 1;
  repeated AttributeOverride attribute_overrides = 2;
}

message AttributeOverride {
  oneof attribute_override {
    ParamTypeOverride param_type_override = 1;
    ApiExternalOverride api_external_override = 2;
  }
}

message ParamTypeOverride {
  string param_name = 1;
  string param_type = 2;
  ParamTypeAction param_type_action = 3;
}

enum ParamTypeAction {
  PARAM_TYPE_ACTION_UNSPECIFIED = 0;
  PARAM_TYPE_ACTION_EXCLUDE = 1;
  PARAM_TYPE_ACTION_COLLAPSE = 2;
}

message ApiExternalOverride {
  bool is_external = 1;
}

message AttributeOverrideIdentifier {
  oneof attribute_override_identifier {
    ParamTypeOverrideIdentifier param_type_override_identifier = 1;
    ApiExternalOverrideIdentifier api_external_override_identifier = 2;
  }
}

message ParamTypeOverrideIdentifier {
  string param_name = 1;
}

message ApiExternalOverrideIdentifier {
}
