syntax = "proto3";

package ai.traceable.data.classification.config.service.v1;

option java_multiple_files = true;

message DataType {
  string id = 1;
  DataTypeRule rule = 2;
}

message DataTypeRule {
  string name = 1;
  optional string description = 2;
  repeated ScopedPattern scoped_pattern = 3;

  message ScopedPattern {
    oneof scope {
      GlobalScope global_scope = 1;
      EnvironmentScope environment_scope = 2;
      ApiScope api_scope = 3;
    }
    ParameterType parameter_type = 5;
    oneof pattern {
      StringPattern key_pattern = 6;
      KeyValuePattern key_value_pattern = 7;
    }
    Action action = 8;
  }

  message GlobalScope {
  }

  message EnvironmentScope {
    repeated string environment_ids = 1;
  }

  message ApiScope {
    repeated string api_ids = 1;
  }

  message StringPattern {
    Operator operator = 1;
    string value = 2;
  }

  message KeyValuePattern {
    StringPattern key_pattern = 1;
    StringPattern value_pattern = 2;
  }

  enum ParameterType {
    PARAMETER_TYPE_UNSPECIFIED = 0;
    PARAMETER_TYPE_PATH = 1;
    PARAMETER_TYPE_QUERY = 2;
    PARAMETER_TYPE_REQUEST_HEADER = 3;
    PARAMETER_TYPE_REQUEST_BODY = 4;
    PARAMETER_TYPE_REQUEST_COOKIE = 5;
    PARAMETER_TYPE_RESPONSE_HEADER = 6;
    PARAMETER_TYPE_RESPONSE_BODY = 7;
    PARAMETER_TYPE_RESPONSE_COOKIE = 8;
  }

  enum Operator {
    OPERATOR_UNSPECIFIED = 0;
    OPERATOR_EQUALS = 1; // operator to check if the key is equal to the provided value
    OPERATOR_MATCHES_REGEX = 2; // operator to check if the key matches the provided regex value
  }

  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_MATCH = 1; // action to apply the data type if match is successful
    ACTION_IGNORE = 2; // action to ignore the data type if match is successful
  }
}

message DataSet {
  string id = 1;
  DataSetInfo info = 2;
}

message DataSetInfo {
  string name = 1;
  optional string description = 2;
  bool enabled = 3;
  repeated string data_type_ids = 4;
  DataSuppression data_suppression = 5;

  enum DataSuppression {
    DATA_SUPPRESSION_UNSPECIFIED = 0;
    DATA_SUPPRESSION_RAW = 1;
    DATA_SUPPRESSION_REDACT = 2;
    DATA_SUPPRESSION_OBFUSCATE = 3;
  }
}
