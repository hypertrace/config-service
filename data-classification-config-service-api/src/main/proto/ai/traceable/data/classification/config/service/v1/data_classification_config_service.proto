syntax = "proto3";

package ai.traceable.data.classification.config.service.v1;

option java_multiple_files = true;

import "ai/traceable/data/classification/config/service/v1/data_classification.proto";

service DataClassificationConfigService {

  // create data type
  rpc CreateDataType(CreateDataTypeRequest) returns (CreateDataTypeResponse) {}

  // get all data types
  rpc GetDataTypes(GetDataTypesRequest) returns (GetDataTypesResponse) {}

  // update data type
  rpc UpdateDataType(UpdateDataTypeRequest) returns (UpdateDataTypeResponse) {}

  // delete data type by id
  rpc DeleteDataType(DeleteDataTypeRequest) returns (DeleteDataTypeResponse) {}

  // create data set
  rpc CreateDataSet(CreateDataSetRequest) returns (CreateDataSetResponse) {}

  // get data set by id
  rpc GetDataSet(GetDataSetRequest) returns (GetDataSetResponse) {
    // Prefer using GetDataSets
    option deprecated = true;
  }

  // get all data sets
  rpc GetDataSets(GetDataSetsRequest) returns (GetDataSetsResponse) {}

  // update data set
  rpc UpdateDataSet(UpdateDataSetRequest) returns (UpdateDataSetResponse) {}

  // delete data set by id
  rpc DeleteDataSet(DeleteDataSetRequest) returns (DeleteDataSetResponse) {}

  // create data classification override
  rpc CreateDataClassificationOverride(CreateDataClassificationOverrideRequest) returns (CreateDataClassificationOverrideResponse) {}

  // get data classification overrides
  rpc GetDataClassificationOverrides(GetDataClassificationOverridesRequest) returns (GetDataClassificationOverridesResponse) {}

  // update data classification override
  rpc UpdateDataClassificationOverride(UpdateDataClassificationOverrideRequest) returns (UpdateDataClassificationOverrideResponse) {}

  // delete data classification override
  rpc DeleteDataClassificationOverrides(DeleteDataClassificationOverridesRequest) returns (DeleteDataClassificationOverridesResponse) {}
}

message CreateDataTypeRequest {
  DataTypeRule rule = 1;
}

message CreateDataTypeResponse {
  DataType data_type = 1;
}

message GetDataTypesRequest {
  optional SystemDataSetVersion system_data_set_version = 1;
  bool resolve_inherited_details = 2;
}

message GetDataTypesResponse {
  repeated DataType data_types = 1;
}

message UpdateDataTypeRequest {
  string id = 1;
  DataTypeRule rule = 2;
}

message UpdateDataTypeResponse {
  DataType data_type = 1;
}

message DeleteDataTypeRequest {
  string id = 1;
}

message DeleteDataTypeResponse {
}

message CreateDataSetRequest {
  DataSetInfo info = 1;
}

message CreateDataSetResponse {
  DataSet data_set = 1;
}

message GetDataSetRequest {
  option deprecated = true;
  string id = 1;
}

message GetDataSetResponse {
  option deprecated = true;
  DataSet data_set = 1;
}

message GetDataSetsRequest {
  optional SystemDataSetVersion system_data_set_version = 1;
}

message GetDataSetsResponse {
  repeated DataSet data_sets = 1;
}

message UpdateDataSetRequest {
  string id = 1;
  DataSetInfo info = 2;
}

message UpdateDataSetResponse {
  DataSet data_set = 1;
}

message DeleteDataSetRequest {
  string id = 1;
}

message DeleteDataSetResponse {
}

message CreateDataClassificationOverrideRequest {
  DataClassificationOverrideRule data_classification_override_rule = 1;
}

message CreateDataClassificationOverrideResponse {
  DataClassificationOverride created_data_classification_override = 1;
}

message GetDataClassificationOverridesRequest {
  DataClassificationOverrideFilter filter = 1;
}

message GetDataClassificationOverridesResponse {
  repeated DataClassificationOverride data_classification_overrides = 1;
}

message UpdateDataClassificationOverrideRequest {
  string id = 1;
  DataClassificationOverrideRule data_classification_override_rule = 2;
}

message UpdateDataClassificationOverrideResponse {
  DataClassificationOverride updated_data_classification_override = 1;
}

message DeleteDataClassificationOverridesRequest {
  DataClassificationOverrideFilter filter = 1;
}

message DeleteDataClassificationOverridesResponse {
  repeated DataClassificationOverride deleted_data_classification_overrides = 1;
}

enum SystemDataSetVersion {
  SYSTEM_DATA_SET_VERSION_UNSPECIFIED = 0;
  SYSTEM_DATA_SET_VERSION_RP1 = 1;
}
