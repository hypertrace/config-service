syntax = "proto3";

package ai.traceable.data.classification.config.service.v1;

option java_multiple_files = true;

import "ai/traceable/data/classification/config/service/v1/data_classification.proto";

service DataClassificationConfigService {

  // create data type
  rpc CreateDataType(CreateDataTypeRequest) returns (CreateDataTypeResponse) {}

  // get all data types
  rpc GetDataTypes(GetDataTypesRequest) returns (GetDataTypesResponse) {}

  // update data type
  rpc UpdateDataType(UpdateDataTypeRequest) returns (UpdateDataTypeResponse) {}

  // delete data type by id
  rpc DeleteDataType(DeleteDataTypeRequest) returns (DeleteDataTypeResponse) {}

  // create data set
  rpc CreateDataSet(CreateDataSetRequest) returns (CreateDataSetResponse) {}

  // get data set by id
  rpc GetDataSet(GetDataSetRequest) returns (GetDataSetResponse) {}

  // get all data sets
  rpc GetDataSets(GetDataSetsRequest) returns (GetDataSetsResponse) {}

  // update data set
  rpc UpdateDataSet(UpdateDataSetRequest) returns (UpdateDataSetResponse) {}

  // delete data set by id
  rpc DeleteDataSet(DeleteDataSetRequest) returns (DeleteDataSetResponse) {}
}

message CreateDataTypeRequest {
  DataTypeRule rule = 1;
}

message CreateDataTypeResponse {
  DataType data_type = 1;
}

message GetDataTypesRequest {
}

message GetDataTypesResponse {
  repeated DataType data_types = 1;
}

message UpdateDataTypeRequest {
  string id = 1;
  DataTypeRule rule = 2;
}

message UpdateDataTypeResponse {
  DataType data_type = 1;
}

message DeleteDataTypeRequest {
  string id = 1;
}

message DeleteDataTypeResponse {
}

message CreateDataSetRequest {
  DataSetInfo info = 1;
}

message CreateDataSetResponse {
  DataSet data_set = 1;
}

message GetDataSetRequest {
  string id = 1;
}

message GetDataSetResponse {
  DataSet data_set = 1;
}

message GetDataSetsRequest {
}

message GetDataSetsResponse {
  repeated DataSet data_sets = 1;
}

message UpdateDataSetRequest {
  string id = 1;
  DataSetInfo info = 2;
}

message UpdateDataSetResponse {
  DataSet data_set = 1;
}

message DeleteDataSetRequest {
  string id = 1;
}

message DeleteDataSetResponse {
}
