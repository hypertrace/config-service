common_variables:
  - name: match_criteria_1
    rules:
      - transformation_config:
          jexl_expression:
            jexl_expression: traceable:parseJson($s.request_body)
  - name: request_body_json_object
    rules:
      - transformation_config:
          jexl_expression:
            jexl_expression: traceable:parseJson($s.request_body)
  - name: cookie_uuid
    rules:
      - transformation_config:
          jexl_expression:
            jexl_expression: $s.getHeaders().get('visitor_uuid')
  - name: device_id
    rules:
      - transformation_config:
          jexl_expression:
            jexl_expression: request_body_json_object['options']['uuid']
  - name: ip_address
    rules:
      - transformation_config:
          jexl_expression:
            jexl_expression: $s.getSourceAddress()
  - name: email_address
    rules:
      - transformation_config:
          jexl_expression:
            jexl_expression: request_body_json_object['user']['email']
  - name: client_type
    rules:
      - transformation_config:
          jexl_expression:
            jexl_expression: "useragent:classifyUA($s.user_agent)"

decision_rules:
  - id: "rate_limit_ip_ua"
    name: "rate_limit_ip_ua"
    rule_scope:
      scope_conditions:
        - environment_scope:
            environments:
              - "env1"
              - "env2"
    rule_category: "EDGE_DECISION_RULE_CATEGORY_RATE_LIMIT"
    rule_status:
      disabled: false
    rule_definition:
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      aggregate_threshold_rule:
        match_condition:
          generic_match_condition:
            jexl_expression:
              jexl_expression: "$s.path.contains('registration')"
        group_by_dimensions:
          - name: "ip_address"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "$s.ip_address"
          - name: "device_id"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "device_id"
          - name: "user_agent"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "$s.user_agent"
        time_window: 600s
        value_aggregate_threshold:
          aggregation_type: "AGGREGATION_TYPE_COUNT"
          static_threshold: 10 # count(*) by (ip_address, user_agent) [600s] > 10
    rule_decision:
      edge_decision_type: "EDGE_DECISION_TYPE_BLOCK"
      sampling_rate: 1.0 # apply always
  - id: "enumeration_email_ip_device"
    name: "enumeration_email_ip_device"
    rule_scope:
      scope_conditions:
        - environment_scope:
            environments:
              - "env1"
              - "env2"
    rule_category: "EDGE_DECISION_RULE_CATEGORY_ORIGINAL"
    rule_status:
      disabled: false
    rule_definition:
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      aggregate_threshold_rule:
        match_condition:
          generic_match_condition:
            jexl_expression:
              jexl_expression: "$s.path.contains('login')"
        group_by_dimensions:
          - name: "ip_address"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "$s.ip_address"
          - name: "device_id"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "device_id"
        time_window: 600s
        value_aggregate_threshold:
          dimension:
            name: "email"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "email"
          aggregation_type: "AGGREGATION_TYPE_DISTINCT_COUNT"
          static_threshold: 5 # count(distinct email) by (ip_address, device_id) [600s] > 5.0
    rule_decision:
      edge_decision_type: "EDGE_DECISION_TYPE_BLOCK"
      sampling_rate: 1.0 # apply always
  - id: "transaction_limit_ip"
    name: "transaction_limit_ip"
    rule_scope:
      scope_conditions:
        - environment_scope:
            environments:
              - "env1"
              - "env2"
    rule_category: "EDGE_DECISION_RULE_CATEGORY_ORIGINAL"
    rule_status:
      disabled: false
    rule_definition:
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      aggregate_threshold_rule:
        match_condition:
          generic_match_condition:
            jexl_expression:
              jexl_expression: "$s.path.contains('payment')"
        group_by_dimensions:
          - name: "ip_address"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "$s.ip_address"
          - name: "email"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "email"
        time_window: 600s
        value_aggregate_threshold:
          dimension:
            name: "email"
            rules:
              - transformation_config:
                  jexl_expression:
                    jexl_expression: "email"
          aggregation_type: "AGGREGATION_TYPE_SUM"
          static_threshold: 1000.0 # sum(transaction_amount) by (ip_address, email) [600s] > 1000.0
    rule_decision:
      edge_decision_type: "EDGE_DECISION_TYPE_BLOCK"
      sampling_rate: 1.0 # apply always
  - id: "per_span_signature_rule_1"
    name: "per_span_signature_rule_1"
    rule_scope:
      scope_conditions:
        - environment_scope:
            environments:
              - "env1"
              - "env2"
    rule_category: "EDGE_DECISION_RULE_CATEGORY_CUSTOM_SIGNATURE"
    rule_status:
      disabled: false
    rule_definition:
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      signature_rule:
        match_condition:
          generic_match_condition:
            jexl_expression:
              jexl_expression: "$s.request_headers['visitor_uuid'] != traceable:parseJson($s.request_body)['user']['uuid']"
      attribute_projections:
        - name: ip_address
          rules:
            - transformation_config:
                jexl_expression:
                  jexl_expression: "$s.ip_address"
    rule_decision:
      edge_decision_type: "EDGE_DECISION_TYPE_BLOCK"
      sampling_rate: 1.0 # apply always
  - id: "per_span_signature_rule_2"
    name: "per_span_signature_rule_2"
    rule_scope:
      scope_conditions:
        - environment_scope:
            environments:
              - "env1"
              - "env2"
    rule_category: "EDGE_DECISION_RULE_CATEGORY_CUSTOM_SIGNATURE"
    rule_status:
      disabled: false
    rule_definition:
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      signature_rule:
        match_condition:
          generic_match_condition:
            jexl_expression:
              jexl_expression: "$s.request_headers['visitor_uuid'] == null"
    rule_decision:
      edge_decision_type: "EDGE_DECISION_TYPE_BLOCK"
      sampling_rate: 1.0 # apply always
  - name: "access_pattern_rule"
    rule_definition:
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      access_pattern_rule:
        target_request:
          generic_match_condition:
            jexl_expression:
              jexl_expression: $s.path.contains("/payment")
        filter:
          generic_match_condition:
            jexl_expression:
              jexl_expression: "client_type == 'DESKTOP_WEB'"
        correlation_key:
          attributes:
            - name: "ip_address"
              rules:
                - transformation_config:
                    jexl_expression:
                      jexl_expression: "$s.ip_address"
            - name: "user_agent"
              rules:
                - transformation_config:
                    jexl_expression:
                      jexl_expression: "$s.user_agent"
        pre_requests:
          - match_condition:
              generic_match_condition:
                jexl_expression:
                  jexl_expression: "$s.url.equals('/profile') && $s.request_method.equals('GET')"
          - match_condition:
              generic_match_condition:
                jexl_expression:
                  jexl_expression: "$s.url.equals('/me') && $s.request_method.equals('POST')"
        check_for_any_pre_requests: true # has any call been made
        time_window: 600s

edge_decision_spec_configs:
  - edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
    scope:
      environment: "prod"
    edge_decision_specs:
    - edge_decision:
        edge_decision_type: "EDGE_DECISION_TYPE_ALLOW"
      specific_rule_ids:
        values:
        - "per_span_signature_rule_1"
        - "per_span_signature_rule_2"
    - edge_decision:
        edge_decision_type: "EDGE_DECISION_TYPE_BLOCK"
      all_rules: true
    - edge_decision:
        edge_decision_type: "EDGE_DECISION_TYPE_ALLOW"
      any_rule_of_type: "EDGE_DECISION_TYPE_ALLOW"
