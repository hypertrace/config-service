syntax = "proto3";

package ai.traceable.edge.decision.config.service.v1;

import "ai/traceable/datamodel/data/transformation/config/v1/transformation.proto";
import "ai/traceable/edge/decision/config/service/v1/edge_attribution_rule.proto";
import "ai/traceable/edge/decision/config/service/v1/edge_custom_response.proto";
import "ai/traceable/edge/decision/config/service/v1/edge_decision_common.proto";
import "ai/traceable/edge/decision/config/service/v1/edge_decision_rule.proto";
import "ai/traceable/edge/decision/config/service/v1/edge_decision_spec.proto";
import "google/protobuf/struct.proto";

option java_multiple_files = true;

// this is the overall config for the edge decision engine.
message EdgeDecisionEngineConfig {
  // this will set to tenant id itself because this config is per tenant.
  string id = 1;
  string name = 2;
  // caller manages the version.
  int64 version = 3;
  // common variables used in the rules
  repeated ai.traceable.datamodel.data.transformation.config.v1.VariableDerivationMapping common_variables = 4;
  // list of all decision rules
  repeated EdgeDecisionRule decision_rules = 5;
  // decision specs encapsulate the "decision tree"
  repeated EdgeDecisionSpec decision_specs = 6;
  // disable edge decision completely
  bool disabled = 7;
  // disable only specific rule categories
  repeated EdgeDecisionRuleCategory disabled_rule_categories = 8;
  // list of all attribution rules
  repeated EdgeAttributionRule attribution_rules = 9;
  // default custom response to be sent on DECISION_DENY
  EdgeCustomResponse default_block_response = 10;
  // allow for customization. mostly to handle hotfix scenarios that won't require change in contract.
  google.protobuf.Value custom_config = 100;
}

message ScopedEdgeDecisionConfig {
  // common variables used in the rules
  repeated ai.traceable.datamodel.data.transformation.config.v1.VariableDerivationMapping common_variables = 1;
  // list of decision rules associated with the scope of the decision spec
  repeated EdgeDecisionRule decision_rules = 2;
  // decision specs encapsulate the "decision tree"
  EdgeDecisionSpec decision_spec = 3;
}
