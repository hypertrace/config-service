syntax = "proto3";

package ai.traceable.config.commons.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;

message AuditDetails {
  CreationDetails creation_details = 1;
  LastUpdateDetails last_user_update_details = 2;
}

message CreationDetails {
  string created_by = 1;
  google.protobuf.Timestamp created_at = 2;
}

message LastUpdateDetails {
  string updated_by = 1;
  google.protobuf.Timestamp updated_at = 2;
}

message AuditFilter {
  TimestampRange created_range = 1;
  TimestampRange updated_range = 2;
  string created_by_contains = 3;
  string last_updated_by_user_contains = 4;
}

message TimestampRange {
  optional google.protobuf.Timestamp start = 1;
  optional google.protobuf.Timestamp end = 2;
}
