syntax = "proto3";
package ai.traceable.attribute.resolution.config.service.v1;

import "ai/traceable/attribute/resolution/config/service/v1/attribute_resolution_config.proto";

option java_multiple_files = true;

message GetAttributeResolutionConfigsResponse {
  repeated AttributeResolutionConfig configs = 1;
}

message CreateAttributeResolutionConfigResponse {
  AttributeResolutionConfig config = 1;
}

message UpdateAttributeResolutionConfigResponse {
  AttributeResolutionConfig config = 1;
}

message DeleteAttributeResolutionConfigResponse {}
