trainer.config.service {
  apiNamingTrainingConfigs = [
    {
      disabled = false,
      apiNamingTrainingConfig = {
        urlFilterConfig = {
          urlRejectRegexPatterns = {
            values = [".css", ".html"]
          }
        }
      }
    },
    {
      disabled = false,
      apiNamingTrainingConfig = {
        trieModelTrainingConfig = {
          allowRegexList = {
            values = ["v\\d+"]
          }
          ids = {
            threshold = 1
            regexList = {
              values  = ["(\\{){0,1}[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}(\\}){0,1}", "\\d+"]
            }
          }
          lowCardinality = {
            threshold = 10
            regexList = {
              values = []
            }
          }
          mediumCardinality = {
            threshold = 25
          }
          highCardinality = {
            threshold = 45
            regexList = {
              values = ["[a-zA-Z]*?([-_+]?[a-zA-Z]+)+[-_+]?"]
            }
          }
          embryonicThreshold = 100
          extensions = {
            values = ["json", "xml"]
          }
        }
      }
    }
  ]
}
