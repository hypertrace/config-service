    {
      disabled = true,
      volumetricTrainingConfig = {
        apiCallSpikeConfig = {
          apiCallSpikeTuningConfigList = {
            apiCallSpikeTuningConfigs = [
              {
                trainingScopeConfig = {}
                endpointSpanCountThreshold = 2000
                endpointSpanCountPercentileThreshold = 0.75
                timeFractionTrainingWindowThreshold = 0.5
              }
            ]
          }
        }
      }
    }
  ],
  apiDiscoveryConfigs = [
    {
      disabled = true,
      apiDiscoveryConfig = {
        staticApiDiscoveryConfig = {
          staticApiDiscoveryState = STATIC_API_DISCOVERY_ACTION_HIDE
          discoveryFilter = {
            logicalFilter = {
              operator = LOGICAL_OPERATOR_AND
              filters = [
                {
                  relationalFilter = {
                    keyFilter = {
                      location = KEY_LOCATION_REQUEST_BODY_SIZE
                    }
                    valueFilter = {
                      operator = RELATIONAL_OPERATOR_EQUALS
                      value = {
                        stringValue = "0"
                      }
                    }
                  }
                },
                {
                  relationalFilter = {
                    keyFilter = {
                      location = KEY_LOCATION_RESPONSE_BODY_SIZE
                    }
                    valueFilter = {
                      operator = RELATIONAL_OPERATOR_EQUALS
                      value = {
                        stringValue = "0"
                      }
                    }
                  }
                },
                {
                  relationalFilter = {
                    keyFilter = {
                      location = KEY_LOCATION_REQUEST_HEADER
                      operator = RELATIONAL_OPERATOR_CONTAINS
                      value = {
                        stringValue = "content-type"
                      }
                    }
                    valueFilter = {
                      operator = RELATIONAL_OPERATOR_NOT_CONTAINS
                      value = {
                        stringValues = {
                          values = ["json", "xml", "urlencoded", "graphql", "protobuf", "multipart", "text/plain"]
                        }
                      }
                    }
                  }
                },
                {
                  relationalFilter = {
