                {
                  level = 1
                  idsThreshold = 100
                  gibberishThreshold = 100
                  lowCardinalityThreshold = 100
                  mediumCardinalityThreshold = 500
                  highCardinalityThreshold = 1000
                }
              ]
            }
          ]
          ids = {
            threshold = 1
            regexList = {
            values = ["(\\{){0,1}[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}(\\}){0,1}", "\\d+"]
            }
          }
          lowCardinality = {
            threshold = 10
            regexList = {
              values = []
            }
          }
          mediumCardinality = {
            threshold = 25
          }
          highCardinality = {
            threshold = 45
            regexList = {
              values = ["[a-zA-Z]*?([-_+]?[a-zA-Z]+)+[-_+]?"]
            }
          }
          embryonicThreshold = 10
          maxNumberOfTriePaths = 3
          extensions = {
            values = ["json", "xml"]
