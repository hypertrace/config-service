          }
        }
      }
    },
    {
      disabled = false
      apiNamingTrainingConfig = {
        rejectFilterConfig = {
          segmentFilterConfig = {
            urlPartsThreshold = 100
            segmentLengthThreshold = 100
          }
          userAgentFilterConfig = {
            botAgentList = {
              values = []
            }
          }
          statusCodeFilterConfig = {
            range_filter_configs = [
              {
                low = 300
                high = 599
                exclusions = {
                  values = [302, 307]
                }
              },
              {
                low = 0
                high = 0
              }
            ]
          }
          urlPathFilterConfig = {
             urlPathRegexPatterns = {
               values = [".*\\.css$", ".*\\.jpg$", ".*\\.svg$", ".*\\.js$", ".*\\.pdf$", ".*\\.jpeg$", ".*\\.gif$", ".*\\.png$", ".*\\.bmp$", ".*\\.tif$", ".*\\.tiff$", ".*\\.mp3$", ".*\\.wma$", ".*\\.wav$", ".*\\.ogg$", ".*\\.mp4$", ".*\\.avi$", ".*\\.mkv$", ".*\\.woff$", ".*\\.woff2$", ".*\\.webp$", ".*\\.html$"]
             }
          }
        }
      }
    },
    {
      disabled = false
      apiNamingTrainingConfig = {
        trieModelTrainingConfig = {
          allowRegexList = {
            values = ["v\\d+"]
          }
          idEnums = {
            values = ["AF","AX","AL","DZ","AS","AD","AO","AI","AQ","AG","AR","AM","AW","AU","AT"]
          }
          segmentMergeConfig = [
            {
              disabled = true
              segmentDepth = "2"
