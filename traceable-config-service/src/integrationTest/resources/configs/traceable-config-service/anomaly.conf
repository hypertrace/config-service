                      location = KEY_LOCATION_ATTRIBUTES
                      operator = RELATIONAL_OPERATOR_CONTAINS
                      value = {
                        stringValue = "http.method"
                      }
                    }
                    valueFilter = {
                      operator = RELATIONAL_OPERATOR_NOT_IN
                      value = {
                        stringValues = {
                          values = ["DELETE", "PUT", "POST", "PATCH"]
                        }
                      }
                    }
                  }
                }
              ]
            }
          }
        }
