main.class = ai.traceable.config.service.TraceableConfigService
service.name = traceable-config-service
service.port.internal = 60101
service.port.external = 60102
service.admin.port = 60103
global.service.port.internal = 60104

generic.config.service {
  document.store {
    dataStoreType = mongo
    mongo {
      host = localhost
      port = 37017
    }
  }
  publish.change.events = false
}

event.store {
  type = kafka
  bootstrap.servers = "localhost:9092"
  activity.events.producer {
    topic.name = activity-events
    bootstrap.servers = "localhost:9092"
    key.serializer = org.apache.kafka.common.serialization.StringSerializer
    value.serializer = io.confluent.kafka.serializers.KafkaAvroSerializer
    schema.registry.url = "http://localhost:8081"
  }
  config.change.events.producer {
    topic.name = config-change-events
    bootstrap.servers = "localhost:9092"
    key.serializer = io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
    value.serializer = io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
    schema.registry.url = "http://localhost:8081"
  }
}

sensitive.data.config.service {
  default.param.type.redaction.strategy = REDACTION_STRATEGY_RAW
  default.automatic.secret.redaction.enabled = true
  default.pii.filter.config {
    "complexData": [
      {
        "key": "http.response.header.set-cookie",
        "type": "cookie"
      },
      {
        "key": "http.request.header.cookie",
        "type": "cookie"
      },
      {
        "key": "http.response.body",
        "typeKey": "http.response.header.content-type"
      },
      {
        "key": "http.request.body",
        "typeKey": "http.request.header.content-type"
      },
      {
        "key": "rpc.response.body",
        "type": "json"
      },
      {
        "key": "rpc.request.body",
        "type": "json"
      },
      {
        "key": "sql.query",
        "type": "sql"
      },
      {
        "key": "http.url",
        "type": "urlencoded"
      }
    ],
    "keyRegexs": [
      {
        "category": "auth",
        "regex": "^access_token(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^api_key(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^apikey(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^password(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^passwd(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^secret(\\[\\d+\\])?$"
      }
    ],
    "prefixes": [
      "http.request.header.",
      "http.response.header.",
      "rpc.request.metadata.",
      "rpc.response.metadata."
    ],
    "redactionStrategy": "REDACTION_STRATEGY_REDACT",
    "invalidJsonPolicy": {}
  }
  default.redaction.rules {
    "auto_redaction_rule-session_header": {
      "name": "Default: session",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^session(\\[\\d+\\])?$"
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-remember_token_header": {
      "name": "Default: remember_token",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^remember_token(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-authorization_header": {
      "name": "Default: authorization",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^authorization(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    }
  }
}

rate.limiting.config.service {
  maxCallCountDurationLimitMinutes = 180m
  shouldPublishActivityEvents = false
}

iprange.config.service {
    shouldPublishActivityEvents = false
}

actor.service.config = {
  host = localhost
  port = 60888
  cache = {
    maxCacheSize = 100
    refreshAfterWriteDuration = 1m
    expireAfterWriteDuration = 2m
  }
  maxNumberOfActors = 10000
}

insights.service.config = {
  host = localhost
  port = 60098
}

entity.service = {
  config {
    host = localhost
    port = 60061
  }
  attributeMap {
    service.id = "SERVICE.id"
    service.name = "SERVICE.name"
    service.environment = "SERVICE.environment"
  }
}

local.api.naming.config = {
  full.trie.reload.config = {
    default = {
      version = "1.2.3"
    }
  }
}

api.naming.config {
  regex {
    fallbacks = ["(\\{){0,1}[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}(\\}){0,1}","\\d+"];
  }
  default.embryonic.threshold = 10
  default.max.number.of.trie.paths = 100
  configs = {
    cache = {
      refreshAfterWriteDuration = 2m
      expireAfterWriteDuration = 2m
    }
  }
  customRules = {
    cache = {
      refreshAfterWriteDuration = 12h
      expireAfterWriteDuration = 24h
      maximumSize = 100
    }
  }
  trieDiffLog = {
    model.store = {
      deep.store.fs.scheme = file
      directory = "/tmp/difflogs"
    }
    diff.logs.retention.period = 1h
    directory.name = "difflog"
    cache = {
      refreshAfterWriteDuration = 2m
      expireAfterWriteDuration = 2m
    }
  }
  trieModels = {
    model.stores = [
      {
        deep.store.fs.scheme = file
        directory = "/tmp/models"
        read.enabled = true
        read.priority = 1
      }
    ]
    cache = {
      refreshAfterWriteDuration = 2m
      expireAfterWriteDuration = 2m
    }
  }
  entity.fetcher = {
    cache = {
      refreshAfterWriteDuration = 12h
      expireAfterWriteDuration = 24h
      maximumSize = 1000
      delegate = {
        refreshAfterWriteDuration = 600s
        expireAfterWriteDuration = 1200s
        maximumSize = 1000
      }
    }
  }
}

license.status.config.service {
  default.license.limit = LICENSE_LIMIT_AVAILABLE
}

local.processing.config.service {
  default.protection.mode = PROTECTION_MODE_ADVANCED
  sampling.policies = [
    {
      "name": "endpoint-rate-limit",
      "rateLimiting": {
        "traceLimitPerEndpointPerMinute": 1000,
        "traceLimitGloballyPerMinute": 10000
      }
    },
    {
      "name": "modsec-anomaly",
      "modsecAnomaly": {}
    },
    {
      "name": "traceableai-blocking-attribute",
      "spanAttributes": {
        "attributesRequiredForSampling": [
            {
                "key": "traceableai.blocked",
                "values": [
                    {
                        "stringValue": "true"
                    },
                    {
                        "boolValue": true
                    }
                ]
            }
        ]
      }
    }
  ]
  modsec.redact = true
}

region.config.service {
  neustar.countries.data {
    mode = RESOURCE_FILE
    resource.file = neustar/countries.csv
  }
  ipqs.countries.data {
    mode = RESOURCE_FILE
    resource.file = ipqs/countries.csv
  }
  shouldPublishActivityEvents = false
}

blocking.config.service.iptype {
  mode = RESOURCE_FILE
  resource.file = iptype/integration_test_highrisk.csv
}

custom.signature.config.service {
  shouldPublishActivityEvents = false
}

anomaly.config.service {
  include "anomaly.conf"
}

risk.config.service {
  include "risk.conf"
}

license.metering.service {
  host = "localhost"
  port = 60099
  call.timeout.duration = 10s
  cache.expiration.duration = 5m
  cache.max.size = 5000
}

feature.flag.service.config {
  host = "localhost"
  port = 60097
}

data.classification.config.service {
  system.datasets = []
  system.datatypes = []
}