main.class = ai.traceable.config.service.TraceableConfigService
service.name = traceable-config-service
service.port.internal = 60101
service.port.external = 60102
service.admin.port = 60103

generic.config.service {
  document.store {
    dataStoreType = mongo
    mongo {
      host = localhost
      port = 37017
    }
  }
}

event.store {
  type = kafka
  bootstrap.servers = "localhost:9092"
  activity.events.producer {
    topic.name = activity-events
    bootstrap.servers = "localhost:9092"
    key.serializer = org.apache.kafka.common.serialization.StringSerializer
    value.serializer = io.confluent.kafka.serializers.KafkaAvroSerializer
    schema.registry.url = "http://localhost:8081"
  }
}

sensitive.data.config.service {
  default.param.type.redaction.strategy = REDACTION_STRATEGY_RAW
  default.automatic.secret.redaction.enabled = true
  default.pii.filter.config {
    "complexData": [
      {
        "key": "http.response.header.set-cookie",
        "type": "cookie"
      },
      {
        "key": "http.request.header.cookie",
        "type": "cookie"
      },
      {
        "key": "http.response.body",
        "typeKey": "http.response.header.content-type"
      },
      {
        "key": "http.request.body",
        "typeKey": "http.request.header.content-type"
      },
      {
        "key": "rpc.response.body",
        "type": "json"
      },
      {
        "key": "rpc.request.body",
        "type": "json"
      },
      {
        "key": "sql.query",
        "type": "sql"
      },
      {
        "key": "http.url",
        "type": "urlencoded"
      }
    ],
    "keyRegexs": [
      {
        "category": "auth",
        "regex": "^access_token(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^api_key(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^apikey(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^password(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^passwd(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^secret(\\[\\d+\\])?$"
      }
    ],
    "prefixes": [
      "http.request.header.",
      "http.response.header.",
      "rpc.request.metadata.",
      "rpc.response.metadata."
    ],
    "redactionStrategy": "REDACTION_STRATEGY_REDACT"
  }
  default.prepopulated.redaction.rules {
    "auto_redaction_rule-session_header": {
      "name": "Default: session",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^session(\\[\\d+\\])?$"
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-remember_token_header": {
      "name": "Default: remember_token",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^remember_token(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-authorization_header": {
      "name": "Default: authorization",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^authorization(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    }
  }
  default.redaction.rules = [
    {
      "regex": ".*",
      "name": "Default (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_REDACT",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^user-agent$",
      "name": "Default: user-agent Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^host$",
      "name": "Default: HTTP host Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^content-type$",
      "name": "Default: content-type Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^content-length$",
      "name": "Default: content-length Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^:path$",
      "name": "Default: rpc path (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^:status$",
      "name": "Default: RPC response status (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^grpc-status$",
      "name": "Default: grpc response status (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "^:authority$",
      "name": "Default: RPC authority metadata (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "regex": "(^x-real-ip$)|(^forwarded$)|(^x-forwarded-for$)|(^x-proxy-user-ip$)",
      "name": "Default: IP headers (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    }
  ]
}

rate.limiting.config.service {
  maxCallCountDurationLimitMinutes = 180m
  shouldPublishActivityEvents = true
}

insights.service.config = {
  host = localhost
  port = 60098
}

license.status.config.service {
  default.license.limit = LICENSE_LIMIT_AVAILABLE
}

local.processing.config.service {
  default.protection.mode = PROTECTION_MODE_ADVANCED
}

region.config.service {
  neustar {
    countries.data.path = /neustar/countries.csv
  }
}

custom.signature.config.service {
  modsecurity {
    directives.data.path = modsecurity.conf
  }
}

blocking.config.service {
  safecrs {
    modsecurity.rules.data.path = safecrs/modsecurity.conf
  }
}

anomaly.config.service {
  include "anomaly.conf"
}