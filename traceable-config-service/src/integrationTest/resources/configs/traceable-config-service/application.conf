main.class = ai.traceable.config.service.TraceableConfigService
service.name = traceable-config-service
service.port.internal = 60101
service.port.external = 60102
service.admin.port = 60103

generic.config.service {
  document.store {
    dataStoreType = mongo
    mongo {
      host = localhost
      port = 37017
    }
  }
  publish.change.events = false
}

event.store {
  type = kafka
  bootstrap.servers = "localhost:9092"
  activity.events.producer {
    topic.name = activity-events
    bootstrap.servers = "localhost:9092"
    key.serializer = org.apache.kafka.common.serialization.StringSerializer
    value.serializer = io.confluent.kafka.serializers.KafkaAvroSerializer
    schema.registry.url = "http://localhost:8081"
  }
  config.change.events.producer {
    topic.name = config-change-events
    bootstrap.servers = "localhost:9092"
    key.serializer = io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
    value.serializer = io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer
    schema.registry.url = "http://localhost:8081"
  }
}

sensitive.data.config.service {
  default.param.type.redaction.strategy = REDACTION_STRATEGY_RAW
  default.automatic.secret.redaction.enabled = true
  default.pii.filter.config {
    "complexData": [
      {
        "key": "http.response.header.set-cookie",
        "type": "cookie"
      },
      {
        "key": "http.request.header.cookie",
        "type": "cookie"
      },
      {
        "key": "http.response.body",
        "typeKey": "http.response.header.content-type"
      },
      {
        "key": "http.request.body",
        "typeKey": "http.request.header.content-type"
      },
      {
        "key": "rpc.response.body",
        "type": "json"
      },
      {
        "key": "rpc.request.body",
        "type": "json"
      },
      {
        "key": "sql.query",
        "type": "sql"
      },
      {
        "key": "http.url",
        "type": "urlencoded"
      }
    ],
    "keyRegexs": [
      {
        "category": "auth",
        "regex": "^access_token(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^api_key(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^apikey(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^password(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^passwd(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^secret(\\[\\d+\\])?$"
      }
    ],
    "prefixes": [
      "http.request.header.",
      "http.response.header.",
      "rpc.request.metadata.",
      "rpc.response.metadata."
    ],
    "redactionStrategy": "REDACTION_STRATEGY_REDACT",
    "invalidJsonPolicy": {}
  }
  default.prepopulated.redaction.rules {
    "auto_redaction_rule-session_header": {
      "name": "Default: session",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^session(\\[\\d+\\])?$"
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-remember_token_header": {
      "name": "Default: remember_token",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^remember_token(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-authorization_header": {
      "name": "Default: authorization",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^authorization(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    }
  }
  default.redaction.rules = [
    {
      "id": "core_mode_rule_1",
      "category": "core_mode_default_rules",
      "regex": ".*",
      "name": "Default (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_REDACT",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_2",
      "category": "core_mode_default_rules",
      "regex": "^user-agent$",
      "name": "Default: user-agent Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_3",
      "category": "core_mode_default_rules",
      "regex": "^host$",
      "name": "Default: HTTP host Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_4",
      "category": "core_mode_default_rules",
      "regex": "^content-type$",
      "name": "Default: content-type Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_5",
      "category": "core_mode_default_rules",
      "regex": "^content-length$",
      "name": "Default: content-length Header (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_6",
      "category": "core_mode_default_rules",
      "regex": "^:path$",
      "name": "Default: rpc path (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_7",
      "category": "core_mode_default_rules",
      "regex": "^:status$",
      "name": "Default: RPC response status (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_8",
      "category": "core_mode_default_rules",
      "regex": "^grpc-status$",
      "name": "Default: grpc response status (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_9",
      "category": "core_mode_default_rules",
      "regex": "^:authority$",
      "name": "Default: RPC authority metadata (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    },
    {
      "id": "core_mode_rule_10",
      "category": "core_mode_default_rules",
      "regex": "(^x-real-ip$)|(^forwarded$)|(^x-forwarded-for$)|(^x-proxy-user-ip$)",
      "name": "Default: IP headers (Local Processing Only)",
      "redactionStrategy": "REDACTION_STRATEGY_RAW",
      "matchType": "MATCH_TYPE_KEY",
      "conditions": [
          {
              "attributeRegexMatch": {
                  "key": "traceableai.processing",
                  "regex": "core"
              }
          }
      ]
    }
  ]
}

rate.limiting.config.service {
  maxCallCountDurationLimitMinutes = 180m
  shouldPublishActivityEvents = false
}

iprange.config.service {
    shouldPublishActivityEvents = false
}

insights.service.config = {
  host = localhost
  port = 60098
}

entity.service.config = {
  host = localhost
  port = 60061
}

api.naming.config {
  regex {
    fallbacks = ["(\\{){0,1}[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}(\\}){0,1}","\\d+"];
  }
  default.embryonic.threshold = 100
  trieDiffLog = {
    model.store = {
      deep.store.fs.scheme = file
      directory = "/tmp/difflogs"
    }
    diff.logs.retention.period = 1h
  }
  trieModels = {
    model.stores = [
      {
        deep.store.fs.scheme = file
        directory = "/tmp/models"
        read.enabled = true
        read.priority = 1
      }
    ]
  }
}

license.status.config.service {
  default.license.limit = LICENSE_LIMIT_AVAILABLE
}

local.processing.config.service {
  default.protection.mode = PROTECTION_MODE_CORE
  sampling.policies = [
    {
      "name": "endpoint-rate-limit",
      "rateLimiting": {
        "traceLimitPerEndpointPerMinute": 1000,
        "traceLimitGloballyPerMinute": 10000
      }
    },
    {
      "name": "modsec-anomaly",
      "modsecAnomaly": {}
    },
    {
      "name": "traceableai-blocking-attribute",
      "spanAttributes": {
        "attributesRequiredForSampling": [
            {
                "key": "traceableai.blocked",
                "values": [
                    {
                        "stringValue": "true"
                    },
                    {
                        "boolValue": true
                    }
                ]
            }
        ]
      }
    }
  ]
  modsec.redact = true
}

region.config.service {
  neustar {
    countries.data.path = /neustar/countries.csv
  }
  shouldPublishActivityEvents = false
}

custom.signature.config.service {
  shouldPublishActivityEvents = false
}

anomaly.config.service {
  include "anomaly.conf"
}

risk.config.service {
  include "risk.conf"
}

license.metering.service {
  host = "localhost"
  port = 60099
  call.timeout.ms = 60000
  cache.expiry.duration = 5m
  cache.max.size = 5000
}

feature.flag.service.config {
  host = "localhost"
  port = 60097
}

data.classification.config.service {
  system.datasets = []
  system.datatypes = []
}