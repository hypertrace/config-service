      },
      {
        "regex": "http.request.header.content-type",
        "name": "Default: content-type Request Header (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_RAW",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
