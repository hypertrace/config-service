main.class = ai.traceable.config.service.TraceableConfigService
service.name = traceable-config-service
service.port.internal = 50101
service.port.external = 50102
service.admin.port = 50103

generic.config.service {
  document.store {
    dataStoreType = mongo
    mongo {
      host = localhost
      host = ${?MONGO_HOST} # provides a way to override the mongo_host via an environment variable
      port = 27017
    }
  }
  publish.change.events = false
}

event.store {
  type = kafka
  bootstrap.servers = "localhost:9092"
  activity.events.producer {
    topic.name = activity-events
    bootstrap.servers = "localhost:9092"
    key.serializer = org.apache.kafka.common.serialization.StringSerializer
    value.serializer = io.confluent.kafka.serializers.KafkaAvroSerializer
    schema.registry.url = "http://localhost:8081"
  }
  config.change.events.producer {
    topic.name = config-change-events
    bootstrap.servers = "localhost:9092"
    key.serializer = org.hypertrace.config.change.event.v1.ConfigChangeEventKeySerializer
    value.serializer = org.hypertrace.config.change.event.v1.ConfigChangeEventValueSerializer
  }
}

sensitive.data.config.service {
  default.param.type.redaction.strategy = REDACTION_STRATEGY_RAW
  default.automatic.secret.redaction.enabled = true
  default.full.privacy.mode.enabled = false
  default.pii.filter.config {
    "complexData": [
      {
        "key": "http.response.header.set-cookie",
        "type": "cookie"
      },
      {
        "key": "http.request.header.cookie",
        "type": "cookie"
      },
      {
        "key": "http.response.body",
        "typeKey": "http.response.header.content-type"
      },
      {
        "key": "http.request.body",
        "typeKey": "http.request.header.content-type"
      },
      {
        "key": "rpc.response.body",
        "type": "json"
      },
      {
        "key": "rpc.request.body",
        "type": "json"
      },
      {
        "key": "sql.query",
        "type": "sql"
      },
      {
        "key": "http.url",
        "type": "urlencoded"
      }
    ],
    "keyRegexs": [
      {
        "category": "auth",
        "regex": "^access_token(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^api_key(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^apikey(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^password(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^passwd(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^secret(\\[\\d+\\])?$"
      }
    ],
    "prefixes": [
      "http.request.header.",
      "http.response.header.",
      "rpc.request.metadata.",
      "rpc.response.metadata."
    ],
    "redactionStrategy": "REDACTION_STRATEGY_REDACT",
    "invalidJsonPolicy": {}
  }
  default.redaction.rules {
    "auto_redaction_rule-session_header": {
      "name": "Default: session",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^session(\\[\\d+\\])?$"
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-remember_token_header": {
      "name": "Default: remember_token",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^remember_token(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    },
    "auto_redaction_rule-authorization_header": {
      "name": "Default: authorization",
      "redactionStrategy": "REDACTION_STRATEGY_HASH",
      "regex": "^authorization(\\[\\d+\\])?$",
      "matchType": "MATCH_TYPE_HEADER",
      "category": "auth",
      "sessionIdentifier": true
    }
  }
}

rate.limiting.config.service {
  maxCallCountDurationLimitMinutes = 180m
  shouldPublishActivityEvents = true
}

iprange.config.service {
  shouldPublishActivityEvents = true
}

actor.service.config = {
  host = localhost
  port = 50888
  request.timeout = 10s
  cache = {
    maxCacheSize = 10000
    refreshAfterWriteDuration = 30s
    expireAfterWriteDuration = 10m
  }
}

insights.service.config = {
  host = localhost
  port = 50098
  request.timeout = 10s
}

entity.service = {
  config {
    host = localhost
    port = 50061
  }
  attributeMap {
    service.id = "SERVICE.id"
    service.name = "SERVICE.name"
    service.environment = "SERVICE.environment"
    environment.id = "ENVIRONMENT.id"
    environment.name = "ENVIRONMENT.name"
  }
  cache = {
    maxCacheSize = 10000
    refreshAfterWriteDuration = 10m
    expireAfterWriteDuration = 12h
  }
}

#TODO: fix cache durations and maximumSizes
api.naming.config {
  regex {
    fallbacks = ["(\\{){0,1}[0-9a-fA-F]{8}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{4}-?[0-9a-fA-F]{12}(\\}){0,1}","\\d+"];
  }
  default.embryonic.threshold = 100
  default.max.number.of.trie.paths = 10000
  configs = {
    cache = {
      refreshAfterWriteDuration = 12h
      expireAfterWriteDuration = 24h
      maximumSize = 100
    }
  }
  customRules = {
    cache = {
      refreshAfterWriteDuration = 150s
      expireAfterWriteDuration = 300s
      maximumSize = 100
    }
  }
  trieDiffLog = {
    model.store = {
      deep.store.fs.scheme = file
      directory = "/tmp/customers/"
    }
    diff.logs.retention.period = 1h
    directory.name = "difflog"
    cache = {
      refreshAfterWriteDuration = 150s
      expireAfterWriteDuration = 300s
      maximumSize = 100
    }
  }
  trieModels = {
    model.stores = [
      {
        deep.store.fs.scheme = file
        directory = "/var/data/models/dev/customers/"
        read.enabled = true
        read.priority = 1
      }
    ]
    cache = {
      refreshAfterWriteDuration = 150s
      expireAfterWriteDuration = 300s
      maximumSize = 100
    }
  }
  entity.fetcher = {
    cache = {
      refreshAfterWriteDuration = 12h
      expireAfterWriteDuration = 24h
      maximumSize = 1000
      delegate = {
        refreshAfterWriteDuration = 600s
        expireAfterWriteDuration = 1200s
        maximumSize = 1000
      }
    }
  }
}

