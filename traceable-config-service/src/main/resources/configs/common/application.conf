        "name": "Default: content-type Response Header (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_RAW",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
        "regex": "rpc.request.metadata.:path",
        "name": "Default: rpc request path (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_RAW",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      }
    ]
  }
}

rate.limiting.config.service {
  maxCallCountDurationLimitMinutes = 180m
  publishActivityEvents = true
}

insights.service.config = {
  host = localhost
  port = 50098
}

local.processing.config.service {
  default.protection.mode = PROTECTION_MODE_ADVANCED
}

region.config.service {
  neustar {
    countries.data.path = /neustar/countries.csv
  }
}

custom.signature.config.service {
  modsecurity {
    directives.data.path = modsecurity.conf
  }
}

blocking.config.service {
  safecrs {
    modsecurity.rules.data.path = safecrs/modsecurity.conf
  }
}

threat.management.config.service {
  upper.bound.score {
    low = 10
    medium = 20
    high = 50
  }
  security.event.contribution.score {
    low = 1
    medium = 2
    high = 3
  }
  anomaly.contribution.score = 1
}

anomaly.config.service {
  include "anomaly.conf"
}