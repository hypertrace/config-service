external.data.classification.config.service {
  data.parsing.rules = [
    {
      "attribute_filter": {
        "prefixes": [
          "http.response.header.set-cookie"
        ]
      },
      "mode": "DATA_PARSING_MODE_COOKIE_STRING"
    },
    {
      "attribute_filter": {
        "prefixes": [
          "http.request.header.cookie"
        ]
      },
      "mode": "DATA_PARSING_MODE_COOKIE_STRING"
    },
    {
      "attribute_filter": {
        "prefixes": [
          "sql.query",
          "db.statement"
        ]
      },
      "mode": "DATA_PARSING_MODE_SQL"
    },
    {
      "attribute_filter": {
        "prefixes": [
          "http.url",
          "http.target",
          "http.path",
          "url.query"
          "url.full"
        ]
      },
      "mode": "DATA_PARSING_MODE_URL_ENCODED"
    },
    {
      "spanFilter": {
        "requiredMatchingAttributes": [{
          "namePredicate": {
            "operator": "OPERATOR_EQUALS",
            "value": "http.request.body.truncated"
           }
        }]
      },
      "attributeFilter": {
        "prefixes": ["http.request.body"]
      },
      "mode": "DATA_PARSING_MODE_JSON",
      "dropOnFailure": {}
    },
    {
      "spanFilter": {
        "requiredMatchingAttributes": [{
          "namePredicate": {
            "operator": "OPERATOR_EQUALS",
            "value": "http.response.body.truncated"
           }
        }]
      },
      "attributeFilter": {
        "prefixes": ["http.response.body"]
      },
      "mode": "DATA_PARSING_MODE_JSON",
      "dropOnFailure": {}
    },
    {
      "spanFilter": {
        "requiredMatchingAttributes": [{
          "namePredicate": {
            "operator": "OPERATOR_EQUALS",
            "value": "rpc.request.body.truncated"
           }
        }]
      },
      "attributeFilter": {
        "prefixes": ["rpc.request.body"]
      },
      "mode": "DATA_PARSING_MODE_JSON"
      "dropOnFailure": {}
    },
    {
      "spanFilter": {
        "requiredMatchingAttributes": [{
          "namePredicate": {
            "operator": "OPERATOR_EQUALS",
            "value": "rpc.response.body.truncated"
           }
        }]
      },
      "attributeFilter": {
        "prefixes": ["rpc.response.body"]
      },
      "mode": "DATA_PARSING_MODE_JSON",
      "dropOnFailure": {}
    }
  ]
  default.external.data.types = [
    {
      "data_type_id": "db_query_attributes"
      "match_rules": [
        {
          "attribute_filter": {
            "prefixes": ["sql.query", "db.statement"]
          }
          "result": RESULT_MATCH
          "path_predicate": {
            "path_segment_predicate": {
              "operator": OPERATOR_MATCHES_REGEX,
              "value": ".*"
            }
          }
        }
      ]
      "transformation": DATA_TRANSFORMATION_REDACT
    },
    {
      "data_type_id": "new_session_attribute"
      "match_rules": [
        {
          "attribute_filter": {
            "prefixes": ["session.new"]
          }
          "result": RESULT_MATCH
          "path_predicate": {
            "path_segment_predicate": {
              "operator": OPERATOR_MATCHES_REGEX,
              "value": ".*\\.id"
            }
          }
        }
      ]
      "transformation": DATA_TRANSFORMATION_OBFUSCATE
    }
  ]
  cache {
    thread.pool.size = 4
    refresh = 1m
  }
}

