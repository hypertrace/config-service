main.class = ai.traceable.config.service.TraceableConfigService
service.name = traceable-config-service
service.port.internal = 50101
service.port.external = 50102
service.admin.port = 50103

generic.config.service {
  document.store {
    dataStoreType = mongo
    mongo {
      host = localhost
      host = ${?MONGO_HOST} # provides a way to override the mongo_host via an environment variable
      port = 27017
    }
  }
}

event.store {
  type = kafka
  bootstrap.servers = "localhost:9092"
  activity.events.producer {
    topic.name = activity-events
    bootstrap.servers = "localhost:9092"
    key.serializer = org.apache.kafka.common.serialization.StringSerializer
    value.serializer = io.confluent.kafka.serializers.KafkaAvroSerializer
    schema.registry.url = "http://localhost:8081"
  }
}

sensitive.data.config.service {
  default.param.type.redaction.strategy = REDACTION_STRATEGY_RAW
  default.automatic.secret.redaction.enabled = true
  default.pii.filter.config {
    "complexData": [
      {
        "key": "http.response.header.set-cookie",
        "type": "cookie"
      },
      {
        "key": "http.request.header.cookie",
        "type": "cookie"
      },
      {
        "key": "http.response.body",
        "typeKey": "http.response.header.content-type"
      },
      {
        "key": "http.request.body",
        "typeKey": "http.request.header.content-type"
      },
      {
        "key": "rpc.response.body",
        "type": "json"
      },
      {
        "key": "rpc.request.body",
        "type": "json"
      },
      {
        "key": "sql.query",
        "type": "sql"
      },
      {
        "key": "http.url",
        "type": "urlencoded"
      }
    ],
    "keyRegexs": [
      {
        "category": "auth",
        "redactionStrategy": "REDACTION_STRATEGY_HASH",
        "regex": "^authorization(\\[\\d+\\])?$",
        "sessionIdentifier": true
      },
      {
        "category": "auth",
        "redactionStrategy": "REDACTION_STRATEGY_HASH",
        "regex": "^remember_token(\\[\\d+\\])?$",
        "sessionIdentifier": true
      },
      {
        "category": "auth",
        "redactionStrategy": "REDACTION_STRATEGY_HASH",
        "regex": "^session(\\[\\d+\\])?$",
        "sessionIdentifier": true
      },
      {
        "category": "auth",
        "regex": "^access_token(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^api_key(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^apikey(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^password(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^passwd(\\[\\d+\\])?$"
      },
      {
        "category": "auth",
        "regex": "^secret(\\[\\d+\\])?$"
      }
    ],
    "prefixes": [
      "http.request.header.",
      "http.response.header.",
      "rpc.request.metadata.",
      "rpc.response.metadata."
    ],
    "redactionStrategy": "REDACTION_STRATEGY_REDACT"
  }
  default.redaction.rules {
    "redaction-rules-config": [
      {
        "regex": "http.url",
        "name": "Default: http url (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_REDACT",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
        "regex": "http.request.header",
        "name": "Default: HTTP Request Header (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_REDACT",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
        "regex": "http.request.body",
        "name": "Default: HTTP Request Body (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_REDACT",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
        "regex": "http.response.header",
        "name": "Default: HTTP Response Header (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_REDACT",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
        "regex": "http.response.body",
        "name": "Default: HTTP Response Body (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_REDACT",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
        "regex": "rpc.request.metadata",
        "name": "Default: RPC Request Metadata (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_REDACT",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
