                }
            }
        ]
      },
      {
        "regex": "rpc.response.metadata",
        "name": "Default: RPC Response Metadata (Local Processing Only)",
        "redactionStrategy": "REDACTION_STRATEGY_REDACT",
        "matchType": "MATCH_TYPE_KEY",
        "conditions": [
            {
                "attributeRegexMatch": {
                    "key": "traceableai.processing",
                    "regex": "core"
                }
            }
        ]
      },
      {
        "regex": "rpc.response.body",
        "name": "Default: RPC Response Body (Local Processing Only)",
