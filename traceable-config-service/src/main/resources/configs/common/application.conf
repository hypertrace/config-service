local.processing.config.service {
  include "span-processing-rules.conf"
  default.protection.mode = PROTECTION_MODE_ADVANCED
  sampling.policies = [
    {
      "name": "endpoint-rate-limit",
      "rateLimiting": {
        "traceLimitPerEndpointPerMinute": 10,
        "traceLimitGloballyPerMinute": 10000
      }
    },
    {
      "name": "modsec-anomaly",
      "modsecAnomaly": {}
    },
    {
      "name": "traceableai-blocking-attribute",
      "spanAttributes": {
        "attributesRequiredForSampling": [
            {
                "key": "traceableai.blocked",
                "values": [
                    {
                        "stringValue": "true"
                    },
                    {
                        "boolValue": true
                    }
                ]
            }
        ]
      }
    }
  ]
  modsec.redact = true
}

