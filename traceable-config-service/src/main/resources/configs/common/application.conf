external.data.classification.config.service {
  data.parsing.rules = [
    {
      "attribute_filter": {
        "prefixes": [
          "http.response.header.set-cookie"
        ]
      },
      "mode": "DATA_PARSING_MODE_COOKIE_STRING"
    },
    {
      "attribute_filter": {
        "prefixes": [
          "http.request.header.cookie"
        ]
      },
      "mode": "DATA_PARSING_MODE_COOKIE_STRING"
    },
    {
      "attribute_filter": {
        "prefixes": [
          "sql.query"
        ]
      },
      "mode": "DATA_PARSING_MODE_SQL"
    },
    {
      "attribute_filter": {
        "prefixes": [
          "http.url",
          "http.target"
        ]
      },
      "mode": "DATA_PARSING_MODE_URL_ENCODED"
    }
  ]
  default.external.data.types = [
    {
      "match_rules": [
        {
          "attribute_filter": {
            "prefixes": ["sql.query"]
          }
          "result": RESULT_MATCH
          "path_predicate": {
            "path_segment_predicate": {
              "operator": OPERATOR_MATCHES_REGEX,
              "value": ".*"
            }
          }
        }
      ]
      "transformation": DATA_TRANSFORMATION_REDACT
    }
  ]
}

