  // Logging APIs
  {
    // graphql logging APIs
    "id": "df0102f9-a77f-4bcc-a0ab-dbb95eadd9c1",
    "data": {
      "name": "Default Rule: Logging API",
      "matching_condition": {
        "composite_condition" : {
          "operator": "LOGICAL_OPERATOR_AND",
          "children": [
            {
              "leaf_condition": {
                "key_condition": {
                  "operator": "OPERATOR_EQUALS",
                  "value": "http.url"
                },
                "string_condition": {
                  "operator": "OPERATOR_MATCHES_REGEX",
                  "value": "\\/graphql$"
                }
              }
            },
            {
              "leaf_condition": {
                "key_condition": {
                  "operator": "OPERATOR_EQUALS",
                  "value": "http.request.body"
                },
                "string_condition": {
                  "operator": "OPERATOR_MATCHES_REGEX",
                  "value": "(?i)\"query\"\\s*:\\s*\\\"\\s*(?:mutation|query)\\s*(?:\\{|\\s)\\s*(?:log(?:Error|Message|Event|Entry)?|record(?:Log|Event))(?:\\s|\\()"
                }
              }
            }
          ]
        }
      },
      "label_action": {
        "entity_types": [
          "API"
        ],
        "operation": "OPERATION_MERGE",
        "static_labels": {
          "ids": [
            "LoggingAPIs"
          ]
        }
      },
      "enabled": true
    }
  },
  {
    "id": "df0102f9-a77f-4bcc-a0ab-dbb95eadd9c2",
    "data": {
      "name": "Default Rule: Logging API",
      "matching_condition": {
        "composite_condition": {
          "operator": "LOGICAL_OPERATOR_AND",
          "children": [
            {
              "leaf_condition": {
                "key_condition": {
                  "operator": "OPERATOR_EQUALS",
                  "value": "http.url"
                },
                "string_condition": {
                  "operator": "OPERATOR_MATCHES_REGEX",
                  "value": "(?i)(?:\\/(?:(?:log|logging)(?:\\/|$))|\\/analytics\\/.*event)"
                }
              }
            },
            {
              "leaf_condition": {
                "key_condition": {
                  "operator": "OPERATOR_EQUALS",
                  "value": "http.request.body"
                },
                "string_condition": {
                  "operator": "OPERATOR_MATCHES_REGEX",
                  "value": "(?i)\\b(?:bomgarMessages|logger|log(?:Message|Level)?|event)\\b"
                }
              }
            }
          ]
        }
      },
      "label_action": {
        "entity_types": [
          "API"
        ],
        "operation": "OPERATION_MERGE",
        "static_labels": {
          "ids": [
            "LoggingAPIs"
