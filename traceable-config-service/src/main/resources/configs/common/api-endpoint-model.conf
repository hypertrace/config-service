# Key match clauses control which API parameters are included in the learnt detection model.
# Each clause can specify a prefix, suffix, or both. Both conditions must match if set together.
#
# Example - filter by suffix only:
# requestKeyMatchClauses = [
#   { suffix = ".request.body.count" },
#   { suffix = ".request.cookie.count" }
# ]
#
# Example - filter by prefix only:
# requestKeyMatchClauses = [
#   { prefix = "http.request.body" }
# ]
#
# Example - filter by both prefix and suffix (key must satisfy BOTH):
# requestKeyMatchClauses = [
#   { prefix = "http.request.body", suffix = ".count" }
# ]
#
# responseKeyMatchClauses follows the same format and applies to response parameters.

requestKeyMatchClauses = []
responseKeyMatchClauses = []
