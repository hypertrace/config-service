edge_decision_config:
  variables:
    - name: match_criteria_1
      rules:
        - transformation_config:
            jexl_expression:
              jexl_expression: traceable:parseJson($s.request_body)
    - name: request_body_json_object
      rules:
        - transformation_config:
            jexl_expression:
              jexl_expression: traceable:parseJson($s.request_body)
    - name: cookie_uuid
      rules:
        - transformation_config:
            jexl_expression:
              jexl_expression: $s.getHeaders().get('visitor_uuid')
    - name: device_id
      rules:
        - transformation_config:
            jexl_expression:
              jexl_expression: request_body_json_object['options']['uuid']
    - name: ip_address
      rules:
        - transformation_config:
            jexl_expression:
              jexl_expression: $s.getSourceAddress()
    - name: email_address
      rules:
        - transformation_config:
            jexl_expression:
              jexl_expression: request_body_json_object['user']['email']
    - name: client_type
      rules:
        - transformation_config:
            jexl_expression:
              jexl_expression: "useragent:classifyUA($s.user_agent)"
  allow_rules:
  block_rules:
    - id: "rate_limit_ip_ua"
      name: "rate_limit_ip_ua"
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      scope:
        environment_scope:
          environments:
            - "env1"
            - "env2"
      match_condition:
        jexl_expression:
          jexl_expression: "$s.path.contains('registration')"
      sampling_rate: 1.0 # apply always
      aggregate_threshold_rule:
        group_by_dimensions:
          - "$s.ip_address"
          - "device_id"
          - "user_agent"
        time_window: 600s
        value_aggregate_threshold:
          aggregation_type: "COUNT"
          static_threshold: 10 # count(*) by (ip_address, user_agent) [600s] > 10
    - id: "enumeration_email_ip_device"
      name: "enumeration_email_ip_device"
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      scope:
        environment_scope:
          environments:
            - "env1"
            - "env2"
      match_condition:
        jexl_expression:
          jexl_expression: "$s.path.contains('login')"
      sampling_rate: 1.0
      aggregate_threshold_rule:
        group_by_dimensions:
          - "ip_address"
          - "device_id"
        time_window: 600s
        value_aggregate_threshold:
          dimension: "email"
          aggregation_type: "COUNT_DISTINCT"
          static_threshold: 5 # count(distinct email) by (ip_address, device_id) [600s] > 5.0
    - id: "transaction_limit_ip"
      name: "transaction_limit_ip"
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      scope:
        environment_scope:
          environments:
            - "env1"
            - "env2"
      match_condition:
        jexl_expression:
          jexl_expression: "$s.path.contains('payment')"
      sampling_rate: 1.0
      aggregate_threshold_rule:
        group_by_dimensions:
          - "ip_address"
          - "email"
        time_window: 600s
        value_aggregate_threshold:
          dimension: "transaction_amount"
          aggregation_type: "SUM"
          static_threshold: 1000.0 # sum(transaction_amount) by (ip_address, email) [600s] > 1000.0
    - id: "per_span_signature_rule_1"
      name: "per_span_signature_rule_1"
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      scope:
        environment_scope:
          environments:
            - "env1"
            - "env2"
      match_condition:
        jexl_expression:
          jexl_expression: "$s.request_headers['visitor_uuid'] != traceable:parseJson($s.request_body)['user']['uuid']"
      signature_rule:
      attribute_projections:
        - name: ip_address
          rules:
            - transformation_config:
                jexl_expression:
                  jexl_expression: "$s.ip_address"
    - id: "per_span_signature_rule_2"
      name: "per_span_signature_rule_2"
      edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      scope:
        environment_scope:
          environments:
            - "env1"
            - "env2"
      match_condition:
        jexl_expression:
          jexl_expression: "$s.request_headers['visitor_uuid'] == null"
      signature_rule:
    - name: "server_detection_fingerprint_rule"
      fingerprint_rule:
        fingerprint_dataset_id: "policy1"
    - name: "access_pattern_rule"
      match_condition:
        jexl_expression:
          jexl_expression: $s.path.contains("/payment") && client_type == 'DESKTOP_WEB'
      access_pattern_rule:
        correlation_key:
          attributes:
            - "ip_address"
            - "user_agent"
        pre_requests:
          - match_condition:
              jexl_expression:
                jexl_expression: "$s.url.equals('/profile') && $s.request_method.equals('GET')"
          - match_condition:
              jexl_expression:
                jexl_expression: "$s.url.equals('/me') && $s.request_method.equals('POST')"
        check_for_any_pre_requests: true # has any call been made
        time_window: 600s
  ordered_edge_decision_spec_configs:
    - edge_input_kind: "EDGE_INPUT_KIND_HTTP_REQUEST"
      scope:
        environment: "prod"
      edge_decision_specs:
      - edge_decision: "EDGE_DECISION_ALLOW"
        specific_rule_ids:
          values:
          - "per_span_signature_rule_1"
          - "per_span_signature_rule_2"
      - edge_decision: "EDGE_DECISION_BLOCK"
        all_rules: true
      - edge_decision: "EDGE_DECISION_ALLOW"
        any_rule_of_type: "EDGE_DECISION_ALLOW"
