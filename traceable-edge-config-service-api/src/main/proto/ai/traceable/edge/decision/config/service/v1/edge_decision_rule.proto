syntax = "proto3";

package ai.traceable.edge.decision.config.service.v1;

option java_multiple_files = true;

import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";
import "ai/traceable/datamodel/data/transformation/config/v1/transformation.proto";
import "ai/traceable/edge/decision/config/service/v1/edge_decision_common.proto";


// represents a single risk decision rule that can be evaluated by risk decision engine
// Given a payload, configure how to determine the risk:
// Check if accepting this payload causes any aggregate threshold to be violated, for example:
// - Has the dim1,dim2..dimN, count(*) crossed a limit -> Rate limit
// - Has the dim1, dim2…dimN, count(distinct dimX) crossed a limit -> Enumeration
// Check if this payload is matching any signatures provided
// Check if this payload matches any known fingerprints, that are provided by different sources
// Check for the occurrence of other events, prior to this event - correlated by certain dimensions
message EdgeDecisionRule {
  string id = 1;
  string name = 2;
  EdgeDecisionRuleScope rule_scope = 3;
  EdgeDecisionRuleCategory rule_category = 4;
  EdgeDecisionRuleStatus rule_status = 5;
  EdgeDecisionRuleDefinition rule_definition = 7;
  EdgeDecision rule_decision = 8;
}

message EdgeDecisionRuleScope {
  repeated EdgeDecisionRuleScopeCondition scope_conditions = 1;
}

message EdgeDecisionRuleScopeCondition {
  oneof scope {
    EntityScope entity_scope = 1;
    LabelScope label_scope = 2;
    UrlScope url_scope = 3;
  }

  message UrlScope{
    repeated string url_regexes = 1;
  }

  message EntityScope {
    EntityType entity_type = 1;
    repeated string entity_ids = 2;
  }

  message LabelScope {
    LabelType label_type = 1;
    repeated string label_ids = 2;
  }

  enum EntityType {
    ENTITY_TYPE_UNSPECIFIED = 0;
    ENTITY_TYPE_API = 1;
    ENTITY_TYPE_SERVICE = 2;
    ENTITY_TYPE_ENVIRONMENT = 3;
  }

  enum LabelType {
    LABEL_TYPE_UNSPECIFIED = 0;
    LABEL_TYPE_SERVICE = 1;
    LABEL_TYPE_API = 2;
  }
}

enum EdgeDecisionRuleCategory {
  EDGE_DECISION_RULE_CATEGORY_UNSPECIFIED = 0;
  EDGE_DECISION_RULE_CATEGORY_ORIGINAL = 1; // rules stored directly in this format
  EDGE_DECISION_RULE_CATEGORY_CUSTOM_SIGNATURE = 2;
  EDGE_DECISION_RULE_CATEGORY_RATE_LIMIT = 3;
  EDGE_DECISION_RULE_CATEGORY_MALICIOUS_SOURCES = 4;
}

message EdgeDecisionRuleStatus {
  bool disabled = 1;
  bool internal = 2;
  // specifies the TTL for which the rule is active
  ConfigTtl ttl = 3;
}

message EdgeDecisionRuleDefinition {
  EdgeInputKind edge_input_kind = 1;
  // variables used specifically in this rule
  repeated ai.traceable.datamodel.data.transformation.config.v1.VariableDerivationMapping rule_variables = 2;
  // if the rule matches, what do you want to capture in the result?
  repeated ai.traceable.datamodel.data.transformation.config.v1.AttributeDerivationMapping attribute_projections = 3;
  oneof rule_definition {
    AggregateThresholdRule aggregate_threshold_rule = 6;
    SignatureRule signature_rule = 7;
    AccessPatternRule access_pattern_rule = 8;
    FingerprintRule fingerprint_rule = 9;
  }
  // each rule must provide a score and weight, that are used to compute the final score.
  //  double risk_score = 6;
  //  double weight = 7;
  // placeholder to allow customization of the rule eval - not all params are known now.
  google.protobuf.Value custom_fields = 100;
}

// Aggregate threshold rules
// rate limit rules that can be evaluated by risk decision engine
// enumeration rules that can be evaluated by risk decision engine
// <IN FUTURE> evaluate other aggregates, aggregate of attribute values
// evaluate a payload against rate tracker
// in a window of time, count(<>) by (<>)
// evaluate a payload against enumeration
// agg_fn(dimension) by (dim1, dim2..dimN) over [timewindow] , threshold
message AggregateThresholdRule {
  // this should refer to a match criteria that's evaluated in variables so that we don't evaluate again and again
  MatchCondition match_condition = 1;

  // group-by to be applied on the payload
  repeated ai.traceable.datamodel.data.transformation.config.v1.AttributeDerivationMapping group_by_dimensions = 2;

  // time window over which aggregate must be computed
  google.protobuf.Duration time_window = 3;

  // The type of aggregation to apply for the threshold
  // Aggregate a value from an event attribute (e.g., sum, avg)
  // equivalent to COUNT(*)
  // - Has the dim1,dim2..dimN, count(*) crossed a limit -> Rate limit

  // Count distinct values for a specific dimension
  // - Has the dim1, dim2…dimN, count(distinct dimX) crossed a limit -> Enumeration
  // - Has the dim1, dim2…dimN, agg_fn(dimX) crossed a limit ->
  ValueAggregateThreshold value_aggregate_threshold = 4;
}

message ValueAggregateThreshold {
  // choose the attribute to aggregate
  ai.traceable.datamodel.data.transformation.config.v1.AttributeDerivationMapping dimension = 1;

  enum AggregationType {
    AGGREGATION_TYPE_UNSPECIFIED = 0;           // Count the total number of events
    AGGREGATION_TYPE_COUNT = 1;           // Count the total number of events
    AGGREGATION_TYPE_DISTINCT_COUNT = 2;  // Count distinct values of specified dimensions
    AGGREGATION_TYPE_SUM = 3;             // Sum of attribute values
    AGGREGATION_TYPE_AVG = 4;             // Average of attribute values
    AGGREGATION_TYPE_MAX = 5;             // Maximum attribute value
    AGGREGATION_TYPE_MIN = 6;             // Minimum attribute value
  }

  AggregationType aggregation_type = 2;
  oneof threshold {
    double static_threshold = 3;  // The threshold for the aggregated value
  }
  // this must be a conscious choice of the consumer - higher resource usage if estimates are disabled for aggregations
  bool disable_estimates = 4;
}

// "signature rules" that can be evaluated by risk decision engine
// evaluate a payload to check if it matches the signature
message SignatureRule {
  MatchCondition match_condition = 1;
}

message FingerprintRule {
  MatchCondition match_condition = 1;
  string fingerprint_dataset_id = 2;
}

// "api access rules" that can be evaluated by risk decision engine
// evaluate a payload against access pattern
message AccessPatternRule {
  // correlation key to be computed on the request payload(s)
  CorrelationKey correlation_key = 1;
  // common filters that must be applied on all payloads (client_type == '')
  MatchCondition filter = 2;
  MatchCondition target_request = 3;

  // what other requests do we expect in this window, before the target is invoked
  repeated RequestInvocation pre_requests = 4;  // Collection of requests that are expected.
  // what is the time window for grouping
  google.protobuf.Duration time_window = 5;
  // what is the probability of no other api being there in this window?
  // set to "true" to trigger the rule if NO api is seen in this window. Irrespective of pre_requests.
  bool check_for_any_pre_requests = 6;
}

message RequestInvocation {
  // required for tracking this invocation.
  string request_invocation_id = 1;
  MatchCondition match_condition = 2;
  int32 weight = 3;
  double median_percent = 4;
}

message CorrelationKey {
  // for now, it is the same set of derivation rules applied on all requests in the access pattern config
  // provide derivation of the attributes in the risk config
  repeated ai.traceable.datamodel.data.transformation.config.v1.AttributeDerivationMapping attributes = 1;
}
