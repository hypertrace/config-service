syntax = "proto3";

package ai.traceable.fraud.datamodel.event.kind.v1;

import "ai/traceable/graphql/autogen/schema/annotations/field/v1/graphql_field_options.proto";

option java_multiple_files = true;

// Represents a primitive data kind in the hierarchical type system
// Examples: string, email, ip_address, integer, etc.
message DataModelEventKind {
  // Unique identifier for this primitive kind
  string id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Unique identifier for this event kind"];

  // Display name shown to users (e.g., "IP Address", "Credit Card")
  string display_name = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Display name shown to users (e.g., IP Address, Credit Card)"];

  // Description of this kind
  string description = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Description of this event kind"];

  // Parent kind ID - must be a system kind
  string parent_kind_id = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_skip) = true];

  // Validation rule - used for validating data at creation/ingestion
  Validation validation = 5 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Validation rule for data of this kind"];
}

// Validation rule for a data kind
message Validation {
  oneof validation_type {
    // Regex pattern validation
    string validation_regex = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Regex pattern for validating data"];
  }
}
