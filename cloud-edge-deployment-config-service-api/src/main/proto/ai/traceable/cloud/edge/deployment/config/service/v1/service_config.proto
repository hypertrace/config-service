syntax = "proto3";

package ai.traceable.cloud.edge.deployment.config.service.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";

option java_multiple_files = true;

message ServiceConfig {
  string service_name = 1;
  repeated DomainConfig domain_configs = 2;
  repeated OriginConfig origin_configs = 3;
  ServiceAdvancedConfig advanced_config = 4;
}

message DomainConfig {
  string domain_name = 1;
  Protocol protocol = 2;
  int32 port = 3;
  string certificate_id = 4;
}

message OriginConfig {
  oneof origin {
    string ip = 1;
    string host_name = 2;
  }
  optional string certificate_id = 3;
  Protocol protocol = 4;
  int32 port = 5;
  HealthCheckDetails health_check_details = 6;
}

message ServiceAdvancedConfig {
  google.protobuf.Struct generic_config = 1;
}

message HealthCheckDetails {
  Protocol protocol = 1;
  string health_check_path = 2;
  HealthCheckSettings health_check_settings = 3;
}

message HealthCheckSettings {
  int32 healthy_threshold = 1;
  int32 unhealthy_threshold = 2;
  google.protobuf.Duration timeout = 3;
  google.protobuf.Duration interval = 4;
  repeated int32 success_codes = 5;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_HTTP = 1;
  PROTOCOL_HTTPS = 2;
}
