actor.service.config {
  host = localhost
  port = 50888
  request.timeout = 10s
  cache = {
    maxCacheSize = 10000
    refreshAfterWriteDuration = 30s
    expireAfterWriteDuration = 10m
  }
  maxNumberOfActors = 10000
}

traceable.edge.config.service {
default.variables.user-attribution {
  tenant1 = [
    {
      transformation_config = {
        jexl_expression = {
          jexl_expression = "$s.getHeaders().get('authorization')"
        }
      }
    },
    {
      transformation_config = {
        static_value = {
          string_value = "value1"
        }
      }
    }
  ]
  tenant2 = [
    {
      transformation_config = {
        jexl_expression = {
          jexl_expression = "$s.getPath().contains('/admin') ? 'Admin' : 'User'"
        }
      }
    }
  ]
}
}