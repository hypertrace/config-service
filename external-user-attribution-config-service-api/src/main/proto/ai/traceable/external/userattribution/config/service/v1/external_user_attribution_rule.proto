syntax = "proto3";

package ai.traceable.external.userattribution.config.service.v1;
option go_package = "github.com/Traceableai/config-service/gen/go/ai/traceable/external/userattribution/config/service/v1";

option java_multiple_files = true;

message ExternalUserAttributionRules {
  repeated ExternalUserAttributionRule external_user_attribution_rule = 1;
}

message ExternalUserAttributionRule {
  string rule_id = 10;
  SpanFilter span_filter = 11;

  oneof rule {
    RawExternalUserAttributionRule raw_external_user_attribution_rule = 1;
    TransformedExternalUserAttributionRule transformed_external_user_attribution_rule = 2;
  }

  message RawExternalUserAttributionRule {
    string yaml = 1;
  }

  message TransformedExternalUserAttributionRule {
    string attribute_key = 1;
    // Type - id, role, scope, authheader, json, urlencoded, cookie
    Type type = 2;
    repeated CustomParsingRule attribute_value_parsing_rules = 25;
    // Encoding (e.g. jwt)
    Encoding encoding = 3 [deprecated = true];
    string cookie_name = 4;
    repeated Condition conditions = 5;
    // ID (e.g. jdoe) configuration.
    repeated string id_claims = 6;
    repeated string id_paths = 7;
    repeated string id_keys = 8;
    repeated CustomParsingRule id_parsing_rules = 21;
    // Role (e.g. user) configuration
    repeated string role_claims = 9;
    repeated string role_paths = 10;
    repeated string role_keys = 11;
    repeated CustomParsingRule role_parsing_rules = 22;
    // Scope (e.g. hypertrace) configuration.
    repeated string scope_claims = 12;
    repeated string scope_paths = 13;
    repeated string scope_keys = 14;
    repeated CustomParsingRule scope_parsing_rules = 23;
    // Session (e.g. token) configuration.
    repeated string session_claims = 15;
    repeated string session_paths = 16;
    repeated string session_keys = 17;
    repeated CustomParsingRule session_parsing_rules = 24;
    repeated int32 session_indexes = 18;
    string session_separator = 19;
    // Whether to capture raw session or hash it.
    bool capture_raw_session = 20;

    enum Type {
      TYPE_UNSPECIFIED = 0;
      TYPE_ID = 1;
      TYPE_ROLE = 2;
      TYPE_SCOPE = 3;
      TYPE_AUTHHEADER = 4 [deprecated = true];
      TYPE_JSON = 5 [deprecated = true];
      TYPE_URLENCODED = 6 [deprecated = true];
      TYPE_COOKIE = 7 [deprecated = true];
    }

    enum Encoding {
      ENCODING_UNSPECIFIED = 0;
      ENCODING_JWT = 1;
    }

    message Condition {
      string key = 1;
      string regex = 2;
    }

    message ParsingTarget {
      oneof target {
        string regex_capture_group = 1;
      }
    }

    message CustomParsingRule {
      ParsingTarget parsing_target = 1;
      oneof parser {
        NoOpParser no_op_parser = 2;
        JwtParser jwt_parser = 3;
        Base64Parser base64_parser = 4;
        JsonParser json_parser = 5;
        CookieParser cookie_parser = 6;
        UrlEncodedParser url_encoded_parser = 7;
      }

      message NoOpParser {}
      message JwtParser {}
      message Base64Parser {}
      message JsonParser {}
      message CookieParser {}
      message UrlEncodedParser {}
    }
  }

  message SpanFilter {
    repeated AttributePredicate required_matching_attributes = 1;
  }

  message AttributePredicate {
    StringPredicate name_predicate = 1;
    StringPredicate value_predicate = 2;
  }

  message StringPredicate {
    Operator operator = 1;
    string value = 2;
  }

  enum Operator {
    OPERATOR_UNSPECIFIED = 0;
    OPERATOR_EQUALS = 1;
    OPERATOR_MATCHES_REGEX = 2;
  }
}
