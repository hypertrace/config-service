syntax = "proto3";

package ai.traceable.external.userattribution.config.service.v1;

import "ai/traceable/external/userattribution/config/service/v1/external_user_attribution_rule.proto";

option go_package = "github.com/Traceableai/config-service/gen/go/ai/traceable/external/userattribution/config/service/v1";
option java_multiple_files = true;

service ExternalUserAttributionConfigService {
  rpc GetExternalUserAttributionRules(GetExternalUserAttributionRulesRequest) returns (GetExternalUserAttributionRulesResponse) {}
}

message GetExternalUserAttributionRulesRequest {
  OnlyIfChangedFilter filter = 1;
  optional string environment_name = 2;

  message OnlyIfChangedFilter {
    string previous_hash = 1;
  }
}

message GetExternalUserAttributionRulesResponse {
  ExternalUserAttributionRules external_user_attribution_rules = 1;
  string hash = 2;
}
