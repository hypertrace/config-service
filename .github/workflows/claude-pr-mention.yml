name: Claude PR Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  claude-mention:
    runs-on: self-hosted-x64-small
    timeout-minutes: 20
    if: |
      contains(github.event.comment.body, '@traceable-review-agent') &&
      github.event.comment.user.type != 'Bot' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (
        github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request != null
      )

    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            PR_NUMBER="${{ github.event.issue.number }}"
            HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.sha)
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out PR code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Run Claude on mention
        uses: anthropics/claude-code-action@1dc994ee7a008f0ecc866d9ac23ef036b7229f84  # v1.0.127
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.BEDROCK_REGION }}
          ANTHROPIC_MODEL: ${{ vars.BEDROCK_MODEL_ID }}
        with:
          use_bedrock: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            A repo collaborator mentioned `@traceable-review-agent` on PR #${{ steps.pr.outputs.number }}.

            Comment author: ${{ github.event.comment.user.login }}
            Comment URL: ${{ github.event.comment.html_url }}
            Comment body:
            ---
            ${{ github.event.comment.body }}
            ---

            ${{ github.event_name == 'pull_request_review_comment' && format('This is a reply on an inline review comment anchored to {0}:{1}. Parent review comment id: {2}.', github.event.comment.path, github.event.comment.line, github.event.comment.in_reply_to_id || github.event.comment.id) || 'This is a top-level PR comment, not a reply on an inline review comment.' }}

            Read `.claude/skills/config-service-code-review/SKILL.md` and follow the **"Mention triggers"** section to choose the right sub-flow (Re-review, Why?/clarification, or free-form). Post the response as a PR comment branded `**Traceable Code Review Agent**`. For "Why?" replies, post as a threaded reply on the parent review comment, not as a new top-level comment.
          claude_args: |
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(grep:*),Bash(find:*),Bash(buf:*),Bash(echo:*),Read,Glob"
            --verbose

      - name: Report run usage
        if: always()
        continue-on-error: true
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          LOG="${RUNNER_TEMP}/claude-execution-output.json"
          if [ ! -f "$LOG" ]; then
            echo "No execution log at $LOG — usage stats unavailable." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          shape=$(jq -r 'if type == "array" then "array" else "object" end' "$LOG")
          if [ "$shape" = "array" ]; then
            base='[.[] | select(.type == "result")] | last'
          else
            base='.'
          fi
          cost=$(jq -r "${base} | .total_cost_usd // empty" "$LOG")
          turns=$(jq -r "${base} | .num_turns // empty" "$LOG")
          denials=$(jq -r "${base} | .permission_denials_count // empty" "$LOG")
          duration_ms=$(jq -r "${base} | .duration_ms // empty" "$LOG")
          if [ "$shape" = "array" ]; then
            usage_totals=$(jq -r '
              [.[] | select(.type == "assistant") | .message.usage // empty]
              | { input: (map(.input_tokens // 0) | add // 0),
                  output: (map(.output_tokens // 0) | add // 0),
                  cache_read: (map(.cache_read_input_tokens // 0) | add // 0),
                  cache_create: (map(.cache_creation_input_tokens // 0) | add // 0) }
              | "\(.input)|\(.output)|\(.cache_read)|\(.cache_create)"
            ' "$LOG")
            input_tokens=${usage_totals%%|*}; rest=${usage_totals#*|}
            output_tokens=${rest%%|*};        rest=${rest#*|}
            cache_read=${rest%%|*};           cache_create=${rest#*|}
          else
            input_tokens=$(jq -r '.usage.input_tokens // empty' "$LOG")
            output_tokens=$(jq -r '.usage.output_tokens // empty' "$LOG")
            cache_read=$(jq -r '.usage.cache_read_input_tokens // empty' "$LOG")
            cache_create=$(jq -r '.usage.cache_creation_input_tokens // empty' "$LOG")
          fi
          duration_human=""
          if [ -n "$duration_ms" ]; then
            duration_human="$(awk "BEGIN { printf \"%.1fs\", ${duration_ms}/1000 }")"
          fi
          errored_tools=""
          tool_breakdown=""
          if [ "$shape" = "array" ]; then
            errored_tools=$(jq -r '
              ([ .[] | select(.type == "user") | (.message.content // [])[]
                 | select(.type == "tool_result" and (.is_error // false))
                 | .tool_use_id ] | unique) as $err_ids
              | [ .[] | select(.type == "assistant")
                  | (.message.content // [])[]
                  | select(.type == "tool_use" and (.id as $id | $err_ids | index($id)))
                  | if .name == "Bash"
                    then "Bash(\((.input.command // "") | split(" ")[0] | sub("^/.*/"; ""))*)"
                    else .name
                    end ]
              | group_by(.)
              | map({tool: .[0], count: length})
              | sort_by(-.count)
              | map("\(.tool) (\(.count))")
              | join(", ")
            ' "$LOG" 2>/dev/null || true)

            tool_breakdown=$(jq -r '
              [ .[]
                | select(.type == "assistant")
                | (.message.content // [])[]
                | select(.type == "tool_use")
                | if .name == "Bash"
                  then "Bash(\((.input.command // "") | split(" ")[0] | sub("^/.*/"; ""))*)"
                  else .name
                  end
              ]
              | group_by(.)
              | map({tool: .[0], count: length})
              | sort_by(-.count)
              | .[]
              | "| \(.tool) | \(.count) |"
            ' "$LOG" 2>/dev/null || true)
          fi
          {
            echo "## Claude PR Mention — usage"
            echo ""
            echo "PR: #${PR_NUMBER}"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            [ -n "$cost" ]          && echo "| cost (USD) | \$${cost} |"
            [ -n "$turns" ]         && echo "| model turns | ${turns} |"
            [ -n "$duration_human" ] && echo "| wall time | ${duration_human} |"
            [ -n "$input_tokens" ] && [ "$input_tokens" != "0" ]   && echo "| input tokens | ${input_tokens} |"
            [ -n "$output_tokens" ] && [ "$output_tokens" != "0" ] && echo "| output tokens | ${output_tokens} |"
            [ -n "$cache_read" ] && [ "$cache_read" != "0" ]       && echo "| cache-read tokens | ${cache_read} |"
            [ -n "$cache_create" ] && [ "$cache_create" != "0" ]   && echo "| cache-create tokens | ${cache_create} |"
            [ -n "$denials" ]       && echo "| tool permission denials | ${denials} |"
            if [ -n "$errored_tools" ]; then
              echo "| failed/denied tool calls | \`${errored_tools}\` |"
            else
              echo "| failed/denied tool calls | _none_ |"
            fi
            if [ -n "$tool_breakdown" ]; then
              echo ""
              echo "### Tool-call breakdown"
              echo ""
              echo "| tool | calls |"
              echo "| --- | --- |"
              echo "$tool_breakdown"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$errored_tools" ]; then
            echo "::notice title=Tool errors::Tools that errored or were blocked: ${errored_tools}"
          fi
