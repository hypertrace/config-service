name: Publish artifacts
on:
  push:
    branches:
      - main
jobs:
  create-release:
    runs-on: self-hosted-x64-small
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v4
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup

      - name: Determine version
        id: version
        run: echo version=$(./gradlew -q -Prelease :printVersion) >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
  publish-artifacts:
    runs-on: self-hosted-x64-small
    needs: [create-release]
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v4
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          use-service-account: true

      - name: Determine docker tag
        id: tag
        run: echo tag=$(./gradlew -q printDockerImageDefaultTag | head -1) >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Docker Image Builds
        uses: hypertrace/github-actions/gradle@main
        with:
          args: dockerBuildImages

      - name: Publish java artifacts
        uses: hypertrace/github-actions/gradle@main
        with:
          args: publish

      - name: Push Mock Docker Image to GHCR
        uses: hypertrace/github-actions/gradle@main
        with:
          args: :mock-config-service:dockerPushImages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Service Docker Image
        uses: ./.github/actions/docker-build-sign-publish
        with:
          image: traceable/traceable-config-service
          tags: ${{ steps.tag.outputs.tag }}
          context: traceable-config-service/build/docker

  publish-charts:
    needs: [create-release, publish-artifacts]
    runs-on: self-hosted-x64-small
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v4
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Package and release chart
        uses: ./.github/actions/helm-artifactory-publish

  publish-release-notes:
    runs-on: self-hosted-x64-small
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: hypertrace/github-actions/release-notes@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  post-publish-artifacts:
    runs-on: self-hosted-x64-small
    needs: [create-release, publish-charts]
    steps:
      - name: Get Token from Github App
        uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.GH_CI_APP_ID }}
          private_key: ${{ secrets.GH_CI_APP_PRIVATE_KEY }}
          repositories: >-
            ["traceable-bom"]
      - name: Auto upgrade BOM
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repository: Traceableai/traceable-bom
          event-type: upgrade-version
          client-payload: |
            {
              "repository": "${{ github.repository }}",
              "version": "${{ needs.create-release.outputs.version }}"
            }
