name: Publish artifacts
on:
  push:
    branches:
      - main
jobs:
  create-release:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v2
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          context-url: ${{ secrets.ARTIFACTORY_CONTEXT_URL }}
          user: ${{ secrets.ARTIFACTORY_READ_USER }}
          password: ${{ secrets.ARTIFACTORY_READ_TOKEN }}

      - name: Determine version
        id: version
        run: echo version=$(./gradlew -q -Prelease :printVersion) >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
  publish-artifacts:
    runs-on: self-hosted-x64-small
    needs: [ create-release ]
    steps:
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v2
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          context-url: ${{ secrets.ARTIFACTORY_CONTEXT_URL }}
          user: ${{ secrets.ARTIFACTORY_PUBLISH_USER }}
          password: ${{ secrets.ARTIFACTORY_PUBLISH_TOKEN }}

      - name: Determine docker tag
        id: tag
        run: echo tag=$(./gradlew -q printDockerImageDefaultTag | head -1) >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_READ_USER }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      - name: Setup Docker Image Builds
        uses: hypertrace/github-actions/gradle@main
        with:
          args: dockerBuildImages

      - name: Publish java artifacts
        uses: hypertrace/github-actions/gradle@main
        with:
          args: publish

      - name: Push Mock Docker Image to GHCR
        uses: hypertrace/github-actions/gradle@main
        with:
          args: :mock-config-service:dockerPushImages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Service Docker Image
        uses: ./.github/actions/docker-publish
        with:
          image: traceable/traceable-config-service
          tag: ${{ steps.tag.outputs.tag }}
          context: traceable-config-service/build/docker
          cache-scope: main-service

  publish-charts:
    needs: [ create-release, publish-artifacts ]
    runs-on: self-hosted-x64-small
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v2
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Package and release chart
        uses: ./.github/actions/helm-artifactory-publish
        with:
          helm-artifactory-user: ${{ secrets.ARTIFACTORY_PUBLISH_USER }}
          helm-artifactory-password: ${{ secrets.ARTIFACTORY_PUBLISH_TOKEN }}

  publish-release-notes:
    runs-on: self-hosted-x64-small
    needs: [ create-release ]
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: hypertrace/github-actions/release-notes@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}