name: build and validate
on:
  schedule:
    - cron: 10 5 * * 1
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-protos:
    runs-on: self-hosted-x64-small
    steps:
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check out main branch code
        uses: actions/checkout@v2
        with:
          ref: main
          path: build/cloned-main
          fetch-depth: 0
          submodules: recursive
      # we want the checked out code outside our main repo, but github doesn't allow it - mv after
      - run: mv build/cloned-main ${{ runner.temp }}/

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1.9.0
        with:
          github_token: ${{ github.token }}

      - name: Lint protos
        uses: bufbuild/buf-lint-action@v1

      - name: Check for breaking changes
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: ${{ runner.temp }}/cloned-main

  validate-helm-charts:
    runs-on: self-hosted-x64-small
    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Validate chart
        uses: hypertrace/github-actions/validate-charts@main
        with:
          extra-args: --set global.env=dev
  build:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v2
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Ensure submodules point to commit from main branch
        run: git submodule foreach --recursive "git merge-base --is-ancestor HEAD origin/main"

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          context-url: ${{ secrets.ARTIFACTORY_CONTEXT_URL }}
          user: ${{ secrets.ARTIFACTORY_READ_USER }}
          password: ${{ secrets.ARTIFACTORY_READ_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_READ_USER }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      - name: Build with Gradle
        uses: hypertrace/github-actions/gradle@main
        with:
          args: assemble dockerBuildImages

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Service Docker Image
        uses: docker/build-push-action@v3
        with:
          context: traceable-config-service/build/docker
          cache-from: type=gha,scope=main-service

      - name: Scan docker image
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/traceable/traceable-config-service
          auth-token: ${{ secrets.DEFECTDOJO_AUTH_TOKEN }}

  test:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v2
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          context-url: ${{ secrets.ARTIFACTORY_CONTEXT_URL }}
          user: ${{ secrets.ARTIFACTORY_READ_USER }}
          password: ${{ secrets.ARTIFACTORY_READ_TOKEN }}

      - name: Unit test and other verification
        uses: hypertrace/github-actions/gradle@main
        with:
          args: check jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: copy test reports
        uses: hypertrace/github-actions/gradle@main
        if: failure()
        with:
          args: copyAllReports --output-dir=/tmp/test-reports

      - name: Tar test reports
        if: failure()
        run: tar -czf /tmp/test-reports.tar.gz /tmp/test-reports

      - name: Archive test reports
        uses: actions/upload-artifact@v1
        if: failure()
        with:
          name: test-reports
          path: /tmp/test-reports.tar.gz

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: ./**/build/test-results/**/*.xml
  integration-test:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v2
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          context-url: ${{ secrets.ARTIFACTORY_CONTEXT_URL }}
          user: ${{ secrets.ARTIFACTORY_READ_USER }}
          password: ${{ secrets.ARTIFACTORY_READ_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_READ_USER }}
          password: ${{ secrets.DOCKERHUB_READ_TOKEN }}

      - name: Integration test
        uses: hypertrace/github-actions/gradle@main
        with:
          args: jacocoIntegrationTestReport

      - name: Upload Integration Coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration

      - name: Copy test reports
        uses: hypertrace/github-actions/gradle@main
        with:
          args: copyAllReports --output-dir=/tmp/test-reports
        if: failure()

      - name: Tar test reports
        if: failure()
        run: tar -czf /tmp/test-reports.tar.gz /tmp/test-reports

      - name: Archive Integration Test Reports
        uses: actions/upload-artifact@v1
        with:
          name: integration-test-reports
          path: /tmp/test-reports.tar.gz
        if: failure()

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: ./**/build/test-results/**/*.xml
          check_name: Integration Test Results
        if: success() || failure()

  dependency-check:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Checkout Traceable actions
        uses: actions/checkout@v3
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          context-url: ${{ secrets.ARTIFACTORY_CONTEXT_URL }}
          user: ${{ secrets.ARTIFACTORY_READ_USER }}
          password: ${{ secrets.ARTIFACTORY_READ_TOKEN }}

      - name: Dependency Check
        uses: ./.github/actions/dependency-check
        with:
          auth-token: ${{ secrets.DEFECTDOJO_AUTH_TOKEN }}
