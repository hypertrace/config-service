name: build and validate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-protos:
    runs-on: ubuntu-20.04
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Check out main branch code
        uses: actions/checkout@v2
        with:
          ref: main
          path: build/cloned-main
      - name: Setup go
        uses: actions/setup-go@v2
        with:
          go-version: 1.16.3
      - name: Setup buf
        uses: Wizhi/setup-buf@f76a0133338dc012333f5a7f883381d466381074
        with:
          version: 0.41.0
      - name: Download protoc go plugins
        run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.1 && go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.26.0
      - name: Generate go files
        run: buf generate --path external-user-attribution-config-service-api/src/main/proto/ai/traceable/external
      - name: Verify generated go matches checked in
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: verify-protos
        run: |
          buf lint
          buf breaking --against "$GITHUB_WORKSPACE/build/cloned-main"
