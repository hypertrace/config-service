name: build and validate
on:
  schedule:
    - cron: 10 5 * * 1
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-protos:
    runs-on: self-hosted-x64-small
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run buf
        uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ github.token }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},recurse_submodules=true

  validate-helm-charts:
    runs-on: self-hosted-x64-small
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate chart
        uses: hypertrace/github-actions/validate-charts@main
        with:
          extra-args: --set global.env=dev
  build:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v4
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Ensure submodules point to commit from main branch
        run: git submodule foreach --recursive "git merge-base --is-ancestor HEAD origin/main"

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup

      - name: Build with Gradle
        uses: hypertrace/github-actions/gradle@main
        with:
          args: assemble dockerBuildImages

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Service Docker Image
        uses: docker/build-push-action@v4
        with:
          context: traceable-config-service/build/docker
          cache-from: type=registry,ref=${{ secrets.GCP_CACHE_ARTIFACT_REGISTRY }}/traceable/traceable-config-service

      - name: Scan docker image
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ secrets.GCP_ARTIFACT_REGISTRY }}/docker/traceable/traceable-config-service

  test:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v4
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup

      - name: Unit test and other verification
        uses: hypertrace/github-actions/gradle@main
        with:
          args: check jacocoTestReport

      - name: copy test reports
        uses: hypertrace/github-actions/gradle@main
        if: failure()
        with:
          args: copyAllReports --output-dir=/tmp/test-reports

      - name: Tar test reports
        if: failure()
        run: tar -czf /tmp/test-reports.tar.gz /tmp/test-reports

      - name: Archive test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: /tmp/test-reports.tar.gz

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: success() || failure()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: ./**/build/test-results/**/*.xml

  integration-test:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Traceable actions
        uses: actions/checkout@v4
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup

      - name: Integration test
        uses: hypertrace/github-actions/gradle@main
        with:
          args: jacocoIntegrationTestReport

      - name: Copy test reports
        uses: hypertrace/github-actions/gradle@main
        with:
          args: copyAllReports --output-dir=/tmp/test-reports
        if: failure()

      - name: Tar test reports
        if: failure()
        run: tar -czf /tmp/test-reports.tar.gz /tmp/test-reports

      - name: Archive Integration Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: /tmp/test-reports.tar.gz
        if: failure()

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: ./**/build/test-results/**/*.xml
          check_name: Integration Test Results
        if: success() || failure()

  dependency-check:
    runs-on: self-hosted-x64-small
    steps:
      # Set fetch-depth: 0 to fetch commit history and tags for use in version calculation
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Traceable actions
        uses: actions/checkout@v4
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup

      - name: Dependency Check
        uses: ./.github/actions/dependency-check
        with:
          database-password: ${{ secrets.NVD_DATABASE_PASSWORD }}