name: Update Locks
on:
  workflow_dispatch:
  schedule:
    - cron: '38 8 * * 4'
jobs:
  update-versions:
    runs-on: self-hosted-x64-small
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Traceable actions
        uses: actions/checkout@v3
        with:
          repository: traceableai/github-actions
          ssh-key: ${{ secrets.GH_ACTION_READ_KEY }}
          path: .github/actions

      - name: Setup gradle auth
        uses: ./.github/actions/gradle-setup
        with:
          context-url: ${{ secrets.ARTIFACTORY_CONTEXT_URL }}
          user: ${{ secrets.ARTIFACTORY_READ_USER }}
          password: ${{ secrets.ARTIFACTORY_READ_TOKEN }}

      - name: Calculate simple repository name
        id: repo-basename
        shell: bash
        run: |
          echo "value=`basename ${{ github.repository }}`" >> $GITHUB_OUTPUT

      - name: Get Token from Github App
        uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.GH_CI_APP_ID }}
          private_key: ${{ secrets.GH_CI_APP_PRIVATE_KEY }}
          repositories: >-
            [${{ toJson(steps.repo-basename.outputs.value) }}]
      - name: Update locks if needed
        uses: hypertrace/github-actions/raise-lock-pr@main
        with:
          token: ${{ steps.generate-token.outputs.token }}
