syntax = "proto3";

package ai.traceable.localprocessing.config.service.v1;

import "ai/traceable/localprocessing/config/service/v1/span_filter.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/Traceableai/config-service/localprocessing/v1";
option java_multiple_files = true;

message RateLimitConfig {
  RateLimit trace_limit_per_endpoint = 1;
  RateLimit trace_limit_global = 2;
  google.protobuf.Duration api_endpoint_cache_duration = 3;
  RateLimitStrategy rate_limit_strategy = 4;
  string id = 5;
  SpanFilter filter = 6;
}

message RateLimit {
  oneof limit {
    WindowedRateLimit fixed_window_limit = 1;
  }
}

message WindowedRateLimit {
  int64 quantity_allowed = 1;
  google.protobuf.Duration window_duration = 2;
}

enum RateLimitStrategy {
  RATE_LIMIT_STRATEGY_UNSPECIFIED = 0;
  RATE_LIMIT_STRATEGY_DROP = 1;
  RATE_LIMIT_STRATEGY_BARESPAN = 2;
}
