syntax = "proto3";

package ai.traceable.localprocessing.config.service.v1;

option java_multiple_files = true;
option go_package = "github.com/Traceableai/config-service/localprocessing/v1";

message ProtectionModeConfig {
  ProtectionMode default_protection_mode = 1;
  repeated ProtectedEndpoint protected_endpoints = 2;
  string hash = 3;
}

enum ProtectionMode {
  PROTECTION_MODE_UNSPECIFIED = 0;
  PROTECTION_MODE_ADVANCED = 1;
  PROTECTION_MODE_CORE = 2;
}

message ProtectedEndpoint {
  ProtectionMode protection_mode = 1;
  string url_pattern = 2;
  string host_header = 3;
}
