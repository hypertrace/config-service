syntax = "proto3";

package ai.traceable.localprocessing.config.service.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/Traceableai/config-service/localprocessing/v1";
option java_multiple_files = true;

message GetApiNamingModelRequest {
  repeated ServiceRequest service_requests = 1;
  optional string environment = 2;
}

message ServiceRequest {
  string service_name = 1;
  optional string token = 2;
  optional string config_hash = 3;
}

message GetApiNamingModelResponse {
  HttpApiNamingModelResponse http_api_naming_response = 1;
  google.protobuf.Duration refresh_after_duration = 2;
}

message HttpApiNamingModelResponse {
  repeated HttpServiceResponse http_service_responses = 1;
}

message HttpServiceResponse {
  string service_name = 1;
  ApiNamingPatterns api_naming_patterns = 2;
  HttpApiNamingConfig http_config = 3;
}

message ApiNamingPatterns {
  oneof api_naming_patterns {
    FullPattern full_pattern = 1;
    DiffPattern diff_pattern = 2;
  }
  string token = 3;
}

message FullPattern {
  repeated ApiNamingPattern api_naming_patterns = 1;
}

message DiffPattern {
  repeated DiffLog diff_logs = 1;
}

message DiffLog {
  oneof change {
    ApiNamingPattern api_naming_pattern_addition = 1;
    ApiNamingPattern api_naming_pattern_deletion = 2;
  }
}

message ApiNamingPattern {
  repeated Segment segments = 1;
}

message Segment {
  oneof value {
    string name = 1;
    Wildcard wildcard = 2;
  }
}

message HttpApiNamingConfig {
  repeated HttpApiNamingCustomRule api_naming_custom_rules = 1;
  repeated string segment_whitelist_regexes = 2;
  repeated string fallback_wildcard_regexes = 3;
  string hash = 4;
}

message Wildcard {
  string identification_regex = 1;
  string replacement_pattern = 2;
}

// Set of segments includes HTTP method
message HttpApiNamingCustomRule {
  string id = 1;
  ApiNamingPattern api_naming_pattern = 2;
}
