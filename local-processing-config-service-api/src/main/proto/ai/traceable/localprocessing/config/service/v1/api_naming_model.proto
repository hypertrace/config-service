syntax = "proto3";

package ai.traceable.localprocessing.config.service.v1;

option java_multiple_files = true;
option go_package = "github.com/Traceableai/config-service/localprocessing/v1";

message GetApiNamingModelRequest {
  repeated ServiceTrieRequest service_trie_requests = 1;
  optional string environment = 2;
  optional string api_naming_custom_rules_hash = 3;
  optional string fallback_wildcard_regexes_hash = 4;
  optional string api_naming_config_hash = 5;
}

message ServiceTrieRequest {
  string service_name = 1;
  optional string previous_token = 2;
}

message GetApiNamingModelResponse {
  repeated Trie tries = 1;
  repeated ApiNamingCustomRule api_naming_custom_rules = 2;
  repeated string fallback_wildcard_regexes = 3;
  ApiNamingConfig api_naming_config = 4;
  string api_naming_custom_rules_hash = 5;
  string fallback_wildcard_regexes_hash = 6;
  string api_naming_config_hash = 7;
}

message ApiNamingCustomRule {
  string regex_pattern = 1;
  string url_pattern = 2;
}

message Trie {
  oneof trie {
    FullTrie full_trie = 1;
    DiffTrie diff_trie = 2;
  }
  string service_name = 3;
  string token = 4;
}

message FullTrie {
  Node root = 1;
}

message Node {
  Value value = 1;
  repeated Node children = 2;
}

message DiffTrie {
  repeated TrieDiffLog trie_diff_logs = 1;
}

message TrieDiffLog {
  oneof change {
    TrieNodePath path_addition = 1;
    TrieNodePath node_removal = 2;
  }
}

message TrieNodePath {
  repeated Value values = 1;
}

message Value {
  oneof segment {
    string name = 1;
    Wildcard wildcard = 2;
  }
}

message Wildcard {
  WildcardType wildcard_type = 1;
  optional string extension = 2;
}

message ApiNamingConfig {
  string hash = 1;
  repeated WildcardConfig wildcard_configs = 2;
  repeated string url_reject_regexes = 3;
  repeated string extensions = 4;
}

message WildcardConfig {
  WildcardType wildcard_type = 1;
  repeated string identification_regexes = 2;
  int32 priority = 3;   //Higher the priority will be denoted by smaller rank
}

enum WildcardType {
  WILDCARD_TYPE_UNSPECIFIED = 0;
  WILDCARD_TYPE_WHITELIST = 1;
  WILDCARD_TYPE_ID = 2;
  WILDCARD_TYPE_LOW_CARDINALITY = 3;
  WILDCARD_TYPE_MEDIUM_CARDINALITY = 4;
  WILDCARD_TYPE_HIGH_CARDINALITY = 5;
}
