syntax = "proto3";

package ai.traceable.localprocessing.config.service.v1;

import "ai/traceable/localprocessing/config/service/v1/api_naming_model.proto";
import "ai/traceable/localprocessing/config/service/v1/protection_mode_config.proto";
import "ai/traceable/localprocessing/config/service/v1/rate_limit_config.proto";
import "ai/traceable/localprocessing/config/service/v1/sampling_policies_config.proto";
import "ai/traceable/localprocessing/config/service/v1/span_filter.proto";

option go_package = "github.com/Traceableai/config-service/localprocessing/v1";
option java_multiple_files = true;

service LocalProcessingConfigService {
  rpc GetLocalProcessingConfig(GetLocalProcessingConfigRequest) returns (GetLocalProcessingConfigResponse) {}

  // get api-naming tries and other rules
  rpc GetApiNamingModel(GetApiNamingModelRequest) returns (GetApiNamingModelResponse) {}

  rpc GetSpanProcessingRules(GetSpanProcessingRulesRequest) returns (GetSpanProcessingRulesResponse) {}

  // Returns modsec-formatted detection rules for libtraceable's detection engine.
  // Unlike GetLocalProcessingConfig which may return coraza-formatted rules based on TPA version,
  // this RPC always returns modsec-formatted rules regardless of the caller's version.
  rpc GetDetectionRules(GetDetectionRulesRequest) returns (GetDetectionRulesResponse) {}
}

message GetLocalProcessingConfigRequest {
  string regular_modsec_detection_rules_hash = 1;
  string custom_modsec_detection_rules_hash = 2;
  string protection_mode_hash = 3;
  string sampling_policies_hash = 4;
  AgentCapabilities agent_capabilities = 5;
  optional string environment = 6;

  message AgentCapabilities {
    repeated Component components = 1;
  }

  message Component {
    oneof value {
      string traceable_platform_agent_version = 1;
    }
  }
}

message GetLocalProcessingConfigResponse {
  ProtectionModeConfig protection_mode_config = 1;
  RegularModsecDetectionRules regular_modsec_detection_rules = 2;
  CustomModsecDetectionRules custom_modsec_detection_rules = 3;
  SamplingPolicies sampling_policies = 4;
  ModsecConfig modsec_config = 5;
}

message GetSpanProcessingRulesRequest {
  repeated SpanProcessingRulesServiceRequest service_requests = 1;
  optional string environment = 2;
  AgentCapabilities agent_capabilities = 3;

  message AgentCapabilities {
    repeated Component components = 1;
  }

  message Component {
    oneof value {
      string traceable_platform_agent_version = 1;
    }
  }
}

message SpanProcessingRulesServiceRequest {
  string service_name = 1;
  string hash = 2;
}

message GetSpanProcessingRulesResponse {
  repeated SpanProcessingRulesServiceResponse span_processing_rules_service_responses = 1;
}

message SpanProcessingRulesServiceResponse {
  string service_name = 1;
  SpanProcessingRules span_processing_rules = 2;
  string hash = 3;
}

message CustomModsecDetectionRules {
  string hash = 1;
  optional string custom_modsec_detection_rules_blob = 2;
}

message RegularModsecDetectionRules {
  string hash = 1;
  optional string regular_modsec_detection_rules_blob = 2;
}

message ModsecConfig {
  bool redact_messages = 1;
  // The modsec_detection_rules will have corresponding rules blob
  RulesBlobType rules_blob_type = 2;

  enum RulesBlobType {
    RULES_BLOB_TYPE_UNSPECIFIED = 0;
    RULES_BLOB_TYPE_MODSEC = 1;
    RULES_BLOB_TYPE_CORAZA = 2;
  }
}

message SpanProcessingRules {
  repeated ExcludeSpanProcessingRule exclude_span_rules = 1;
  repeated ProtectionSpanProcessingRule protection_span_rules = 3;
  RateLimitConfig rate_limit_config = 2;
  repeated RateLimitConfig custom_rate_limit_configs = 4;
  repeated PercentageLimitConfig percentage_limit_configs = 5;
}

message ExcludeSpanProcessingRule {
  ExcludeSpanProcessingRuleInfo exclude_span_processing_rule_info = 1;
}

message ExcludeSpanProcessingRuleInfo {
  string id = 1;
  SpanFilter filter = 2;
}

message ProtectionSpanProcessingRule {
  ProtectionSpanProcessingRuleInfo protection_span_processing_rule_info = 1;
}

message ProtectionSpanProcessingRuleInfo {
  string id = 1;
  SpanFilter filter = 2;
}

message PercentageLimitConfig {
  string id = 1;
  // allowed_percentage is a percentage value between 0 and 100
  // and only if the generated value, which will be generated via an unbiased random number generator,
  // is less than allowed_percentage, the span will be allowed to pass through
  float allowed_percentage = 2;
  SpanFilter filter = 3;
  SpanLimitingStrategy limiting_strategy = 4;
}

message GetDetectionRulesRequest {
  string regular_modsec_detection_rules_hash = 1;
  string custom_modsec_detection_rules_hash = 2;
  optional string environment = 3;
}

message GetDetectionRulesResponse {
  RegularModsecDetectionRules regular_modsec_detection_rules = 1;
  CustomModsecDetectionRules custom_modsec_detection_rules = 2;
}
