syntax = "proto3";

package ai.traceable.waf.integration.service.api.v1;

option java_multiple_files = true;

message AwsIntegrationParams {
  string access_key_id = 1 [deprecated=true];
  string encrypted_secret_access_key = 2 [deprecated=true];
  repeated AwsResource resources = 3;
  optional int64 rule_group_capacity = 4;
  oneof connection_credentials {
    AuthCredentials auth_credentials = 10;
    WebIdentityAuthenticationCredentials web_identity_auth_credentials = 11;
  }
}

message AuthCredentials {
  string access_key_id = 1;
  string encrypted_secret_access_key = 2;
}

message WebIdentityAuthenticationCredentials {
  string role_arn = 1;
}

message AwsResource {
  string region = 1;
  string arn = 2;
}

message AwsIntegrationUpdateParams {
  string access_key_id = 1 [deprecated=true];
  optional string encrypted_secret_access_key = 2 [deprecated=true];
  repeated AwsResource resources = 3;
  optional int64 rule_group_capacity = 4;
  oneof connection_credentials {
    AuthCredentials auth_credentials = 10;
    WebIdentityAuthenticationCredentials web_identity_auth_credentials = 11;
  }
}
