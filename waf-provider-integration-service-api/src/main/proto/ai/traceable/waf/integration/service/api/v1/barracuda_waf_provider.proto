syntax = "proto3";

package ai.traceable.waf.integration.service.api.v1;

option java_multiple_files = true;

message BarracudaIntegrationParams {
  BarracudaIntegrationDetails barracuda_integration_details = 1;
}

message BarracudaIntegrationUpdateParams {
  BarracudaIntegrationDetails barracuda_integration_details = 1;
}

message BarracudaIntegrationDetails {
  string url = 1; // Either hostname:port or ipaddress:port
  BarracudaPolicyDetails barracuda_policy_details = 2;
  BarracudaAuthCredentials barracuda_auth_credentials = 3;
}

message BarracudaPolicyDetails {
  string web_application_name = 1;
  string content_rule_group_name = 2;
}

message BarracudaAuthCredentials {
  string encryption_key_id = 1; // Key used to encrypt the data.
  string encrypted_user_name = 2;
  string encrypted_password = 3;
}
