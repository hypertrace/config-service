syntax = "proto3";

package ai.traceable.waf.integration.service.api.v1;

import "ai/traceable/waf/integration/service/api/v1/waf_provider.proto";

option java_multiple_files = true;

service WafProviderService {
  rpc CreateWafIntegration(CreateWafIntegrationRequest) returns (CreateWafIntegrationResponse) {}
  rpc GetWafIntegration(GetWafIntegrationRequest) returns (GetWafIntegrationResponse) {}
  rpc GetWafIntegrations(GetWafIntegrationsRequest) returns (GetWafIntegrationsResponse) {}
  rpc GetWafIntegrationsDetails(GetWafIntegrationsDetailsRequest) returns (GetWafIntegrationsDetailsResponse) {}
  rpc UpdateWafIntegration(UpdateWafIntegrationRequest) returns (UpdateWafIntegrationResponse) {}
  rpc DeleteWafIntegration(DeleteWafIntegrationRequest) returns (DeleteWafIntegrationResponse) {}
  rpc UpdateWafIntegrationSyncSchedule(UpdateWafIntegrationSyncScheduleRequest) returns (UpdateWafIntegrationSyncScheduleResponse) {}
  rpc GetWafIntegrationSyncSchedule(GetWafIntegrationSyncScheduleRequest) returns (GetWafIntegrationSyncScheduleResponse) {}
}

message CreateWafIntegrationRequest {
  WafIntegrationDetails waf_integration_details = 1;
}

message CreateWafIntegrationResponse {
  WafIntegration waf_integration = 1;
}

message GetWafIntegrationRequest {
  string id = 1;
}

message GetWafIntegrationResponse {
  WafIntegration waf_integration = 1;
}

message GetWafIntegrationsRequest {
  GetWafIntegrationsFilter filter = 1;
}

message GetWafIntegrationsResponse {
  repeated WafIntegration waf_integration = 1;
}

message GetWafIntegrationsDetailsRequest {
  GetWafIntegrationsFilter filter = 1;
}

message GetWafIntegrationsDetailsResponse {
  repeated WafIntegration waf_integration = 1;
}

message UpdateWafIntegrationRequest {
  string id = 1;
  UpdatedWafIntegrationDetails updated_waf_integration_details = 2;
}

message UpdateWafIntegrationResponse {
  WafIntegration waf_integration = 1;
}

message DeleteWafIntegrationRequest {
  string id = 1;
}

message DeleteWafIntegrationResponse {}

message UpdateWafIntegrationSyncScheduleRequest {
  string integration_id = 1;
  bool enabled = 2;
  optional WafSyncCronMetadata cron_metadata = 3;
}

message UpdateWafIntegrationSyncScheduleResponse {
  WafIntegration waf_integration = 1;
}

message GetWafIntegrationSyncScheduleRequest {
  string integration_id = 1;
}

message GetWafIntegrationSyncScheduleResponse {
  WafIntegrationSyncSchedule schedule = 1;
}

message WafIntegrationSyncSchedule {
  string schedule_id = 1;
  WafSyncScheduleStatus status = 2;
  WafSyncCronMetadata cron_metadata = 3;
}

enum WafSyncScheduleStatus {
  WAF_SYNC_SCHEDULE_STATUS_UNSPECIFIED = 0;
  WAF_SYNC_SCHEDULE_STATUS_ENABLED = 1;
  WAF_SYNC_SCHEDULE_STATUS_DISABLED = 2;
}

message WafSyncCronMetadata {
  string cron_expression = 1;
  string zone_offset = 2;
}

message GetWafIntegrationsFilter {
  repeated string ids = 1;
  repeated WafProviderType waf_provider_types = 2;
  WafIntegrationScope waf_integration_scope = 3;
  optional bool enabled = 4;
  enum WafProviderType {
    WAF_PROVIDER_TYPE_UNSPECIFIED = 0;
    WAF_PROVIDER_TYPE_CLOUDFLARE = 1;
    WAF_PROVIDER_TYPE_AWS = 2;
    WAF_PROVIDER_TYPE_IMPERVA = 3;
    WAF_PROVIDER_TYPE_AZURE = 4;
    WAF_PROVIDER_TYPE_GCP = 5;
    WAF_PROVIDER_TYPE_F5 = 6;
    WAF_PROVIDER_TYPE_AKAMAI = 7;
    WAF_PROVIDER_TYPE_FORTINET = 8;
    WAF_PROVIDER_TYPE_BARRACUDA = 9;
  }
}
