syntax = "proto3";

package ai.traceable.waf.integration.service.api.v1;

option java_multiple_files = true;

message ImpervaIntegrationParams {
  string api_id = 1;
  EncryptedText api_key = 2;
}

message EncryptedText {
  string key_id = 1; // Key used to encrypt the message
  string value = 2;
}

message ImpervaIntegrationUpdateParams {
  optional string api_id = 1;
  EncryptedText api_key = 2;
}
