syntax = "proto3";

package ai.traceable.cloud.bot.deployment.config.service.v1;

import "ai/traceable/graphql/autogen/schema/annotations/field/v1/graphql_field_options.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;

// Main configuration for bot protection deployment
message CloudBotDeploymentConfig {
  bool enabled = 5 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "If deployment is enabled or not"];
  string id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Unique identifier for the bot deployment configuration"];
  SiteConfig site_config = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Site-specific configuration for bot protection"];
  DeploymentDetails deployment_details = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Details about how the bot protection is deployed"];
  CloudBotDeploymentStatus cloud_bot_deployment_status = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Information about the bot deployment status"];
  google.protobuf.Timestamp last_updated_timestamp = 6 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Unix timestamp of when the config was last updated"];
}

// Input configuration provided by users through the UI
message CloudBotDeploymentConfigInput {
  bool enabled = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "If deployment is enabled or not"];
  SiteConfig site_config = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Site-specific configuration for bot protection"];
  DeploymentDetails deployment_details = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Details about how the bot protection is deployed"];
}

message DeploymentDetails {
  string environment = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Environment where spans will be reported to (e.g., production, staging)"];
  // Domain-specific configuration based on deployment mode
  DeploymentMode deployment_mode = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Mode of deployment (Edge or Out-of-Band)"];
  oneof deployment_specific_config {
    EdgeDeploymentConfig edge_deployment_config = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Configuration specific to Edge deployment mode"];
    OobDeploymentConfig oob_deployment_config = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Configuration specific to Out-of-Band deployment mode"];
  }
}

message SiteConfig {
  string site_name = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Site configuration name"];
  string site_key = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Unique identifier for the site configuration"];
  repeated string domains = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "List of domains protected by this configuration"];
  CaptchaConfig captcha_config = 4 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Type and scope of Captcha to be shown"];
  IpWhitelistConfig ip_whitelist_config = 5 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "IPs whom we won't show captcha"];
  // These are internal details and we don't want to show them over graphql
  CaptchaProviderDetails captcha_provider_details = 6 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_skip) = true];
  JWTSigningKeyDetails jwt_signing_details = 7 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "JWT signing details"];
  // Additional labels needed can be added here
  map<string, string> labels = 8 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_skip) = true];
}

message EdgeDeploymentConfig {
  string cloud_edge_deployment_id = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Identifier for the cloud edge deployment"];
  InterstitialPageConfig interstitial_page_config = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Configuration for the interstitial page shown during bot detection"];
}

message OobDeploymentConfig {
  ApiToken api_token = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Current active API token"];
  ApiToken previous_api_token = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Previous API token (to be rotated and will expire)"];
  string traceable_captcha_domain = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Customer's traceable domain which should be used for bot protection related interaction"];
}

message ApiToken {
  string key_value = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Value of the API token"];
  optional google.protobuf.Timestamp expiry_timestamp = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Expiration time of the token"];
}

message CaptchaConfig {
  bool enabled = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Whether the feature is enabled"];
  CaptchaType captcha_type = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Type of CAPTCHA (Visual or Proof Shield)"];
  repeated UrlRule url_rules = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Rules defining which URLs should have CAPTCHA applied"];
}

message InterstitialPageConfig {
  bool enabled = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Whether the feature is enabled"];
  string custom_message = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Custom message to display on the interstitial page"];
}

message IpWhitelistConfig {
  repeated string ip_addresses = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Individual IP addresses to whitelist"];
  repeated string ip_ranges = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "IP ranges (CIDR notation) to whitelist"];
}

message CloudBotDeploymentStatus {
  DeploymentStatus deployment_status = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Current status of the deployment for the bot cluster"];
  optional string message = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Optional message associated with the deployment status, mandatory for blocked state and would be displayed to customers"];
}

message CaptchaProviderDetails {
  oneof providers {
    MTCaptchaDetails mt_captcha = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Details for MTCaptcha provider"];
  }
}

message MTCaptchaDetails {
  string site_key = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Site key for MTCaptcha integration"];
}

// Details for JWT signing keys used for token generation and verification
message JWTSigningKeyDetails {
  // Private key is hidden from GraphQL for security reasons
  EncryptedText encrypted_private_key = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_skip) = true];
  string public_key_pem = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Public key in PEM format used for JWT verification"];
  JWTSigningAlgorithm algorithm = 3 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Algorithm used for JWT signing"];

  enum JWTSigningAlgorithm {
    JWT_SIGNING_ALGORITHM_UNSPECIFIED = 0;
    JWT_SIGNING_ALGORITHM_RS256 = 1;
  }
}

message EncryptedText {
  // Key used for encryption
  string key_id = 1;
  // Encrypted raw private key used for JWT signing
  string value = 2;
}

message UrlRule {
  RuleType rule_type = 1 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "Type of URL matching rule"];
  repeated string values = 2 [(ai.traceable.graphql.autogen.schema.annotations.field.v1.graphql_description) = "URL patterns or regular expressions to match"];
}

enum CaptchaType {
  CAPTCHA_TYPE_UNSPECIFIED = 0;
  CAPTCHA_TYPE_VISUAL = 1;
  CAPTCHA_TYPE_PROOF_SHIELD = 2;
}

enum RuleType {
  RULE_TYPE_UNSPECIFIED = 0;
  RULE_TYPE_INCLUDE_URLS = 1;
  RULE_TYPE_EXCLUDE_URLS = 2;
  RULE_TYPE_INCLUDE_URL_REGEX = 3;
  RULE_TYPE_EXCLUDE_URL_REGEX = 4;
}

enum DeploymentMode {
  DEPLOYMENT_MODE_UNSPECIFIED = 0;
  DEPLOYMENT_MODE_EDGE = 1;
  DEPLOYMENT_MODE_OUT_OF_BAND = 2;
}

enum ClusterStatus {
  option deprecated = true;

  CLUSTER_STATUS_UNSPECIFIED = 0;
  CLUSTER_STATUS_PROVISIONING = 1;
  CLUSTER_STATUS_READY = 2;
  CLUSTER_STATUS_ERROR = 3;
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_REQUESTED = 1;
  DEPLOYMENT_STATUS_IN_PROGRESS = 2;
  DEPLOYMENT_STATUS_DEPLOYED_SUCCESSFULLY = 3;
  DEPLOYMENT_STATUS_BLOCKED = 4;
  DEPLOYMENT_STATUS_CHANGE_REQUESTED = 5;
  DEPLOYMENT_STATUS_CHANGE_IN_PROGRESS = 6;
  DEPLOYMENT_STATUS_CHANGE_BLOCKED = 7;
  DEPLOYMENT_STATUS_REMOVAL_IN_PROGRESS = 8;
  DEPLOYMENT_STATUS_DEPLOYMENT_DELETED = 9;
}

message StringMap {
  map<string, string> map = 1;
}
