syntax = "proto3";

package ai.traceable.api.spec.config.service.v1;

option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// get
message GetApiSpecsRequest {
  ApiSpecFilter api_spec_filter = 1;
}

message ApiSpecFilter {
  oneof filter {
    FileContentSha256Filter file_content_sha_256 = 1;
    StringList ids = 2;
    StringList spec_paths = 3;
  }
}

message StringList {
  repeated string values = 1;
}

message FileContentSha256Filter {
  repeated string file_content_sha256 = 1;
}

message GetApiSpecsResponse {
  repeated ApiSpec api_specs = 1;
}

message GetApiSpecRequest {
  string id = 1;
}

message GetApiSpecResponse {
  ApiSpec api_spec = 1;
}

// create
message CreateApiSpecRequest {
  CreateApiSpec create_api_spec = 1;
}

message CreateApiSpecResponse {
  ApiSpec api_spec = 1;
}

message CreateApiSpec {
  string name = 1;
  bool api_naming_enabled = 2;
  ApiSpecStatus status = 3;
  optional string file_content_sha256 = 4;
  optional string spec_path = 5;
  bool api_discovery_enabled = 6;
  SpecType spec_type = 7;
}

// update
message UpdateApiSpecRequest {
  UpdateApiSpec api_spec = 1;
}

message UpdateApiSpecResponse {
  ApiSpec api_spec = 1;
}

message UpdateApiSpecsRequest {
  repeated UpdateApiSpec api_specs = 1;
}

message UpdateApiSpecsResponse {
  repeated ApiSpec api_specs = 1;
}

message UpdateApiSpec {
  string spec_id = 1;
  string name = 2;
  bool api_naming_enabled = 3;
  ApiSpecStatus status = 4;
  bool api_discovery_enabled = 5;
}

// delete
message DeleteApiSpecRequest {
  string spec_id = 1;
}

message DeleteApiSpecResponse {
}

message DeleteApiSpecsRequest {
  repeated string spec_ids = 1;
}

message DeleteApiSpecsResponse {
}

message ApiSpec {
  string spec_id = 1;
  string name = 2;
  bool api_naming_enabled = 3;
  ApiSpecStatus status = 4;
  google.protobuf.Timestamp creation_timestamp = 5;
  google.protobuf.Timestamp last_updated_timestamp = 6;
  optional string file_content_sha256 = 7;
  optional string spec_path = 8;
  bool api_discovery_enabled = 9;
  SpecType spec_type = 10;
}

enum SpecType {
  SPEC_TYPE_UNSPECIFIED = 0;
  SPEC_TYPE_OPEN_API_SPEC = 1;
  SPEC_TYPE_POSTMAN_COLLECTION = 2;
  SPEC_TYPE_POSTMAN_ENVIRONMENT = 3;
  SPEC_TYPE_GRAPHQL_SCHEMA = 4;
}

enum ApiSpecStatus {
  API_SPEC_STATUS_UNSPECIFIED = 0;
  API_SPEC_STATUS_IN_PROGRESS = 1;
  API_SPEC_STATUS_COMPLETED = 2;
  API_SPEC_STATUS_INVALID_FORMAT = 3;
  API_SPEC_STATUS_SIZE_LIMIT_EXCEEDED = 4;
  API_SPEC_STATUS_FILE_LIMIT_EXCEEDED = 5;
  API_SPEC_STATUS_NO_FILES_FOUND = 6;
  API_SPEC_STATUS_INVALID_JOB_ID = 7;
}
