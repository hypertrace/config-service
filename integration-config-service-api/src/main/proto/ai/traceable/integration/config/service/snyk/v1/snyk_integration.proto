syntax = "proto3";

package ai.traceable.integration.config.service.snyk.v1;

option java_multiple_files = true;

message SnykIntegration {
  SnykIntegrationSummary snyk_integration_summary = 1;
  EncryptedText api_token = 2;
}

message SnykIntegrationSummary {
  string name = 1;
  optional string description = 2;
}

message EncryptedText {
  string key_id = 1;
  string value = 2;
}
