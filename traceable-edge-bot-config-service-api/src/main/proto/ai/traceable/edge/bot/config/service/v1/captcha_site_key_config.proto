syntax = "proto3";
package ai.traceable.edge.bot.config.service.v1;

import "ai/traceable/edge/bot/config/service/v1/flow_config.proto";

option java_multiple_files = true;

enum CaptchaMode {
  CAPTCHA_MODE_UNSPECIFIED = 0;
  CAPTCHA_MODE_AUTO = 1;
  CAPTCHA_MODE_FORCE_VISUAL = 2;
  CAPTCHA_MODE_NONE = 3;
}

enum CaptchaDifficulty {
  CAPTCHA_DIFFICULTY_UNSPECIFIED = 0;
  CAPTCHA_DIFFICULTY_EASY = 1;
  CAPTCHA_DIFFICULTY_MEDIUM = 2;
  CAPTCHA_DIFFICULTY_HARD = 3;
}

message CaptchaSiteKeyConfig {
  string id = 1;
  string site_key = 2;
  string private_key = 3;
  repeated string domains = 4;
  repeated string allowed_ip_addresses = 5;
  CaptchaMode captcha_mode = 6;
  CaptchaDifficulty captcha_difficulty = 7;
  bool disabled = 8;
  map<string, string> labels = 9;
  string flow = 11 [deprecated = true];
  string mt_captcha_sitekey = 12;
  string environment = 13;
  string default_flow = 14; // default flow for the tenant
  // specify how to derive the "flow" based on the request
  // these are generated from the flow configs on the tenant
  // all match conditions are evaluated for a packet and all of them are added to "flows" in the jwt
  repeated FlowDerivationConfig flow_derivation_configs = 15;
  bool enable_invisible_captcha = 16;
  string api_secret_key = 17; // api secret key for bot service to be used as captcha provider
}

// bot-service can only derive the flow based on the pages
message FlowDerivationConfig {
  string flow = 1;
  repeated PageDerivationRules pages = 2;
}

message CaptchaSiteKeyConfigList {
  repeated ai.traceable.edge.bot.config.service.v1.CaptchaSiteKeyConfig configs = 1;
}
