  {
    id = "fc816139-5649-407d-ae08-8d91647b46ea"
    data = {
      category = CATEGORY_ENUMERATION
      name = "Default: Potential API Reconnaissance Activity"
      description = "Suspicious API request pattern indicating probing/enumeration"
      enabled = false
      ruleEvaluationPoints = [RULE_EVALUATION_POINT_PLATFORM]
      labels = {
        "OWASP_API_2019" : "API4"
        "OWASP_2021" : "A9"
        "CWE" : "799"
      }
      condition = {
        compositeCondition = {
          operator = LOGICAL_OPERATOR_AND
          children = [
            {
              leafCondition = {
                keyValueCondition = {
                  type = TYPE_STATUS_CODE
                  valueCondition = {
                    operator = MATCH_OPERATOR_MATCHES_REGEX
                    value = "^(3|4|5)"
                  }
                }
              }
            },
            {
              leafCondition = {
                ipAddressCondition = {
                  ipAddressConditionType = IP_ADDRESS_CONDITION_TYPE_ALL_EXTERNAL
                }
              }
            }
          ]
        }
      }
      thresholdActionConfigs = [
        {
          resourceAccessThresholdConfigs = [
            {
              userAggregateType = USER_AGGREGATE_TYPE_PER_USER
              apiAggregateType = API_AGGREGATE_TYPE_ACROSS_ENDPOINTS
              valueBasedThresholdConfig = {
                uniqueValuesAllowed = 100
                durationIso = "PT60S"
                valueType = VALUE_TYPE_PATH_PARAMS
              }
            }
          ]
          actions = [
            {
              alert = {
                eventSeverity = EVENT_SEVERITY_LOW
              }
            }
          ]
        }
      ]
      ruleStatus = {
        ruleCreationSource = RULE_SOURCE_DEFAULT
      }
    }
  }
