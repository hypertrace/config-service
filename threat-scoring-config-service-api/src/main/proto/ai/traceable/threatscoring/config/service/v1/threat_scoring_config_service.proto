syntax = "proto3";

package ai.traceable.threatscoring.config.service.v1;

import "ai/traceable/threatscoring/config/service/v1/threat_scoring_request_response.proto";

option java_multiple_files = true;

service ThreatScoringConfigService {
  rpc GetScopedThreatScoringConfigs(GetScopedThreatScoringConfigsRequest) returns (GetScopedThreatScoringConfigsResponse) {}
  rpc OverrideEventConfidenceScoringConfig(OverrideEventConfidenceScoringConfigRequest) returns (OverrideEventConfidenceScoringConfigResponse) {}
  rpc DeleteEventConfidenceScoringConfigOverrides(DeleteEventConfidenceScoringConfigOverridesRequest) returns (DeleteEventConfidenceScoringConfigOverridesResponse) {}
  rpc OverrideThreatActivityConfidenceScoringConfig(OverrideThreatActivityConfidenceScoringConfigRequest) returns (OverrideThreatActivityConfidenceScoringConfigResponse) {}
  rpc DeleteThreatActivityConfidenceScoringConfigOverrides(DeleteThreatActivityConfidenceScoringConfigOverridesRequest) returns (DeleteThreatActivityConfidenceScoringConfigOverridesResponse) {}
}
