syntax = "proto3";

package ai.traceable.external.agent.action.config.service.v1;

option go_package = "github.com/Traceableai/config-service/gen/go/ai/traceable/external/agent/action/config/service/v1";
option java_multiple_files = true;

service AgentActionService {
  rpc GetAgentActions(GetAgentActionsRequest) returns (GetAgentActionsResponse);
}

message GetAgentActionsRequest {
  string previous_hash = 1;
  // scope of the requested config
  AgentScope scope = 2;
  // details of the previously applied actions on agent.
  repeated AgentActionStatus previous_statuses = 3;
}

message AgentActionStatus {
  // hash of the action applied.
  string hash = 1;
  // status of the agent after applying the last action.
  // for config updates, the state can be set based on the effect of application last config received from platform.
  // for debug information, the status can be set based on the result of exporting of debug zip.
  Status status = 2;
  // additional information about the status. for ex: reason in case of failure
  string status_message = 3;
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_SUCCESS = 1;
    STATUS_FAILURE = 2;
  }
}

message GetAgentActionsResponse {
  string hash = 1;
  // actions to be taken by this Agent instance.
  repeated AgentAction actions = 2;
}

message AgentAction {
  // string hash of the operation.
  string hash = 1;
  // expiration duration for the action, once expired the agents shouldn't try to take this action.
  int64 expiration_epoch_millis = 2;

  oneof action {
    ConfigMutationAction update_config_action = 3;
    FetchDebugInformationAction fetch_debug_information_action = 4;
    RestartAgentAction restart_agent_action = 5;
  }
}

message ConfigMutationAction {
  // list of environment key, value pairs to be applied on an agent instance.
  map<string, string> environment_variables = 1;
}

message FetchDebugInformationAction {}

message RestartAgentAction {}

message AgentScope {
  // name of the targeted deployment.
  // This is just to group different agent instances on data collection side
  // and doesn't necessarily match the actual deployment name or id.
  string deployment_name = 1;
  // id unique to the specific agent instance.
  string service_instance_id = 2;
  //optional if environment information for TA is needed by platform.
  string environment = 3;
  // name of module (agent) requesting for configs.
  string module_name = 4;
  // version of module (agent) requesting for configs.
  string module_version = 5;
}
