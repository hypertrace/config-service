syntax = "proto3";

package ai.traceable.external.agent.attribute.config.service.v1;
option go_package = "github.com/Traceableai/config-service/gen/go/ai/traceable/external/agent/attribute/config/service/v1";

option java_multiple_files = true;

import "ai/traceable/external/agent/attribute/config/service/v1/agent_attribute_rule.proto";
import "google/protobuf/duration.proto";

service ExternalAgentAttributeConfigService {
  rpc GetAgentAttributeRules (GetAgentAttributeRulesRequest) returns (GetAgentAttributeRulesResponse) {
  }
}

message GetAgentAttributeRulesRequest {
  OnlyIfChangedFilter filter = 1;
  Scope scope = 2;

  message OnlyIfChangedFilter {
    string previous_hash = 1;
  }

  message Scope {
    oneof scope {
      string environment_name = 1;
    }
  }
}

message GetAgentAttributeRulesResponse {
  repeated AttributeRule agent_attribute_rules = 1;
  string hash = 2;
  google.protobuf.Duration refresh_after_duration = 3;
}
